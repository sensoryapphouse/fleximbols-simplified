<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Sky -->
  <rect x="0" y="0" width="100" height="85" fill="#87ceeb"/>
  <!-- Ground/Champ de Mars -->
  <rect x="0" y="83" width="100" height="17" fill="#6aaa6a"/>
  <!-- Eiffel Tower - iron lattice structure -->
  <!-- Base legs (4 curved legs) -->
  <path d="M20,84 Q28,70 38,60 L42,60 Q32,70 34,84 Z" fill="#555" stroke="#333" stroke-width="1.5"/>
  <path d="M80,84 Q72,70 62,60 L58,60 Q68,70 66,84 Z" fill="#555" stroke="#333" stroke-width="1.5"/>
  <!-- First floor platform -->
  <rect x="34" y="58" width="32" height="5" rx="1" fill="#666" stroke="#333" stroke-width="1.5"/>
  <!-- Lattice on first floor -->
  <line x1="36" y1="58" x2="38" y2="63" stroke="#888" stroke-width="1"/>
  <line x1="40" y1="58" x2="42" y2="63" stroke="#888" stroke-width="1"/>
  <line x1="44" y1="58" x2="46" y2="63" stroke="#888" stroke-width="1"/>
  <line x1="48" y1="58" x2="50" y2="63" stroke="#888" stroke-width="1"/>
  <line x1="52" y1="58" x2="54" y2="63" stroke="#888" stroke-width="1"/>
  <line x1="56" y1="58" x2="58" y2="63" stroke="#888" stroke-width="1"/>
  <line x1="60" y1="58" x2="62" y2="63" stroke="#888" stroke-width="1"/>
  <!-- Middle section -->
  <path d="M38,58 Q42,45 44,35 L56,35 Q58,45 62,58 Z" fill="#666" stroke="#333" stroke-width="1.5"/>
  <!-- Lattice details middle -->
  <line x1="40" y1="50" x2="60" y2="50" stroke="#888" stroke-width="1"/>
  <line x1="41" y1="44" x2="59" y2="44" stroke="#888" stroke-width="1"/>
  <line x1="42" y1="38" x2="58" y2="38" stroke="#888" stroke-width="1"/>
  <!-- Second floor platform -->
  <rect x="40" y="33" width="20" height="4" rx="1" fill="#666" stroke="#333" stroke-width="1.5"/>
  <!-- Upper section narrowing -->
  <path d="M43,33 L46,18 L54,18 L57,33 Z" fill="#666" stroke="#333" stroke-width="1.5"/>
  <!-- Lattice upper -->
  <line x1="44" y1="28" x2="56" y2="28" stroke="#888" stroke-width="1"/>
  <line x1="45" y1="24" x2="55" y2="24" stroke="#888" stroke-width="1"/>
  <!-- Third floor -->
  <rect x="44" y="16" width="12" height="3" rx="1" fill="#666" stroke="#333" stroke-width="1.5"/>
  <!-- Spire -->
  <line x1="50" y1="16" x2="50" y2="5" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Antenna tip -->
  <circle cx="50" cy="5" r="2" fill="#e74c3c"/>
  <!-- Lattice x-braces on legs -->
  <line x1="25" y1="80" x2="35" y2="68" stroke="#888" stroke-width="1"/>
  <line x1="35" y1="80" x2="25" y2="68" stroke="#888" stroke-width="1"/>
  <line x1="65" y1="80" x2="75" y2="68" stroke="#888" stroke-width="1"/>
  <line x1="75" y1="80" x2="65" y2="68" stroke="#888" stroke-width="1"/>
  <!-- Seine river glimpse -->
  <path d="M0,88 Q50,84 100,88" fill="none" stroke="#4fc3f7" stroke-width="3"/>
</svg>
