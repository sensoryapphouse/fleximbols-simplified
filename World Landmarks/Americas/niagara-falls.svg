  <!-- Sky -->
  <rect x="0" y="0" width="100" height="30" fill="#87ceeb"/>
  <!-- Upper river/lake -->
  <rect x="0" y="20" width="100" height="18" fill="#4fc3f7" stroke="none"/>
  <!-- Green grass top (Goat Island) -->
  <rect x="40" y="18" width="20" height="6" fill="#4a9e40"/>
  <!-- Horseshoe Falls - curved cliff edge -->
  <path d="M0,38 Q50,28 100,38 L100,42 Q50,32 0,42 Z" fill="#6ab0d0"/>
  <!-- Falls cascading down - multiple strands -->
  <rect x="0" y="38" width="38" height="35" fill="#81d4fa"/>
  <rect x="62" y="38" width="38" height="35" fill="#81d4fa"/>
  <!-- Horseshoe drop in middle -->
  <path d="M38,32 Q50,26 62,32 L62,73 Q50,78 38,73 Z" fill="#4fc3f7"/>
  <!-- White water streaks -->
  <line x1="8" y1="38" x2="6" y2="72" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="18" y1="38" x2="16" y2="72" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="28" y1="38" x2="26" y2="72" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="72" y1="38" x2="70" y2="72" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="82" y1="38" x2="80" y2="72" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="92" y1="38" x2="90" y2="72" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="44" y1="32" x2="44" y2="73" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="50" y1="28" x2="50" y2="78" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="56" y1="32" x2="56" y2="73" stroke="#fff" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Mist at bottom -->
  <path d="M0,70 Q50,65 100,70 L100,80 Q50,75 0,80 Z" fill="#fff" opacity="0.7"/>
  <!-- Lower river -->
  <rect x="0" y="78" width="100" height="22" fill="#4fc3f7"/>
  <!-- Mist cloud / rainbow -->
  <path d="M20,75 Q50,68 80,75" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.5"/>
  <path d="M22,77 Q50,70 78,77" fill="none" stroke="#f0c040" stroke-width="2" opacity="0.5"/>
  <path d="M24,79 Q50,72 76,79" fill="none" stroke="#4a9e4a" stroke-width="2" opacity="0.5"/>
  <!-- Maid of the Mist boat -->
  <path d="M40,88 Q50,85 60,88 L58,94 L42,94 Z" fill="#6b8cba" stroke="#333" stroke-width="1.5"/>
</svg>
