  <!-- Sky -->
  <rect x="0" y="0" width="100" height="60" fill="#87ceeb"/>
  <!-- Green jungle base -->
  <path d="M0,65 Q25,60 50,63 Q75,66 100,62 L100,100 L0,100 Z" fill="#4a9e40"/>
  <!-- El Castillo / Temple of Kukulcan pyramid steps -->
  <!-- Base platform -->
  <rect x="5" y="70" width="90" height="6" rx="1" fill="#d4c090" stroke="#8b6914" stroke-width="2"/>
  <!-- Step 4 -->
  <rect x="10" y="63" width="80" height="7" rx="1" fill="#e8d4a0" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Step 3 -->
  <rect x="18" y="56" width="64" height="7" rx="1" fill="#d4c090" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Step 2 -->
  <rect x="26" y="49" width="48" height="7" rx="1" fill="#e8d4a0" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Step 1 -->
  <rect x="34" y="42" width="32" height="7" rx="1" fill="#d4c090" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Temple on top -->
  <rect x="36" y="30" width="28" height="13" rx="1" fill="#e8d4a0" stroke="#8b6914" stroke-width="2"/>
  <!-- Temple roof comb -->
  <rect x="34" y="22" width="32" height="9" rx="1" fill="#e8d4a0" stroke="#8b6914" stroke-width="2"/>
  <!-- Decorative holes in comb -->
  <rect x="38" y="24" width="4" height="5" rx="1" fill="#87ceeb" stroke="#8b6914" stroke-width="1"/>
  <rect x="45" y="24" width="4" height="5" rx="1" fill="#87ceeb" stroke="#8b6914" stroke-width="1"/>
  <rect x="52" y="24" width="4" height="5" rx="1" fill="#87ceeb" stroke="#8b6914" stroke-width="1"/>
  <rect x="59" y="24" width="4" height="5" rx="1" fill="#87ceeb" stroke="#8b6914" stroke-width="1"/>
  <!-- Staircase on front face -->
  <rect x="46" y="42" width="8" height="28" fill="#b09050" stroke="#8b6914" stroke-width="1"/>
  <!-- Stair lines -->
  <line x1="46" y1="46" x2="54" y2="46" stroke="#8b6914" stroke-width="0.8"/>
  <line x1="46" y1="50" x2="54" y2="50" stroke="#8b6914" stroke-width="0.8"/>
  <line x1="46" y1="54" x2="54" y2="54" stroke="#8b6914" stroke-width="0.8"/>
  <line x1="46" y1="58" x2="54" y2="58" stroke="#8b6914" stroke-width="0.8"/>
  <line x1="46" y1="62" x2="54" y2="62" stroke="#8b6914" stroke-width="0.8"/>
  <line x1="46" y1="66" x2="54" y2="66" stroke="#8b6914" stroke-width="0.8"/>
  <!-- Serpent head at staircase base (Kukulcan) -->
  <ellipse cx="43" cy="71" rx="5" ry="4" fill="#8b6914" stroke="#6b5010" stroke-width="1.5"/>
  <path d="M38,72 Q35,75 40,76" fill="none" stroke="#6b5010" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="57" cy="71" rx="5" ry="4" fill="#8b6914" stroke="#6b5010" stroke-width="1.5"/>
  <path d="M62,72 Q65,75 60,76" fill="none" stroke="#6b5010" stroke-width="2" stroke-linecap="round"/>
  <!-- Temple doorway -->
  <rect x="42" y="32" width="16" height="11" rx="1" fill="#6b4010" stroke="#4b3010" stroke-width="1.5"/>
  <!-- Temple columns -->
  <rect x="38" y="30" width="4" height="13" rx="1" fill="#e8d4a0" stroke="#8b6914" stroke-width="1"/>
  <rect x="58" y="30" width="4" height="13" rx="1" fill="#e8d4a0" stroke="#8b6914" stroke-width="1"/>
</svg>
