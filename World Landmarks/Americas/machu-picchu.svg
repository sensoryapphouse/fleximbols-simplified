  <!-- Sky with clouds -->
  <rect x="0" y="0" width="100" height="40" fill="#87ceeb"/>
  <ellipse cx="15" cy="12" rx="14" ry="7" fill="#fff" opacity="0.9"/>
  <ellipse cx="80" cy="8" rx="16" ry="7" fill="#fff" opacity="0.9"/>
  <!-- Huayna Picchu mountain behind -->
  <polygon points="55,40 72,5 90,40" fill="#6a8050" stroke="#4a6030" stroke-width="1.5"/>
  <!-- Main mountain ridge -->
  <path d="M0,100 L0,55 Q10,45 20,50 Q30,42 40,45 Q50,38 60,42 Q70,35 80,40 Q90,38 100,42 L100,100 Z" fill="#7a9060"/>
  <!-- Terraced ruins - the iconic terraces -->
  <!-- Lower terraces -->
  <rect x="5" y="72" width="90" height="5" rx="1" fill="#a09060" stroke="#6a5030" stroke-width="1.5"/>
  <rect x="8" y="67" width="84" height="5" rx="1" fill="#b0a070" stroke="#6a5030" stroke-width="1.5"/>
  <rect x="12" y="62" width="76" height="5" rx="1" fill="#c0a870" stroke="#6a5030" stroke-width="1.5"/>
  <rect x="16" y="57" width="68" height="5" rx="1" fill="#c8b080" stroke="#6a5030" stroke-width="1.5"/>
  <rect x="20" y="52" width="60" height="5" rx="1" fill="#d0b888" stroke="#6a5030" stroke-width="1.5"/>
  <!-- Stone walls/buildings on terraces -->
  <rect x="25" y="44" width="12" height="8" rx="1" fill="#c8b080" stroke="#6a5030" stroke-width="2"/>
  <rect x="40" y="42" width="14" height="10" rx="1" fill="#c8b080" stroke="#6a5030" stroke-width="2"/>
  <rect x="57" y="44" width="12" height="8" rx="1" fill="#c8b080" stroke="#6a5030" stroke-width="2"/>
  <!-- Roofless structures -->
  <rect x="26" y="38" width="10" height="6" rx="1" fill="none" stroke="#6a5030" stroke-width="2"/>
  <rect x="42" y="36" width="12" height="6" rx="1" fill="none" stroke="#6a5030" stroke-width="2"/>
  <rect x="58" y="38" width="10" height="6" rx="1" fill="none" stroke="#6a5030" stroke-width="2"/>
  <!-- Intihuatana stone (Sun Stone) -->
  <rect x="47" y="32" width="6" height="6" rx="1" fill="#8a7a60" stroke="#6a5030" stroke-width="2"/>
  <rect x="49" y="28" width="2" height="4" rx="1" fill="#8a7a60" stroke="#6a5030" stroke-width="1"/>
  <!-- Llama -->
  <path d="M75,60 Q80,55 82,60 L82,66 L78,66 Z" fill="#d4c090" stroke="#8b6914" stroke-width="1.5"/>
  <line x1="79" y1="60" x2="79" y2="55" stroke="#d4c090" stroke-width="3" stroke-linecap="round"/>
  <circle cx="79" cy="53" r="3" fill="#d4c090" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Cloud mist at base of mountain -->
  <path d="M0,45 Q25,40 50,44 Q75,48 100,43 L100,50 Q75,54 50,50 Q25,46 0,50 Z" fill="#fff" opacity="0.6"/>
