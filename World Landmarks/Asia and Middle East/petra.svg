  <!-- Desert sky -->
  <rect x="0" y="0" width="100" height="45" fill="#87ceeb"/>
  <!-- Rose-red sandstone cliff -->
  <path d="M0,0 L0,80 L8,80 L8,40 Q12,30 16,40 L16,80 L22,80 L22,35 Q26,25 30,35 L30,80 L70,80 L70,35 Q74,25 78,35 L78,80 L84,80 L84,40 Q88,30 92,40 L92,80 L100,80 L100,0 Z" fill="#c4922a"/>
  <!-- Cliff layers/striations -->
  <path d="M0,15 Q50,10 100,15" fill="none" stroke="#b07820" stroke-width="2"/>
  <path d="M0,25 Q50,20 100,25" fill="none" stroke="#b07820" stroke-width="2"/>
  <path d="M0,35 Q50,30 100,35" fill="none" stroke="#b07820" stroke-width="2"/>
  <!-- The Treasury / Al-Khazneh facade carved into rock -->
  <!-- Carved facade face -->
  <rect x="22" y="30" width="56" height="52" rx="2" fill="#d4a240" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Upper pediment / broken pediment -->
  <polygon points="22,30 50,12 78,30" fill="#e8b860" stroke="#8b6914" stroke-width="2"/>
  <!-- Side columns upper -->
  <rect x="24" y="30" width="6" height="28" rx="1" fill="#c4922a" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="70" y="30" width="6" height="28" rx="1" fill="#c4922a" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Round tholos center upper -->
  <circle cx="50" cy="24" r="7" fill="none" stroke="#8b6914" stroke-width="2"/>
  <!-- Urn atop -->
  <ellipse cx="50" cy="17" rx="4" ry="5" fill="#c4922a" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Lower columns (6) -->
  <rect x="23" y="56" width="5" height="26" rx="1" fill="#e8b860" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="31" y="56" width="5" height="26" rx="1" fill="#e8b860" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="39" y="56" width="5" height="26" rx="1" fill="#e8b860" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="56" y="56" width="5" height="26" rx="1" fill="#e8b860" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="64" y="56" width="5" height="26" rx="1" fill="#e8b860" stroke="#8b6914" stroke-width="1.5"/>
  <rect x="72" y="56" width="5" height="26" rx="1" fill="#e8b860" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Doorway -->
  <path d="M40,82 L40,66 Q50,60 60,66 L60,82 Z" fill="#8b5010" stroke="#6b4010" stroke-width="2"/>
  <!-- Entablature between levels -->
  <rect x="22" y="54" width="56" height="4" rx="1" fill="#c4922a" stroke="#8b6914" stroke-width="1.5"/>
  <!-- Sandy floor of Siq -->
  <rect x="0" y="80" width="100" height="20" fill="#e8c97a"/>
