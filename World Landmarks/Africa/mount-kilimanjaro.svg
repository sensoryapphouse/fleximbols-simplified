  <!-- Sky gradient area -->
  <rect x="0" y="0" width="100" height="60" fill="#87ceeb"/>
  <!-- Kilimanjaro - wide flat-topped stratovolcano -->
  <path d="M0,80 L5,75 L15,60 L25,52 L35,45 L42,42 L50,38 L58,42 L65,45 L75,52 L85,60 L95,75 L100,80 Z" fill="#8a9bb0" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Distinctive flat summit with icecap -->
  <path d="M35,45 L42,42 L50,38 L58,42 L65,45 L60,42 L50,40 L40,42 Z" fill="#9db0c0"/>
  <!-- Snow/ice cap - Kilimanjaro's famous shrinking glacier -->
  <path d="M38,44 L42,41 L50,38 L58,41 L62,44 L58,42 L52,40 L48,40 L42,42 Z" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <!-- Smaller ice patches -->
  <ellipse cx="44" cy="42" rx="5" ry="2" fill="#e8f5ff" stroke="#ccc" stroke-width="1"/>
  <ellipse cx="56" cy="42" rx="4" ry="2" fill="#e8f5ff" stroke="#ccc" stroke-width="1"/>
  <!-- Savanna base -->
  <rect x="0" y="78" width="100" height="22" fill="#c8a850"/>
  <path d="M0,80 Q25,76 50,78 Q75,80 100,76 L100,80 L0,80" fill="#a89040"/>
  <!-- Acacia trees silhouettes -->
  <line x1="15" y1="80" x2="15" y2="68" stroke="#5d4037" stroke-width="2"/>
  <path d="M8,70 Q15,62 22,70 Q18,74 12,74 Z" fill="#4a7a30"/>
  <line x1="80" y1="80" x2="80" y2="70" stroke="#5d4037" stroke-width="2"/>
  <path d="M73,72 Q80,64 87,72 Q83,76 77,76 Z" fill="#4a7a30"/>
  <!-- Giraffe silhouette small -->
  <line x1="60" y1="80" x2="60" y2="66" stroke="#c4922a" stroke-width="3"/>
  <line x1="60" y1="72" x2="60" y2="66" stroke="#c4922a" stroke-width="2"/>
  <line x1="60" y1="66" x2="63" y2="60" stroke="#c4922a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="63" cy="59" r="3" fill="#c4922a" stroke="#8b6914" stroke-width="1"/>
</svg>
