  <circle cx="54" cy="88" r="2.5" fill="#6ab4d8" stroke="#336699" stroke-width="1.5"/>
  <circle cx="62" cy="84" r="2" fill="#6ab4d8" stroke="#336699" stroke-width="1.5"/>
