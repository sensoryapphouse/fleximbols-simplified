<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Flat glassy surface - rectangle with sheen -->
  <rect x="15" y="45" width="70" height="28" rx="4" fill="#d8eaf8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Glassy highlight / sheen across surface -->
  <rect x="15" y="45" width="70" height="10" rx="4" fill="#eef5ff" stroke="none"/>
  <!-- Sheen line -->
  <line x1="20" y1="50" x2="60" y2="50" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Surface reflection label -->
  <path d="M18,76 Q50,70 82,76" fill="none" stroke="#b8d0e8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hand gliding over -->
  <path d="M25,40 Q50,34 75,40" fill="#f5c8a0" stroke="#333" stroke-width="2" stroke-linecap="round"/>
