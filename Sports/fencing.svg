<!-- Fencer figure in lunge position -->
  <!-- Mask -->
  <rect x="28" y="12" width="16" height="14" rx="4" fill="#888" stroke="#333" stroke-width="2"/>
  <line x1="28" y1="16" x2="44" y2="16" stroke="#555" stroke-width="1"/>
  <line x1="28" y1="20" x2="44" y2="20" stroke="#555" stroke-width="1"/>
  <!-- Head inside mask -->
  <circle cx="36" cy="19" r="6" fill="#f0ede0" stroke="none"/>
  <!-- Body -->
  <rect x="28" y="26" width="18" height="22" rx="3" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
  <!-- Sword arm extended forward -->
  <line x1="46" y1="32" x2="88" y2="28" stroke="#e8e8e8" stroke-width="4" stroke-linecap="round"/>
  <!-- Guard/bell -->
  <circle cx="66" cy="30" r="5" fill="#d0d0d0" stroke="#333" stroke-width="1.5"/>
  <!-- Foil blade (thin) -->
  <line x1="71" y1="29" x2="90" y2="27" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Back arm -->
  <line x1="28" y1="32" x2="16" y2="24" stroke="#e8e8e8" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs - lunge -->
  <line x1="33" y1="48" x2="22" y2="72" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/>
  <line x1="40" y1="48" x2="60" y2="68" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/>
  <!-- Front foot -->
  <line x1="60" y1="68" x2="72" y2="68" stroke="#e8e8e8" stroke-width="4" stroke-linecap="round"/>
  <!-- Back foot -->
  <line x1="22" y1="72" x2="12" y2="72" stroke="#e8e8e8" stroke-width="4" stroke-linecap="round"/>
  <!-- Label -->
</svg>
