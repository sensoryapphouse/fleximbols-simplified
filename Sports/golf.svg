<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Green / ground -->
  <ellipse cx="50" cy="75" rx="40" ry="8" fill="#7dc55e" stroke="#5a9940" stroke-width="1.5"/>
  <!-- Hole -->
  <ellipse cx="72" cy="75" rx="6" ry="3" fill="#333"/>
  <!-- Flag -->
  <line x1="72" y1="72" x2="72" y2="45" stroke="#333" stroke-width="1.5"/>
  <polygon points="72,45 86,50 72,55" fill="#e05050"/>
  <!-- Golf club shaft -->
  <line x1="28" y1="20" x2="52" y2="73" stroke="#8B6914" stroke-width="2"/>
  <!-- Club head -->
  <rect x="47" y="70" width="12" height="7" rx="2" fill="#aaa" stroke="#333" stroke-width="2"/>
  <!-- Golf ball -->
  <circle cx="50" cy="73" r="5" fill="white" stroke="#333" stroke-width="1.5"/>
  <circle cx="49" cy="72" r="1" fill="#ccc"/>
  <circle cx="51" cy="74" r="1" fill="#ccc"/>
</svg>
