<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(-7.229 6.967) scale(1.1446)">
<!-- String from finger at top -->
  <line x1="50" y1="10" x2="50" y2="42" stroke="#888" stroke-width="1.5"/>
  <!-- Finger -->
  <ellipse cx="50" cy="10" rx="5" ry="4" fill="#f5c5a3" stroke="#222" stroke-width="1.5"/>
  <!-- Yo-yo - two discs -->
  <ellipse cx="50" cy="55" rx="18" ry="6" fill="#e74c3c" stroke="#222" stroke-width="2"/>
  <ellipse cx="50" cy="63" rx="18" ry="6" fill="#c0392b" stroke="#222" stroke-width="2"/>
  <rect x="32" y="55" width="36" height="8" fill="#c0392b" stroke="none"/>
  <!-- Axle -->
  <line x1="50" y1="55" x2="50" y2="63" stroke="#222" stroke-width="2"/>
  <!-- Shine on top disc -->
  <ellipse cx="44" cy="53" rx="4" ry="1.5" fill="white" opacity="0.4" stroke="none"/>
</g>
  </svg>
