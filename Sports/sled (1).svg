  <!-- Modern sled: flat deck with runners, rope at front -->
  <!-- Left runner -->
  <path d="M8,74 Q12,60 20,55 L80,55 Q90,55 92,74" fill="none" stroke="#cc2222" stroke-width="4" stroke-linecap="round"/>
  <!-- Right runner (parallel, offset perspective) -->
  <path d="M8,82 Q12,68 20,63 L80,63 Q90,63 92,82" fill="none" stroke="#cc2222" stroke-width="4" stroke-linecap="round"/>
  <!-- Deck boards connecting runners -->
  <rect x="22" y="55" width="56" height="8" rx="2" fill="#c8a55a" stroke="#222" stroke-width="1.5"/>
  <!-- Cross slats (deck boards) -->
  <line x1="32" y1="55" x2="32" y2="63" stroke="#9b7a35" stroke-width="2"/>
  <line x1="44" y1="55" x2="44" y2="63" stroke="#9b7a35" stroke-width="2"/>
  <line x1="56" y1="55" x2="56" y2="63" stroke="#9b7a35" stroke-width="2"/>
  <line x1="68" y1="55" x2="68" y2="63" stroke="#9b7a35" stroke-width="2"/>
  <!-- Cross bars (struts between runners) -->
  <line x1="26" y1="55" x2="26" y2="63" stroke="#888" stroke-width="2"/>
  <line x1="74" y1="55" x2="74" y2="63" stroke="#888" stroke-width="2"/>
  <!-- Front rope/handle -->
  <path d="M20,58 Q14,50 18,42 Q22,36 28,38" fill="none" stroke="#b87333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rope loop -->
  <ellipse cx="28" cy="38" rx="5" ry="3" fill="none" stroke="#b87333" stroke-width="2"/>
  <!-- Snow ground -->
  <line x1="4" y1="86" x2="96" y2="86" stroke="#aaccee" stroke-width="2" stroke-dasharray="4,3"/>
</svg>
