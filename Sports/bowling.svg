<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Lane -->
  <rect x="10" y="60" width="80" height="16" rx="2" fill="#f5e6c8" stroke="#888" stroke-width="1.5"/>
  <!-- Lane arrows -->
  <polygon points="50,63 47,68 53,68" fill="#888"/>
  <!-- Pins at end of lane (triangle) -->
  <circle cx="77" cy="62" r="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <circle cx="72" cy="62" r="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <circle cx="82" cy="62" r="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <circle cx="67" cy="62" r="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <!-- Bowler -->
  <!-- Head -->
  <circle cx="20" cy="30" r="7" fill="#f5c5a3" stroke="#222" stroke-width="2"/>
  <!-- Body -->
  <line x1="20" y1="37" x2="22" y2="54" stroke="#5b8dd9" stroke-width="3" stroke-linecap="round"/>
  <!-- Arm swinging back with ball -->
  <line x1="20" y1="42" x2="35" y2="50" stroke="#5b8dd9" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ball -->
  <circle cx="38" cy="54" r="8" fill="#e74c3c" stroke="#222" stroke-width="2"/>
  <circle cx="36" cy="52" r="1.5" fill="#c0392b"/>
  <circle cx="40" cy="51" r="1.5" fill="#c0392b"/>
  <circle cx="38" cy="55" r="1.5" fill="#c0392b"/>
  <!-- Forward arm -->
  <line x1="20" y1="42" x2="12" y2="48" stroke="#5b8dd9" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs stepping forward -->
  <line x1="22" y1="54" x2="30" y2="66" stroke="#5b8dd9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="54" x2="18" y2="66" stroke="#5b8dd9" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="30" cy="67" rx="5" ry="3" fill="#333" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="17" cy="67" rx="5" ry="3" fill="#333" stroke="#222" stroke-width="1.5"/>
</svg>
