  <!-- Slot machine: cabinet with reels and lever -->
  <!-- Machine body -->
  <rect x="8" y="20" width="72" height="74" rx="8" fill="#b04020" stroke="#333" stroke-width="2.5"/>
  <!-- Top light bar -->
  <rect x="8" y="14" width="72" height="10" rx="4" fill="#d05030" stroke="#333" stroke-width="2"/>
  <!-- Reel display window -->
  <rect x="16" y="30" width="56" height="34" rx="4" fill="#f0e8d0" stroke="#333" stroke-width="2.5"/>
  <!-- Reel dividers -->
  <line x1="35" y1="30" x2="35" y2="64" stroke="#333" stroke-width="2"/>
  <line x1="53" y1="30" x2="53" y2="64" stroke="#333" stroke-width="2"/>
  <!-- Reel 1: Lemon -->
  <ellipse cx="26" cy="47" rx="8" ry="10" fill="#e8c820" stroke="#333" stroke-width="1.5"/>
  <path d="M26 37 Q30 35 26 33" fill="none" stroke="#3a8020" stroke-width="2" stroke-linecap="round"/>
  <!-- Reel 2: Bell -->
  <path d="M44 40 C38 42 36 50 38 56 L52 56 C54 50 52 42 44 40" fill="#e8c820" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="44" cy="57" rx="8" ry="3" fill="#c8a010" stroke="#333" stroke-width="1.5"/>
  <circle cx="44" cy="60" r="2" fill="#333"/>
  <!-- Reel 3: Cherry -->
  <circle cx="62" cy="50" r="7" fill="#d02020" stroke="#333" stroke-width="1.5"/>
  <circle cx="68" cy="44" r="5" fill="#d02020" stroke="#333" stroke-width="1.5"/>
  <path d="M62 43 Q65 38 68 39" fill="none" stroke="#3a8020" stroke-width="2" stroke-linecap="round"/>
  <!-- Coin slot -->
  <rect x="28" y="72" width="32" height="6" rx="3" fill="#222" stroke="#333" stroke-width="1.5"/>
  <!-- Win tray -->
  <path d="M18 88 L8 96 L80 96 L70 88 Z" fill="#c84020" stroke="#333" stroke-width="2"/>
  <!-- Lever -->
  <line x1="80" y1="35" x2="95" y2="60" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <circle cx="96" cy="63" r="6" fill="#d02020" stroke="#333" stroke-width="2.5"/>
  <circle cx="80" cy="35" r="4" fill="#aaa" stroke="#333" stroke-width="2"/>
