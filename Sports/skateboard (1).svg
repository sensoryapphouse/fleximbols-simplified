  <circle cx="24" cy="66" r="3" fill="#888"/>
  <circle cx="36" cy="66" r="7" fill="#f5c542" stroke="#222" stroke-width="2"/>
  <circle cx="36" cy="66" r="3" fill="#888"/>
  <circle cx="64" cy="66" r="7" fill="#f5c542" stroke="#222" stroke-width="2"/>
  <circle cx="64" cy="66" r="3" fill="#888"/>
  <circle cx="76" cy="66" r="7" fill="#f5c542" stroke="#222" stroke-width="2"/>
  <circle cx="76" cy="66" r="3" fill="#888"/>
  <!-- Kick tail up -->
