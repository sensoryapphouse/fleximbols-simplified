<!-- Male adult figure (slightly more formal than dad) -->
  <circle cx="50" cy="18" r="11" fill="#f5cba7" stroke="#333" stroke-width="2"/>
  <!-- Smart hair parted -->
  <path d="M39 13 Q42 7 50 8 Q58 7 61 13 Q58 9 50 9 Q42 9 39 13 Z" fill="#333" stroke="#333" stroke-width="1"/>
  <!-- Suit jacket body -->
  <rect x="38" y="30" width="24" height="32" rx="3" fill="#34495e" stroke="#333" stroke-width="2"/>
  <!-- Lapels -->
  <polygon points="50,30 44,40 38,35" fill="#2c3e50" stroke="#333" stroke-width="1"/>
  <polygon points="50,30 56,40 62,35" fill="#2c3e50" stroke="#333" stroke-width="1"/>
  <!-- Shirt/tie -->
<polygon points="50,32 48,42 50,40 52,42" fill="#e74c3c" stroke="#333" stroke-width="1"/>
  <!-- Arms -->
  <line x1="38" y1="36" x2="22" y2="52" stroke="#34495e" stroke-width="6" stroke-linecap="round"/>
  <line x1="62" y1="36" x2="78" y2="52" stroke="#34495e" stroke-width="6" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="20" cy="54" r="4" fill="#f5cba7" stroke="#333" stroke-width="1.5"/>
  <circle cx="80" cy="54" r="4" fill="#f5cba7" stroke="#333" stroke-width="1.5"/>
