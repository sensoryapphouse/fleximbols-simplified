  <rect x="38" y="60" width="10" height="18" rx="2" fill="#2c3e50" stroke="#333" stroke-width="2"/>
  <rect x="52" y="60" width="10" height="18" rx="2" fill="#2c3e50" stroke="#333" stroke-width="2"/>
  <path d="M46 22 Q50 26 54 22" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
