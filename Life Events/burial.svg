  <!-- Grave mound -->
  <ellipse cx="50" cy="60" rx="35" ry="8" fill="#6b7c50" stroke="#333" stroke-width="2"/>
  <!-- Coffin being lowered (dashed lines) -->
  <path d="M30 35 L30 58" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
