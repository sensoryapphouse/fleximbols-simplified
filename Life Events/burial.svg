  <rect x="47" y="28" width="6" height="18" rx="1" fill="#c8b090" stroke="#555" stroke-width="1.2"/>
  <rect x="42" y="33" width="16" height="6" rx="1" fill="#c8b090" stroke="#555" stroke-width="1.2"/>
