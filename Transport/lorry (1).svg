<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Trailer/cargo box -->
  <rect x="5" y="36" width="58" height="38" rx="3" fill="#aab7c4" stroke="#333" stroke-width="2.5"/>
  <!-- Cab -->
  <rect x="63" y="44" width="30" height="30" rx="4" fill="#6c8ebf" stroke="#333" stroke-width="2.5"/>
  <!-- Cab window -->
  <rect x="68" y="48" width="18" height="14" rx="2" fill="#aed6f1" stroke="#333" stroke-width="1.5"/>
  <!-- Cab roof fairing -->
  <path d="M63 44 Q65 36 75 34 L93 34 L93 44 Z" fill="#5a7aad" stroke="#333" stroke-width="2"/>
  <!-- Exhaust pipe -->
  <rect x="90" y="28" width="4" height="14" rx="2" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Headlight -->
  <rect x="89" y="60" width="6" height="5" rx="2" fill="#f9e64f" stroke="#333" stroke-width="1.5"/>
  <!-- Wheels - rear -->
  <circle cx="20" cy="74" r="10" fill="#555" stroke="#333" stroke-width="2.5"/>
  <circle cx="20" cy="74" r="4.5" fill="#888" stroke="#333" stroke-width="1.5"/>
  <circle cx="44" cy="74" r="10" fill="#555" stroke="#333" stroke-width="2.5"/>
  <circle cx="44" cy="74" r="4.5" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Wheels - front cab -->
  <circle cx="80" cy="74" r="10" fill="#555" stroke="#333" stroke-width="2.5"/>
  <circle cx="80" cy="74" r="4.5" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Label -->
</svg>
