<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Double-decker bus body -->
  <rect x="8" y="22" width="80" height="58" rx="4" fill="#e74c3c" stroke="#333" stroke-width="2.5"/>
  <!-- Upper deck windows -->
  <rect x="14" y="28" width="14" height="12" rx="2" fill="#aed6f1" stroke="#333" stroke-width="1.5"/>
  <rect x="32" y="28" width="14" height="12" rx="2" fill="#aed6f1" stroke="#333" stroke-width="1.5"/>
  <rect x="50" y="28" width="14" height="12" rx="2" fill="#aed6f1" stroke="#333" stroke-width="1.5"/>
  <rect x="68" y="28" width="14" height="12" rx="2" fill="#aed6f1" stroke="#333" stroke-width="1.5"/>
  <!-- Deck divider -->
  <rect x="8" y="42" width="80" height="4" fill="#c0392b" stroke="#333" stroke-width="1"/>
  <!-- Lower deck windows -->
  <rect x="14" y="49" width="14" height="12" rx="2" fill="#aed6f1" stroke="#333" stroke-width="1.5"/>
  <rect x="32" y="49" width="14" height="12" rx="2" fill="#aed6f1" stroke="#333" stroke-width="1.5"/>
  <rect x="50" y="49" width="14" height="12" rx="2" fill="#aed6f1" stroke="#333" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="68" y="48" width="14" height="20" rx="2" fill="#c0392b" stroke="#333" stroke-width="1.5"/>
  <!-- Front/headlight -->
  <rect x="84" y="30" width="6" height="8" rx="2" fill="#f9e64f" stroke="#333" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="26" cy="80" r="10" fill="#555" stroke="#333" stroke-width="2.5"/>
  <circle cx="26" cy="80" r="4.5" fill="#888" stroke="#333" stroke-width="1.5"/>
  <circle cx="72" cy="80" r="10" fill="#555" stroke="#333" stroke-width="2.5"/>
  <circle cx="72" cy="80" r="4.5" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Label -->
</svg>
