  <!-- Road edge lines -->
  <polygon points="30,78 34,78 52,12 42,12" fill="#e8e0d0"/>
  <polygon points="70,78 66,78 48,12 58,12" fill="#e8e0d0"/>
  <!-- Centre line (dashes, perspective) -->
  <line x1="50" y1="14" x2="50" y2="26" stroke="white" stroke-width="2"/>
  <line x1="50" y1="30" x2="50" y2="46" stroke="white" stroke-width="2.5"/>
  <line x1="50" y1="51" x2="50" y2="68" stroke="white" stroke-width="3"/>
  <!-- Ground on sides -->
  <polygon points="0,78 30,78 42,12 0,12" fill="#8ab870"/>
  <polygon points="100,78 70,78 58,12 100,12" fill="#8ab870"/>
  <!-- Label -->
</svg>