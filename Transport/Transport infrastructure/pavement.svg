  <!-- Road on the right -->
  <rect x="0" y="0" width="100" height="100" fill="#6b6f73"/>
  <!-- road centre dashes -->
  <g fill="#f4d03f">
    <rect x="84" y="8" width="5" height="16" rx="2"/>
    <rect x="84" y="34" width="5" height="16" rx="2"/>
    <rect x="84" y="60" width="5" height="16" rx="2"/>
    <rect x="84" y="86" width="5" height="16" rx="2"/>
  </g>
  <!-- kerb -->
  <rect x="62" y="0" width="8" height="100" fill="#b9bcc2" stroke="#333" stroke-width="2"/>
  <!-- Paved sidewalk slabs (left of kerb) -->
  <rect x="0" y="0" width="62" height="100" fill="#cfd3d8"/>
  <g stroke="#9aa0a6" stroke-width="2.5">
    <line x1="0" y1="25" x2="62" y2="25"/>
    <line x1="0" y1="50" x2="62" y2="50"/>
    <line x1="0" y1="75" x2="62" y2="75"/>
    <line x1="31" y1="0" x2="31" y2="100"/>
  </g>
  <!-- outline border between slab area and kerb -->
  <rect x="0" y="0" width="62" height="100" fill="none" stroke="#9aa0a6" stroke-width="2.5"/>
</svg>
