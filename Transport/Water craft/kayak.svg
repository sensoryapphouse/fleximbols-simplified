<!-- Water -->
  <path d="M5,70 Q25,66 50,70 Q75,74 95,70 L95,85 L5,85 Z" fill="#aed6f1" stroke="none"/>
  <path d="M5,72 Q25,68 50,72 Q75,76 95,72" fill="none" stroke="#5b8dd9" stroke-width="1.5"/>
