<!-- Wall mounting bracket -->
  <rect x="44" y="8" width="12" height="18" rx="3" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- Ring body outer -->
  <circle cx="50" cy="52" r="34" fill="#cc0000" stroke="#333" stroke-width="2.5"/>
  <!-- Ring inner hole -->
  <circle cx="50" cy="52" r="18" fill="white" stroke="#333" stroke-width="2.5"/>
  <!-- Alternating white quarter panels -->
  <path d="M50 18 A34 34 0 0 1 84 52 L66 52 A16 16 0 0 0 50 36Z" fill="white" stroke="none"/>
  <path d="M50 86 A34 34 0 0 1 16 52 L34 52 A16 16 0 0 0 50 68Z" fill="white" stroke="none"/>
  <!-- Ring outline redraw -->
  <circle cx="50" cy="52" r="34" fill="none" stroke="#333" stroke-width="2.5"/>
  <circle cx="50" cy="52" r="18" fill="none" stroke="#333" stroke-width="2.5"/>
  <!-- Ropes connecting to wall -->
  <line x1="50" y1="18" x2="50" y2="26" stroke="#c8a800" stroke-width="2" stroke-dasharray="2,1"/>
  <!-- Cross lines (rope across ring) -->
  <line x1="50" y1="18" x2="84" y2="52" stroke="#c8a800" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="50" y1="86" x2="16" y2="52" stroke="#c8a800" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
