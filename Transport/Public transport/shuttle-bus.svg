<!-- Small shuttle bus - minibus style -->
  <!-- Body -->
  <rect x="10" y="40" width="80" height="28" rx="6" fill="#6688aa" stroke="#333" stroke-width="2.5"/>
  <!-- Roof -->
  <rect x="14" y="32" width="72" height="10" rx="4" fill="#5577aa" stroke="#333" stroke-width="2"/>
  <!-- Front windshield - rounded -->
  <path d="M10 44 Q14 34 26 32 L26 52 Q16 52 10 44 Z" fill="#aaddff" stroke="#333" stroke-width="2"/>
  <!-- Side windows - three -->
  <rect x="30" y="42" width="14" height="14" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="48" y="42" width="14" height="14" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="66" y="42" width="14" height="14" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <!-- Rear window -->
  <rect x="84" y="44" width="4" height="12" rx="2" fill="#aaddff" stroke="#333" stroke-width="1"/>
  <!-- Door on right -->
  <rect x="78" y="40" width="10" height="28" rx="3" fill="#5577aa" stroke="#333" stroke-width="1.5"/>
  <line x1="83" y1="40" x2="83" y2="68" stroke="#6688aa" stroke-width="1"/>
  <!-- Headlights -->
  <ellipse cx="11" cy="56" rx="3" ry="4" fill="#ffffaa" stroke="#333" stroke-width="1"/>
  <!-- SHUTTLE text on side -->
  
  <!-- Wheels -->
  <circle cx="26" cy="68" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="26" cy="68" r="5" fill="#666"/>
  <circle cx="74" cy="68" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="74" cy="68" r="5" fill="#666"/>
</svg>
