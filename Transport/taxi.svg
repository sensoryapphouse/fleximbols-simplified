<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Yellow cab body -->
  <rect x="8" y="52" width="84" height="24" rx="5" fill="#f5c800" stroke="#333" stroke-width="2.5"/>
  <!-- Taxi roof/cabin -->
  <path d="M22 52 Q26 34 38 30 L62 30 Q74 34 78 52 Z" fill="#f5c800" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Windows -->
  <rect x="26" y="34" width="20" height="16" rx="3" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="54" y="34" width="20" height="16" rx="3" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <!-- Taxi light on roof -->

  <!-- Black checker stripe -->
  <rect x="8" y="60" width="84" height="6" rx="0" fill="none"/>
  <!-- Checker pattern -->
  <rect x="8" y="60" width="6" height="6" fill="#333"/>
  <rect x="20" y="60" width="6" height="6" fill="#333"/>
  <rect x="32" y="60" width="6" height="6" fill="#333"/>
  <rect x="44" y="60" width="6" height="6" fill="#333"/>
  <rect x="56" y="60" width="6" height="6" fill="#333"/>
  <rect x="68" y="60" width="6" height="6" fill="#333"/>
  <rect x="80" y="60" width="6" height="6" fill="#333"/>
  <rect x="14" y="60" width="6" height="6" fill="#f5c800"/>
  <!-- Phone icon showing app -->
  <rect x="78" y="46" width="12" height="18" rx="2" fill="#eee" stroke="#555" stroke-width="1"/>
  <rect x="79" y="48" width="10" height="12" rx="1" fill="#aaddff"/>
  <circle cx="84" cy="62" r="1.5" fill="#555"/>
  <!-- Wheels -->
  <circle cx="26" cy="76" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="26" cy="76" r="5" fill="#777"/>
  <circle cx="74" cy="76" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="74" cy="76" r="5" fill="#777"/>
</svg>
