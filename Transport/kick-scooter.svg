  <!-- Kick scooter: similar to push scooter but with foot kicking pose implied, folding stem -->
  <!-- Front wheel (larger) -->
  <circle cx="73" cy="76" r="14" fill="#d0d0d0" stroke="#222" stroke-width="2.5"/>
  <circle cx="73" cy="76" r="8" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="73" cy="76" r="2.5" fill="#222"/>
  <!-- Rear wheel (smaller) -->
  <circle cx="20" cy="80" r="10" fill="#d0d0d0" stroke="#222" stroke-width="2.5"/>
  <circle cx="20" cy="80" r="5" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="20" cy="80" r="2.5" fill="#222"/>
  <!-- Deck (low, near ground) -->
  <rect x="14" y="66" width="64" height="7" rx="2.5" fill="#3366cc" stroke="#222" stroke-width="2"/>
  <!-- Stem (slightly angled, foldable joint shown) -->
  <line x1="70" y1="62" x2="56" y2="18" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Fold joint circle -->
  <circle cx="62" cy="42" r="4" fill="#aaa" stroke="#222" stroke-width="1.5"/>
  <!-- Handlebar -->
  <line x1="48" y1="16" x2="64" y2="16" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="16" x2="56" y2="20" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Grips -->
  <rect x="45" y="13" width="6" height="6" rx="3" fill="#333" stroke="#222" stroke-width="1.5"/>
  <rect x="61" y="13" width="6" height="6" rx="3" fill="#333" stroke="#222" stroke-width="1.5"/>
  <!-- Brake lever suggestion -->
  <line x1="64" y1="16" x2="67" y2="22" stroke="#222" stroke-width="2" stroke-linecap="round"/>
</svg>
