<!-- Book spine -->
  <rect x="18" y="12" width="12" height="70" rx="3" fill="#2a4a8a" stroke="#1a3060" stroke-width="2"/>
  <!-- Book cover front -->
  <rect x="28" y="12" width="52" height="70" rx="3" fill="#2a4a8a" stroke="#333" stroke-width="2.5"/>
  <!-- Cover content -->
  <rect x="32" y="18" width="44" height="30" rx="2" fill="#4060a0" stroke="#1a3060" stroke-width="1.5"/>
  <!-- Landmark on cover (simple tower) -->
  <rect x="46" y="24" width="12" height="20" rx="1" fill="#e8c44a" stroke="#c8a020" stroke-width="1.5"/>
  <polygon points="42,24 52,16 62,24" fill="#e8c44a" stroke="#c8a020" stroke-width="1.5"/>
  <rect x="50" y="36" width="4" height="8" rx="0" fill="#2a4a8a" stroke="none"/>
  <!-- Title text on cover -->
  <rect x="32" y="52" width="44" height="6" rx="1" fill="#e8c44a" stroke="none"/>
  <text x="54" y="57" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="5" text-anchor="middle" fill="#2a4a8a" font-weight="bold">TRAVEL GUIDE</text>
