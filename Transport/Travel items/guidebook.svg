  <line x1="34" y1="62" x2="72" y2="62" stroke="#4060a0" stroke-width="1.5"/>
  <line x1="34" y1="67" x2="60" y2="67" stroke="#4060a0" stroke-width="1.5"/>
  <line x1="34" y1="72" x2="68" y2="72" stroke="#4060a0" stroke-width="1.5"/>
  <!-- Pages visible at bottom -->
