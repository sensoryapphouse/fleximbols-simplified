  <!-- Balance bike: no pedals, low frame, two wheels -->
  <!-- Rear wheel -->
  <circle cx="22" cy="68" r="18" fill="#d0d0d0" stroke="#222" stroke-width="2.5"/>
  <circle cx="22" cy="68" r="10" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="22" cy="68" r="3" fill="#222"/>
  <!-- Front wheel -->
  <circle cx="76" cy="68" r="18" fill="#d0d0d0" stroke="#222" stroke-width="2.5"/>
  <circle cx="76" cy="68" r="10" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="76" cy="68" r="3" fill="#222"/>
  <!-- Frame: seat tube -->
  <line x1="45" y1="50" x2="42" y2="68" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Frame: down tube to front -->
  <line x1="45" y1="50" x2="70" y2="52" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="70" y1="52" x2="76" y2="68" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Frame: chain stay to rear -->
  <line x1="42" y1="68" x2="22" y2="68" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Frame: seat stay -->
  <line x1="45" y1="50" x2="22" y2="68" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Seat (low, for striding) -->
  <rect x="37" y="44" width="16" height="5" rx="2.5" fill="#e07020" stroke="#222" stroke-width="2"/>
  <line x1="45" y1="49" x2="45" y2="50" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <!-- Handlebars -->
  <line x1="65" y1="44" x2="77" y2="44" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="44" x2="70" y2="52" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
</svg>
