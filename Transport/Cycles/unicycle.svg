  <!-- Unicycle: single wheel, pedals, seat post, saddle -->
  <!-- Wheel -->
  <circle cx="50" cy="72" r="22" fill="#d0d0d0" stroke="#222" stroke-width="2.5"/>
  <circle cx="50" cy="72" r="13" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="50" cy="72" r="3.5" fill="#222"/>
  <!-- Spokes -->
  <line x1="50" y1="72" x2="50" y2="50" stroke="#555" stroke-width="1.5"/>
  <line x1="50" y1="72" x2="50" y2="94" stroke="#555" stroke-width="1.5"/>
  <line x1="50" y1="72" x2="28" y2="72" stroke="#555" stroke-width="1.5"/>
  <line x1="50" y1="72" x2="72" y2="72" stroke="#555" stroke-width="1.5"/>
  <!-- Seat post -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Saddle -->
  <ellipse cx="50" cy="26" rx="12" ry="4" fill="#8B4513" stroke="#222" stroke-width="2"/>
  <!-- Pedal crank arm -->
  <line x1="40" y1="72" x2="60" y2="72" stroke="#444" stroke-width="3" stroke-linecap="round"/>
  <!-- Pedals -->
  <rect x="30" y="69" width="10" height="5" rx="1" fill="#555" stroke="#222" stroke-width="1.5"/>
  <rect x="60" y="69" width="10" height="5" rx="1" fill="#555" stroke="#222" stroke-width="1.5"/>
</svg>
