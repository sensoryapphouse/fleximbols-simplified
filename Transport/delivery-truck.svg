<!-- Box truck / delivery truck -->
  <!-- Cab -->
  <path d="M6 46 L6 70 L32 70 L32 38 Q24 34 14 36 L6 42 Z" fill="#6699aa" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cab windshield -->
  <path d="M12 44 Q16 38 30 38 L30 54 L12 54 Z" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <!-- Box body -->
  <rect x="32" y="30" width="62" height="40" rx="3" fill="#6699aa" stroke="#333" stroke-width="2.5"/>
  <!-- Box roof -->
  <rect x="32" y="26" width="62" height="6" rx="2" fill="#5588aa" stroke="#333" stroke-width="2"/>
  <!-- Roller shutter door on rear -->
  <rect x="88" y="30" width="6" height="40" rx="2" fill="#5588aa" stroke="#333" stroke-width="1.5"/>
  <!-- Roller door lines -->
  <line x1="88" y1="34" x2="94" y2="34" stroke="#4477aa" stroke-width="1"/>
  <line x1="88" y1="38" x2="94" y2="38" stroke="#4477aa" stroke-width="1"/>
  <line x1="88" y1="42" x2="94" y2="42" stroke="#4477aa" stroke-width="1"/>
  <line x1="88" y1="46" x2="94" y2="46" stroke="#4477aa" stroke-width="1"/>
  <line x1="88" y1="50" x2="94" y2="50" stroke="#4477aa" stroke-width="1"/>
  <line x1="88" y1="54" x2="94" y2="54" stroke="#4477aa" stroke-width="1"/>
  <line x1="88" y1="58" x2="94" y2="58" stroke="#4477aa" stroke-width="1"/>
  <line x1="88" y1="62" x2="94" y2="62" stroke="#4477aa" stroke-width="1"/>
  <!-- Box side: parcel graphic -->
  <rect x="40" y="36" width="40" height="28" rx="2" fill="#5588aa" stroke="#aaddcc" stroke-width="1.5"/>
  <!-- Arrow showing delivery -->
  <path d="M48 50 L66 50" fill="none" stroke="white" stroke-width="2.5"/>
  <polygon points="66,47 72,50 66,53" fill="white"/>
  <!-- Bumper/step -->
  <rect x="6" y="68" width="88" height="4" rx="2" fill="#445566" stroke="#333" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="18" cy="70" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="18" cy="70" r="5" fill="#666"/>
  <circle cx="52" cy="70" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="52" cy="70" r="5" fill="#666"/>
  <circle cx="80" cy="70" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="80" cy="70" r="5" fill="#666"/>
</svg>
