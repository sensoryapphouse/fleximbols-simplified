  <line x1="0" y1="74" x2="100" y2="74" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <line x1="0" y1="82" x2="100" y2="82" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Sleepers -->
  <line x1="10" y1="72" x2="10" y2="84" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <line x1="25" y1="72" x2="25" y2="84" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="72" x2="40" y2="84" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="72" x2="55" y2="84" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="72" x2="70" y2="84" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="72" x2="85" y2="84" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
