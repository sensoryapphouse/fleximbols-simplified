  <ellipse cx="33" cy="47" rx="6" ry="3" fill="#8b6040" stroke="#333" stroke-width="1.5" transform="rotate(-30,33,47)"/>
  <ellipse cx="74" cy="73" rx="6" ry="3" fill="#8b6040" stroke="#333" stroke-width="1.5" transform="rotate(-30,74,73)"/>
  <!-- Person (kneeling) -->
