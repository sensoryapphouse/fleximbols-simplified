<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Body -->
  <rect x="30" y="38" width="52" height="28" rx="3" fill="#e85c2c" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Engine hood -->
  <rect x="56" y="42" width="26" height="18" rx="2" fill="#c8401a" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <!-- Exhaust pipe -->
  <rect x="74" y="30" width="5" height="15" rx="2" fill="#555" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="76.5" cy="29" rx="4" ry="2" fill="#777" stroke="#222" stroke-width="1"/>
  <!-- Cab -->
  <rect x="30" y="26" width="28" height="14" rx="3" fill="#e85c2c" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cab window -->
  <rect x="33" y="28" width="21" height="11" rx="2" fill="#aad4f5" stroke="#222" stroke-width="1.5"/>
  <!-- Cab roof -->
  <rect x="28" y="22" width="32" height="6" rx="2" fill="#c8401a" stroke="#222" stroke-width="2"/>
  <!-- Front small wheel -->
  <circle cx="74" cy="68" r="9" fill="#333" stroke="#222" stroke-width="2.5"/>
  <circle cx="74" cy="68" r="4" fill="#888"/>
  <!-- Big rear wheel -->
  <circle cx="32" cy="72" r="18" fill="#333" stroke="#222" stroke-width="2.5"/>
  <circle cx="32" cy="72" r="9" fill="#888"/>
  <!-- Wheel lugs on big wheel -->
  <line x1="32" y1="54" x2="32" y2="90" stroke="#555" stroke-width="1.5"/>
  <line x1="14" y1="72" x2="50" y2="72" stroke="#555" stroke-width="1.5"/>
  <line x1="19" y1="59" x2="45" y2="85" stroke="#555" stroke-width="1.5"/>
  <line x1="45" y1="59" x2="19" y2="85" stroke="#555" stroke-width="1.5"/>
</svg>
