<!-- Classic red double-decker bus -->
  <!-- Upper deck -->
  <rect x="8" y="16" width="82" height="28" rx="4" fill="#cc2222" stroke="#333" stroke-width="2.5"/>
  <!-- Upper deck windows -->
  <rect x="12" y="20" width="14" height="16" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="30" y="20" width="14" height="16" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="48" y="20" width="14" height="16" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="66" y="20" width="14" height="16" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <!-- Upper deck divider strip -->
  <rect x="8" y="42" width="82" height="4" rx="0" fill="#aa1111" stroke="#333" stroke-width="1"/>
  <!-- Lower deck -->
  <rect x="8" y="44" width="82" height="26" rx="4" fill="#cc2222" stroke="#333" stroke-width="2.5"/>
  <!-- Lower deck windows -->
  <rect x="28" y="48" width="14" height="14" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="46" y="48" width="14" height="14" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="64" y="48" width="14" height="14" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <!-- Front windshield lower -->
  <rect x="10" y="48" width="14" height="14" rx="2" fill="#aaddff" stroke="#333" stroke-width="2"/>
  <!-- Door area -->
  <rect x="82" y="46" width="8" height="24" rx="2" fill="#aa1111" stroke="#333" stroke-width="1.5"/>
  <!-- Bus number display -->
  <rect x="10" y="10" width="20" height="8" rx="2" fill="#222" stroke="#333" stroke-width="1"/>
  
  <!-- Wheels -->
  <circle cx="24" cy="70" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="24" cy="70" r="5" fill="#666"/>
  <circle cx="76" cy="70" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="76" cy="70" r="5" fill="#666"/>
</svg>
