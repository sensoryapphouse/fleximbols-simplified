  <!-- LSV = Low Speed Vehicle (street legal golf cart style) -->
  <!-- enclosed body, more car-like than golf cart -->
  <!-- body -->
  <path d="M8 70 L8 44 Q8 40 12 40 L16 40 Q24 30 32 28 L72 28 Q80 30 86 36 L92 40 Q95 40 95 44 L95 70 Z" fill="#a0b8d0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- roof (shorter, rounded) -->
  <path d="M24 40 Q28 32 36 29 L72 28 Q80 30 84 36 L90 40 Z" fill="#80a0b8" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- windows -->
  <rect x="26" y="30" width="22" height="16" rx="2" fill="#c8e0f0" stroke="#333" stroke-width="1.5"/>
  <rect x="50" y="30" width="20" height="16" rx="2" fill="#c8e0f0" stroke="#333" stroke-width="1.5"/>
  <!-- door line -->
  <line x1="50" y1="46" x2="48" y2="70" stroke="#80a0b8" stroke-width="2" stroke-linecap="round"/>
  <!-- door handles -->
  <rect x="36" y="56" width="8" height="3" rx="1" fill="#888" stroke="#555" stroke-width="1"/>
  <rect x="60" y="56" width="8" height="3" rx="1" fill="#888" stroke="#555" stroke-width="1"/>
  <!-- bottom rail -->
  <rect x="8" y="66" width="87" height="6" rx="1" fill="#608090" stroke="#333" stroke-width="2"/>
  <!-- street-legal lights (larger than golf cart) -->
  <!-- headlight housing -->
  <rect x="88" y="42" width="6" height="10" rx="2" fill="#e8d050" stroke="#333" stroke-width="1.5"/>
  <!-- DRL strip -->
  <line x1="86" y1="44" x2="92" y2="44" stroke="#f0f0a0" stroke-width="2"/>
  <!-- taillight -->
  <rect x="6" y="44" width="6" height="10" rx="2" fill="#e05050" stroke="#333" stroke-width="1.5"/>
  <!-- LSV badge -->
  <rect x="36" y="62" width="28" height="8" rx="2" fill="#d0e0f0" stroke="#333" stroke-width="1.5"/>
  
  <!-- wheels -->
  <circle cx="24" cy="73" r="11" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="24" cy="73" r="7" fill="#888" stroke="#555" stroke-width="1.5"/>
  <circle cx="24" cy="73" r="3" fill="#ccc"/>
  <circle cx="78" cy="73" r="11" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="78" cy="73" r="7" fill="#888" stroke="#555" stroke-width="1.5"/>
  <circle cx="78" cy="73" r="3" fill="#ccc"/>
</svg>
