<!-- VW-style camper van - rounded body -->
  <!-- Main body -->
  <path d="M10 72 L10 44 Q12 26 30 20 L70 20 Q88 26 90 44 L90 72 Z" fill="#e8d870" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Two-tone paint split (classic VW) -->
  <path d="M10 52 Q12 46 18 44 L82 44 Q88 46 90 52 L90 72 L10 72 Z" fill="white" stroke="none"/>
  <line x1="10" y1="52" x2="90" y2="52" stroke="#333" stroke-width="2"/>
  <!-- VW split windshield -->
  <rect x="14" y="26" width="30" height="20" rx="3" fill="#aaddff" stroke="#333" stroke-width="2"/>
  <line x1="29" y1="26" x2="29" y2="46" stroke="#333" stroke-width="2"/>
  <!-- Side windows -->
  <rect x="50" y="26" width="16" height="18" rx="3" fill="#aaddff" stroke="#333" stroke-width="2"/>
  <rect x="70" y="28" width="14" height="14" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <!-- VW roundel -->
  <circle cx="50" cy="52" r="8" fill="#e8d870" stroke="#333" stroke-width="2"/>
  <circle cx="50" cy="52" r="5" fill="#e8d870" stroke="#333" stroke-width="1.5"/>
  <text x="50" y="55" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold" text-anchor="middle" fill="#333">VW</text>
  <!-- Roof rack -->
  <rect x="16" y="18" width="68" height="4" rx="2" fill="#888" stroke="#333" stroke-width="1.5"/>
  <line x1="26" y1="18" x2="26" y2="22" stroke="#333" stroke-width="1"/>
  <line x1="50" y1="18" x2="50" y2="22" stroke="#333" stroke-width="1"/>
  <line x1="74" y1="18" x2="74" y2="22" stroke="#333" stroke-width="1"/>
  <!-- Pop-top suggestion -->
  <rect x="30" y="14" width="40" height="6" rx="2" fill="#e8d870" stroke="#333" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Headlights - round VW style -->
  <circle cx="15" cy="54" r="5" fill="#ffffaa" stroke="#333" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="24" cy="72" r="11" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="24" cy="72" r="5" fill="#888"/>
  <circle cx="76" cy="72" r="11" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="76" cy="72" r="5" fill="#888"/>
</svg>
