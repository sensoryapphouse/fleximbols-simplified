<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Body -->
  <rect x="8" y="44" width="84" height="28" rx="3" fill="#5a9e5a" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cab top - boxy 4x4 style -->
  <rect x="18" y="26" width="60" height="20" rx="3" fill="#5a9e5a" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Windscreen -->
  <rect x="22" y="28" width="22" height="15" rx="2" fill="#aad4f5" stroke="#222" stroke-width="1.5"/>
  <!-- Rear window -->
  <rect x="56" y="28" width="18" height="15" rx="2" fill="#aad4f5" stroke="#222" stroke-width="1.5"/>
  <!-- B-pillar -->
  <rect x="45" y="26" width="5" height="20" fill="#5a9e5a" stroke="#222" stroke-width="1"/>
  <!-- Grille -->
  <rect x="8" y="46" width="12" height="12" rx="2" fill="#aaa" stroke="#222" stroke-width="1.5"/>
  <line x1="14" y1="46" x2="14" y2="58" stroke="#222" stroke-width="1"/>
  <line x1="8" y1="52" x2="20" y2="52" stroke="#222" stroke-width="1"/>
  <!-- Headlight -->
  <rect x="8" y="44" width="8" height="6" rx="1" fill="#f5f5aa" stroke="#222" stroke-width="1.5"/>
  <!-- Bull bar -->
  <rect x="6" y="56" width="4" height="10" rx="1" fill="#888" stroke="#222" stroke-width="1.5"/>
  <!-- Spare tyre on back -->
  <circle cx="88" cy="56" r="10" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="88" cy="56" r="5" fill="#888"/>
  <!-- Big tyres -->
  <circle cx="24" cy="72" r="13" fill="#333" stroke="#222" stroke-width="2.5"/>
  <circle cx="24" cy="72" r="6" fill="#888"/>
  <circle cx="74" cy="72" r="13" fill="#333" stroke="#222" stroke-width="2.5"/>
  <circle cx="74" cy="72" r="6" fill="#888"/>
</svg>
