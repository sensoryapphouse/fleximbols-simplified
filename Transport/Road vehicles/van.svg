<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Van body -->
  <rect x="8" y="38" width="84" height="38" rx="4" fill="#5b8dd9" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cab section top -->
  <rect x="8" y="28" width="32" height="12" rx="3" fill="#5b8dd9" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <!-- Windscreen -->
  <rect x="11" y="30" width="26" height="10" rx="2" fill="#aad4f5" stroke="#222" stroke-width="1.5"/>
  <!-- Side windows (panel van – small) -->
  <rect x="16" y="42" width="14" height="10" rx="2" fill="#aad4f5" stroke="#222" stroke-width="1.5"/>
  <!-- Rear doors line -->
  <line x1="72" y1="38" x2="72" y2="76" stroke="#222" stroke-width="2"/>
  <circle cx="76" cy="57" r="2" fill="#222"/>
  <!-- Grille -->
  <rect x="8" y="62" width="8" height="8" rx="1" fill="#aad4f5" stroke="#222" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="26" cy="76" r="11" fill="#333" stroke="#222" stroke-width="2.5"/>
  <circle cx="26" cy="76" r="5" fill="#888"/>
  <circle cx="74" cy="76" r="11" fill="#333" stroke="#222" stroke-width="2.5"/>
  <circle cx="74" cy="76" r="5" fill="#888"/>
  <!-- Wheel arches -->
  <path d="M14 76 Q26 64 38 76" fill="none" stroke="#222" stroke-width="2"/>
  <path d="M62 76 Q74 64 86 76" fill="none" stroke="#222" stroke-width="2"/>
</svg>
