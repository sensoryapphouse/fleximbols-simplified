  <!-- pickup truck - cab + cargo bed -->
  <!-- cargo bed (left) -->
  <path d="M4 68 L4 50 L6 48 L40 48 L40 68 Z" fill="#8a7060" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- bed walls -->
  <rect x="4" y="48" width="36" height="6" rx="1" fill="#6a5040" stroke="#333" stroke-width="2"/>
  <!-- cab (right) -->
  <path d="M40 68 L40 44 Q40 40 44 40 L48 40 Q54 32 62 30 L84 30 Q90 32 94 36 L97 40 Q97 40 97 44 L97 68 Z" fill="#8a7060" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cab roof -->
  <path d="M48 40 Q52 34 60 31 L84 31 Q90 32 93 36 L96 40 Z" fill="#6a5040" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- windows -->
  <rect x="52" y="32" width="22" height="16" rx="2" fill="#b8d8f0" stroke="#333" stroke-width="1.5"/>
  <path d="M76 32 Q82 33 88 37 L92 40 L75 40 Z" fill="#b8d8f0" stroke="#333" stroke-width="1.5"/>
  <!-- door line -->
  <line x1="74" y1="44" x2="72" y2="68" stroke="#6a5040" stroke-width="1.5" stroke-linecap="round"/>
  <!-- bottom rail -->
  <rect x="4" y="64" width="93" height="6" rx="1" fill="#6a5040" stroke="#333" stroke-width="2"/>
  <!-- wheels -->
  <circle cx="21" cy="70" r="12" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="21" cy="70" r="7" fill="#888" stroke="#555" stroke-width="1.5"/>
  <circle cx="21" cy="70" r="3" fill="#ccc"/>
  <circle cx="79" cy="70" r="12" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="79" cy="70" r="7" fill="#888" stroke="#555" stroke-width="1.5"/>
  <circle cx="79" cy="70" r="3" fill="#ccc"/>
  <!-- headlight -->
  <rect x="91" y="42" width="5" height="9" rx="2" fill="#e8d050" stroke="#333" stroke-width="1.5"/>
  <!-- taillight -->
  <rect x="4" y="52" width="4" height="8" rx="2" fill="#e05050" stroke="#333" stroke-width="1.5"/>
  <!-- tow hitch -->
  <rect x="4" y="64" width="4" height="4" rx="1" fill="#888" stroke="#333" stroke-width="1.5"/>
  <line x1="2" y1="66" x2="6" y2="66" stroke="#333" stroke-width="2"/>
