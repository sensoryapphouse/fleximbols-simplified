<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Main rotor blades -->
  <line x1="15" y1="28" x2="85" y2="28" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="50" y2="36" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round"/>
  <!-- Rotor hub -->
  <circle cx="50" cy="28" r="4" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- Rotor mast -->
  <line x1="50" y1="32" x2="50" y2="42" stroke="#555" stroke-width="2"/>
  <!-- Fuselage body -->
  <path d="M20 42 Q20 35 35 35 L72 35 Q82 35 82 42 L82 58 Q82 65 72 65 L35 65 Q20 65 20 58 Z" fill="#7090c0" stroke="#2a4080" stroke-width="2.5"/>
  <!-- Cockpit bubble -->
  <path d="M60 35 L80 38 Q88 42 88 50 Q88 58 80 62 L60 65" fill="#aaddff" stroke="#2a4080" stroke-width="2"/>
  <!-- Window in cockpit -->
  <ellipse cx="78" cy="50" rx="6" ry="8" fill="#cceeff" stroke="#2a4080" stroke-width="1.5"/>
  <!-- Side windows -->
  <rect x="35" y="40" width="10" height="8" rx="2" fill="#cceeff" stroke="#2a4080" stroke-width="1.5"/>
  <rect x="50" y="40" width="10" height="8" rx="2" fill="#cceeff" stroke="#2a4080" stroke-width="1.5"/>
  <!-- Tail boom -->
  <path d="M20 50 L5 52 L5 55 L20 58" fill="#7090c0" stroke="#2a4080" stroke-width="2"/>
  <!-- Tail rotor -->
  <line x1="5" y1="45" x2="5" y2="62" stroke="#4a4a4a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="5" cy="54" r="3" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Skids -->
  <line x1="30" y1="65" x2="28" y2="74" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="65" x2="62" y2="74" stroke="#333" stroke-width="2"/>
  <line x1="22" y1="74" x2="38" y2="74" stroke="#333" stroke-width="2.5"/>
  <line x1="55" y1="74" x2="70" y2="74" stroke="#333" stroke-width="2.5"/>
  <!-- Label -->
</svg>
