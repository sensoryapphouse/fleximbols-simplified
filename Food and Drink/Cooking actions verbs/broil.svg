<!-- Overhead heating element -->
  <rect x="12" y="15" width="76" height="10" rx="3" fill="#c8c8c0" stroke="#444" stroke-width="2.5"/>
  <!-- Heating coils (glowing red) -->
  <path d="M18 20 Q22 16 26 20 Q30 24 34 20 Q38 16 42 20 Q46 24 50 20 Q54 16 58 20 Q62 24 66 20 Q70 16 74 20 Q78 24 82 20" fill="none" stroke="#e03010" stroke-width="3" stroke-linecap="round"/>
  <!-- Heat rays downward -->
  <line x1="25" y1="25" x2="25" y2="40" stroke="#f05010" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="25" x2="35" y2="42" stroke="#f05010" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="25" x2="50" y2="44" stroke="#f05010" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="25" x2="65" y2="42" stroke="#f05010" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="25" x2="75" y2="40" stroke="#f05010" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrows showing heat direction -->
  <polygon points="25,40 22,34 28,34" fill="#f05010"/>
  <polygon points="50,44 47,38 53,38" fill="#f05010"/>
  <polygon points="75,40 72,34 78,34" fill="#f05010"/>
  <!-- Broiling rack -->
  <rect x="14" y="60" width="72" height="5" rx="2" fill="#888" stroke="#444" stroke-width="1.5"/>
  <line x1="25" y1="60" x2="25" y2="65" stroke="#666" stroke-width="2"/>
  <line x1="38" y1="60" x2="38" y2="65" stroke="#666" stroke-width="2"/>
  <line x1="50" y1="60" x2="50" y2="65" stroke="#666" stroke-width="2"/>
  <line x1="62" y1="60" x2="62" y2="65" stroke="#666" stroke-width="2"/>
  <line x1="75" y1="60" x2="75" y2="65" stroke="#666" stroke-width="2"/>
  <!-- Food on rack -->
  <path d="M28 54 Q50 46 72 54 Q68 62 50 63 Q32 62 28 54Z" fill="#c87820" stroke="#8a5010" stroke-width="2"/>
  <!-- Sear marks -->
  <line x1="38" y1="52" x2="38" y2="62" stroke="#5a2a00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="63" stroke="#5a2a00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="52" x2="62" y2="62" stroke="#5a2a00" stroke-width="1.5" stroke-linecap="round"/>
