  <line x1="36" y1="60" x2="28" y2="66" stroke="#e8a040" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="60" x2="72" y2="66" stroke="#e8a040" stroke-width="3" stroke-linecap="round"/>
