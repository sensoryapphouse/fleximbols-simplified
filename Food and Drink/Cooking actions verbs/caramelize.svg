  <circle cx="36" cy="32" r="1.5" fill="#f0f0f0"/>
  <circle cx="42" cy="31" r="1.5" fill="#f0f0f0"/>
  <circle cx="48" cy="32" r="1.5" fill="#f0f0f0"/>
