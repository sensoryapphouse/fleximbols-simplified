  <!-- Saucepan/skillet -->
  <path d="M16 52 L20 86 L80 86 L84 52 Z" fill="#c8a870" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="12" y="46" width="76" height="8" rx="3" fill="#b09050" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Handle -->
  <rect x="88" y="48" width="10" height="6" rx="3" fill="#8b4513" stroke="#333" stroke-width="2"/>
