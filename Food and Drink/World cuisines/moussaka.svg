<!-- Baking dish -->
  <path d="M10 55 L10 78 L90 78 L90 55 Z" fill="#c87830" stroke="#7a3c0a" stroke-width="2"/>
  <rect x="10" y="50" width="80" height="8" rx="2" fill="#d88840" stroke="#7a3c0a" stroke-width="2"/>
  <!-- Layered bake visible from side/front -->
  <!-- Bechamel top (cream/white) -->
  <rect x="12" y="52" width="76" height="12" rx="1" fill="#f0e8c8" stroke="#c8b080" stroke-width="1.5"/>
  <!-- Golden brown top -->
  <path d="M12 52 Q50 48 88 52" fill="none" stroke="#c8900a" stroke-width="2" stroke-linecap="round"/>
  <!-- Meat layer (brown) -->
  <rect x="12" y="61" width="76" height="8" rx="1" fill="#8B4018" stroke="#5a1a00" stroke-width="1.5"/>
  <!-- Eggplant layer (purple-brown) -->
  <rect x="12" y="66" width="76" height="8" rx="1" fill="#5a2878" stroke="#3a0a50" stroke-width="1.5"/>
  <!-- Potato layer (yellow) -->
  <rect x="12" y="71" width="76" height="5" rx="1" fill="#d4c060" stroke="#8B8030" stroke-width="1.5"/>
  <!-- Dish handles -->
  <rect x="2" y="60" width="10" height="6" rx="2" fill="#c07030" stroke="#7a3c0a" stroke-width="1.5"/>
  <rect x="88" y="60" width="10" height="6" rx="2" fill="#c07030" stroke="#7a3c0a" stroke-width="1.5"/>
