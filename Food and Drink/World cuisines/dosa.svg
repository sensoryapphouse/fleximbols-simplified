<!-- Dosa - large thin crepe, rolled/cone shape -->
  <!-- Plate -->
  <ellipse cx="50" cy="78" rx="38" ry="8" fill="#e8e0d0" stroke="#a09080" stroke-width="1.5"/>
  <!-- Dosa body (large curved crepe) -->
  <path d="M10 45 Q50 25 90 45 Q90 68 70 72 Q50 75 30 72 Q10 68 10 45Z" fill="#e8c870" stroke="#a07830" stroke-width="2" stroke-linejoin="round"/>
  <!-- Dosa crispy edge texture -->
  <path d="M10 45 Q30 35 50 30 Q70 35 90 45" fill="none" stroke="#c8a830" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Filling visible at one end -->
  <ellipse cx="50" cy="60" rx="15" ry="6" fill="#e8a83a" stroke="#a07830" stroke-width="1.5"/>
  <!-- Lacy holes -->
  <circle cx="35" cy="50" r="2" fill="white" stroke="none"/>
  <circle cx="65" cy="48" r="2.5" fill="white" stroke="none"/>
  <circle cx="50" cy="44" r="2" fill="white" stroke="none"/>
</svg>
