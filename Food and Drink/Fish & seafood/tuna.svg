<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- tuna steak - dark red-brown thick steak -->
  <rect x="16" y="28" width="68" height="46" rx="6" fill="#6D3B2E" stroke="#3E1F15" stroke-width="2.5"/>
  <!-- seared crust top -->
  <rect x="16" y="28" width="68" height="10" rx="5" fill="#3E1F15" stroke="#3E1F15" stroke-width="1"/>
  <!-- red tuna flesh -->
  <rect x="18" y="36" width="64" height="34" rx="4" fill="#8D3A2E" stroke="none"/>
  <!-- flesh grain lines -->
  <line x1="18" y1="44" x2="82" y2="44" stroke="#6D3B2E" stroke-width="1.5"/>
  <line x1="18" y1="52" x2="82" y2="52" stroke="#6D3B2E" stroke-width="1.5"/>
  <line x1="18" y1="60" x2="82" y2="60" stroke="#6D3B2E" stroke-width="1.5"/>
  <!-- highlight -->
  <ellipse cx="40" cy="40" rx="12" ry="5" fill="#A05040" opacity="0.5"/>
  <!-- sesame seeds on crust -->
  <ellipse cx="32" cy="32" rx="3" ry="1.5" fill="#F5DEB3"/>
  <ellipse cx="44" cy="31" rx="3" ry="1.5" fill="#F5DEB3"/>
  <ellipse cx="56" cy="32" rx="3" ry="1.5" fill="#F5DEB3"/>
  <ellipse cx="68" cy="31" rx="3" ry="1.5" fill="#F5DEB3"/>
</svg>
