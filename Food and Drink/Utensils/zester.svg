  <!-- Zester: rasp-style microplane grater with lemon/citrus zest -->
  <!-- Handle -->
  <rect x="60" y="55" width="32" height="16" rx="7" fill="#f5a623" stroke="#222" stroke-width="2.5"/>
  <!-- Handle grip lines -->
  <line x1="64" y1="55" x2="64" y2="71" stroke="#e67e22" stroke-width="1.5"/>
  <line x1="70" y1="55" x2="70" y2="71" stroke="#e67e22" stroke-width="1.5"/>
  <line x1="76" y1="55" x2="76" y2="71" stroke="#e67e22" stroke-width="1.5"/>
  <line x1="82" y1="55" x2="82" y2="71" stroke="#e67e22" stroke-width="1.5"/>
  <!-- Grater frame/neck -->
  <rect x="52" y="56" width="12" height="14" rx="2" fill="#888" stroke="#222" stroke-width="2"/>
  <!-- Long grater blade (microplane style) -->
  <rect x="8" y="56" width="46" height="14" rx="3" fill="#ccc" stroke="#222" stroke-width="2.5"/>
  <!-- Microplane holes/rasps (pattern of small raised dots) -->
  <circle cx="14" cy="60" r="1.5" fill="#888"/>
  <circle cx="20" cy="60" r="1.5" fill="#888"/>
  <circle cx="26" cy="60" r="1.5" fill="#888"/>
  <circle cx="32" cy="60" r="1.5" fill="#888"/>
  <circle cx="38" cy="60" r="1.5" fill="#888"/>
  <circle cx="44" cy="60" r="1.5" fill="#888"/>
  <circle cx="14" cy="66" r="1.5" fill="#888"/>
  <circle cx="20" cy="66" r="1.5" fill="#888"/>
  <circle cx="26" cy="66" r="1.5" fill="#888"/>
  <circle cx="32" cy="66" r="1.5" fill="#888"/>
  <circle cx="38" cy="66" r="1.5" fill="#888"/>
  <circle cx="44" cy="66" r="1.5" fill="#888"/>
  <circle cx="17" cy="63" r="1.5" fill="#888"/>
  <circle cx="23" cy="63" r="1.5" fill="#888"/>
  <circle cx="29" cy="63" r="1.5" fill="#888"/>
  <circle cx="35" cy="63" r="1.5" fill="#888"/>
  <circle cx="41" cy="63" r="1.5" fill="#888"/>
  <circle cx="47" cy="63" r="1.5" fill="#888"/>
  <!-- Lemon being zested (top right) -->
  <ellipse cx="72" cy="28" rx="20" ry="16" fill="#fff700" stroke="#222" stroke-width="2.5"/>
  <!-- Lemon texture spots -->
  <circle cx="65" cy="24" r="2" fill="#f5c842" stroke="none"/>
  <circle cx="76" cy="22" r="2" fill="#f5c842" stroke="none"/>
  <circle cx="68" cy="32" r="2" fill="#f5c842" stroke="none"/>
  <circle cx="78" cy="30" r="2" fill="#f5c842" stroke="none"/>
  <!-- Lemon tip -->
  <ellipse cx="90" cy="28" rx="5" ry="4" fill="#e6cc00" stroke="#222" stroke-width="1.5"/>
  <!-- Zest flying off grater -->
  <path d="M8 55 Q5 48 10 42" fill="none" stroke="#fff700" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 54 Q12 46 17 40" fill="none" stroke="#fff700" stroke-width="2" stroke-linecap="round"/>
  <path d="M20 54 Q20 45 25 38" fill="none" stroke="#fff700" stroke-width="2" stroke-linecap="round"/>
  <!-- Zest dots -->
  <circle cx="10" cy="41" r="2" fill="#fff700" stroke="#e6cc00" stroke-width="1"/>
  <circle cx="17" cy="39" r="2" fill="#fff700" stroke="#e6cc00" stroke-width="1"/>
  <circle cx="25" cy="37" r="2" fill="#fff700" stroke="#e6cc00" stroke-width="1"/>
</svg>
