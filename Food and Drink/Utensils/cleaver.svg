  <g transform="translate(-31.899 -28.729) scale(1.5459)">
<!-- Cleaver - heavy wide rectangular blade -->
  <!-- Blade (large rectangle) -->
  <rect x="24" y="22" width="58" height="44" rx="2" fill="#d5d8dc" stroke="#2c3e50" stroke-width="2.5"/>
  <!-- Blade surface detail -->
  <rect x="26" y="24" width="54" height="40" rx="1" fill="#ecf0f1"/>
  <!-- Edge line at bottom of blade -->
  <line x1="24" y1="66" x2="82" y2="66" stroke="#95a5a6" stroke-width="2"/>
  <!-- Hole in blade (classic cleaver) -->
  <circle cx="70" cy="38" r="6" fill="white" stroke="#2c3e50" stroke-width="2"/>
  <!-- Handle -->
  <rect x="28" y="64" width="28" height="16" rx="5" fill="#8d6e63" stroke="#2c3e50" stroke-width="2.5"/>
  <!-- Handle rivets -->
  <circle cx="36" cy="72" r="2.5" fill="#5d4037" stroke="#2c3e50" stroke-width="1.5"/>
  <circle cx="48" cy="72" r="2.5" fill="#5d4037" stroke="#2c3e50" stroke-width="1.5"/>
