<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Coconut half (cut view) -->
  <!-- Outer shell (brown) -->
  <path d="M15 55 Q15 82 50 85 Q85 82 85 55 Q85 30 50 28 Z" fill="#8a5820" stroke="#5a3010" stroke-width="2.5"/>
  <!-- White flesh -->
  <path d="M22 55 Q22 76 50 78 Q78 76 78 55 Q78 36 50 34 Z" fill="#f5f0e0" stroke="#d0c8b0" stroke-width="1.5"/>
  <!-- Hollow center with coconut water -->
  <ellipse cx="50" cy="58" rx="22" ry="15" fill="#d8f0f8" stroke="#90c0d0" stroke-width="1.5"/>
  <!-- Fibrous texture lines on shell -->
  <path d="M20 50 Q50 28 80 50" fill="none" stroke="#6a4010" stroke-width="1" opacity="0.5"/>
  <path d="M18 60 Q50 38 82 60" fill="none" stroke="#6a4010" stroke-width="1" opacity="0.5"/>
  <!-- Three eyes at top -->
  <circle cx="44" cy="32" r="3" fill="#3a1808" stroke="#1a0804" stroke-width="1.5"/>
  <circle cx="50" cy="30" r="3" fill="#3a1808" stroke="#1a0804" stroke-width="1.5"/>
  <circle cx="56" cy="32" r="3" fill="#3a1808" stroke="#1a0804" stroke-width="1.5"/>
</svg>
