<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Pot body -->
  <rect x="20" y="40" width="50" height="38" rx="4" fill="#c0c0c0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Pot bottom rounded -->
  <ellipse cx="45" cy="78" rx="25" ry="5" fill="#aaa" stroke="#333" stroke-width="2"/>
  <!-- Lid -->
  <rect x="18" y="34" width="54" height="8" rx="3" fill="#d8d8d8" stroke="#333" stroke-width="2"/>
  <ellipse cx="45" cy="34" rx="8" ry="3" fill="#999" stroke="#333" stroke-width="1.5"/>
  <!-- Long handle -->
  <rect x="70" y="45" width="18" height="5" rx="2.5" fill="#8B4513" stroke="#333" stroke-width="2"/>
  <circle cx="89" cy="47.5" r="2.5" fill="#8B4513" stroke="#333" stroke-width="1.5"/>
  <!-- Sheen -->
  <line x1="26" y1="46" x2="26" y2="70" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
