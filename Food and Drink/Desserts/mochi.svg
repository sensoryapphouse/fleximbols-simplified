<!-- Three mochi on a plate -->
  <!-- Plate -->
  <ellipse cx="50" cy="80" rx="38" ry="8" fill="#e8e0d0" stroke="#888" stroke-width="2"/>
  <!-- Left mochi - pink -->
  <circle cx="28" cy="68" r="16" fill="#f0b0c0" stroke="#c07080" stroke-width="2.5"/>
  <!-- Pinch mark on top -->
  <path d="M22 56 Q28 52 34 56" fill="none" stroke="#c07080" stroke-width="2" stroke-linecap="round"/>
  <!-- Middle mochi - white -->
  <circle cx="50" cy="66" r="16" fill="#f5f0ee" stroke="#c0b8b0" stroke-width="2.5"/>
  <path d="M44 54 Q50 50 56 54" fill="none" stroke="#c0b8b0" stroke-width="2" stroke-linecap="round"/>
  <!-- Right mochi - green matcha -->
  <circle cx="72" cy="68" r="16" fill="#90b870" stroke="#507030" stroke-width="2.5"/>
  <path d="M66 56 Q72 52 78 56" fill="none" stroke="#507030" stroke-width="2" stroke-linecap="round"/>
