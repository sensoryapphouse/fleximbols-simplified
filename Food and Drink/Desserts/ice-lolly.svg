  <!-- Popsicle - classic two-color popsicle -->
  <!-- Stick -->
  <rect x="44" y="63" width="12" height="30" rx="4" fill="#D4A860" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bottom half - different color -->
  <rect x="22" y="45" width="56" height="24" rx="8" fill="#FF8C00" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top half -->
  <rect x="22" y="14" width="56" height="36" rx="12" fill="#FF4444" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Dividing line between colors -->
  <line x1="22" y1="45" x2="78" y2="45" stroke="#333" stroke-width="1.5"/>
  <!-- Highlight -->
  <rect x="30" y="18" width="12" height="32" rx="6" fill="#FF8888" stroke="none" opacity="0.5"/>
  <!-- Bite mark -->
  <path d="M60,14 Q74,20 76,30 Q70,18 60,14Z" fill="#CC3333" stroke="none" opacity="0.4"/>
</svg>
