<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Freezer body (shorter, wide) -->
  <rect x="14" y="22" width="72" height="64" rx="4" fill="#dce8f4" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lid hinge line at top -->
  <rect x="14" y="22" width="72" height="10" rx="4" fill="#c8d8ec" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Handle on lid -->
  <rect x="34" y="26" width="32" height="5" rx="2.5" fill="#999" stroke="#555" stroke-width="1.5"/>
  <!-- Ice crystals inside -->
  <!-- Crystal 1 -->
  <line x1="32" y1="55" x2="32" y2="65" stroke="#7ab8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="57" x2="37" y2="63" stroke="#7ab8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="63" x2="37" y2="57" stroke="#7ab8d4" stroke-width="2" stroke-linecap="round"/>
  <!-- Crystal 2 -->
  <line x1="50" y1="48" x2="50" y2="60" stroke="#7ab8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="51" x2="56" y2="57" stroke="#7ab8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="57" x2="56" y2="51" stroke="#7ab8d4" stroke-width="2" stroke-linecap="round"/>
  <!-- Crystal 3 -->
  <line x1="68" y1="58" x2="68" y2="68" stroke="#7ab8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="60" x2="73" y2="66" stroke="#7ab8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="66" x2="73" y2="60" stroke="#7ab8d4" stroke-width="2" stroke-linecap="round"/>
</svg>
