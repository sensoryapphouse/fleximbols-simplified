  <g transform="translate(0.049 -0.879)">
<!-- Main cylinder (outer) -->
  <rect x="30" y="20" width="40" height="60" rx="5" fill="#e8e0d8" stroke="#8b7355" stroke-width="2.5"/>
  <!-- Coffee inside cylinder -->
  <rect x="33" y="50" width="34" height="28" rx="3" fill="#5a2a10" stroke="none"/>
  <!-- Plunger inside -->
  <rect x="32" y="22" width="36" height="28" rx="3" fill="#c8b8a8" stroke="#9a8878" stroke-width="1"/>
  <!-- Plunger rod -->
  <rect x="45" y="10" width="10" height="15" rx="3" fill="#9a8878" stroke="#7a6858" stroke-width="1.5"/>
  <!-- Arrow showing pressing down -->
  <path d="M50 5 L50 12" fill="none" stroke="#7a5c1e" stroke-width="2" stroke-linecap="round"/>
  <path d="M46 9 L50 13 L54 9" fill="none" stroke="#7a5c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cap/filter at bottom -->
  <rect x="28" y="78" width="44" height="6" rx="3" fill="#9a8878" stroke="#7a6858" stroke-width="2"/>
  <!-- Filter holes -->
  <circle cx="40" cy="81" r="1.5" fill="#7a6858"/>
  <circle cx="50" cy="81" r="1.5" fill="#7a6858"/>
  <circle cx="60" cy="81" r="1.5" fill="#7a6858"/>
  <!-- Coffee drip -->
  <line x1="50" y1="84" x2="50" y2="90" stroke="#5a2a10" stroke-width="2" stroke-linecap="round"/>
  <!-- Cap underneath cup -->
  <rect x="26" y="84" width="48" height="4" rx="2" fill="#c8b898" stroke="#8b7355" stroke-width="1.5"/>
</g>
