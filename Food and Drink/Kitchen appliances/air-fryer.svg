<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L7,4 L0,8 Z" fill="#e8734a"/>
  </marker>
  </defs>
<!-- Air fryer body (rounded tall unit) -->
  <rect x="22" y="20" width="56" height="60" rx="12" fill="#555" stroke="#333" stroke-width="2.5"/>
  <!-- Top dark area (lid/top) -->
  <rect x="22" y="20" width="56" height="20" rx="12" fill="#444" stroke="#333" stroke-width="2"/>
  <!-- Display/screen -->
  <rect x="30" y="24" width="40" height="12" rx="3" fill="#1a3a1a" stroke="#333" stroke-width="1"/>
  <text x="50" y="33" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="#00ff00">200°</text>
  <!-- Drawer/basket -->
  <rect x="25" y="56" width="50" height="20" rx="6" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- Drawer handle -->
  <rect x="37" y="62" width="26" height="6" rx="3" fill="#e8734a" stroke="#333" stroke-width="1.5"/>
  <!-- Hot air vents at top -->
  <ellipse cx="36" cy="18" rx="3" ry="2" fill="#e8734a" stroke="#333" stroke-width="1"/>
  <ellipse cx="50" cy="15" rx="3" ry="2" fill="#e8734a" stroke="#333" stroke-width="1"/>
  <ellipse cx="64" cy="18" rx="3" ry="2" fill="#e8734a" stroke="#333" stroke-width="1"/>
  <!-- Air circulation arrows -->
  <path d="M50,10 Q55,7 58,10" fill="none" stroke="#e8734a" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
</svg>