  <!-- Negroni: rocks glass, deep red/orange, ice, orange peel -->
  <!-- rocks glass (wide short tumbler) -->
  <path d="M15 24 L85 24 L82 88 L18 88 Z" fill="#c84818" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- glass highlight -->
  <line x1="19" y1="26" x2="21" y2="86" stroke="#f07040" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- large ice sphere/cube -->
  <circle cx="50" cy="60" r="20" fill="#e8f4fc" stroke="#88ccee" stroke-width="2"/>
  <!-- negroni colour over ice -->
  <path d="M20 58 L80 58 L82 88 L18 88 Z" fill="#c84818" opacity="0.5"/>
  <!-- deep red drink surface -->
  <path d="M20 36 L80 36 L80 58 L20 58 Z" fill="#d85828" opacity="0.7"/>
  <!-- orange peel garnish -->
  <path d="M55 12 Q75 8 78 22 Q73 30 62 22 Q55 16 55 12" fill="#f8a020" stroke="#c87010" stroke-width="2" stroke-linejoin="round"/>
  <!-- peel detail line -->
  <path d="M58 14 Q72 18 70 24" fill="none" stroke="#e08010" stroke-width="1.5" stroke-linecap="round"/>
</svg>