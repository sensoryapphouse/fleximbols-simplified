  <!-- glass highlights -->
  <line x1="32" y1="14" x2="30" y2="86" stroke="#eeffee" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- ice cubes -->
  <rect x="35" y="60" width="14" height="14" rx="2" fill="#ddf4ff" stroke="#aaddff" stroke-width="1.5"/>
  <rect x="51" y="62" width="12" height="12" rx="2" fill="#ddf4ff" stroke="#aaddff" stroke-width="1.5"/>
  <!-- lime wedges -->
  <path d="M36 38 Q44 30 52 38 Q44 46 36 38 Z" fill="#78c040" stroke="#4a8820" stroke-width="1.5"/>
  <path d="M48 35 Q56 27 62 35 Q56 43 48 35 Z" fill="#90d050" stroke="#4a8820" stroke-width="1.5"/>
