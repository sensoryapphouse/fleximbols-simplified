  <!-- Highball glass with pink grapefruit soda, salted rim, grapefruit -->
  <!-- Salted rim (dotted) -->
  <path d="M27 16 L73 16" stroke="#ddd" stroke-width="3" stroke-dasharray="3,2" stroke-linecap="round"/>
  <!-- Glass body -->
  <path d="M27 16 L24 85 Q24 90 32 90 L68 90 Q76 90 76 85 L73 16 Z" fill="#f5a8b0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Liquid - pink -->
  <path d="M28 22 L25 85 Q25 89 32 89 L68 89 Q75 89 75 85 L72 22 Z" fill="#f59898"/>
  <!-- Bubbles -->
  <circle cx="42" cy="45" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="58" cy="60" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="50" cy="35" r="1.5" fill="#fff" opacity="0.5"/>
  <!-- Ice -->
  <rect x="34" y="58" width="12" height="12" rx="2" fill="#d8eef5" stroke="#aaccdd" stroke-width="1.5" opacity="0.8"/>
  <!-- Glass outline -->
  <path d="M27 16 L24 85 Q24 90 32 90 L68 90 Q76 90 76 85 L73 16 Z" fill="none" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Grapefruit half on rim -->
  <circle cx="71" cy="18" r="10" fill="#f5a830" stroke="#c87820" stroke-width="1.5"/>
  <!-- Grapefruit segments -->
  <path d="M71 8 L71 28" stroke="#c87820" stroke-width="0.8"/>
  <path d="M61 18 L81 18" stroke="#c87820" stroke-width="0.8"/>
  <path d="M64 11 L78 25" stroke="#c87820" stroke-width="0.8"/>
  <path d="M78 11 L64 25" stroke="#c87820" stroke-width="0.8"/>
  <!-- Pink flesh -->
  <circle cx="71" cy="18" r="6" fill="#f5a0b0"/>
