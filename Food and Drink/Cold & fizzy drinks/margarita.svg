  <!-- Margarita: wide rim glass with salt rim and lime garnish -->
  <!-- glass body (wide-rim margarita shape) -->
  <path d="M10 22 L90 22 L65 60 L58 88 L42 88 L35 60 Z" fill="#d4f040" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- stem -->
  <line x1="50" y1="60" x2="50" y2="88" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- base -->
  <ellipse cx="50" cy="90" rx="18" ry="5" fill="#c0c0c0" stroke="#333" stroke-width="2"/>
  <!-- salt rim (dashes around wide edge) -->
  <path d="M10 22 L90 22" fill="none" stroke="#eee" stroke-width="4" stroke-dasharray="5,3"/>
  <!-- liquid fill -->
  <path d="M18 28 L82 28 L65 60 L35 60 Z" fill="#c8e830" opacity="0.7"/>
  <!-- lime wheel on rim -->
  <circle cx="80" cy="22" r="12" fill="#78c040" stroke="#4a8820" stroke-width="2"/>
  <circle cx="80" cy="22" r="7" fill="#90d050" stroke="#4a8820" stroke-width="1"/>
  <line x1="80" y1="10" x2="80" y2="34" stroke="#4a8820" stroke-width="1"/>
  <line x1="68" y1="22" x2="92" y2="22" stroke="#4a8820" stroke-width="1"/>
  <!-- notch cut (lime on glass rim) -->
  <path d="M74 22 L80 16" fill="none" stroke="#333" stroke-width="1.5"/>
</svg>