<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- butternut squash shape - pear/bell shape -->
  <!-- narrow neck top -->
  <rect x="41" y="18" width="18" height="26" rx="8" fill="#F9A825" stroke="#F57F17" stroke-width="2.5"/>
  <!-- bulbous bottom -->
  <ellipse cx="50" cy="62" rx="26" ry="22" fill="#FDD835" stroke="#F57F17" stroke-width="2.5"/>
  <!-- rib line on neck -->
  <line x1="50" y1="18" x2="50" y2="44" stroke="#F57F17" stroke-width="1.5"/>
  <!-- rib lines on bottom -->
  <line x1="50" y1="44" x2="50" y2="82" stroke="#F57F17" stroke-width="1.5"/>
  <path d="M36 48 C30 54 28 64 30 74" stroke="#F57F17" stroke-width="1.5" fill="none"/>
  <path d="M64 48 C70 54 72 64 70 74" stroke="#F57F17" stroke-width="1.5" fill="none"/>
  <!-- stem -->
  <rect x="47" y="10" width="6" height="10" rx="2" fill="#5D4037" stroke="#3E2723" stroke-width="1.5"/>
</svg>
