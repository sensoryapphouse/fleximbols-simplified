<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Garlic: white bulb with papery skin, green shoot, clove segments visible -->
  <!-- Root base -->
  <line x1="42" y1="88" x2="38" y2="95" stroke="#9a8870" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="47" y1="90" x2="46" y2="97" stroke="#9a8870" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="53" y1="90" x2="54" y2="97" stroke="#9a8870" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="88" x2="62" y2="95" stroke="#9a8870" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Main bulb -->
  <ellipse cx="50" cy="72" rx="26" ry="22" fill="#f0ece0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Papery skin lines (clove ridges) -->
  <path d="M36 58 Q26 72 36 85" fill="none" stroke="#d8d0b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 55 Q50 72 50 88" fill="none" stroke="#d8d0b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M64 58 Q74 72 64 85" fill="none" stroke="#d8d0b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M43 56 Q38 72 43 87" fill="none" stroke="#d8d0b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M57 56 Q62 72 57 87" fill="none" stroke="#d8d0b8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top neck of bulb -->
  <path d="M40 55 Q50 48 60 55" fill="#f0ece0" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Green shoot from top -->
  <path d="M50 52 Q48 38 46 22" fill="none" stroke="#4a8828" stroke-width="3" stroke-linecap="round"/>
  <path d="M46 22 Q38 14 36 8" fill="none" stroke="#4a8828" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 26 Q54 18 58 12" fill="none" stroke="#4a8828" stroke-width="2.5" stroke-linecap="round"/>
</svg>
