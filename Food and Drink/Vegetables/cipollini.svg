  <!-- Cipollini: flat disc-shaped onion, golden-straw color -->
  <!-- Roots -->
  <line x1="42" y1="85" x2="38" y2="92" stroke="#7a6050" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="86" x2="47" y2="93" stroke="#7a6050" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="86" x2="55" y2="93" stroke="#7a6050" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="85" x2="64" y2="92" stroke="#7a6050" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Very flat disc-shape, distinctive feature of cipollini -->
  <ellipse cx="50" cy="70" rx="36" ry="18" fill="#d4b048" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Flat disc top view with concentric rings suggesting layers -->
  <ellipse cx="50" cy="67" rx="28" ry="12" fill="#e0c050" stroke="#b89030" stroke-width="1.5"/>
  <ellipse cx="50" cy="65" rx="18" ry="8" fill="#e8cc60" stroke="#b89030" stroke-width="1.2"/>
  <!-- Layer lines on side -->
  <path d="M18 66 Q15 70 18 76" fill="none" stroke="#b89030" stroke-width="2" stroke-linecap="round"/>
  <path d="M26 56 Q18 70 26 83" fill="none" stroke="#b89030" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M74 56 Q82 70 74 83" fill="none" stroke="#b89030" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M82 66 Q85 70 82 76" fill="none" stroke="#b89030" stroke-width="2" stroke-linecap="round"/>
  <!-- Very short neck (almost no neck) -->
  <path d="M43 54 Q50 49 57 54" fill="#b89030" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Very short green tops -->
  <path d="M47 52 Q46 42 44 30" fill="none" stroke="#3a7820" stroke-width="3" stroke-linecap="round"/>
  <path d="M53 52 Q54 42 56 30" fill="none" stroke="#3a7820" stroke-width="3" stroke-linecap="round"/>
</svg>
