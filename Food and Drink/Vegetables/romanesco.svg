  <polygon points="66,35 60,58 70,58" fill="#5a9c28" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="42,28 38,52 48,52" fill="#6aac30" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="58,28 52,52 62,52" fill="#6aac30" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
