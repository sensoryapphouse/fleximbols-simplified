  <!-- Taro - hairy brown corm with ring markings, one leaf above -->
  <!-- Corm body -->
  <ellipse cx="50" cy="68" rx="30" ry="24" fill="#7a5a2a" stroke="#3a2a0a" stroke-width="2.5"/>
  <!-- Ring markings (growth rings) -->
  <path d="M24 60 Q50 54 76 60" fill="none" stroke="#3a2a0a" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 70 Q50 64 78 70" fill="none" stroke="#3a2a0a" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 80 Q50 75 76 80" fill="none" stroke="#3a2a0a" stroke-width="2" stroke-linecap="round"/>
  <!-- Hairy roots at bottom -->
  <line x1="38" y1="90" x2="34" y2="98" stroke="#3a2a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="92" x2="42" y2="99" stroke="#3a2a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="92" x2="50" y2="99" stroke="#3a2a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="92" x2="58" y2="99" stroke="#3a2a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="90" x2="66" y2="98" stroke="#3a2a0a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Characteristic heart-shaped leaf above -->
  <path d="M50 45 C42 35 28 32 30 20 C32 10 44 8 50 18 C56 8 68 10 70 20 C72 32 58 35 50 45 Z"
        fill="#3a7a2a" stroke="#1a4a0a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Leaf stem -->
  <line x1="50" y1="45" x2="50" y2="58" stroke="#5a8a2a" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaf vein -->
  <line x1="50" y1="20" x2="50" y2="43" stroke="#1a4a0a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
