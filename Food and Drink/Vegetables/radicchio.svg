  <!-- Radicchio - red/burgundy round head with white veins -->
  <!-- Outer leaves -->
  <circle cx="50" cy="56" r="40" fill="#8a1a2a" stroke="#5a0a1a" stroke-width="2.5"/>
  <!-- Leaf layers -->
  <path d="M14 46 Q10 36 20 28 Q26 24 32 30" fill="none" stroke="#5a0a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M86 46 Q90 36 80 28 Q74 24 68 30" fill="none" stroke="#5a0a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Inner head -->
  <circle cx="50" cy="56" r="28" fill="#aa2a3a" stroke="#5a0a1a" stroke-width="2"/>
  <circle cx="50" cy="56" r="16" fill="#c03a4a" stroke="#5a0a1a" stroke-width="1.5"/>
  <!-- White veins - characteristic of radicchio -->
  <line x1="50" y1="20" x2="50" y2="88" stroke="#f0e0e0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="44" x2="82" y2="68" stroke="#f0e0e0" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="68" x2="82" y2="44" stroke="#f0e0e0" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="30" x2="72" y2="82" stroke="#f0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="30" x2="28" y2="82" stroke="#f0e0e0" stroke-width="1.5" stroke-linecap="round"/>
</svg>
