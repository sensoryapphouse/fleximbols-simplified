  <line x1="53" y1="91" x2="55" y2="98" stroke="#9a9070" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="59" y1="91" x2="57" y2="98" stroke="#9a9070" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="90" x2="68" y2="97" stroke="#9a9070" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Light green lower portion of stalks -->
  <line x1="38" y1="75" x2="35" y2="60" stroke="#c0d870" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="75" x2="50" y2="58" stroke="#c0d870" stroke-width="3.5" stroke-linecap="round"/>
