  <!-- Scallion: thin long stalks, small white bulb base -->
  <!-- Three stalks -->
  <!-- Left stalk -->
  <line x1="38" y1="85" x2="32" y2="10" stroke="#3a7820" stroke-width="4" stroke-linecap="round"/>
  <!-- Center stalk -->
  <line x1="50" y1="85" x2="50" y2="8" stroke="#3a7820" stroke-width="4" stroke-linecap="round"/>
  <!-- Right stalk -->
  <line x1="62" y1="85" x2="68" y2="10" stroke="#3a7820" stroke-width="4" stroke-linecap="round"/>
  <!-- White bulge at base of each stalk -->
  <ellipse cx="38" cy="82" rx="6" ry="8" fill="#f0f0e8" stroke="#333" stroke-width="2"/>
  <ellipse cx="50" cy="82" rx="6" ry="8" fill="#f0f0e8" stroke="#333" stroke-width="2"/>
  <ellipse cx="62" cy="82" rx="6" ry="8" fill="#f0f0e8" stroke="#333" stroke-width="2"/>
  <!-- Roots -->
  <line x1="35" y1="90" x2="32" y2="97" stroke="#9a9070" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="91" x2="38" y2="98" stroke="#9a9070" stroke-width="1.5" stroke-linecap="round"/>
