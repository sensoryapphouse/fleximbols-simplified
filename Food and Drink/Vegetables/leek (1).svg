<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Leek: long green stalk with white base -->
  <!-- White/pale base bulb -->
  <rect x="38" y="65" width="24" height="28" rx="8" fill="#f0f0e8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Layers on white base -->
  <path d="M42 66 Q40 79 42 92" fill="none" stroke="#d0d0c0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M50 65 Q48 79 50 93" fill="none" stroke="#d0d0c0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Green stalk transition -->
  <rect x="38" y="40" width="24" height="28" fill="#c0d880" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Upper dark green stalk with fan of leaves -->
  <rect x="38" y="12" width="24" height="30" rx="4" fill="#3a7820" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Fan leaves at top -->
  <path d="M38 30 Q20 22 14 8" fill="none" stroke="#3a7820" stroke-width="5" stroke-linecap="round"/>
  <path d="M62 30 Q80 22 86 8" fill="none" stroke="#3a7820" stroke-width="5" stroke-linecap="round"/>
  <path d="M50 20 Q50 12 50 6" fill="none" stroke="#3a7820" stroke-width="5" stroke-linecap="round"/>
  <!-- Roots at base -->
  <line x1="42" y1="92" x2="38" y2="98" stroke="#9a9070" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="47" y1="93" x2="46" y2="99" stroke="#9a9070" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="53" y1="93" x2="54" y2="99" stroke="#9a9070" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="92" x2="62" y2="98" stroke="#9a9070" stroke-width="1.5" stroke-linecap="round"/>
</svg>
