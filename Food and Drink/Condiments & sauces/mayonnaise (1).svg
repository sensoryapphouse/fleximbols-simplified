<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(-24.693 -21.700) scale(1.4953)">
<!-- mayo jar -->
  <!-- lid -->
  <rect x="32" y="18" width="36" height="10" rx="3" fill="#999" stroke="#666" stroke-width="2.5"/>
  <!-- jar body -->
  <rect x="28" y="28" width="44" height="50" rx="5" fill="#f5f5f0" stroke="#888" stroke-width="2.5"/>
  <!-- label -->
  <rect x="32" y="36" width="36" height="28" rx="3" fill="#e8e4d4" stroke="#aaa" stroke-width="1.5"/>
  
  
  <!-- decorative line on label -->
  <line x1="34" y1="58" x2="66" y2="58" stroke="#bbb" stroke-width="1"/>
  <!-- jar shine -->
  <line x1="70" y1="32" x2="70" y2="72" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</g>
  </svg>
