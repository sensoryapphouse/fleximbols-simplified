  <rect x="62" y="26" width="22" height="20" rx="1.5" fill="#fff4cf" stroke="#333" stroke-width="1.5"/>
  <!-- A single flake motif on the box -->
  <path d="M68 36 Q70 31 74 33 Q79 31 79 37 Q81 41 76 42 Q72 45 69 41 Z" fill="#e0a020" stroke="#9a6a10" stroke-width="1.2" stroke-linejoin="round"/>
