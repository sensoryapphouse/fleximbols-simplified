  <!-- Flakes floating in the bowl -->
  <path d="M22 57 Q25 53 29 55 Q33 53 33 58 Q31 62 26 61 Q22 61 22 57 Z" fill="#e8a830" stroke="#9a6a10" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M38 56 Q41 51 46 54 Q50 53 49 58 Q48 62 43 61 Q38 61 38 56 Z" fill="#f0b840" stroke="#9a6a10" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M52 58 Q55 54 59 56 Q62 55 61 60 Q59 63 55 62 Q51 61 52 58 Z" fill="#e8a830" stroke="#9a6a10" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M30 62 Q33 59 37 61 Q40 61 39 64 Q37 66 33 65 Q30 64 30 62 Z" fill="#f0b840" stroke="#9a6a10" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Spoon -->
