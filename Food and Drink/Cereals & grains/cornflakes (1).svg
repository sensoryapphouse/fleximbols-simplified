  <line x1="66" y1="55" x2="80" y2="55" stroke="#caa030" stroke-width="1"/>
  <!-- Bowl of cornflakes -->
  <ellipse cx="40" cy="60" rx="32" ry="9" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <path d="M8 60 Q12 84 40 84 Q68 84 72 60 Z" fill="#dfeaf5" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
