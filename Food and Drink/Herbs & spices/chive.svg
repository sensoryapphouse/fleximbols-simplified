  <circle cx="50" cy="18" r="11" fill="#8858a8" stroke="#333" stroke-width="2.5"/>
  <!-- Petal texture -->
  <circle cx="46" cy="14" r="4" fill="#9868b8" stroke="#333" stroke-width="1.5"/>
