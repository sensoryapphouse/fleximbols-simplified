<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- jam jar - round shape -->
  <!-- lid with cloth cover -->
  <circle cx="50" cy="28" r="20" fill="#e8d8b0" stroke="#8b7a50" stroke-width="2"/>
  <circle cx="50" cy="28" r="16" fill="#f0e8c8" stroke="#8b7a50" stroke-width="1.5"/>
  <circle cx="50" cy="28" r="12" fill="#cc4444" stroke="#8b1010" stroke-width="1.5"/>
  <!-- ribbon on lid -->
  <path d="M34,24 C34,28 38,32 42,30" fill="none" stroke="#8b7a50" stroke-width="2" stroke-linecap="round"/>
  <path d="M66,24 C66,28 62,32 58,30" fill="none" stroke="#8b7a50" stroke-width="2" stroke-linecap="round"/>
  <!-- jar body -->
  <rect x="28" y="38" width="44" height="40" rx="6" fill="#cc4444" stroke="#8b1010" stroke-width="2.5"/>
  <!-- label -->
  <rect x="32" y="48" width="36" height="18" rx="2" fill="#f5e8d0" stroke="#8b6a30" stroke-width="1.5"/>
  
  
</svg>
