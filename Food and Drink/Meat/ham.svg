<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- ham slice - pink oval with fat border and rind -->
  <!-- rind outer edge -->
  <ellipse cx="50" cy="50" rx="34" ry="30" fill="#FFCDD2" stroke="#C62828" stroke-width="2.5"/>
  <!-- pink ham meat -->
  <ellipse cx="50" cy="50" rx="28" ry="24" fill="#F48FB1" stroke="#AD1457" stroke-width="2"/>
  <!-- inner lighter area -->
  <ellipse cx="50" cy="50" rx="18" ry="15" fill="#F8BBD9" stroke="none"/>
  <!-- marbling lines -->
  <path d="M34 46 C40 42 46 48 52 44 C58 40 64 46 68 42" stroke="#F06292" stroke-width="1.5" fill="none"/>
  <path d="M32 56 C38 52 44 58 50 54 C56 50 62 56 66 52" stroke="#F06292" stroke-width="1.5" fill="none"/>
  <!-- rind detail top right -->
  <path d="M68 28 C76 30 82 40 80 52" stroke="#C62828" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
