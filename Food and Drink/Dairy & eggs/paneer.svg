  <!-- Bowl of paneer cheese cubes (white cubes), no text -->
  <!-- Bowl -->
  <path d="M14 56 Q14 84 50 84 Q86 84 86 56 Z" fill="#d8d2c4" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bowl inner rim -->
  <ellipse cx="50" cy="56" rx="36" ry="9" fill="#c4bdac" stroke="#333" stroke-width="2.5"/>
  <!-- Paneer cubes heaped in bowl -->
  <!-- back row -->
  <rect x="28" y="40" width="16" height="16" rx="2" fill="#f8f5e8" stroke="#bdb79f" stroke-width="2"/>
  <rect x="46" y="38" width="16" height="16" rx="2" fill="#f8f5e8" stroke="#bdb79f" stroke-width="2"/>
  <rect x="62" y="42" width="15" height="15" rx="2" fill="#f3efe0" stroke="#bdb79f" stroke-width="2"/>
  <!-- front row -->
  <rect x="22" y="50" width="16" height="14" rx="2" fill="#fbf9ef" stroke="#bdb79f" stroke-width="2"/>
  <rect x="40" y="51" width="16" height="14" rx="2" fill="#f8f5e8" stroke="#bdb79f" stroke-width="2"/>
  <rect x="56" y="50" width="16" height="14" rx="2" fill="#fbf9ef" stroke="#bdb79f" stroke-width="2"/>
  <!-- light pan-fried edge tint -->
  <path d="M30 42 L42 42" stroke="#e3d49a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M48 40 L60 40" stroke="#e3d49a" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
