<!-- Dry crumbly cheese block -->
  <rect x="16" y="40" width="52" height="32" rx="3" fill="#f5f0e0" stroke="#333" stroke-width="2.5"/>
  <!-- Top of block -->
  <path d="M16 40 L28 30 L80 30 L68 40 Z" fill="#f8f4ea" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right side -->
  <path d="M68 40 L80 30 L80 62 L68 72 Z" fill="#e8e4d4" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Grater beside cheese -->
  <rect x="75" y="35" width="12" height="40" rx="2" fill="#d0d0d0" stroke="#333" stroke-width="2"/>
  <!-- Grater holes -->
  <circle cx="81" cy="42" r="1.5" fill="#aaa"/>
  <circle cx="81" cy="49" r="1.5" fill="#aaa"/>
  <circle cx="81" cy="56" r="1.5" fill="#aaa"/>
  <circle cx="81" cy="63" r="1.5" fill="#aaa"/>
  <!-- Grated cheese falling off -->
  <circle cx="73" cy="44" r="1.5" fill="#f5f0e0"/>
  <circle cx="71" cy="50" r="1" fill="#f5f0e0"/>
  <circle cx="73" cy="56" r="1.5" fill="#f5f0e0"/>
