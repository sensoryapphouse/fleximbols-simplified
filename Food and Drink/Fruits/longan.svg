  <!-- Branch with two longan fruits -->
  <line x1="50" y1="10" x2="50" y2="35" stroke="#5a3a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="25" x2="32" y2="40" stroke="#5a3a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="25" x2="68" y2="40" stroke="#5a3a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fruit 1 (left) -->
  <circle cx="32" cy="54" r="16" fill="#c4a35a" stroke="#5a3a1a" stroke-width="2.5"/>
  <ellipse cx="28" cy="50" rx="5" ry="3" fill="#d4b36a" stroke="none"/>
  <!-- Fruit 2 (right) -->
  <circle cx="68" cy="54" r="16" fill="#c4a35a" stroke="#5a3a1a" stroke-width="2.5"/>
  <ellipse cx="64" cy="50" rx="5" ry="3" fill="#d4b36a" stroke="none"/>
  <!-- Leaves -->
