  <!-- Durian - large oval with prominent sharp spikes all over -->
  <!-- Base oval body -->
  <ellipse cx="50" cy="58" rx="32" ry="28" fill="#c8b040" stroke="#333" stroke-width="2"/>
  <!-- Spike pattern covering the body - triangular spikes -->
  <!-- Top spikes -->
  <polygon points="50,10 46,28 54,28" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="65,15 61,32 69,31" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="35,15 31,32 39,31" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Upper side spikes -->
  <polygon points="78,30 68,40 73,46" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="22,30 32,40 27,46" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Mid spikes -->
  <polygon points="88,52 73,55 78,63" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="12,52 27,55 22,63" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lower side spikes -->
  <polygon points="82,70 68,68 72,76" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="18,70 32,68 28,76" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Bottom spikes -->
  <polygon points="50,95 46,78 54,78" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="64,90 61,75 68,73" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="36,90 39,75 32,73" fill="#b09030" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Stem -->
  <rect x="46" y="6" width="8" height="8" rx="2" fill="#8a6020" stroke="#333" stroke-width="2"/>
</svg>