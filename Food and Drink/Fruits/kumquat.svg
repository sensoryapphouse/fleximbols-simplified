  <g transform="translate(-18.438 -25.402) scale(1.3714)">
<!-- three kumquats - small oval orange fruits -->
  <!-- main large one -->
  <ellipse cx="50" cy="55" rx="14" ry="20" fill="#e88020" stroke="#333" stroke-width="2.5"/>
  <circle cx="50" cy="35" r="5" fill="#5a9030" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="35" x2="50" y2="30" stroke="#5a9030" stroke-width="2" stroke-linecap="round"/>
  <!-- segment lines on main -->
  <line x1="50" y1="36" x2="50" y2="74" stroke="#c06010" stroke-width="1" stroke-dasharray="2,3"/>
  <!-- second kumquat left -->
  <ellipse cx="28" cy="60" rx="11" ry="16" fill="#e87818" stroke="#333" stroke-width="2"/>
  <line x1="28" y1="44" x2="26" y2="38" stroke="#5a9030" stroke-width="1.5" stroke-linecap="round"/>
  <!-- third kumquat right -->
  <ellipse cx="72" cy="58" rx="11" ry="16" fill="#f09030" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="42" x2="74" y2="36" stroke="#5a9030" stroke-width="1.5" stroke-linecap="round"/>
  <!-- highlights -->
  <ellipse cx="44" cy="46" rx="4" ry="5" fill="white" opacity="0.3"/>
</g>
