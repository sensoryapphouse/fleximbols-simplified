<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Kiwi cross-section -->
  <!-- Brown outer skin -->
  <circle cx="50" cy="50" r="36" fill="#8a6030" stroke="#5a3810" stroke-width="2.5"/>
  <!-- White border -->
  <circle cx="50" cy="50" r="30" fill="#f0f8f0" stroke="#c8d8c0" stroke-width="2"/>
  <!-- Green flesh -->
  <circle cx="50" cy="50" r="28" fill="#70c040" stroke="#50a020" stroke-width="1.5"/>
  <!-- White center -->
  <circle cx="50" cy="50" r="8" fill="#f8fff8" stroke="#c8d8c0" stroke-width="1"/>
  <!-- Seeds radiating out (black) -->
  <ellipse cx="50" cy="24" rx="3" ry="4" fill="#1a1a10" transform="rotate(0 50 24)"/>
  <ellipse cx="67" cy="29" rx="3" ry="4" fill="#1a1a10" transform="rotate(60 67 29)"/>
  <ellipse cx="74" cy="46" rx="3" ry="4" fill="#1a1a10" transform="rotate(90 74 46)"/>
  <ellipse cx="67" cy="63" rx="3" ry="4" fill="#1a1a10" transform="rotate(120 67 63)"/>
  <ellipse cx="50" cy="72" rx="3" ry="4" fill="#1a1a10" transform="rotate(0 50 72)"/>
  <ellipse cx="33" cy="63" rx="3" ry="4" fill="#1a1a10" transform="rotate(60 33 63)"/>
  <ellipse cx="26" cy="46" rx="3" ry="4" fill="#1a1a10" transform="rotate(90 26 46)"/>
  <ellipse cx="33" cy="29" rx="3" ry="4" fill="#1a1a10" transform="rotate(120 33 29)"/>
  <!-- Lines from center -->
  <line x1="50" y1="42" x2="50" y2="26" stroke="#50a020" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="42" x2="64" y2="32" stroke="#50a020" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="50" x2="70" y2="48" stroke="#50a020" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="58" x2="64" y2="64" stroke="#50a020" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="58" x2="50" y2="70" stroke="#50a020" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="58" x2="36" y2="64" stroke="#50a020" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="50" x2="30" y2="48" stroke="#50a020" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="42" x2="36" y2="32" stroke="#50a020" stroke-width="1" opacity="0.5"/>
</svg>
