  <!-- Autobiography: person writing own story, I/self symbol -->
  <rect x="16" y="10" width="10" height="80" rx="2" fill="#1a237e" stroke="#333" stroke-width="2.5"/>
  <rect x="16" y="8" width="68" height="84" rx="3" fill="#283593" stroke="#333" stroke-width="2.5"/>
  <rect x="23" y="13" width="58" height="74" rx="2" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/>
  <!-- Person icon (self) -->
  <circle cx="44" cy="34" r="9" fill="#5c6bc0" stroke="#3949ab" stroke-width="2"/>
  <path d="M32 56 Q38 46 44 46 Q50 46 56 56 L58 70 L30 70 Z" fill="#5c6bc0" stroke="#3949ab" stroke-width="2"/>
  <!-- Writing hand extending -->
  <path d="M56 60 Q62 54 70 50" fill="none" stroke="#3949ab" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pen/quill -->
  <rect x="67" y="40" width="5" height="16" rx="1" fill="#ffd600" stroke="#f9a825" stroke-width="1.5" transform="rotate(30 69 48)"/>
  <polygon points="67,54 72,54 69,60" fill="#e53935" transform="rotate(30 69 48)"/>
  <!-- Self-referential "I" -->
  <text x="66" y="76" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="16" fill="#3949ab" font-weight="bold" font-style="italic">I</text>
  <!-- Lines of self-written text -->
  <line x1="26" y1="75" x2="56" y2="75" stroke="#9fa8da" stroke-width="1"/>
  <line x1="26" y1="80" x2="52" y2="80" stroke="#9fa8da" stroke-width="1"/>
</svg>
