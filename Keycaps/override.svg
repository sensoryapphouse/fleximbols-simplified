  <!-- Background document (vetoed, crossed out) -->
  <rect x="8" y="40" width="55" height="55" rx="3" fill="#f5e0e0" stroke="#aaa" stroke-width="2" opacity="0.8"/>
  <!-- Red X on background doc -->
  <line x1="12" y1="44" x2="59" y2="91" stroke="#c0392b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="59" y1="44" x2="12" y2="91" stroke="#c0392b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Foreground override document -->
  <rect x="37" y="8" width="58" height="72" rx="3" fill="#fffde7" stroke="#222" stroke-width="2.5"/>
  <!-- Text lines on override doc -->
  <line x1="44" y1="20" x2="88" y2="20" stroke="#bdc3c7" stroke-width="1.5"/>
  <line x1="44" y1="28" x2="88" y2="28" stroke="#bdc3c7" stroke-width="1.5"/>
  <line x1="44" y1="36" x2="82" y2="36" stroke="#bdc3c7" stroke-width="1.5"/>
  <!-- Green "OVERRIDE" stamp -->
  <rect x="40" y="48" width="52" height="18" rx="3" fill="#27ae60" stroke="#222" stroke-width="2" transform="rotate(-8,66,57)"/>
  
