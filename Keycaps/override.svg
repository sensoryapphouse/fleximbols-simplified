  <circle cx="66" cy="82" r="12" fill="#27ae60" stroke="#222" stroke-width="2.5"/>
  <polyline points="57,82 63,88 76,75" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
