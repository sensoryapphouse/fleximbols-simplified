<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Bladder body - balloon oval -->
  <ellipse cx="50" cy="42" rx="28" ry="32" fill="#c8e6fa" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bladder texture folds -->
  <path d="M35 35 Q50 30 65 35" fill="none" stroke="#7ab8d8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M30 45 Q50 40 70 45" fill="none" stroke="#7ab8d8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ureteral inlets (top of bladder) -->
  <circle cx="40" cy="17" r="3" fill="#a0c8e0" stroke="#333" stroke-width="1.8"/>
  <circle cx="60" cy="17" r="3" fill="#a0c8e0" stroke="#333" stroke-width="1.8"/>
  <!-- Drainage tube at bottom -->
  <rect x="45" y="73" width="10" height="12" rx="3" fill="#a0c8e0" stroke="#333" stroke-width="2"/>
</svg>