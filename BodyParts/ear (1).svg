<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Large single ear, centered -->
  <!-- Outer ear (pinna) -->
  <path d="M30 20 Q16 20 12 42 Q10 58 20 70 Q28 80 38 78 Q46 76 48 70 Q50 62 44 58 Q38 54 40 46 Q42 38 48 36 Q56 34 54 22 Q52 10 38 12 Q30 14 30 20 Z" fill="#f5c89a" stroke="#222" stroke-width="2.5"/>
  <!-- Inner ear folds -->
  <!-- Antihelix -->
  <path d="M36 24 Q26 28 24 42 Q22 54 30 62 Q36 68 40 66" fill="none" stroke="#d4a070" stroke-width="2" stroke-linecap="round"/>
  <!-- Tragus -->
  <path d="M44 60 Q48 56 46 52" fill="none" stroke="#d4a070" stroke-width="2" stroke-linecap="round"/>
  <!-- Ear canal (dark circle) -->
  <ellipse cx="42" cy="50" rx="5" ry="6" fill="#5c3010" stroke="#333" stroke-width="1.5"/>
  <!-- Concha (bowl area) -->
  <path d="M38 38 Q32 42 32 52 Q32 60 38 64" fill="none" stroke="#c09070" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ear lobe -->
  <ellipse cx="36" cy="74" rx="8" ry="6" fill="#f5c89a" stroke="#222" stroke-width="2"/>
  <!-- Arrow pointing to ear -->
  <line x1="72" y1="46" x2="58" y2="46" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="62,42 58,46 62,50" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Highlight -->
  <path d="M18 30 Q14 42 16 58 Q20 70 30 76" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
