  <path d="M64 30 Q68 20 74 14" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <path d="M75 36 Q80 28 86 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower lashes (shorter) -->
  <path d="M25 64 Q22 72 20 76" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40 70 Q38 78 38 82" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
