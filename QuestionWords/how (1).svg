<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>how</title>

  <!-- Big graphical question mark (matches why's hook) -->
  <path d="M180 220 Q180 150 256 150 Q332 150 332 220 Q332 270 280 290 Q256 300 256 340 L256 360" fill="none" stroke="#1a1a1a" stroke-width="3.929" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="410" r="26" fill="#e74c3c" stroke="#1a1a1a" stroke-width="3.929" />

  <!-- Gear (mechanism / method) -->
  <g transform="translate(20 320) scale(1.4)">
    <circle cx="60" cy="60" r="35" fill="#7f8c8d" stroke="#1a1a1a" stroke-width="3.929" />
    <circle cx="60" cy="60" r="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.929" />
    <rect x="55" y="10" width="10" height="14" fill="#7f8c8d" stroke="#1a1a1a" stroke-width="3.929" />
    <rect x="55" y="96" width="10" height="14" fill="#7f8c8d" stroke="#1a1a1a" stroke-width="3.929" />
    <rect x="10" y="55" width="14" height="10" fill="#7f8c8d" stroke="#1a1a1a" stroke-width="3.929" />
    <rect x="96" y="55" width="14" height="10" fill="#7f8c8d" stroke="#1a1a1a" stroke-width="3.929" />
    <rect x="22" y="22" width="14" height="10" fill="#7f8c8d" stroke="#1a1a1a" stroke-width="3.929" transform="rotate(45 29 27)" />
    <rect x="84" y="22" width="14" height="10" fill="#7f8c8d" stroke="#1a1a1a" stroke-width="3.929" transform="rotate(-45 91 27)" />
    <rect x="22" y="88" width="14" height="10" fill="#7f8c8d" stroke="#1a1a1a" stroke-width="3.929" transform="rotate(-45 29 93)" />
    <rect x="84" y="88" width="14" height="10" fill="#7f8c8d" stroke="#1a1a1a" stroke-width="3.929" transform="rotate(45 91 93)" />
  </g>

  <!-- Small coloured ? decoration -->
  <text x="380" y="320" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="50" font-weight="900" fill="#f1c40f" stroke="#1a1a1a" stroke-width="3.929">?</text>

  <!-- Decorative dots -->
  <circle cx="80" cy="100" r="6" fill="#f39c12" />
  <circle cx="440" cy="100" r="6" fill="#f39c12" />
  <circle cx="80" cy="200" r="6" fill="#f39c12" />
