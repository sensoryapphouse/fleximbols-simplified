<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- legs -->
  <rect x="28" y="72" width="8" height="14" rx="3" fill="#888" stroke="#555" stroke-width="2"/>
  <rect x="40" y="72" width="8" height="14" rx="3" fill="#888" stroke="#555" stroke-width="2"/>
  <rect x="52" y="72" width="8" height="14" rx="3" fill="#888" stroke="#555" stroke-width="2"/>
  <rect x="64" y="72" width="8" height="14" rx="3" fill="#888" stroke="#555" stroke-width="2"/>
  <!-- fluffy body - overlapping circles -->
  <circle cx="36" cy="62" r="16" fill="#f5f5f0" stroke="#888" stroke-width="2"/>
  <circle cx="50" cy="58" r="18" fill="#f5f5f0" stroke="#888" stroke-width="2"/>
  <circle cx="64" cy="62" r="16" fill="#f5f5f0" stroke="#888" stroke-width="2"/>
  <circle cx="44" cy="68" r="12" fill="#f5f5f0" stroke="#888" stroke-width="2"/>
  <circle cx="58" cy="68" r="12" fill="#f5f5f0" stroke="#888" stroke-width="2"/>
  <!-- head - dark -->
  <ellipse cx="76" cy="52" rx="14" ry="12" fill="#555" stroke="#333" stroke-width="2.5"/>
  <!-- ear -->
  <ellipse cx="82" cy="44" rx="5" ry="8" fill="#555" stroke="#333" stroke-width="2" transform="rotate(20,82,44)"/>
  <!-- eye -->
  <circle cx="80" cy="50" r="3" fill="white"/>
  <circle cx="81" cy="50" r="1.5" fill="#1a1a1a"/>
  <!-- nose -->
  <ellipse cx="86" cy="56" rx="4" ry="3" fill="#7a5050" stroke="#555" stroke-width="1.5"/>
  <!-- tail small -->
  <ellipse cx="24" cy="60" rx="6" ry="8" fill="#f5f5f0" stroke="#888" stroke-width="2"/>
</svg>
