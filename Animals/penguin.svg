<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- ice/snow base -->
  <ellipse cx="50" cy="90" rx="30" ry="6" fill="#d8eeff" stroke="#88aacc" stroke-width="1.5"/>
  <!-- body - upright, tuxedo -->
  <ellipse cx="50" cy="62" rx="18" ry="24" fill="#1a1a2a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- white belly -->
  <ellipse cx="50" cy="66" rx="12" ry="18" fill="#f5f5f5" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- flipper arms -->
  <path d="M32 54 Q22 62 24 74 Q30 76 34 68 Q34 60 38 56 Z" fill="#1a1a2a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M68 54 Q78 62 76 74 Q70 76 66 68 Q66 60 62 56 Z" fill="#1a1a2a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- feet - orange -->
  <path d="M40 84 Q36 88 32 90 Q36 92 38 90 Q40 90 42 88 Q44 90 46 90 Q48 92 44 84 Z" fill="#e08020" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M60 84 Q64 88 68 90 Q64 92 62 90 Q60 90 58 88 Q56 90 54 90 Q52 92 56 84 Z" fill="#e08020" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="50" cy="36" r="18" fill="#1a1a2a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- white face patches -->
  <ellipse cx="50" cy="40" rx="11" ry="10" fill="#f5f5f5" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- orange beak -->
  <path d="M42 42 Q50 38 58 42 Q56 48 50 50 Q44 48 42 42 Z" fill="#e08020" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="40" cy="34" r="4" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <circle cx="40" cy="34" r="3" fill="#333"/>
  <circle cx="39" cy="33" r="1" fill="white"/>
  <circle cx="60" cy="34" r="4" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <circle cx="60" cy="34" r="3" fill="#333"/>
  <circle cx="59" cy="33" r="1" fill="white"/>
  <!-- white eye rings -->
  <circle cx="40" cy="34" r="4" fill="none" stroke="#f5f5f5" stroke-width="1"/>
  <circle cx="60" cy="34" r="4" fill="none" stroke="#f5f5f5" stroke-width="1"/>
</svg>
