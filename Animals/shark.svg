  <path d="M36 60 Q30 50 22 46 Q32 54 36 60" fill="#607888" stroke="#2a4050" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Tail fin - crescent -->
  <path d="M88 58 Q96 46 94 54 M88 58 Q96 70 94 62 M88 58 L82 58" fill="#5a7888" stroke="#2a4050" stroke-width="2" stroke-linejoin="round"/>
