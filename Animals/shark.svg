<!-- Body - torpedo shape -->
  <ellipse cx="50" cy="58" rx="40" ry="16" fill="#7090a0" stroke="#2a4050" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- White belly -->
  <ellipse cx="50" cy="64" rx="30" ry="8" fill="#e8eef0" stroke="none"/>
  <!-- Pointed head/snout -->
  <path d="M10 58 Q5 54 8 50" stroke="#2a4050" stroke-width="2" fill="none"/>
  <!-- Jaw with teeth -->
  <path d="M10 58 Q16 64 26 64 Q16 62 10 58" fill="#e8eef0" stroke="#2a4050" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Teeth -->
  <polygon points="12,60 14,64 16,60" fill="white" stroke="#2a4050" stroke-width="1"/>
  <polygon points="16,61 18,65 20,61" fill="white" stroke="#2a4050" stroke-width="1"/>
  <polygon points="20,62 22,65 24,62" fill="white" stroke="#2a4050" stroke-width="1"/>
  <!-- Eye - small black -->
  <circle cx="16" cy="54" r="3" fill="#111111"/>
  <!-- Dorsal fin - iconic tall -->
  <path d="M46 42 Q50 26 56 42" fill="#5a7888" stroke="#2a4050" stroke-width="2" stroke-linejoin="round"/>
  <!-- Pectoral fins -->
