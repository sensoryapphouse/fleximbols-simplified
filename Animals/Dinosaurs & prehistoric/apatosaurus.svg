  <!-- apatosaurus - similar to diplodocus, heavier body -->
  <!-- tail -->
  <path d="M80,65 Q90,58 96,48 Q98,40 94,38" fill="none" stroke="#7a9870" stroke-width="7" stroke-linecap="round"/>
  <path d="M80,65 Q90,58 96,48 Q98,40 94,38" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- heavy body -->
  <ellipse cx="58" cy="68" rx="24" ry="18" fill="#8aaa70" stroke="#333" stroke-width="2.5"/>
  <!-- neck (medium length) -->
  <path d="M38,58 Q28,42 22,26 Q18,14 24,10 Q30,8 34,18 Q38,32 44,50 Q48,58 50,62" fill="#8aaa70" stroke="#333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- head -->
  <ellipse cx="24" cy="10" rx="9" ry="6" fill="#8aaa70" stroke="#333" stroke-width="2.5"/>
  <circle cx="20" cy="9" r="2" fill="#222"/>
  <path d="M16,13 Q22,15 30,13" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- legs - heavier -->
  <rect x="40" y="82" width="11" height="16" rx="5" fill="#7a9a60" stroke="#333" stroke-width="2"/>
  <rect x="54" y="82" width="11" height="14" rx="5" fill="#7a9a60" stroke="#333" stroke-width="2"/>
  <rect x="66" y="82" width="11" height="14" rx="5" fill="#7a9a60" stroke="#333" stroke-width="2"/>
  <rect x="78" y="82" width="10" height="16" rx="5" fill="#7a9a60" stroke="#333" stroke-width="2"/>
</svg>
