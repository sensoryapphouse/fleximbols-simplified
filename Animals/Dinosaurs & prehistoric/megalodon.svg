  <!-- dorsal fin -->
  <path d="M50,24 Q56,10 62,8 Q60,16 58,24" fill="#5a7888" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- pectoral fin -->
  <path d="M34,38 Q24,46 20,58 Q28,54 38,46 Q44,40 40,36 Z" fill="#6080a0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- head and massive jaw -->
  <path d="M8,50 Q8,36 14,30" fill="none" stroke="#5a7888" stroke-width="2" stroke-linecap="round"/>
  <!-- jaw open slightly -->
  <path d="M8,50 Q10,58 16,62 Q22,56 24,50" fill="#c0d0dc" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- teeth -->
  <path d="M10,44 L8,52" stroke="#f0ece0" stroke-width="3" stroke-linecap="round"/>
  <path d="M14,40 L12,50" stroke="#f0ece0" stroke-width="3" stroke-linecap="round"/>
  <path d="M18,38 L18,48" stroke="#f0ece0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- lower teeth -->
  <path d="M10,56 L8,50" stroke="#f0ece0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14,60 L12,52" stroke="#f0ece0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="20" cy="42" r="4" fill="#222"/>
  <!-- gill slits -->
  <path d="M28,34 Q26,44 28,54" fill="none" stroke="#5a7888" stroke-width="1.5" stroke-linecap="round"/>
