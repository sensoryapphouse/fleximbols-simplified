  <!-- megalodon - giant shark side view -->
  <!-- main body torpedo shape -->
  <path d="M8,50 Q10,30 30,24 Q55,18 78,28 Q92,36 94,50 Q92,64 78,72 Q55,82 30,76 Q10,70 8,50 Z" fill="#7090a8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- belly lighter -->
  <path d="M14,56 Q20,66 40,72 Q60,76 76,68 Q88,62 90,54 Q88,58 76,64 Q55,70 34,66 Q18,62 14,56 Z" fill="#c0d0dc" stroke="none"/>
