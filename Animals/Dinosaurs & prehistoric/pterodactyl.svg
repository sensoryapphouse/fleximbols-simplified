  <!-- pterodactyl - wings spread, long beak crest, in flight -->
  <!-- left wing -->
  <path d="M50,50 Q30,30 10,22 Q6,20 8,26 Q20,36 30,46 Q40,54 50,56 Z" fill="#a08870" stroke="#333" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- right wing -->
  <path d="M50,50 Q70,30 90,22 Q94,20 92,26 Q80,36 70,46 Q60,54 50,56 Z" fill="#a08870" stroke="#333" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- wing membrane lines -->
  <path d="M50,50 Q36,40 20,26" fill="none" stroke="#8a6850" stroke-width="1" stroke-linecap="round"/>
  <path d="M50,50 Q64,40 80,26" fill="none" stroke="#8a6850" stroke-width="1" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="50" cy="54" rx="12" ry="8" fill="#b09880" stroke="#333" stroke-width="2.5"/>
  <!-- neck -->
  <path d="M46,50 Q42,42 44,36" fill="#b09880" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- head with crest -->
  <path d="M38,36 Q36,26 42,20 Q48,16 54,22 Q58,28 54,36 Z" fill="#b09880" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- crest -->
  <path d="M54,22 Q62,14 66,8 Q60,10 54,18" fill="#c0a890" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- long beak -->
  <path d="M38,36 Q30,40 22,38 Q24,42 32,42 Q38,40 42,36" fill="#c0a890" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="46" cy="28" r="3" fill="#222"/>
  <!-- tail short -->
  <path d="M58,56 Q68,60 72,68" fill="none" stroke="#b09880" stroke-width="4" stroke-linecap="round"/>
  <path d="M58,56 Q68,60 72,68" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- legs/feet -->
  <path d="M46,60 Q44,68 42,74 Q44,76 48,74 Q50,68 52,62" fill="#a08870" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M54,60 Q56,68 58,74 Q60,76 64,74 Q62,68 60,62" fill="#a08870" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
