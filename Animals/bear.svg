<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Body - big and rounded -->
  <ellipse cx="50" cy="67" rx="26" ry="22" fill="#8a5a28" stroke="#3a2000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="50" cy="38" rx="18" ry="16" fill="#8a5a28" stroke="#3a2000" stroke-width="2.5"/>
  <!-- Round ears -->
  <circle cx="34" cy="26" r="8" fill="#8a5a28" stroke="#3a2000" stroke-width="2.5"/>
  <circle cx="66" cy="26" r="8" fill="#8a5a28" stroke="#3a2000" stroke-width="2.5"/>
  <circle cx="34" cy="26" r="4" fill="#6a3a10" stroke="none"/>
  <circle cx="66" cy="26" r="4" fill="#6a3a10" stroke="none"/>
  <!-- Muzzle -->
  <ellipse cx="50" cy="45" rx="9" ry="7" fill="#c8a060" stroke="#3a2000" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="43" cy="36" r="3" fill="#111111"/>
  <circle cx="57" cy="36" r="3" fill="#111111"/>
  <circle cx="43.8" cy="35.2" r="1" fill="white"/>
  <circle cx="57.8" cy="35.2" r="1" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="42" rx="3" ry="2.5" fill="#111111"/>
  <!-- Mouth -->
  <path d="M45 47 Q50 51 55 47" fill="none" stroke="#3a2000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="30" y="82" width="10" height="10" rx="5" fill="#8a5a28" stroke="#3a2000" stroke-width="2"/>
  <rect x="44" y="82" width="10" height="10" rx="5" fill="#8a5a28" stroke="#3a2000" stroke-width="2"/>
  <rect x="56" y="82" width="10" height="10" rx="5" fill="#8a5a28" stroke="#3a2000" stroke-width="2"/>
  <rect x="70" y="82" width="10" height="10" rx="5" fill="#8a5a28" stroke="#3a2000" stroke-width="2"/>
  <!-- Label -->
</svg>
