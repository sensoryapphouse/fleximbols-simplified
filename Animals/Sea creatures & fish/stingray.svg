<!-- Water tint -->
<!-- Stingray: flat diamond shape from above -->
  <!-- Main disc body -->
  <path d="M50,22 Q72,28 82,50 Q72,72 50,78 Q28,72 18,50 Q28,28 50,22 Z" fill="#9a8868" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Belly lighter -->
  <path d="M50,28 Q68,34 76,50 Q68,66 50,72 Q32,66 24,50 Q32,34 50,28 Z" fill="#c4b890" opacity="0.4" stroke="none"/>
  <!-- Eyes on top of disc -->
  <circle cx="42" cy="38" r="2.5" fill="#222" stroke="#444" stroke-width="1"/>
  <circle cx="58" cy="38" r="2.5" fill="#222" stroke="#444" stroke-width="1"/>
  <!-- Eye highlight -->
  <circle cx="41" cy="37" r="0.8" fill="white"/>
  <circle cx="57" cy="37" r="0.8" fill="white"/>
  <!-- Spiracles behind eyes -->
  <ellipse cx="42" cy="34" rx="2" ry="1.5" fill="#777"/>
  <ellipse cx="58" cy="34" rx="2" ry="1.5" fill="#777"/>
  <!-- Mouth on underside (shown as faint line) -->
  <path d="M43,60 Q50,63 57,60" stroke="#777" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Gill slits suggestion -->
  <line x1="43" y1="56" x2="43" y2="62" stroke="#888" stroke-width="1"/>
  <line x1="46" y1="56" x2="46" y2="62" stroke="#888" stroke-width="1"/>
  <line x1="54" y1="56" x2="54" y2="62" stroke="#888" stroke-width="1"/>
  <line x1="57" y1="56" x2="57" y2="62" stroke="#888" stroke-width="1"/>
  <!-- Long thin tail with stinger -->
  <path d="M50,78 Q52,86 56,92" stroke="#7a6848" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M56,88 Q58,90 60,86" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Spine/barb on tail -->
  <line x1="54" y1="85" x2="58" y2="82" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <!-- Wing motion lines -->
  <path d="M18,50 Q14,44 16,38" stroke="#8a7858" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M82,50 Q86,44 84,38" stroke="#8a7858" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
