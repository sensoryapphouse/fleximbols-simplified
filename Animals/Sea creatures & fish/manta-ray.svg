<!-- Manta ray seen from above: broad triangular wings, flat diamond body -->
<!-- left wing -->
  <path d="M50 34 Q22 40 6 64 Q28 60 44 56 Z" fill="#3f5160" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<!-- right wing -->
  <path d="M50 34 Q78 40 94 64 Q72 60 56 56 Z" fill="#3f5160" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<!-- central body -->
  <path d="M50 30 Q42 34 42 56 Q46 70 50 74 Q54 70 58 56 Q58 34 50 30 Z" fill="#4a5e6e" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<!-- cephalic head fins (two paddles at front) -->
  <path d="M44 34 Q40 26 36 22 Q42 24 46 30 Z" fill="#3f5160" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <path d="M56 34 Q60 26 64 22 Q58 24 54 30 Z" fill="#3f5160" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<!-- long thin tail -->
  <path d="M50 74 Q50 86 50 96" fill="none" stroke="#2c3a45" stroke-width="3" stroke-linecap="round"/>
<!-- subtle wing edge highlight -->
  <path d="M48 40 Q26 46 14 62" fill="none" stroke="#5d7282" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 40 Q74 46 86 62" fill="none" stroke="#5d7282" stroke-width="2" stroke-linecap="round"/>
</svg>
