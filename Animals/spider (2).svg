<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- web lines -->
  <line x1="50" y1="10" x2="50" y2="45" stroke="#c0c0c0" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="20" x2="50" y2="45" stroke="#c0c0c0" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="20" x2="50" y2="45" stroke="#c0c0c0" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="45" x2="50" y2="45" stroke="#c0c0c0" stroke-width="1" opacity="0.6"/>
  <line x1="90" y1="45" x2="50" y2="45" stroke="#c0c0c0" stroke-width="1" opacity="0.6"/>
  <!-- concentric web arcs -->
  <path d="M30 18 Q50 28 70 18" fill="none" stroke="#c0c0c0" stroke-width="1" opacity="0.5"/>
  <path d="M18 34 Q50 48 82 34" fill="none" stroke="#c0c0c0" stroke-width="1" opacity="0.5"/>
  <!-- abdomen large -->
  <ellipse cx="50" cy="65" rx="16" ry="18" fill="#2a2a2a" stroke="#000000" stroke-width="2.5"/>
  <!-- hourglass mark -->
  <path d="M45 62 L55 62 L50 68 L55 74 L45 74 L50 68 Z" fill="#cc2020" opacity="0.9"/>
  <!-- cephalothorax -->
  <ellipse cx="50" cy="46" rx="11" ry="9" fill="#3a3a3a" stroke="#000000" stroke-width="2.5"/>
  <!-- 8 eyes -->
  <circle cx="45" cy="42" r="1.8" fill="#e0e0e0"/>
  <circle cx="50" cy="41" r="1.8" fill="#e0e0e0"/>
  <circle cx="55" cy="42" r="1.8" fill="#e0e0e0"/>
  <!-- 8 legs - 4 each side -->
  <line x1="41" y1="44" x2="20" y2="36" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="47" x2="18" y2="47" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="51" x2="18" y2="58" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="55" x2="22" y2="68" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="59" y1="44" x2="80" y2="36" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="47" x2="82" y2="47" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="51" x2="82" y2="58" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="55" x2="78" y2="68" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- label -->
</svg>
