<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- upper wings muted / held flat -->
  <ellipse cx="31" cy="46" rx="21" ry="14" fill="#a89070" stroke="#4a3a20" stroke-width="2.5"/>
  <ellipse cx="69" cy="46" rx="21" ry="14" fill="#a89070" stroke="#4a3a20" stroke-width="2.5"/>
  <!-- wing markings subtle -->
  <path d="M22 42 Q30 46 25 54" fill="none" stroke="#4a3a20" stroke-width="1.5" opacity="0.6"/>
  <path d="M78 42 Q70 46 75 54" fill="none" stroke="#4a3a20" stroke-width="1.5" opacity="0.6"/>
  <circle cx="28" cy="44" r="3.5" fill="#c0a888" stroke="#4a3a20" stroke-width="1"/>
  <circle cx="72" cy="44" r="3.5" fill="#c0a888" stroke="#4a3a20" stroke-width="1"/>
  <!-- lower wings wider than butterfly's -->
  <ellipse cx="33" cy="62" rx="18" ry="11" fill="#b8a080" stroke="#4a3a20" stroke-width="2.5"/>
  <ellipse cx="67" cy="62" rx="18" ry="11" fill="#b8a080" stroke="#4a3a20" stroke-width="2.5"/>
  <!-- body stout -->
  <ellipse cx="50" cy="54" rx="6" ry="18" fill="#6a5840" stroke="#4a3a20" stroke-width="2.5"/>
  <!-- furry head -->
  <circle cx="50" cy="36" r="6" fill="#7a6850" stroke="#4a3a20" stroke-width="2.5"/>
  <!-- feathery antennae (moth style) -->
  <path d="M46 31 Q38 24 33 18" fill="none" stroke="#4a3a20" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 26 L34 22" stroke="#4a3a20" stroke-width="1" stroke-linecap="round"/>
  <path d="M41 28 L37 24" stroke="#4a3a20" stroke-width="1" stroke-linecap="round"/>
  <path d="M54 31 Q62 24 67 18" fill="none" stroke="#4a3a20" stroke-width="2" stroke-linecap="round"/>
  <path d="M62 26 L66 22" stroke="#4a3a20" stroke-width="1" stroke-linecap="round"/>
  <path d="M59 28 L63 24" stroke="#4a3a20" stroke-width="1" stroke-linecap="round"/>
  <!-- label -->
</svg>
