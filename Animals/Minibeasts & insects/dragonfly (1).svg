<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- 4 long wings -->
  <ellipse cx="33" cy="42" rx="26" ry="8" fill="#d0f0ff" stroke="#5090b0" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="67" cy="42" rx="26" ry="8" fill="#d0f0ff" stroke="#5090b0" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="33" cy="54" rx="22" ry="7" fill="#d0f0ff" stroke="#5090b0" stroke-width="1.5" opacity="0.75"/>
  <ellipse cx="67" cy="54" rx="22" ry="7" fill="#d0f0ff" stroke="#5090b0" stroke-width="1.5" opacity="0.75"/>
  <!-- slender abdomen with segments -->
  <rect x="47" y="50" width="6" height="32" rx="3" fill="#2060a0" stroke="#0a3060" stroke-width="2"/>
  <line x1="47" y1="57" x2="53" y2="57" stroke="#0a3060" stroke-width="1.5"/>
  <line x1="47" y1="63" x2="53" y2="63" stroke="#0a3060" stroke-width="1.5"/>
  <line x1="47" y1="69" x2="53" y2="69" stroke="#0a3060" stroke-width="1.5"/>
  <line x1="47" y1="75" x2="53" y2="75" stroke="#0a3060" stroke-width="1.5"/>
  <!-- thorax -->
  <ellipse cx="50" cy="48" rx="8" ry="6" fill="#2060a0" stroke="#0a3060" stroke-width="2"/>
  <!-- large head with big eyes -->
  <circle cx="50" cy="38" r="9" fill="#2060a0" stroke="#0a3060" stroke-width="2.5"/>
  <ellipse cx="44" cy="36" rx="6" ry="6" fill="#40b060" stroke="#0a3060" stroke-width="1.5"/>
  <ellipse cx="56" cy="36" rx="6" ry="6" fill="#40b060" stroke="#0a3060" stroke-width="1.5"/>
  <!-- pupil -->
  <circle cx="44" cy="36" r="2.5" fill="#1a1a1a"/>
  <circle cx="56" cy="36" r="2.5" fill="#1a1a1a"/>
  <!-- label -->
</svg>
