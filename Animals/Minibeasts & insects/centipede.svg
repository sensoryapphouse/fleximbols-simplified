<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Centipede - fast, one pair legs per segment, flatter -->
  <!-- Body - elongated S-curve (fast moving) -->
  <path d="M8 42 Q20 30 36 40 Q52 50 68 40 Q84 30 94 42" fill="none" stroke="#c87020" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Segments (fewer, more visible than millipede) -->
  <path d="M14 36 Q16 40 14 44" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <path d="M20 32 Q22 36 20 40" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <path d="M28 31 Q30 35 28 39" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <path d="M36 34 Q38 38 36 42" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <path d="M44 38 Q46 42 44 46" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <path d="M52 42 Q54 46 52 50" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <path d="M60 38 Q62 42 60 46" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <path d="M68 34 Q70 38 68 42" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <path d="M76 32 Q78 36 76 40" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <path d="M84 34 Q86 38 84 42" fill="none" stroke="#a05010" stroke-width="1.5"/>
  <!-- ONE pair of legs per segment (vs 2 in millipede) projecting widely -->
  <path d="M14 36 L6 28 M14 44 L6 52" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <path d="M20 32 L12 22 M20 40 L12 50" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 31 L20 20 M28 39 L20 50" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <path d="M36 34 L28 22 M36 42 L28 54" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 38 L36 26 M44 46 L36 58" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 42 L44 30 M52 50 L44 62" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 38 L52 26 M60 46 L52 58" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <path d="M68 34 L60 22 M68 42 L60 54" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <path d="M76 32 L68 20 M76 40 L68 52" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <path d="M84 34 L76 22 M84 42 L76 54" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
  <!-- Last pair - elongated cerci-like legs at tail -->
  <path d="M92 40 L100 30 M92 44 L100 56" stroke="#8a4010" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head with forcipules (venomous claws) -->
  <ellipse cx="8" cy="42" rx="8" ry="7" fill="#b06010" stroke="#7a3808" stroke-width="2"/>
  <!-- Forcipules -->
  <path d="M2 38 Q-2 34 -2 30 Q0 28 4 32 Q6 36 2 38Z" fill="#8a4010" stroke="#5a2808" stroke-width="1.5"/>
  <path d="M2 46 Q-2 50 -2 54 Q0 56 4 52 Q6 48 2 46Z" fill="#8a4010" stroke="#5a2808" stroke-width="1.5"/>
  <!-- Long antennae -->
  <path d="M4 38 Q-2 28 -4 18" fill="none" stroke="#7a3808" stroke-width="2" stroke-linecap="round"/>
  <path d="M8 36 Q8 26 10 16" fill="none" stroke="#7a3808" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="6" cy="40" r="2" fill="#1a1010"/>
</svg>
