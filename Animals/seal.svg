<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- rock/surface -->
  <ellipse cx="50" cy="86" rx="40" ry="8" fill="#b0a890" stroke="#888" stroke-width="1.5"/>
  <!-- body - torpedo shaped, resting on surface -->
  <ellipse cx="50" cy="68" rx="28" ry="18" fill="#7a8890" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- lighter belly -->
  <ellipse cx="50" cy="72" rx="20" ry="13" fill="#c0c8d0" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
  <!-- tail flippers -->
  <path d="M76 72 Q86 66 88 72 Q86 78 76 76 Z" fill="#5a6878" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M76 72 Q88 74 90 80 Q86 82 76 76 Z" fill="#5a6878" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- front flippers -->
  <path d="M36 66 Q26 60 22 66 Q24 72 36 72 Z" fill="#6a7888" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- head - on raised neck -->
  <path d="M30 58 Q26 48 28 40 Q36 36 42 44 Q44 54 38 62 Z" fill="#7a8890" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- head circle -->
  <circle cx="30" cy="38" r="14" fill="#7a8890" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- whiskered muzzle -->
  <ellipse cx="20" cy="42" rx="8" ry="6" fill="#9aa8b8" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- whiskers -->
  <line x1="12" y1="40" x2="22" y2="41" stroke="#f0f0f0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="42" x2="22" y2="42" stroke="#f0f0f0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="44" x2="22" y2="43" stroke="#f0f0f0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="41" x2="18" y2="40" stroke="#f0f0f0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="43" x2="18" y2="44" stroke="#f0f0f0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- nose -->
  <ellipse cx="16" cy="42" rx="2.5" ry="2" fill="#333"/>
  <!-- eyes - big round -->
  <circle cx="26" cy="34" r="4" fill="#333"/>
  <circle cx="25" cy="33" r="1.5" fill="white"/>
  <!-- ear holes (no external ears for seal) -->
  <circle cx="38" cy="34" r="1.5" fill="#555"/>
</svg>
