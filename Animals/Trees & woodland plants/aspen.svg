<!-- Slender trunk - white/pale like birch -->
  <rect x="46" y="48" width="8" height="36" rx="2" fill="#d8d8c8" stroke="#888870" stroke-width="2"/>
  <!-- Dark marks on trunk -->
  <ellipse cx="50" cy="58" rx="4" ry="2" fill="#606050" stroke="none"/>
  <ellipse cx="50" cy="68" rx="4" ry="2" fill="#606050" stroke="none"/>
  <ellipse cx="50" cy="75" rx="3" ry="1.5" fill="#606050" stroke="none"/>
  <!-- Slender oval crown with round fluttering leaves -->
  <ellipse cx="50" cy="34" rx="22" ry="20" fill="#4a8a38" stroke="#2d5e22" stroke-width="2"/>
  <!-- Round aspen leaves (they flutter due to flat petioles) -->
  <circle cx="38" cy="28" r="6" fill="#6aaa50" stroke="#2d5e22" stroke-width="1.2"/>
  <circle cx="52" cy="22" r="6" fill="#6aaa50" stroke="#2d5e22" stroke-width="1.2"/>
  <circle cx="64" cy="30" r="6" fill="#6aaa50" stroke="#2d5e22" stroke-width="1.2"/>
  <circle cx="42" cy="40" r="5" fill="#5a9a45" stroke="#2d5e22" stroke-width="1.2"/>
  <circle cx="60" cy="38" r="5" fill="#5a9a45" stroke="#2d5e22" stroke-width="1.2"/>
  <circle cx="50" cy="45" r="5" fill="#5a9a45" stroke="#2d5e22" stroke-width="1.2"/>
  <!-- Petiole lines on leaves -->
  <line x1="38" y1="34" x2="38" y2="28" stroke="#2d5e22" stroke-width="0.8"/>
  <line x1="52" y1="28" x2="52" y2="22" stroke="#2d5e22" stroke-width="0.8"/>
</svg>
