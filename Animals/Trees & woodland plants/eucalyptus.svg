  <path d="M55 60 Q58 67 56 75" stroke="#A07840" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M46 70 Q43 77 45 82" stroke="#A07840" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- sparse drooping branches -->
  <path d="M50 42 Q30 38 18 28" stroke="#6A9040" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M50 48 Q70 42 80 30" stroke="#6A9040" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M50 36 Q40 28 32 18" stroke="#6A9040" stroke-width="2" fill="none" stroke-linecap="round"/>
