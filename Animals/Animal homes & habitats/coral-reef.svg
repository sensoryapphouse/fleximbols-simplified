  <!-- Coral reef underwater side view -->
  <!-- Water background -->
  <rect x="0" y="0" width="100" height="100" fill="#336699" stroke="none"/>
  <!-- Sandy seafloor -->
  <rect x="0" y="75" width="100" height="25" fill="#ccaa66" stroke="#333" stroke-width="2"/>
  <!-- Coral formations -->
  <!-- Brain coral -->
  <circle cx="20" cy="72" r="10" fill="#cc7744" stroke="#222" stroke-width="2"/>
  <path d="M12,68 Q16,72 12,76" fill="none" stroke="#aa5522" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M18,66 Q22,72 18,78" fill="none" stroke="#aa5522" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M24,68 Q28,72 24,76" fill="none" stroke="#aa5522" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Staghorn coral -->
  <line x1="50" y1="75" x2="50" y2="55" stroke="#ff8866" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="62" x2="42" y2="52" stroke="#ff8866" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="62" x2="58" y2="52" stroke="#ff8866" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="55" x2="45" y2="47" stroke="#ff8866" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="55" x2="55" y2="47" stroke="#ff8866" stroke-width="2" stroke-linecap="round"/>
  <!-- Tube coral/sponge -->
  <rect x="68" y="58" width="6" height="17" rx="3" fill="#cc44aa" stroke="#222" stroke-width="2"/>
  <rect x="76" y="63" width="5" height="12" rx="2.5" fill="#cc44aa" stroke="#222" stroke-width="2"/>
  <rect x="60" y="65" width="5" height="10" rx="2.5" fill="#cc44aa" stroke="#222" stroke-width="2"/>
  <!-- Fan coral -->
  <line x1="85" y1="75" x2="85" y2="50" stroke="#ff6633" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="85" cy="50" rx="10" ry="14" fill="none" stroke="#ff6633" stroke-width="2"/>
  <line x1="78" y1="45" x2="92" y2="55" stroke="#ff6633" stroke-width="1" stroke-linecap="round"/>
  <line x1="77" y1="52" x2="93" y2="52" stroke="#ff6633" stroke-width="1" stroke-linecap="round"/>
  <!-- Fish -->
  <ellipse cx="35" cy="40" rx="8" ry="4" fill="#ffcc44" stroke="#222" stroke-width="1.5"/>
  <polygon points="27,40 22,36 22,44" fill="#ffcc44" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="37" cy="39" r="1.5" fill="#222"/>
  <!-- Water ripple -->
  <path d="M5,20 Q25,15 45,20 Q65,25 85,20" fill="none" stroke="#4477aa" stroke-width="1.5" stroke-linecap="round"/>
</svg>
