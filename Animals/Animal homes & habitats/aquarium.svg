<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Ground -->
  <rect x="0" y="78" width="100" height="12" fill="#b8d4a0" stroke="#555" stroke-width="1"/>
  <!-- Building -->
  <rect x="8" y="30" width="84" height="48" fill="#d0e8f8" stroke="#444" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="4,30 96,30 84,14 16,14" fill="#4080a8" stroke="#444" stroke-width="2"/>
  <!-- Fish tank window -->
  <rect x="14" y="36" width="72" height="32" fill="#2050a0" stroke="#2060a0" stroke-width="2" rx="4"/>
  <!-- Water gradient effect with bands -->
  <rect x="14" y="36" width="72" height="8" fill="#4080d0" rx="4"/>
  <!-- Fish 1 - clownfish -->
  <ellipse cx="30" cy="52" rx="8" ry="5" fill="#e86010" stroke="#444" stroke-width="1.5"/>
  <line x1="30" y1="47" x2="30" y2="57" stroke="white" stroke-width="1.5"/>
  <line x1="35" y1="48" x2="35" y2="56" stroke="white" stroke-width="1.5"/>
  <ellipse cx="36" cy="52" rx="3" ry="4" fill="#e86010" stroke="#444" stroke-width="1"/>
  <circle cx="26" cy="51" r="1.5" fill="#333"/>
  <!-- Fish 2 - blue tang -->
  <ellipse cx="60" cy="48" rx="9" ry="6" fill="#3060e0" stroke="#444" stroke-width="1.5"/>
  <ellipse cx="67" cy="48" rx="4" ry="5" fill="#3060e0" stroke="#444" stroke-width="1"/>
  <circle cx="55" cy="47" r="1.5" fill="#333"/>
  <!-- Seaweed -->
  <path d="M50,68 Q53,62 50,56 Q53,50 50,44" fill="none" stroke="#40a840" stroke-width="2"/>
  <path d="M70,68 Q73,60 70,52 Q73,46 70,40" fill="none" stroke="#40a840" stroke-width="2"/>
  <!-- Bubble -->
  <circle cx="28" cy="40" r="2" fill="none" stroke="#a0d0f0" stroke-width="1"/>
  <circle cx="60" cy="38" r="1.5" fill="none" stroke="#a0d0f0" stroke-width="1"/>
  <!-- Door -->
  <rect x="40" y="62" width="20" height="16" fill="#4080a8" stroke="#444" stroke-width="1.5"/>
  <!-- Label -->
</svg>
