<!-- Body - fluffy -->
  <ellipse cx="52" cy="66" rx="20" ry="16" fill="#e8d8a0" stroke="#8a7030" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Fluffy chest -->
  <ellipse cx="42" cy="60" rx="12" ry="10" fill="#f0e8c0" stroke="#8a7030" stroke-width="1.5"/>
  <!-- Long neck - very distinctive -->
  <path d="M42 52 Q38 38 42 24" fill="none" stroke="#e8d8a0" stroke-width="10" stroke-linecap="round"/>
  <!-- Fluffy neck texture -->
  <path d="M40 52 Q36 38 40 24" fill="none" stroke="#f0e8c0" stroke-width="4" stroke-linecap="round" stroke-dasharray="4,3"/>
  <!-- Head - small banana-shaped -->
  <ellipse cx="43" cy="22" rx="7" ry="9" fill="#e8d8a0" stroke="#8a7030" stroke-width="2.5"/>
  <!-- Ears - long banana ears -->
  <ellipse cx="37" cy="13" rx="3" ry="7" fill="#e8d8a0" stroke="#8a7030" stroke-width="2" transform="rotate(-10 37 13)"/>
  <ellipse cx="49" cy="13" rx="3" ry="7" fill="#e8d8a0" stroke="#8a7030" stroke-width="2" transform="rotate(10 49 13)"/>
  <!-- Eye -->
  <circle cx="40" cy="20" r="2.5" fill="#111111"/>
  <circle cx="40.8" cy="19.2" r="0.8" fill="white"/>
  <!-- Snobbish nose/muzzle -->
  <ellipse cx="44" cy="27" rx="4" ry="3" fill="#d4c090" stroke="#8a7030" stroke-width="1"/>
  <ellipse cx="44" cy="29" rx="2" ry="1.5" fill="#333333"/>
  <!-- Legs -->
  <line x1="40" y1="80" x2="37" y2="92" stroke="#8a7030" stroke-width="4" stroke-linecap="round"/>
  <line x1="47" y1="81" x2="45" y2="92" stroke="#8a7030" stroke-width="4" stroke-linecap="round"/>
  <line x1="57" y1="81" x2="55" y2="92" stroke="#8a7030" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="80" x2="62" y2="92" stroke="#8a7030" stroke-width="4" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M72 62 Q78 66 76 74" fill="none" stroke="#8a7030" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Label -->
</svg>
