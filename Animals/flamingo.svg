<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- water reflection -->
  <path d="M20 86 Q50 82 80 86" fill="none" stroke="#88aacc" stroke-width="1.5" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="52" cy="56" rx="16" ry="12" fill="#f08090" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- wing feathers -->
  <path d="M40 54 Q36 60 32 68 Q38 68 44 62 Q46 58 48 54 Z" fill="#e06070" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M64 54 Q68 60 70 68 Q64 68 60 62 Q58 58 56 54 Z" fill="#e06070" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- long neck - S-curve bending down -->
  <path d="M48 52 Q44 44 44 36 Q44 28 46 24 Q52 20 58 24 Q60 32 54 40 Q50 46 50 52 Z" fill="#f08090" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="50" cy="20" r="9" fill="#f08090" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- distinctive bent beak (flamingo bill) -->
  <path d="M41 22 Q44 18 50 18 Q54 20 50 24 Q44 26 40 24 Z" fill="#f5f5f5" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- black tip on beak -->
  <path d="M41 22 Q38 24 40 26 Q42 26 44 24 Q42 22 41 22 Z" fill="#333" stroke="#333" stroke-width="1"/>
  <!-- eye -->
  <circle cx="48" cy="18" r="2.5" fill="#e0b020" stroke="#333" stroke-width="1"/>
  <circle cx="48" cy="18" r="1.5" fill="#333"/>
  <circle cx="47.5" cy="17.5" r="0.5" fill="white"/>
  <!-- one leg standing, one tucked -->
  <!-- standing leg - very long and thin -->
  <line x1="46" y1="68" x2="44" y2="88" stroke="#f08090" stroke-width="3" stroke-linecap="round"/>
  <!-- knee joint -->
  <circle cx="44.5" cy="80" r="2" fill="#e06070" stroke="#333" stroke-width="1"/>
  <!-- knee bends backward (bird knee) -->
  <line x1="44.5" y1="80" x2="46" y2="88" stroke="#f08090" stroke-width="3" stroke-linecap="round"/>
  <!-- foot -->
  <path d="M44 88 Q40 90 38 92" fill="none" stroke="#f08090" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 88 Q46 92 46 94" fill="none" stroke="#f08090" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M48 88 Q50 90 52 92" fill="none" stroke="#f08090" stroke-width="2.5" stroke-linecap="round"/>
  <!-- tucked leg hint -->
  <path d="M58 64 Q62 68 60 72 Q56 70 56 66 Z" fill="#f08090" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
