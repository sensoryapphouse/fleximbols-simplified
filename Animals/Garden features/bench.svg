<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Bench seat - long planks -->
  <rect x="5" y="42" width="90" height="8" rx="2" fill="#C8A87A" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="5" y="50" width="90" height="8" rx="2" fill="#C8A87A" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Plank gap/seam -->
  <line x1="5" y1="49" x2="95" y2="49" stroke="#8B7355" stroke-width="1" stroke-linecap="round"/>
  <!-- Wood grain on planks -->
  <line x1="20" y1="43" x2="20" y2="57" stroke="#B8986A" stroke-width="1" stroke-linecap="round"/>
  <line x1="35" y1="43" x2="35" y2="57" stroke="#B8986A" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="43" x2="50" y2="57" stroke="#B8986A" stroke-width="1" stroke-linecap="round"/>
  <line x1="65" y1="43" x2="65" y2="57" stroke="#B8986A" stroke-width="1" stroke-linecap="round"/>
  <line x1="80" y1="43" x2="80" y2="57" stroke="#B8986A" stroke-width="1" stroke-linecap="round"/>
  <!-- Left support bracket -->
  <rect x="14" y="57" width="5" height="24" fill="#8B7355" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <path d="M8,80 L14,58 L19,58 L19,80Z" fill="#8B7355" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <line x1="8" y1="80" x2="25" y2="80" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <!-- Right support bracket -->
  <rect x="81" y="57" width="5" height="24" fill="#8B7355" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <path d="M92,80 L86,58 L81,58 L81,80Z" fill="#8B7355" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <line x1="75" y1="80" x2="92" y2="80" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
  <!-- Back support (park bench style) -->
  <rect x="5" y="28" width="90" height="7" rx="2" fill="#C8A87A" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="5" y="35" width="90" height="7" rx="2" fill="#C8A87A" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Back uprights -->
  <rect x="14" y="28" width="5" height="16" fill="#8B7355" stroke="#555" stroke-width="1.5"/>
  <rect x="81" y="28" width="5" height="16" fill="#8B7355" stroke="#555" stroke-width="1.5"/>
</svg>
