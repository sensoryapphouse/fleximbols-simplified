<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- branch -->
  <path d="M10 80 Q50 76 90 80" fill="none" stroke="#8B6030" stroke-width="5" stroke-linecap="round"/>
  <!-- body - rounded -->
  <ellipse cx="50" cy="66" rx="18" ry="20" fill="#a07840" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- feather pattern on body -->
  <path d="M36 56 Q42 52 48 56" fill="none" stroke="#7a5820" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M52 54 Q58 50 64 54" fill="none" stroke="#7a5820" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M34 62 Q40 58 46 62" fill="none" stroke="#7a5820" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M54 60 Q60 56 66 60" fill="none" stroke="#7a5820" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M34 68 Q40 64 46 68" fill="none" stroke="#7a5820" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M54 66 Q60 62 66 66" fill="none" stroke="#7a5820" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cream breast -->
  <ellipse cx="50" cy="70" rx="12" ry="16" fill="#e0d0a0" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
  <!-- wings folded -->
  <path d="M32 56 Q24 62 26 74 Q32 76 36 70 Q36 62 40 56 Z" fill="#7a5820" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M68 56 Q76 62 74 74 Q68 76 64 70 Q64 62 60 56 Z" fill="#7a5820" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- tail feathers -->
  <path d="M42 84 Q46 86 50 88 Q54 86 58 84 Q54 90 50 92 Q46 90 42 84 Z" fill="#a07840" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- head - large and round -->
  <circle cx="50" cy="42" r="20" fill="#a07840" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- ear tufts -->
  <path d="M34 26 Q30 16 34 12 Q38 16 38 26 Z" fill="#7a5820" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M66 26 Q70 16 66 12 Q62 16 62 26 Z" fill="#7a5820" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- large facial disc -->
  <ellipse cx="50" cy="44" rx="16" ry="14" fill="#c8b080" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- large round eyes -->
  <circle cx="40" cy="42" rx="8" r="7" fill="#f0d840" stroke="#333" stroke-width="2"/>
  <circle cx="40" cy="42" r="5" fill="#f5c000" stroke="none"/>
  <circle cx="40" cy="42" r="3.5" fill="#333"/>
  <circle cx="39" cy="41" r="1.2" fill="white"/>
  <circle cx="60" cy="42" r="7" fill="#f0d840" stroke="#333" stroke-width="2"/>
  <circle cx="60" cy="42" r="5" fill="#f5c000" stroke="none"/>
  <circle cx="60" cy="42" r="3.5" fill="#333"/>
  <circle cx="59" cy="41" r="1.2" fill="white"/>
  <!-- small hooked beak -->
  <path d="M46 50 Q50 46 54 50 Q52 54 50 55 Q48 54 46 50 Z" fill="#e0a020" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- talons -->
  <line x1="40" y1="78" x2="34" y2="84" stroke="#c89020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="78" x2="38" y2="86" stroke="#c89020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="78" x2="42" y2="86" stroke="#c89020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="78" x2="62" y2="84" stroke="#c89020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="78" x2="58" y2="86" stroke="#c89020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="78" x2="54" y2="86" stroke="#c89020" stroke-width="2.5" stroke-linecap="round"/>
</svg>
