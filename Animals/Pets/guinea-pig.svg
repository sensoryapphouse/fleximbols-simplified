  <g transform="translate(-22.002 -31.363) scale(1.4414)">
<!-- body - very round, no visible tail -->
  <ellipse cx="50" cy="66" rx="30" ry="20" fill="#b87a40" stroke="#555" stroke-width="2"/>
  <!-- white patch on body -->
  <ellipse cx="42" cy="65" rx="12" ry="10" fill="#f5f0e8"/>
  <!-- orange patch -->
  <ellipse cx="62" cy="60" rx="10" ry="8" fill="#d4882a"/>
  <!-- head - round and large -->
  <circle cx="50" cy="44" r="18" fill="#b87a40" stroke="#555" stroke-width="2"/>
  <!-- white face patch -->
  <ellipse cx="50" cy="48" rx="10" ry="8" fill="#f5f0e8"/>
  <!-- ears - small rounded -->
  <circle cx="35" cy="32" r="7" fill="#b87a40" stroke="#555" stroke-width="2"/>
  <circle cx="35" cy="32" r="4" fill="#e8a090"/>
  <circle cx="65" cy="32" r="7" fill="#b87a40" stroke="#555" stroke-width="2"/>
  <circle cx="65" cy="32" r="4" fill="#e8a090"/>
  <!-- eyes - large dark -->
  <circle cx="42" cy="41" r="5" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <circle cx="58" cy="41" r="5" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <circle cx="43" cy="40" r="1.5" fill="white"/>
  <circle cx="59" cy="40" r="1.5" fill="white"/>
  <!-- nose -->
  <ellipse cx="50" cy="50" rx="3.5" ry="2.5" fill="#e88"/>
  <!-- mouth -->
  <path d="M46,52 Q50,55 54,52" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- whiskers -->
  <line x1="46" y1="50" x2="28" y2="47" stroke="#aaa" stroke-width="0.8"/>
  <line x1="46" y1="51" x2="28" y2="51" stroke="#aaa" stroke-width="0.8"/>
  <line x1="54" y1="50" x2="72" y2="47" stroke="#aaa" stroke-width="0.8"/>
  <line x1="54" y1="51" x2="72" y2="51" stroke="#aaa" stroke-width="0.8"/>
  <!-- tiny paws -->
  <ellipse cx="32" cy="82" rx="7" ry="4" fill="#b87a40" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="68" cy="82" rx="7" ry="4" fill="#b87a40" stroke="#555" stroke-width="1.5"/>
