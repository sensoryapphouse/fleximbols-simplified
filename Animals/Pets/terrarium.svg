<!-- geometric terrarium shape (pentagon prism) -->
  <polygon points="50,10 85,35 85,75 15,75 15,35" fill="#d4f0d4" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- glass shine lines -->
  <line x1="50" y1="10" x2="15" y2="35" stroke="#b0ddb0" stroke-width="1.5"/>
  <line x1="50" y1="10" x2="85" y2="35" stroke="#b0ddb0" stroke-width="1.5"/>
  <!-- bottom edge highlight -->
  <line x1="15" y1="75" x2="85" y2="75" stroke="#333" stroke-width="2.5"/>
  <!-- soil layer -->
  <rect x="16" y="65" width="68" height="9" rx="1" fill="#c8a870"/>
  <!-- plants inside -->
  <line x1="35" y1="65" x2="35" y2="50" stroke="#5a8a5a" stroke-width="2"/>
  <ellipse cx="35" cy="46" rx="9" ry="7" fill="#7dc47d" stroke="#5a8a5a" stroke-width="1.5"/>
  <ellipse cx="27" cy="52" rx="7" ry="5" fill="#5aad5a" stroke="#5a8a5a" stroke-width="1.5"/>
  <!-- cactus -->
  <rect x="57" y="50" width="8" height="15" rx="4" fill="#7dc47d" stroke="#5a8a5a" stroke-width="1.5"/>
  <rect x="52" y="55" width="6" height="5" rx="3" fill="#7dc47d" stroke="#5a8a5a" stroke-width="1.5"/>
  <rect x="63" y="53" width="6" height="5" rx="3" fill="#7dc47d" stroke="#5a8a5a" stroke-width="1.5"/>
  <!-- small rock -->
  <ellipse cx="48" cy="65" rx="6" ry="4" fill="#bbb" stroke="#333" stroke-width="1.5"/>
  <!-- moss patches -->
  <ellipse cx="25" cy="65" rx="5" ry="3" fill="#6aaa6a"/>
  <ellipse cx="72" cy="65" rx="5" ry="3" fill="#6aaa6a"/>
</svg>
