<!-- Large thick-coated body -->
  <ellipse cx="50" cy="62" rx="26" ry="20" fill="#8b7355" stroke="#4a3728" stroke-width="2.5"/>
  <!-- White undercoat -->
  <ellipse cx="50" cy="65" rx="16" ry="12" fill="#f0ece0" stroke="#c9b99a" stroke-width="1"/>
  <!-- Head - large -->
  <circle cx="50" cy="34" r="18" fill="#8b7355" stroke="#4a3728" stroke-width="2.5"/>
  <!-- White face -->
  <ellipse cx="50" cy="39" rx="12" ry="12" fill="#f0ece0" stroke="#c9b99a" stroke-width="1"/>
