  <polygon points="36,20 30,6 44,19" fill="#8b7355" stroke="#4a3728" stroke-width="2"/>
  <polygon points="64,20 70,6 56,19" fill="#8b7355" stroke="#4a3728" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="43" cy="31" r="4" fill="#6b4226" stroke="#4a3728" stroke-width="1.5"/>
  <circle cx="57" cy="31" r="4" fill="#6b4226" stroke="#4a3728" stroke-width="1.5"/>
  <circle cx="42" cy="30" r="1.5" fill="white"/>
  <circle cx="56" cy="30" r="1.5" fill="white"/>
