  <ellipse cx="50" cy="55" rx="6" ry="13" fill="#f8f8e8" stroke="#ccccaa" stroke-width="1.5" transform="rotate(180 50 68)"/>
  <ellipse cx="50" cy="55" rx="6" ry="13" fill="#f8f8e8" stroke="#ccccaa" stroke-width="1.5" transform="rotate(240 50 68)"/>
  <ellipse cx="50" cy="55" rx="6" ry="13" fill="#f8f8e8" stroke="#ccccaa" stroke-width="1.5" transform="rotate(300 50 68)"/>
