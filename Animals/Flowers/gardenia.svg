<line x1="50" y1="78" x2="50" y2="90" stroke="#2d7a2d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dark glossy leaves -->
  <ellipse cx="40" cy="80" rx="10" ry="4" fill="#2a7a2a" stroke="#1a5a1a" stroke-width="1.5" transform="rotate(-25 40 80)"/>
  <ellipse cx="60" cy="80" rx="10" ry="4" fill="#2a7a2a" stroke="#1a5a1a" stroke-width="1.5" transform="rotate(25 60 80)"/>
