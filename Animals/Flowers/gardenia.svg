  <ellipse cx="50" cy="50" rx="9" ry="20" fill="#f8f8e0" stroke="#ccccaa" stroke-width="2" transform="rotate(210 50 68)"/>
  <!-- inner petals -->
  <ellipse cx="50" cy="55" rx="6" ry="13" fill="#f8f8e8" stroke="#ccccaa" stroke-width="1.5" transform="rotate(0 50 68)"/>
  <ellipse cx="50" cy="55" rx="6" ry="13" fill="#f8f8e8" stroke="#ccccaa" stroke-width="1.5" transform="rotate(60 50 68)"/>
