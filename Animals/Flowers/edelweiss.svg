  <ellipse cx="50" cy="38" rx="5" ry="13" fill="#e0e0cc" stroke="#a0a080" stroke-width="1.5" transform="rotate(67.5 50 50)"/>
  <ellipse cx="50" cy="38" rx="5" ry="13" fill="#e0e0cc" stroke="#a0a080" stroke-width="1.5" transform="rotate(112.5 50 50)"/>
  <ellipse cx="50" cy="38" rx="5" ry="13" fill="#e0e0cc" stroke="#a0a080" stroke-width="1.5" transform="rotate(157.5 50 50)"/>
