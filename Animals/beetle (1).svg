<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(-12.035 -14.218) scale(1.2419)">
<!-- hard oval shell elytra -->
  <ellipse cx="50" cy="60" rx="22" ry="18" fill="#3a5a20" stroke="#1a2a08" stroke-width="2.5"/>
  <!-- elytra split -->
  <line x1="50" y1="42" x2="50" y2="78" stroke="#1a2a08" stroke-width="2" stroke-linecap="round"/>
  <!-- shine marks -->
  <ellipse cx="42" cy="52" rx="4" ry="7" fill="#507a30" opacity="0.5"/>
  <ellipse cx="58" cy="52" rx="4" ry="7" fill="#507a30" opacity="0.5"/>
  <!-- thorax -->
  <ellipse cx="50" cy="42" rx="14" ry="8" fill="#2a4a10" stroke="#1a2a08" stroke-width="2.5"/>
  <!-- head -->
  <ellipse cx="50" cy="32" rx="10" ry="8" fill="#3a5a20" stroke="#1a2a08" stroke-width="2.5"/>
  <!-- eyes -->
  <circle cx="43" cy="30" r="2.5" fill="#1a1a1a"/>
  <circle cx="57" cy="30" r="2.5" fill="#1a1a1a"/>
  <!-- antennae -->
  <line x1="45" y1="25" x2="36" y2="16" stroke="#1a2a08" stroke-width="2" stroke-linecap="round"/>
  <circle cx="36" cy="16" r="2" fill="#1a2a08"/>
  <line x1="55" y1="25" x2="64" y2="16" stroke="#1a2a08" stroke-width="2" stroke-linecap="round"/>
  <circle cx="64" cy="16" r="2" fill="#1a2a08"/>
  <!-- 6 legs -->
  <line x1="38" y1="44" x2="24" y2="50" stroke="#1a2a08" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="50" x2="22" y2="58" stroke="#1a2a08" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="58" x2="24" y2="66" stroke="#1a2a08" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="44" x2="76" y2="50" stroke="#1a2a08" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="50" x2="78" y2="58" stroke="#1a2a08" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="58" x2="76" y2="66" stroke="#1a2a08" stroke-width="2" stroke-linecap="round"/>
  <!-- label -->
</g>
