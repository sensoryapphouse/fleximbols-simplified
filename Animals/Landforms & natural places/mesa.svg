  <!-- Sky -->
  <rect x="0" y="0" width="100" height="60" fill="#aaccee" stroke="none"/>
  <!-- Ground level -->
  <rect x="0" y="78" width="100" height="22" fill="#c8a870" stroke="#333" stroke-width="2"/>
  <!-- Mesa - flat-topped elevated landform -->
  <!-- Vertical cliff sides -->
  <rect x="18" y="38" width="64" height="40" fill="#b07840" stroke="#222" stroke-width="2.5"/>
  <!-- Rock strata lines on cliff -->
  <line x1="18" y1="52" x2="82" y2="52" stroke="#996633" stroke-width="1.5"/>
  <line x1="18" y1="63" x2="82" y2="63" stroke="#aa7744" stroke-width="1.5"/>
  <!-- Flat top surface -->
  <rect x="18" y="32" width="64" height="10" fill="#c8935a" stroke="#222" stroke-width="2.5"/>
  <!-- Top edge slight overhang effect -->
  <line x1="14" y1="38" x2="86" y2="38" stroke="#222" stroke-width="2"/>
  <!-- Talus slope hints at base -->
  <polygon points="18,78 12,84 18,84" fill="#aa8855" stroke="#333" stroke-width="1"/>
  <polygon points="82,78 88,84 82,84" fill="#aa8855" stroke="#333" stroke-width="1"/>
