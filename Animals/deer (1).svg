<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Body - slim elegant -->
  <ellipse cx="52" cy="66" rx="20" ry="14" fill="#c87840" stroke="#6a3a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- White belly -->
  <ellipse cx="52" cy="69" rx="12" ry="8" fill="#f0e8d0" stroke="none"/>
  <!-- Neck -->
  <path d="M48 52 Q44 44 46 36" fill="none" stroke="#c87840" stroke-width="8" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="47" cy="34" rx="10" ry="8" fill="#c87840" stroke="#6a3a10" stroke-width="2.5"/>
  <!-- Ears -->
  <ellipse cx="38" cy="30" rx="5" ry="8" fill="#c87840" stroke="#6a3a10" stroke-width="2" transform="rotate(-20 38 30)"/>
  <ellipse cx="56" cy="30" rx="5" ry="8" fill="#c87840" stroke="#6a3a10" stroke-width="2" transform="rotate(20 56 30)"/>
  <ellipse cx="38" cy="30" rx="2.5" ry="5" fill="#d4a0a0" stroke="none" transform="rotate(-20 38 30)"/>
  <ellipse cx="56" cy="30" rx="2.5" ry="5" fill="#d4a0a0" stroke="none" transform="rotate(20 56 30)"/>
  <!-- Antlers -->
  <path d="M43 27 Q38 20 32 15 M32 15 Q29 10 26 8 M32 15 Q30 12 28 14" fill="none" stroke="#6a3a10" stroke-width="2" stroke-linecap="round"/>
  <path d="M51 27 Q56 20 62 15 M62 15 Q65 10 68 8 M62 15 Q64 12 66 14" fill="none" stroke="#6a3a10" stroke-width="2" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="44" cy="33" r="2" fill="#111111"/>
  <circle cx="44.7" cy="32.3" r="0.7" fill="white"/>
  <!-- Nose -->
  <ellipse cx="48" cy="38" rx="2" ry="1.5" fill="#333333"/>
  <!-- Legs - thin and long -->
  <line x1="42" y1="78" x2="40" y2="90" stroke="#6a3a10" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="79" x2="46" y2="90" stroke="#6a3a10" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="79" x2="56" y2="90" stroke="#6a3a10" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="78" x2="62" y2="90" stroke="#6a3a10" stroke-width="3" stroke-linecap="round"/>
  <!-- White tail -->
  <circle cx="72" cy="60" r="4" fill="#f0ece8" stroke="#aaaaaa" stroke-width="1"/>
  <!-- Label -->
</svg>
