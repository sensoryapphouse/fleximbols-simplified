<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- three body segments -->
  <!-- head -->
  <circle cx="50" cy="28" r="8" fill="#8a2a18" stroke="#3a0a00" stroke-width="2.5"/>
  <!-- antennae -->
  <line x1="46" y1="22" x2="38" y2="13" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <circle cx="38" cy="13" r="2" fill="#3a0a00"/>
  <line x1="54" y1="22" x2="62" y2="13" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <circle cx="62" cy="13" r="2" fill="#3a0a00"/>
  <!-- eyes -->
  <circle cx="45" cy="26" r="2" fill="#1a1a1a"/>
  <circle cx="55" cy="26" r="2" fill="#1a1a1a"/>
  <!-- thorax -->
  <circle cx="50" cy="46" r="9" fill="#8a2a18" stroke="#3a0a00" stroke-width="2.5"/>
  <!-- narrow waist -->
  <ellipse cx="50" cy="57" rx="4" ry="3" fill="#8a2a18" stroke="#3a0a00" stroke-width="2"/>
  <!-- abdomen -->
  <ellipse cx="50" cy="70" rx="11" ry="14" fill="#8a2a18" stroke="#3a0a00" stroke-width="2.5"/>
  <!-- 6 legs (3 pairs) -->
  <line x1="42" y1="44" x2="28" y2="38" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="38" x2="22" y2="44" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="48" x2="26" y2="50" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="50" x2="20" y2="58" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="52" x2="28" y2="58" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="58" x2="24" y2="66" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="72" y2="38" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="38" x2="78" y2="44" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="48" x2="74" y2="50" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="50" x2="80" y2="58" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="52" x2="72" y2="58" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="58" x2="76" y2="66" stroke="#3a0a00" stroke-width="2" stroke-linecap="round"/>
  <!-- label -->
</svg>
