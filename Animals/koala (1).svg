<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- tree branch -->
  <rect x="10" y="60" width="80" height="8" rx="4" fill="#8B6030" stroke="#555" stroke-width="1.5"/>
  <!-- body -->
  <ellipse cx="50" cy="70" rx="18" ry="16" fill="#a0a0a0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- arms gripping branch -->
  <path d="M36 66 Q30 62 28 64 Q30 68 36 68 Z" fill="#a0a0a0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 66 Q70 62 72 64 Q70 68 64 68 Z" fill="#a0a0a0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- claws on branch -->
  <line x1="26" y1="63" x2="24" y2="61" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="62" x2="27" y2="60" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="63" x2="74" y2="61" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="62" x2="71" y2="60" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <!-- head - large and round -->
  <circle cx="50" cy="44" r="20" fill="#b0b0b0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- very large round ears -->
  <circle cx="28" cy="32" r="12" fill="#b0b0b0" stroke="#333" stroke-width="2"/>
  <circle cx="28" cy="32" r="8" fill="#c8c0c0" stroke="none"/>
  <circle cx="72" cy="32" r="12" fill="#b0b0b0" stroke="#333" stroke-width="2"/>
  <circle cx="72" cy="32" r="8" fill="#c8c0c0" stroke="none"/>
  <!-- face -->
  <!-- large leathery nose -->
  <ellipse cx="50" cy="48" rx="8" ry="6" fill="#333" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="50" cy="48" rx="5" ry="3.5" fill="#555"/>
  <!-- nostrils -->
  <ellipse cx="46" cy="48" rx="1.5" ry="1.2" fill="#222"/>
  <ellipse cx="54" cy="48" rx="1.5" ry="1.2" fill="#222"/>
  <!-- eyes - small and sleepy -->
  <ellipse cx="40" cy="40" rx="3" ry="2.5" fill="#333"/>
  <circle cx="39.5" cy="39.5" r="0.8" fill="white"/>
  <ellipse cx="60" cy="40" rx="3" ry="2.5" fill="#333"/>
  <circle cx="59.5" cy="39.5" r="0.8" fill="white"/>
  <!-- tummy lighter -->
  <ellipse cx="50" cy="74" rx="10" ry="10" fill="#c8c0b0" stroke="#333" stroke-width="1"/>
  <!-- legs hanging down -->
  <path d="M38 82 Q34 88 36 92 Q40 92 40 88 Q40 84 40 80 Z" fill="#a0a0a0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M62 82 Q66 88 64 92 Q60 92 60 88 Q60 84 60 80 Z" fill="#a0a0a0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
</svg>
