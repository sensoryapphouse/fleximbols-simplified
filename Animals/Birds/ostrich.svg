<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- very long legs -->
  <line x1="42" y1="68" x2="38" y2="88" stroke="#e8c880" stroke-width="5" stroke-linecap="round"/>
  <line x1="58" y1="68" x2="62" y2="88" stroke="#e8c880" stroke-width="5" stroke-linecap="round"/>
  <!-- knee joint -->
  <circle cx="40" cy="80" r="3.5" fill="#d0a860" stroke="#333" stroke-width="1"/>
  <circle cx="60" cy="80" r="3.5" fill="#d0a860" stroke="#333" stroke-width="1"/>
  <!-- lower leg different angle (bird knee) -->
  <line x1="40" y1="80" x2="36" y2="88" stroke="#e8c880" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="80" x2="64" y2="88" stroke="#e8c880" stroke-width="4" stroke-linecap="round"/>
  <!-- two-toed feet -->
  <path d="M34 88 Q30 90 28 92" stroke="#d0a860" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M36 88 Q36 92 36 94" stroke="#d0a860" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M62 88 Q66 90 68 92" stroke="#d0a860" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M64 88 Q64 92 64 94" stroke="#d0a860" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- body - large fluffy black (male) -->
  <ellipse cx="50" cy="58" rx="22" ry="18" fill="#1a1a1a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- white fluffy tail feathers -->
  <path d="M66 56 Q76 50 78 58 Q76 66 66 62 Q70 58 68 56 Z" fill="#f0f0f0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M66 60 Q78 56 80 64 Q78 70 66 66 Z" fill="#f0f0f0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- white wing tips -->
  <path d="M34 52 Q26 48 22 56 Q26 62 34 58 Z" fill="#f0f0f0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- very long neck - pink/bare skin -->
  <rect x="45" y="16" width="10" height="46" rx="5" fill="#e8a0a0" stroke="#333" stroke-width="2"/>
  <!-- small head -->
  <circle cx="50" cy="14" r="8" fill="#e8a0a0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- flat wide bill -->
  <path d="M42 16 Q50 12 58 16 Q56 20 50 22 Q44 20 42 16 Z" fill="#e8b020" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- large eye -->
  <circle cx="46" cy="10" r="4" fill="#333"/>
  <circle cx="45" cy="9" r="1.5" fill="white"/>
  <!-- eyelashes (ostrich has striking lashes) -->
  <path d="M42 8 Q44 6 46 8" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
