  <!-- flower center -->
  <circle cx="76" cy="50" r="9" fill="#f5c020" stroke="#d0a000" stroke-width="1.5"/>
  <!-- hummingbird hovering -->
  <!-- wings blurred (motion) - horizontal blur effect -->
  <ellipse cx="38" cy="36" rx="22" ry="8" fill="#a0d0a0" stroke="#70a870" stroke-width="1" opacity="0.6"/>
  <ellipse cx="38" cy="54" rx="22" ry="8" fill="#a0d0a0" stroke="#70a870" stroke-width="1" opacity="0.6"/>
