  <path d="M18 34 Q38 30 58 36" fill="none" stroke="#80b880" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M18 38 Q38 34 58 40" fill="none" stroke="#80b880" stroke-width="1.5" stroke-linecap="round"/>
