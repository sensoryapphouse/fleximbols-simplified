  <path d="M18 56 Q38 60 58 56" fill="none" stroke="#80b880" stroke-width="1.5" stroke-linecap="round"/>
  <!-- body - tiny, iridescent -->
  <ellipse cx="44" cy="46" rx="10" ry="6" fill="#30a060" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- ruby throat -->
  <ellipse cx="36" cy="46" rx="5" ry="4" fill="#e02020" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
