<!-- Hovering kestrel: wings raised, tail fanned -->
  <!-- Left wing: raised -->
  <path d="M48,48 L22,32 L16,38 L22,46 Z" fill="#c8780a" stroke="#444" stroke-width="2" stroke-linejoin="round"/>
  <path d="M22,46 L16,38 L10,44 L18,50 Z" fill="#b86808" stroke="#444" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right wing: raised -->
  <path d="M52,48 L78,32 L84,38 L78,46 Z" fill="#c8780a" stroke="#444" stroke-width="2" stroke-linejoin="round"/>
  <path d="M78,46 L84,38 L90,44 L82,50 Z" fill="#b86808" stroke="#444" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Wing markings: dark spots -->
  <circle cx="26" cy="38" r="2" fill="#6a3808"/>
  <circle cx="34" cy="36" r="2" fill="#6a3808"/>
  <circle cx="42" cy="38" r="2" fill="#6a3808"/>
  <circle cx="74" cy="38" r="2" fill="#6a3808"/>
  <circle cx="66" cy="36" r="2" fill="#6a3808"/>
  <circle cx="58" cy="38" r="2" fill="#6a3808"/>
  <!-- Body: compact -->
  <ellipse cx="50" cy="56" rx="12" ry="10" fill="#e8b060" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Belly: streaked -->
  <line x1="44" y1="52" x2="42" y2="60" stroke="#8a5020" stroke-width="1"/>
  <line x1="48" y1="51" x2="46" y2="62" stroke="#8a5020" stroke-width="1"/>
  <line x1="52" y1="51" x2="54" y2="62" stroke="#8a5020" stroke-width="1"/>
  <line x1="56" y1="52" x2="58" y2="60" stroke="#8a5020" stroke-width="1"/>
  <!-- Head: blue-grey -->
  <ellipse cx="50" cy="44" rx="10" ry="9" fill="#9090b0" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Moustache mark -->
  <path d="M44,48 Q46,50 46,52" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M56,48 Q54,50 54,52" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eye: yellow -->
  <circle cx="44" cy="41" r="3" fill="#e8c020" stroke="#444" stroke-width="1.5"/>
  <circle cx="44" cy="41" r="1.8" fill="#222"/>
  <circle cx="43" cy="40" r="0.6" fill="white"/>
  <circle cx="56" cy="41" r="3" fill="#e8c020" stroke="#444" stroke-width="1.5"/>
  <circle cx="56" cy="41" r="1.8" fill="#222"/>
  <circle cx="55" cy="40" r="0.6" fill="white"/>
  <!-- Beak: hooked -->
  <path d="M45,47 Q50,46 55,48 Q54,52 50,52 Q46,52 45,50 Z" fill="#d8a020" stroke="#444" stroke-width="1.5"/>
  <!-- Fan tail -->
  <path d="M38,64 L62,64 Q68,74 50,76 Q32,74 38,64 Z" fill="#e8b060" stroke="#444" stroke-width="2" stroke-linejoin="round"/>
  <!-- Tail banding -->
  <line x1="40" y1="67" x2="60" y2="67" stroke="#8a5020" stroke-width="1.5"/>
  <line x1="40" y1="70" x2="60" y2="70" stroke="#8a5020" stroke-width="1.5"/>
  <!-- Sub-terminal band: dark -->
  <path d="M38,72 Q50,76 62,72" stroke="#333" stroke-width="3" fill="none"/>
</svg>
