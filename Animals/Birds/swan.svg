<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- water -->
  <path d="M8 72 Q24 68 40 72 Q56 76 72 72 Q84 68 92 72" fill="none" stroke="#5599cc" stroke-width="2" stroke-linecap="round"/>
  <path d="M8 76 Q24 72 40 76 Q56 80 72 76 Q84 72 92 76" fill="none" stroke="#88bbdd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- body floating -->
  <ellipse cx="54" cy="70" rx="26" ry="14" fill="#f5f5f5" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- raised wings (regal pose) -->
  <path d="M42 64 Q38 52 28 46 Q22 50 28 58 Q34 62 42 66 Z" fill="#f5f5f5" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M62 64 Q66 52 76 46 Q82 50 76 58 Q70 62 62 66 Z" fill="#f5f5f5" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- wing detail -->
  <path d="M30 50 Q36 56 42 62" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 54 Q38 60 42 64" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M74 50 Q68 56 62 62" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M72 54 Q66 60 62 64" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- long graceful neck - S-curve -->
  <path d="M46 68 Q40 60 36 50 Q34 40 38 32 Q44 28 50 34 Q52 44 48 56 Q46 64 46 68 Z" fill="#f5f5f5" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="44" cy="28" r="10" fill="#f5f5f5" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- orange bill with black base (mute swan) -->
  <path d="M34 30 Q40 26 46 28 Q44 34 38 36 Z" fill="#f0a020" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- black knob at bill base -->
  <circle cx="46" cy="28" r="3" fill="#333"/>
  <!-- eye -->
  <circle cx="40" cy="24" r="2.5" fill="#333"/>
  <circle cx="39.5" cy="23.5" r="0.8" fill="white"/>
  <!-- tail feathers lifted -->
  <path d="M74 66 Q82 58 84 62 Q82 68 76 68 Z" fill="#f5f5f5" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
