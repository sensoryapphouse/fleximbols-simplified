<!-- water line -->
  <path d="M8 70 Q20 66 32 70 Q44 74 56 70 Q68 66 80 70 Q88 72 92 70" fill="none" stroke="#5599cc" stroke-width="2" stroke-linecap="round"/>
  <!-- body mostly submerged -->
  <ellipse cx="52" cy="74" rx="32" ry="14" fill="#8a7a80" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- head above water - massive and wide -->
  <ellipse cx="32" cy="60" rx="24" ry="16" fill="#8a7a80" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- top of head / nostrils above waterline -->
  <ellipse cx="28" cy="50" rx="14" ry="8" fill="#8a7a80" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- nostrils on top -->
  <ellipse cx="22" cy="48" rx="3" ry="2" fill="#555" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="34" cy="48" rx="3" ry="2" fill="#555" stroke="#333" stroke-width="1.5"/>
  <!-- eyes on top of head -->
  <circle cx="18" cy="55" r="3.5" fill="#c8b060" stroke="#333" stroke-width="1.5"/>
  <circle cx="18" cy="55" r="1.8" fill="#333"/>
  <circle cx="17.5" cy="54.5" r="0.6" fill="white"/>
  <circle cx="38" cy="55" r="3.5" fill="#c8b060" stroke="#333" stroke-width="1.5"/>
  <circle cx="38" cy="55" r="1.8" fill="#333"/>
  <circle cx="37.5" cy="54.5" r="0.6" fill="white"/>
  <!-- ear bumps -->
  <circle cx="12" cy="56" r="4" fill="#8a7a80" stroke="#333" stroke-width="1.5"/>
  <circle cx="46" cy="56" r="4" fill="#8a7a80" stroke="#333" stroke-width="1.5"/>
  <!-- wide mouth hint -->
  <path d="M12 66 Q28 72 44 66" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- short legs under water -->
  <rect x="36" y="82" width="9" height="8" rx="3" fill="#8a7a80" stroke="#333" stroke-width="2"/>
  <rect x="50" y="82" width="9" height="8" rx="3" fill="#8a7a80" stroke="#333" stroke-width="2"/>
  <rect x="63" y="82" width="9" height="8" rx="3" fill="#8a7a80" stroke="#333" stroke-width="2"/>
  <!-- tail -->
  <path d="M82 72 L88 68 Q90 74 87 78 L82 76" fill="none" stroke="#8a7a80" stroke-width="2.5" stroke-linecap="round"/>
