<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- body - white/cream -->
  <ellipse cx="50" cy="68" rx="22" ry="20" fill="#f5f5f5" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- black belly patch -->
  <ellipse cx="50" cy="72" rx="13" ry="14" fill="#2a2a2a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- black arms -->
  <path d="M30 62 Q20 56 18 64 Q20 72 30 70 Z" fill="#2a2a2a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M70 62 Q80 56 82 64 Q80 72 70 70 Z" fill="#2a2a2a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- legs -->
  <path d="M36 82 Q32 90 36 92 Q42 92 42 86 Q42 80 40 78 Z" fill="#2a2a2a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 82 Q68 90 64 92 Q58 92 58 86 Q58 80 60 78 Z" fill="#2a2a2a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- head - large round -->
  <circle cx="50" cy="40" r="22" fill="#f5f5f5" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- large round ears -->
  <circle cx="30" cy="22" r="9" fill="#2a2a2a" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="22" r="9" fill="#2a2a2a" stroke="#333" stroke-width="2"/>
  <!-- eye patches - oval black -->
  <ellipse cx="38" cy="38" rx="8" ry="7" fill="#2a2a2a" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="62" cy="38" rx="8" ry="7" fill="#2a2a2a" stroke="#333" stroke-width="1.5"/>
  <!-- eyes - white then pupil -->
  <circle cx="38" cy="38" r="4" fill="white"/>
  <circle cx="38" cy="38" r="2.5" fill="#333"/>
  <circle cx="37.5" cy="37.5" r="0.8" fill="white"/>
  <circle cx="62" cy="38" r="4" fill="white"/>
  <circle cx="62" cy="38" r="2.5" fill="#333"/>
  <circle cx="61.5" cy="37.5" r="0.8" fill="white"/>
  <!-- round muzzle -->
  <ellipse cx="50" cy="48" rx="10" ry="8" fill="#f0f0f0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- nose -->
  <path d="M45 46 Q50 44 55 46 Q54 50 50 50 Q46 50 45 46 Z" fill="#2a2a2a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- mouth -->
  <path d="M45 50 Q48 53 50 52 Q52 53 55 50" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
</svg>
