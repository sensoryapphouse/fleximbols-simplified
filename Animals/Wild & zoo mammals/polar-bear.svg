<!-- Body - big and rounded, white/cream -->
  <ellipse cx="50" cy="67" rx="26" ry="22" fill="#f0ece8" stroke="#8a8880" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Head - more elongated than brown bear -->
  <ellipse cx="50" cy="37" rx="17" ry="14" fill="#f0ece8" stroke="#8a8880" stroke-width="2.5"/>
  <!-- Smaller rounder ears -->
  <circle cx="35" cy="26" r="7" fill="#f0ece8" stroke="#8a8880" stroke-width="2.5"/>
  <circle cx="65" cy="26" r="7" fill="#f0ece8" stroke="#8a8880" stroke-width="2.5"/>
  <circle cx="35" cy="26" r="3.5" fill="#ddd8d0" stroke="none"/>
  <circle cx="65" cy="26" r="3.5" fill="#ddd8d0" stroke="none"/>
  <!-- Longer muzzle -->
  <ellipse cx="50" cy="45" rx="8" ry="6" fill="#e8e4e0" stroke="#8a8880" stroke-width="1.5"/>
  <!-- Eyes - small dark -->
  <circle cx="43" cy="35" r="2.5" fill="#111111"/>
  <circle cx="57" cy="35" r="2.5" fill="#111111"/>
  <circle cx="43.8" cy="34.2" r="0.8" fill="white"/>
  <circle cx="57.8" cy="34.2" r="0.8" fill="white"/>
  <!-- Nose - black -->
  <ellipse cx="50" cy="42" rx="3" ry="2" fill="#111111"/>
  <!-- Mouth -->
  <path d="M46 46 Q50 49 54 46" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="30" y="82" width="10" height="10" rx="5" fill="#f0ece8" stroke="#8a8880" stroke-width="2"/>
  <rect x="44" y="82" width="10" height="10" rx="5" fill="#f0ece8" stroke="#8a8880" stroke-width="2"/>
  <rect x="56" y="82" width="10" height="10" rx="5" fill="#f0ece8" stroke="#8a8880" stroke-width="2"/>
  <rect x="70" y="82" width="10" height="10" rx="5" fill="#f0ece8" stroke="#8a8880" stroke-width="2"/>
