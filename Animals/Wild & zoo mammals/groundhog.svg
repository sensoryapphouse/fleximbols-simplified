<!-- Ground/burrow -->
  <ellipse cx="50" cy="84" rx="28" ry="8" fill="#c8a868" stroke="#8a6838" stroke-width="2"/>
  <!-- Body: stocky upright -->
  <ellipse cx="50" cy="66" rx="20" ry="18" fill="#8a7048" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Head: round wide -->
  <ellipse cx="50" cy="43" rx="18" ry="16" fill="#8a7048" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Ears: small rounded -->
  <ellipse cx="36" cy="28" rx="6" ry="7" fill="#8a7048" stroke="#444" stroke-width="2"/>
  <ellipse cx="36" cy="28" rx="4" ry="5" fill="#c49878"/>
  <ellipse cx="64" cy="28" rx="6" ry="7" fill="#8a7048" stroke="#444" stroke-width="2"/>
  <ellipse cx="64" cy="28" rx="4" ry="5" fill="#c49878"/>
  <!-- Eyes -->
  <circle cx="42" cy="40" r="3" fill="#222"/>
  <circle cx="58" cy="40" r="3" fill="#222"/>
  <circle cx="43" cy="39" r="1" fill="white"/>
  <circle cx="59" cy="39" r="1" fill="white"/>
  <!-- Snout: broad -->
  <ellipse cx="50" cy="50" rx="9" ry="6" fill="#a08858" stroke="#444" stroke-width="1.5"/>
  <!-- Nose -->
  <ellipse cx="50" cy="49" rx="3" ry="2" fill="#333"/>
  <!-- Bucked teeth -->
  <rect x="47" y="53" width="3" height="4" rx="1" fill="#f0f0d0" stroke="#888" stroke-width="1"/>
  <rect x="51" y="53" width="3" height="4" rx="1" fill="#f0f0d0" stroke="#888" stroke-width="1"/>
  <!-- Belly: lighter -->
  <ellipse cx="50" cy="68" rx="14" ry="14" fill="#c4a870" stroke="none"/>
  <!-- Front paws raised: alert posture -->
  <ellipse cx="34" cy="60" rx="5" ry="8" fill="#7a6038" stroke="#444" stroke-width="2" transform="rotate(20,34,60)"/>
  <ellipse cx="66" cy="60" rx="5" ry="8" fill="#7a6038" stroke="#444" stroke-width="2" transform="rotate(-20,66,60)"/>
  <!-- Paw details -->
  <line x1="31" y1="53" x2="29" y2="50" stroke="#5a4028" stroke-width="1.5"/>
  <line x1="34" y1="52" x2="33" y2="49" stroke="#5a4028" stroke-width="1.5"/>
  <line x1="37" y1="53" x2="37" y2="50" stroke="#5a4028" stroke-width="1.5"/>
