<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Massive body with hump -->
  <ellipse cx="55" cy="67" rx="26" ry="18" fill="#5a4020" stroke="#2a1800" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Hump over shoulders -->
  <ellipse cx="36" cy="54" rx="16" ry="13" fill="#5a4020" stroke="#2a1800" stroke-width="2.5"/>
  <!-- Thick neck -->
  <path d="M38 54 Q35 46 38 36" fill="none" stroke="#5a4020" stroke-width="12" stroke-linecap="round"/>
  <!-- Head - large and low -->
  <ellipse cx="38" cy="35" rx="14" ry="11" fill="#4a3018" stroke="#2a1800" stroke-width="2.5"/>
  <!-- Muzzle -->
  <ellipse cx="38" cy="41" rx="9" ry="6" fill="#6a5030" stroke="#2a1800" stroke-width="1.5"/>
  <!-- Shaggy mane/beard -->
  <path d="M28 38 Q24 46 26 54" fill="none" stroke="#3a2808" stroke-width="5" stroke-linecap="round"/>
  <!-- Short curved horns -->
  <path d="M30 28 Q24 22 22 18" fill="none" stroke="#2a1800" stroke-width="3" stroke-linecap="round"/>
  <path d="M46 28 Q52 22 54 18" fill="none" stroke="#2a1800" stroke-width="3" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="33" cy="32" r="2.5" fill="#111111"/>
  <circle cx="33.8" cy="31.2" r="0.8" fill="white"/>
  <!-- Nose -->
  <ellipse cx="38" cy="44" rx="3" ry="2" fill="#111111"/>
  <!-- Legs - short and thick -->
  <rect x="40" y="80" width="8" height="11" rx="3" fill="#5a4020" stroke="#2a1800" stroke-width="2"/>
  <rect x="50" y="80" width="8" height="11" rx="3" fill="#5a4020" stroke="#2a1800" stroke-width="2"/>
  <rect x="60" y="80" width="8" height="11" rx="3" fill="#5a4020" stroke="#2a1800" stroke-width="2"/>
  <rect x="28" y="80" width="8" height="11" rx="3" fill="#5a4020" stroke="#2a1800" stroke-width="2"/>
  <!-- Tail -->
  <path d="M80 64 Q86 70 84 78" fill="none" stroke="#5a4020" stroke-width="3" stroke-linecap="round"/>
  <!-- Label -->
</svg>
