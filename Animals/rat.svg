<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(-1.374 -9.378) scale(1.0714)">
<!-- long scaly tail -->
  <path d="M70,68 Q88,62 90,48 Q91,36 84,28" fill="none" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <!-- body - larger than mouse -->
  <ellipse cx="48" cy="64" rx="25" ry="16" fill="#8a8090" stroke="#555" stroke-width="2"/>
  <!-- belly -->
  <ellipse cx="48" cy="66" rx="16" ry="10" fill="#c0b8c0"/>
  <!-- head -->
  <ellipse cx="50" cy="45" rx="16" ry="14" fill="#8a8090" stroke="#555" stroke-width="2"/>
  <!-- pointed snout -->
  <ellipse cx="50" cy="55" rx="9" ry="6" fill="#8a8090" stroke="#555" stroke-width="1.5"/>
  <!-- ears - smaller than mouse -->
  <circle cx="36" cy="33" r="8" fill="#8a8090" stroke="#555" stroke-width="2"/>
  <circle cx="36" cy="33" r="5" fill="#e0a090"/>
  <circle cx="64" cy="33" r="8" fill="#8a8090" stroke="#555" stroke-width="2"/>
  <circle cx="64" cy="33" r="5" fill="#e0a090"/>
  <!-- eyes - small beady -->
  <circle cx="43" cy="44" r="3" fill="#1a1a1a"/>
  <circle cx="57" cy="44" r="3" fill="#1a1a1a"/>
  <circle cx="43.8" cy="43.2" r="0.8" fill="white"/>
  <circle cx="57.8" cy="43.2" r="0.8" fill="white"/>
  <!-- nose -->
  <ellipse cx="50" cy="58" rx="3" ry="2.5" fill="#e88"/>
  <!-- whiskers - long -->
  <line x1="47" y1="57" x2="24" y2="53" stroke="#bbb" stroke-width="0.8"/>
  <line x1="47" y1="58" x2="24" y2="58" stroke="#bbb" stroke-width="0.8"/>
  <line x1="47" y1="59" x2="24" y2="63" stroke="#bbb" stroke-width="0.8"/>
  <line x1="53" y1="57" x2="76" y2="53" stroke="#bbb" stroke-width="0.8"/>
  <line x1="53" y1="58" x2="76" y2="58" stroke="#bbb" stroke-width="0.8"/>
  <line x1="53" y1="59" x2="76" y2="63" stroke="#bbb" stroke-width="0.8"/>
  <!-- paws -->
  <ellipse cx="33" cy="78" rx="6" ry="3.5" fill="#8a8090" stroke="#555" stroke-width="1.5"/>
  <ellipse cx="63" cy="78" rx="6" ry="3.5" fill="#8a8090" stroke="#555" stroke-width="1.5"/>
</g>
  </svg>
