<!-- Sky -->
  <rect x="0" y="0" width="100" height="55" fill="#b0c4de"/>
  <!-- Ocean -->
  <rect x="0" y="65" width="100" height="35" fill="#4682b4"/>
  <!-- Wave line -->
  <path d="M0,65 Q25,60 50,65 Q75,70 100,65" fill="none" stroke="#2255a0" stroke-width="2"/>
  <!-- Cloud at top -->
  <ellipse cx="50" cy="12" rx="30" ry="10" fill="#778899" stroke="#333" stroke-width="2"/>
  <ellipse cx="35" cy="14" rx="14" ry="9" fill="#778899" stroke="#333" stroke-width="2"/>
  <ellipse cx="65" cy="14" rx="14" ry="9" fill="#778899" stroke="#333" stroke-width="2"/>
  <!-- Funnel/waterspout column - wide top, narrows at water -->
  <path d="M38,20 C35,30 34,40 37,52 C39,58 43,63 45,65 C47,67 53,67 55,65 C57,63 61,58 63,52 C66,40 65,30 62,20 Z" fill="#a0b8d0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Swirl lines in funnel -->
  <path d="M42,30 Q50,35 58,30" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40,42 Q50,47 60,42" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Spray at water surface -->
  <path d="M42,65 Q50,68 58,65" fill="none" stroke="#c0d8f0" stroke-width="2" stroke-linecap="round"/>
