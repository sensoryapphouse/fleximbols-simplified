<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- cake body layer 1 (bottom) -->
  <rect x="15" y="58" width="70" height="20" rx="3" fill="#e8a060"/>
  <!-- cake layer 2 (cream) -->
  <rect x="15" y="50" width="70" height="12" rx="0" fill="#f8f0f0"/>
  <!-- cake layer 3 (top sponge) -->
  <rect x="15" y="36" width="70" height="18" rx="3" fill="#e8a060" stroke="#a06020" stroke-width="2"/>
  <!-- icing top -->
  <path d="M 15 38 Q 25 28 35 34 Q 45 26 55 33 Q 65 26 75 34 Q 82 30 85 38 L 85 38 L 15 38 Z" fill="#f8c8d0" stroke="#e090a0" stroke-width="1.5"/>
  <!-- outline -->
  <rect x="15" y="36" width="70" height="42" rx="3" fill="none" stroke="#a06020" stroke-width="2"/>
  <!-- candle -->
  <rect x="47" y="22" width="6" height="14" rx="2" fill="#f5d040" stroke="#a09020" stroke-width="1.5"/>
  <circle cx="50" cy="20" r="4" fill="#ff8030" stroke="#ff4000" stroke-width="1"/>
</svg>
