<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- box -->
  <rect x="18" y="48" width="64" height="38" rx="3" fill="#e05c8a" stroke="#b03060" stroke-width="2.5"/>
  <!-- lid -->
  <rect x="15" y="40" width="70" height="12" rx="3" fill="#c03070" stroke="#7a1040" stroke-width="2.5"/>
  <!-- vertical ribbon on box -->
  <rect x="46" y="48" width="8" height="38" fill="#f5e642" stroke="#c8b800" stroke-width="1"/>
  <!-- horizontal ribbon on lid -->
  <rect x="15" y="44" width="70" height="8" fill="#f5e642" stroke="#c8b800" stroke-width="1"/>
  <!-- bow left loop -->
  <ellipse cx="40" cy="35" rx="12" ry="7" fill="#f5e642" stroke="#c8b800" stroke-width="2" transform="rotate(-20,40,35)"/>
  <!-- bow right loop -->
  <ellipse cx="60" cy="35" rx="12" ry="7" fill="#f5e642" stroke="#c8b800" stroke-width="2" transform="rotate(20,60,35)"/>
  <!-- bow knot -->
  <circle cx="50" cy="38" r="5" fill="#f5c518" stroke="#c8940a" stroke-width="2"/>
</svg>
