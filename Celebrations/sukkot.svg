<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Sukkah (booth) structure -->
  <!-- Walls -->
  <rect x="10" y="45" width="80" height="45" fill="#d4a96a" stroke="#333" stroke-width="2.5"/>
  <!-- Wall slats -->
  <line x1="25" y1="45" x2="25" y2="90" stroke="#8B6340" stroke-width="1.5"/>
  <line x1="40" y1="45" x2="40" y2="90" stroke="#8B6340" stroke-width="1.5"/>
  <line x1="55" y1="45" x2="55" y2="90" stroke="#8B6340" stroke-width="1.5"/>
  <line x1="70" y1="45" x2="70" y2="90" stroke="#8B6340" stroke-width="1.5"/>
  <!-- Schach (thatched roof) - foliage on top -->
  <rect x="8" y="38" width="84" height="10" rx="2" fill="#27ae60" stroke="#333" stroke-width="2"/>
  <!-- Branch/leaf details on roof -->
  <line x1="15" y1="38" x2="15" y2="48" stroke="#1a7a40" stroke-width="2"/>
  <line x1="25" y1="38" x2="25" y2="48" stroke="#1a7a40" stroke-width="2"/>
  <line x1="35" y1="38" x2="35" y2="48" stroke="#1a7a40" stroke-width="2"/>
  <line x1="45" y1="38" x2="45" y2="48" stroke="#1a7a40" stroke-width="2"/>
  <line x1="55" y1="38" x2="55" y2="48" stroke="#1a7a40" stroke-width="2"/>
  <line x1="65" y1="38" x2="65" y2="48" stroke="#1a7a40" stroke-width="2"/>
  <line x1="75" y1="38" x2="75" y2="48" stroke="#1a7a40" stroke-width="2"/>
  <line x1="85" y1="38" x2="85" y2="48" stroke="#1a7a40" stroke-width="2"/>
  <!-- Stars visible through roof gap -->
  <circle cx="32" cy="22" r="2" fill="#f0d080" stroke="none"/>
  <circle cx="50" cy="18" r="2" fill="#f0d080" stroke="none"/>
  <circle cx="68" cy="24" r="2" fill="#f0d080" stroke="none"/>
  <circle cx="20" cy="30" r="1.5" fill="#f0d080" stroke="none"/>
  <circle cx="80" cy="28" r="1.5" fill="#f0d080" stroke="none"/>
  <!-- Hanging fruit/decorations inside -->
  <circle cx="30" cy="60" r="5" fill="#e74c3c" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="55" x2="30" y2="48" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="50" cy="62" r="5" fill="#f0d080" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="57" x2="50" y2="48" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="70" cy="60" r="5" fill="#e8a030" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="55" x2="70" y2="48" stroke="#5a3a1a" stroke-width="1.5"/>
  <!-- Door opening -->
  <rect x="40" y="62" width="20" height="28" rx="2" fill="#6b4c2a" opacity="0.4" stroke="#333" stroke-width="1.5"/>
</svg>
