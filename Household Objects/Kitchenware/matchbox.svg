  <!-- Matchbox tray, slightly open -->
  <!-- inner tray with matches -->
  <rect x="20" y="40" width="60" height="34" rx="3" fill="#d9b07a" stroke="#333" stroke-width="2.5"/>
  <!-- matchsticks lying in the tray -->
  <g>
    <rect x="24" y="44" width="38" height="4" rx="2" fill="#e7d2a8" stroke="#333" stroke-width="1.2"/>
    <circle cx="64" cy="46" r="3.5" fill="#c0392b" stroke="#333" stroke-width="1.2"/>
    <rect x="24" y="51" width="38" height="4" rx="2" fill="#e7d2a8" stroke="#333" stroke-width="1.2"/>
    <circle cx="64" cy="53" r="3.5" fill="#c0392b" stroke="#333" stroke-width="1.2"/>
  </g>
  <!-- outer sleeve (front face) -->
  <rect x="16" y="58" width="68" height="30" rx="4" fill="#e8a73a" stroke="#333" stroke-width="2.5"/>
  <!-- label panel on the sleeve -->
  <rect x="28" y="63" width="44" height="20" rx="3" fill="#d3373b" stroke="#333" stroke-width="2"/>
  <!-- single struck match motif on the label (a flame) -->
  <rect x="46" y="66" width="3" height="13" rx="1.5" fill="#e7d2a8" stroke="#333" stroke-width="1"/>
  <path d="M47.5 66 q-4 -4 0 -9 q4 5 0 9 z" fill="#f4a522" stroke="#333" stroke-width="1.2"/>
  <!-- striking strip -->
  <rect x="16" y="58" width="6" height="30" rx="2" fill="#7a5230" stroke="#333" stroke-width="2"/>
