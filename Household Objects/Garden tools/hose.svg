<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Coiled hose -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#4aaa4a" stroke-width="7" stroke-dasharray="44 22" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="44 22" stroke-linecap="round" opacity="0.6"/>
  <!-- Inner coil -->
  <circle cx="50" cy="50" r="16" fill="none" stroke="#4aaa4a" stroke-width="6" stroke-dasharray="25 20"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="25 20" opacity="0.6"/>
  <!-- Nozzle end -->
  <rect x="70" y="22" width="14" height="7" rx="3" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- Water drops -->
  <circle cx="87" cy="18" r="2" fill="#5aaccc"/>
  <circle cx="84" cy="14" r="1.5" fill="#5aaccc"/>
  <circle cx="90" cy="14" r="1.5" fill="#5aaccc"/>
  <!-- Label -->
</svg>
