<!-- Hedge trimmer: long blade bar + motor body + handles -->
  <!-- Motor body -->
  <rect x="55" y="28" width="30" height="20" rx="4" fill="#e05c2a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Rear handle -->
  <path d="M82,30 Q92,30 92,38 Q92,46 82,46" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Front handle -->
  <rect x="42" y="25" width="16" height="8" rx="3" fill="#555" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Blade bar (long flat bar) -->
  <rect x="5" y="40" width="60" height="8" rx="2" fill="#bbb" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Blade teeth top -->
  <polygon points="10,40 14,34 18,40" fill="#888" stroke="#333" stroke-width="1.5"/>
  <polygon points="18,40 22,34 26,40" fill="#888" stroke="#333" stroke-width="1.5"/>
  <polygon points="26,40 30,34 34,40" fill="#888" stroke="#333" stroke-width="1.5"/>
  <polygon points="34,40 38,34 42,40" fill="#888" stroke="#333" stroke-width="1.5"/>
  <polygon points="42,40 46,34 50,40" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Blade teeth bottom -->
  <polygon points="10,48 14,54 18,48" fill="#888" stroke="#333" stroke-width="1.5"/>
  <polygon points="18,48 22,54 26,48" fill="#888" stroke="#333" stroke-width="1.5"/>
  <polygon points="26,48 30,54 34,48" fill="#888" stroke="#333" stroke-width="1.5"/>
  <polygon points="34,48 38,54 42,48" fill="#888" stroke="#333" stroke-width="1.5"/>
  <polygon points="42,48 46,54 50,48" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Cord -->
  <path d="M85,38 Q93,20 88,12" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
