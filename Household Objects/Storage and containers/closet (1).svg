<!-- Wall (surrounding closet built-in) -->
  <rect x="5" y="5" width="90" height="85" fill="#E8E0D0" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Closet opening - recessed -->
  <rect x="12" y="12" width="76" height="73" fill="#D0C8B8" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Closet interior (dark) -->
  <rect x="15" y="15" width="70" height="68" fill="#BDB5A5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Sliding door left panel -->
  <rect x="15" y="15" width="35" height="68" rx="1" fill="#DDD8C8" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Sliding door right panel (overlapping) -->
  <rect x="48" y="15" width="37" height="68" rx="1" fill="#CCC8B8" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Door tracks at top -->
  <rect x="13" y="13" width="74" height="4" rx="1" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Door tracks at bottom -->
  <rect x="13" y="82" width="74" height="4" rx="1" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Door handles -->
  <rect x="47" y="45" width="4" height="10" rx="2" fill="#888" stroke="#555" stroke-width="1.5"/>
  <rect x="49" y="45" width="4" height="10" rx="2" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Clothes hanging inside (visible through gap) -->
  <line x1="25" y1="20" x2="35" y2="20" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <!-- Hanger shapes -->
  <path d="M28,20 Q30,16 32,20" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <!-- Hanging item -->
  <rect x="26" y="20" width="8" height="18" rx="2" fill="#7788AA" stroke="#555" stroke-width="1.5"/>
</svg>
