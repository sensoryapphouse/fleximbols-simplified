<!-- heater body -->
  <rect x="15" y="30" width="70" height="52" rx="5" fill="#D4C5A9" stroke="#8B7355" stroke-width="2.5"/>
  <!-- heating element grille -->
  <rect x="20" y="36" width="60" height="38" rx="3" fill="#C0A882" stroke="#8B7355" stroke-width="1.5"/>
  <!-- grille horizontal lines -->
  <line x1="23" y1="43" x2="77" y2="43" stroke="#8B7355" stroke-width="1.5"/>
  <line x1="23" y1="50" x2="77" y2="50" stroke="#8B7355" stroke-width="1.5"/>
  <line x1="23" y1="57" x2="77" y2="57" stroke="#8B7355" stroke-width="1.5"/>
  <line x1="23" y1="64" x2="77" y2="64" stroke="#8B7355" stroke-width="1.5"/>
  <!-- heat glow behind grille -->
  <rect x="22" y="38" width="56" height="34" rx="2" fill="#FF8C00" opacity="0.2"/>
  <!-- top controls -->
  <circle cx="30" cy="37" r="0" fill="none"/>
  <rect x="58" y="33" width="12" height="5" rx="2" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
  <!-- heat waves rising -->
  <path d="M32,28 Q35,22 32,16" fill="none" stroke="#FF8C00" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M50,26 Q53,20 50,14" fill="none" stroke="#FF8C00" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M68,28 Q71,22 68,16" fill="none" stroke="#FF8C00" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- feet -->
  <rect x="22" y="80" width="12" height="5" rx="2" fill="#8B7355" stroke="#4a3728" stroke-width="1.5"/>
  <rect x="66" y="80" width="12" height="5" rx="2" fill="#8B7355" stroke="#4a3728" stroke-width="1.5"/>
</svg>