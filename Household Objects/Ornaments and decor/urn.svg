<!-- Classical urn shape -->
  <!-- Base foot -->
  <rect x="34" y="76" width="32" height="6" rx="3" fill="#c8a87c" stroke="#333" stroke-width="2.5"/>
  <!-- Pedestal -->
  <rect x="40" y="70" width="20" height="8" rx="2" fill="#d4b48c" stroke="#333" stroke-width="2"/>
  <!-- Urn body -->
  <path d="M28 68 Q22 52 30 36 Q38 24 50 22 Q62 24 70 36 Q78 52 72 68 Z" fill="#d4b48c" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Urn neck -->
  <rect x="40" y="18" width="20" height="8" rx="2" fill="#c8a87c" stroke="#333" stroke-width="2.5"/>
  <!-- Lid -->
  <ellipse cx="50" cy="18" rx="14" ry="5" fill="#c8a87c" stroke="#333" stroke-width="2.5"/>
  <!-- Knob on lid -->
  <circle cx="50" cy="13" r="5" fill="#c8a87c" stroke="#333" stroke-width="2"/>
  <!-- Handles -->
  <path d="M28 40 Q18 45 20 55 Q22 62 28 60" fill="none" stroke="#c8a87c" stroke-width="6" stroke-linecap="round"/>
  <path d="M28 40 Q18 45 20 55 Q22 62 28 60" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M72 40 Q82 45 80 55 Q78 62 72 60" fill="none" stroke="#c8a87c" stroke-width="6" stroke-linecap="round"/>
  <path d="M72 40 Q82 45 80 55 Q78 62 72 60" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Decorative band -->
  <line x1="32" y1="50" x2="68" y2="50" stroke="#a87840" stroke-width="2" opacity="0.7"/>
</svg>
