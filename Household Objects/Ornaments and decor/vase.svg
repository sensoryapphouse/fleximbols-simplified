  <line x1="45" y1="12" x2="38" y2="2" stroke="#5D8A3C" stroke-width="2"/>
  <line x1="50" y1="12" x2="50" y2="0" stroke="#5D8A3C" stroke-width="2"/>
  <line x1="55" y1="12" x2="62" y2="2" stroke="#5D8A3C" stroke-width="2"/>
  <circle cx="38" cy="2" r="4" fill="#E74C3C"/>
  <circle cx="50" cy="0" r="4" fill="#FFD700"/>
  <circle cx="62" cy="2" r="4" fill="#C8A8E9"/>
</svg>