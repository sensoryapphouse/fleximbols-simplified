  <!-- Modern bleach bottle - jug shape with handle -->
  <!-- Handle -->
  <path d="M62 38 Q80 38 80 55 Q80 72 62 72" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <path d="M62 38 Q78 38 78 55 Q78 70 62 70" fill="none" stroke="#e8e8e8" stroke-width="4"/>
  <!-- Bottle body -->
  <path d="M25 40 L25 82 Q25 90 50 90 Q62 90 62 82 L62 40 Z" fill="#f0f8ff" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Shoulder -->
  <path d="M33 40 L33 28 Q33 22 43 20 L55 20 Q62 22 62 28 L62 40 Z" fill="#e0f0f8" stroke="#333" stroke-width="2.5"/>
  <!-- Cap -->
  <rect x="36" y="12" width="22" height="12" rx="4" ry="4" fill="#f4c020" stroke="#333" stroke-width="2.5"/>
  <!-- Warning triangle / hazard on label -->
  <polygon points="50,52 40,70 60,70" fill="#f4e060" stroke="#e07800" stroke-width="2"/>
  <text font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" x="50" y="67" text-anchor="middle" font-size="12" fill="#e07800" font-weight="bold">!</text>
