<!-- Surface being polished -->
  <rect x="10" y="58" width="80" height="18" rx="4" fill="#d4a876" stroke="#7d5a2a" stroke-width="2"/>
  <!-- Shine / reflection on surface -->
  <ellipse cx="50" cy="67" rx="20" ry="5" fill="#f9e79f" opacity="0.5"/>
  <!-- Cloth/rag doing the polishing -->
  <rect x="34" y="42" width="32" height="18" rx="6" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2"/>
  <!-- Cloth texture -->
  <path d="M36 48 Q50 46 66 48" fill="none" stroke="#bdc3c7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M36 53 Q50 51 66 53" fill="none" stroke="#bdc3c7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hand holding cloth -->
  <ellipse cx="50" cy="36" rx="14" ry="8" fill="#f5cba7" stroke="#555" stroke-width="2"/>
  <!-- Sparkle lines showing shine -->
  <line x1="22" y1="50" x2="18" y2="44" stroke="#f9e79f" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="16" y2="52" stroke="#f9e79f" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="22" y2="43" stroke="#f9e79f" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="80" y2="44" stroke="#f9e79f" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="82" y2="52" stroke="#f9e79f" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="76" y2="43" stroke="#f9e79f" stroke-width="2" stroke-linecap="round"/>
</svg>
