<!-- Mattress body - thick rectangular pad -->
  <rect x="10" y="32" width="80" height="38" rx="5" fill="#EEE8D8" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top face -->
  <rect x="10" y="32" width="80" height="8" rx="4" fill="#F5F0E8" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Side/depth face -->
  <rect x="10" y="62" width="80" height="8" rx="3" fill="#D8D2C0" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Quilting buttons/pattern -->
  <circle cx="28" cy="48" r="3" fill="#CCC0A8" stroke="#888" stroke-width="1.5"/>
  <circle cx="50" cy="48" r="3" fill="#CCC0A8" stroke="#888" stroke-width="1.5"/>
  <circle cx="72" cy="48" r="3" fill="#CCC0A8" stroke="#888" stroke-width="1.5"/>
  <!-- Quilting lines connecting buttons -->
  <line x1="10" y1="48" x2="25" y2="48" stroke="#C8BCAA" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="31" y1="48" x2="47" y2="48" stroke="#C8BCAA" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="53" y1="48" x2="69" y2="48" stroke="#C8BCAA" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="48" x2="90" y2="48" stroke="#C8BCAA" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tufting vertical lines -->
  <line x1="28" y1="38" x2="28" y2="62" stroke="#C8BCAA" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="38" x2="50" y2="62" stroke="#C8BCAA" stroke-width="1" stroke-linecap="round"/>
  <line x1="72" y1="38" x2="72" y2="62" stroke="#C8BCAA" stroke-width="1" stroke-linecap="round"/>
  <!-- Border piping -->
  <rect x="10" y="32" width="80" height="38" rx="5" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
  
</svg>
