<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Dresser body (chest of drawers) -->
  <rect x="12" y="12" width="76" height="74" rx="2" fill="#C8A87A" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top surface -->
  <rect x="10" y="10" width="80" height="6" rx="2" fill="#B89868" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Mirror on top -->
  <rect x="28" y="2" width="44" height="10" rx="2" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <rect x="25" y="0" width="50" height="4" rx="1" fill="#B89868" stroke="#555" stroke-width="1.5"/>
  <!-- Drawer 1 (top) -->
  <rect x="15" y="18" width="70" height="15" rx="2" fill="#DDBB88" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="50" cy="26" r="3" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Drawer 2 -->
  <rect x="15" y="35" width="70" height="15" rx="2" fill="#DDBB88" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="50" cy="43" r="3" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Drawer 3 -->
  <rect x="15" y="52" width="70" height="15" rx="2" fill="#DDBB88" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="50" cy="60" r="3" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Drawer 4 (bottom) -->
  <rect x="15" y="69" width="70" height="14" rx="2" fill="#DDBB88" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="50" cy="76" r="3" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Side legs/feet -->
  <rect x="14" y="84" width="10" height="5" rx="2" fill="#AA8858" stroke="#555" stroke-width="1.5"/>
  <rect x="76" y="84" width="10" height="5" rx="2" fill="#AA8858" stroke="#555" stroke-width="1.5"/>
</svg>
