<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Wardrobe body -->
  <rect x="8" y="10" width="84" height="78" rx="2" fill="#C8A87A" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top cornice -->
  <rect x="5" y="8" width="90" height="7" rx="2" fill="#B89868" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Base plinth -->
  <rect x="5" y="83" width="90" height="6" rx="2" fill="#B89868" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left door -->
  <rect x="10" y="12" width="38" height="70" rx="2" fill="#DDBB88" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left door panels -->
  <rect x="13" y="15" width="32" height="28" rx="2" fill="#CCA877" stroke="#888" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="13" y="47" width="32" height="32" rx="2" fill="#CCA877" stroke="#888" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left door handle -->
  <rect x="45" y="43" width="4" height="8" rx="2" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Right door -->
  <rect x="52" y="12" width="38" height="70" rx="2" fill="#DDBB88" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right door panels -->
  <rect x="55" y="15" width="32" height="28" rx="2" fill="#CCA877" stroke="#888" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="55" y="47" width="32" height="32" rx="2" fill="#CCA877" stroke="#888" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right door handle -->
  <rect x="51" y="43" width="4" height="8" rx="2" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Center split line -->
  <line x1="50" y1="12" x2="50" y2="82" stroke="#888" stroke-width="2" stroke-linecap="round"/>
</svg>
