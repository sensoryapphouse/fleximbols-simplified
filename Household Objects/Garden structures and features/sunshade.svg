<!-- Shade sail triangle -->
<polygon points="10,22 90,10 90,68" fill="#88aacc" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<!-- Fabric texture lines -->
<line x1="10" y1="22" x2="90" y2="40" stroke="#6688aa" stroke-width="1"/>
<line x1="10" y1="22" x2="90" y2="55" stroke="#6688aa" stroke-width="1"/>
<line x1="50" y1="16" x2="90" y2="68" stroke="#6688aa" stroke-width="1"/>
<!-- Corner connection rings -->
<circle cx="10" cy="22" r="4" fill="#888" stroke="#333" stroke-width="2"/>
<circle cx="90" cy="10" r="4" fill="#888" stroke="#333" stroke-width="2"/>
<circle cx="90" cy="68" r="4" fill="#888" stroke="#333" stroke-width="2"/>
<!-- Attachment lines to posts -->
<line x1="6" y1="22" x2="6" y2="82" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
<line x1="94" y1="10" x2="94" y2="82" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
<!-- Ground anchors -->
<line x1="6" y1="80" x2="14" y2="84" stroke="#555" stroke-width="2" stroke-linecap="round"/>
<line x1="94" y1="80" x2="86" y2="84" stroke="#555" stroke-width="2" stroke-linecap="round"/>
</svg>
