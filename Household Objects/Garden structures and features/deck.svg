<line x1="70" y1="40" x2="70" y2="55" stroke="#aaa" stroke-width="1.5"/>
<line x1="80" y1="40" x2="80" y2="55" stroke="#aaa" stroke-width="1.5"/>
<!-- Steps -->
<rect x="36" y="72" width="28" height="4" fill="#b8986a" stroke="#333" stroke-width="1.5"/>
<rect x="38" y="76" width="24" height="3" fill="#c8a87a" stroke="#333" stroke-width="1"/>
