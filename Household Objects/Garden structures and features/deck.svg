<rect x="10" y="38" width="4" height="18" fill="#888" stroke="#333" stroke-width="1.5"/>
<rect x="48" y="38" width="4" height="18" fill="#888" stroke="#333" stroke-width="1.5"/>
<rect x="86" y="38" width="4" height="18" fill="#888" stroke="#333" stroke-width="1.5"/>
<!-- Railing top rail -->
<rect x="8" y="35" width="84" height="5" rx="2" fill="#888" stroke="#333" stroke-width="2"/>
