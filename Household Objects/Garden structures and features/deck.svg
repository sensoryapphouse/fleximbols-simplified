<!-- Deck platform in perspective -->
<polygon points="10,55 90,55 80,75 20,75" fill="#c8a87a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<!-- Deck boards horizontal lines -->
<line x1="12" y1="60" x2="88" y2="60" stroke="#b0906a" stroke-width="1.5"/>
<line x1="13" y1="65" x2="87" y2="65" stroke="#b0906a" stroke-width="1.5"/>
<line x1="15" y1="70" x2="85" y2="70" stroke="#b0906a" stroke-width="1.5"/>
