<!-- Corridor perspective - vanishing point -->
  <!-- Floor converging to back -->
  <polygon points="8,88 92,88 72,52 28,52" fill="#d4c4a0" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
