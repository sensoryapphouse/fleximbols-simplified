  <line x1="50" y1="22" x2="50" y2="52" stroke="#ffee99" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="22" x2="70" y2="52" stroke="#ffee99" stroke-width="1" opacity="0.4"/>
  <!-- Coat hook on left wall -->
  <line x1="12" y1="48" x2="18" y2="45" stroke="#8a6030" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18" cy="44" r="2" fill="#8a6030" stroke="#5a3a1a" stroke-width="1"/>
