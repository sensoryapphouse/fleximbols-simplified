  <polygon points="8,10 92,10 72,30 28,30" fill="#f0e8d8" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <!-- Back wall with door -->
  <rect x="28" y="30" width="44" height="22" fill="#e4dccc" stroke="#8a6030" stroke-width="2"/>
  <!-- Back door -->
  <rect x="38" y="34" width="24" height="18" fill="#8a6030" stroke="#5a3a1a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Door handle -->
  <circle cx="58" cy="44" r="2" fill="#cc9900"/>
  <!-- Light on ceiling -->
  <ellipse cx="50" cy="18" rx="6" ry="4" fill="#ffee99" stroke="#cc9900" stroke-width="1.5"/>
