<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- back wall -->
  <rect x="56" y="56" width="400" height="224" fill="#d8d0c4" stroke="#000000" stroke-width="5"/>
  <!-- floor surface with perspective -->
  <path d="M 56,280 L 456,280 L 508,464 L 4,464 Z" fill="#c9a060" stroke="#000000" stroke-width="5"/>
  <!-- floor board lines (longitudinal) -->
  <line x1="256" y1="280" x2="256" y2="464" stroke="#a07840" stroke-width="3"/>
  <line x1="156" y1="280" x2="130" y2="464" stroke="#a07840" stroke-width="3"/>
  <line x1="356" y1="280" x2="382" y2="464" stroke="#a07840" stroke-width="3"/>
  <line x1="56"  y1="280" x2="4"   y2="464" stroke="#a07840" stroke-width="3"/>
  <line x1="456" y1="280" x2="508" y2="464" stroke="#a07840" stroke-width="3"/>
  <!-- floor board lines (lateral) -->
  <line x1="56"  y1="340" x2="456" y2="340" stroke="#a07840" stroke-width="2"/>
  <line x1="30"  y1="406" x2="482" y2="406" stroke="#a07840" stroke-width="2"/>
  <!-- arrow pointing to floor -->
  <line x1="256" y1="130" x2="256" y2="262" stroke="#27ae60" stroke-width="10" stroke-linecap="round"/>
  <polygon points="256,280 236,254 276,254" fill="#27ae60" stroke="#000000" stroke-width="3"/>
</svg>
