  <!-- Window bars -->
  <rect x="22" y="53" width="18" height="12" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <line x1="31" y1="53" x2="31" y2="65" stroke="#555" stroke-width="1.5"/>
  <line x1="22" y1="59" x2="40" y2="59" stroke="#555" stroke-width="1.5"/>
