  <!-- Modern ironing board - padded board on folding legs -->
  <!-- Board surface - tapered at one end -->
  <path d="M5,35 Q5,28 15,28 L88,28 Q95,28 95,35 L95,42 Q95,48 88,48 L15,48 Q5,48 5,42 Z" fill="#E8D4C0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Padding highlight -->
  <path d="M8,31 Q8,26 15,26 L85,26 Q92,26 92,31" fill="none" stroke="#D4B8A0" stroke-width="1.5"/>
  <!-- Board pointed nose at left -->
  <path d="M5,38 Q2,38 5,35" fill="#E8D4C0" stroke="#333" stroke-width="2"/>
  <!-- Iron on board -->
  <path d="M55,28 L55,42 Q62,42 68,38 Q72,34 68,30 L62,28 Z" fill="#C8C8D0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Iron handle -->
  <path d="M58,28 Q60,22 65,22 Q68,22 68,28" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Steam holes on iron -->
  <circle cx="58" cy="35" r="1.5" fill="#999"/>
  <circle cx="62" cy="38" r="1.5" fill="#999"/>
  <circle cx="63" cy="32" r="1.5" fill="#999"/>
  <!-- Folding legs - X crossed -->
  <line x1="25" y1="48" x2="40" y2="90" stroke="#8B6048" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="55" y1="48" x2="40" y2="90" stroke="#8B6048" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="70" y1="48" x2="82" y2="90" stroke="#8B6048" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="88" y1="48" x2="75" y2="90" stroke="#8B6048" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pivot pins -->
  <circle cx="38" cy="70" r="3" fill="#C8C8C8" stroke="#333" stroke-width="1.5"/>
  <circle cx="79" cy="70" r="3" fill="#C8C8C8" stroke="#333" stroke-width="1.5"/>
  <!-- Steam from iron -->
  <path d="M60,24 Q58,18 60,12" fill="none" stroke="#CCC" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M65,22 Q63,16 65,10" fill="none" stroke="#CCC" stroke-width="1.5" stroke-linecap="round"/>
</svg>
