<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- clock body -->
  <circle cx="50" cy="50" r="38" fill="#F5F0E8" stroke="#4a3728" stroke-width="3"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#8B7355" stroke-width="1.5"/>
  <!-- hour markers -->
  <line x1="50" y1="16" x2="50" y2="20" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="50" y2="84" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="50" x2="20" y2="50" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="84" y2="50" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- minute markers -->
  <line x1="67" y1="20" x2="65" y2="23" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="33" x2="77" y2="35" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="67" x2="77" y2="65" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="67" y1="80" x2="65" y2="77" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="33" y1="80" x2="35" y2="77" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="67" x2="23" y2="65" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="33" x2="23" y2="35" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="33" y1="20" x2="35" y2="23" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <!-- hands -->
  <line x1="50" y1="50" x2="50" y2="25" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="67" y2="55" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- center dot -->
  <circle cx="50" cy="50" r="3" fill="#333"/>
</svg>