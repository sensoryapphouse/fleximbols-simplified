  <!-- Spanner/wrench - diagonal, double-ended -->
  <g transform="rotate(-35 50 50)">
    <!-- Handle -->
    <rect x="42" y="28" width="16" height="44" fill="#95A5A6" stroke="#000" stroke-width="2.5"/>
    <!-- Top open jaw -->
    <path d="M34 28 L66 28 L66 18 L58 18 L58 22 L42 22 L42 18 L34 18 Z" fill="#95A5A6" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Bottom open jaw (rotated 90) -->
    <path d="M34 72 L66 72 L66 82 L58 82 L58 78 L42 78 L42 82 L34 82 Z" fill="#95A5A6" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Highlight stripe -->
    <line x1="48" y1="32" x2="48" y2="68" stroke="#7F8C8D" stroke-width="2"/>
  </g>
</svg>
