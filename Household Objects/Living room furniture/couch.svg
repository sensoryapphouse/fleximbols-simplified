  <!-- Three seat cushions -->
  <rect x="12" y="51" width="24" height="20" rx="4" fill="#CCA877" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <rect x="39" y="51" width="22" height="20" rx="4" fill="#CCA877" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <rect x="64" y="51" width="20" height="20" rx="4" fill="#CCA877" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Back -->
  <rect x="10" y="32" width="80" height="22" rx="6" fill="#AA8855" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
