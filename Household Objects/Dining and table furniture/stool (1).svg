<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Stool seat - round top -->
  <ellipse cx="50" cy="35" rx="32" ry="8" fill="#CC9966" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="18" y="30" width="64" height="8" fill="#CC9966" stroke="none"/>
  <ellipse cx="50" cy="30" rx="32" ry="8" fill="#DDAA77" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Seat thickness -->
  <ellipse cx="50" cy="35" rx="32" ry="8" fill="#CC9966" stroke="#555" stroke-width="2"/>
  <!-- Three legs -->
  <line x1="32" y1="38" x2="22" y2="82" stroke="#8B7355" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="68" y1="38" x2="78" y2="82" stroke="#8B7355" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="50" y2="82" stroke="#8B7355" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Foot rest ring -->
  <path d="M26,64 Q50,58 74,64" fill="none" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Foot rest left -->
  <line x1="26" y1="64" x2="50" y2="63" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Foot rest right -->
  <line x1="50" y1="63" x2="74" y2="64" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Floor line -->
  <line x1="10" y1="82" x2="90" y2="82" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,4"/>
</svg>
