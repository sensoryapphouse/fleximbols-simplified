<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- rug base -->
  <rect x="10" y="20" width="80" height="58" rx="4" fill="#E8A87C" stroke="#8B4513" stroke-width="2.5"/>
  <!-- border pattern -->
  <rect x="15" y="25" width="70" height="48" rx="2" fill="none" stroke="#8B4513" stroke-width="2"/>
  <!-- inner pattern - diamonds -->
  <rect x="30" y="35" width="40" height="28" rx="1" fill="#C0392B" stroke="#8B4513" stroke-width="1.5" transform="rotate(45 50 49)"/>
  <rect x="38" y="43" width="24" height="14" rx="1" fill="#E8A87C" stroke="#8B4513" stroke-width="1" transform="rotate(45 50 50)"/>
  <!-- corner decorations -->
  <circle cx="22" cy="32" r="3" fill="#8B4513"/>
  <circle cx="78" cy="32" r="3" fill="#8B4513"/>
  <circle cx="22" cy="66" r="3" fill="#8B4513"/>
  <circle cx="78" cy="66" r="3" fill="#8B4513"/>
  <!-- fringe -->
  <line x1="14" y1="20" x2="14" y2="10" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="22" y1="20" x2="22" y2="10" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="30" y1="20" x2="30" y2="10" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="38" y1="20" x2="38" y2="10" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="62" y1="20" x2="62" y2="10" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="70" y1="20" x2="70" y2="10" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="78" y1="20" x2="78" y2="10" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="86" y1="20" x2="86" y2="10" stroke="#8B4513" stroke-width="1.5"/>
</svg>