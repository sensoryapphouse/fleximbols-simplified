<!-- Ground -->
  <rect x="5" y="75" width="90" height="6" fill="#c8c8c8" stroke="#888" stroke-width="1.5"/>
  <!-- Building body -->
  <rect x="15" y="45" width="55" height="30" fill="#c8b898" stroke="#7a6040" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Chimney -->
  <rect x="55" y="18" width="16" height="30" fill="#aaa" stroke="#666" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Smoke from chimney -->
  <ellipse cx="61" cy="14" rx="5" ry="4" fill="#888" stroke="#555" stroke-width="1"/>
  <ellipse cx="64" cy="9" rx="5" ry="4" fill="#777" stroke="#444" stroke-width="1"/>
  <ellipse cx="60" cy="5" rx="4" ry="3" fill="#666" stroke="#333" stroke-width="1"/>
  <!-- Fire in furnace door -->
  <rect x="25" y="52" width="20" height="18" rx="2" fill="#333" stroke="#555" stroke-width="1.5"/>
  <!-- Flames -->
  <path d="M27,70 Q30,58 32,62 Q34,55 36,60 Q38,53 40,62 Q42,57 43,70" fill="#e8a020" stroke="#c06010" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Red flame tips -->
  <path d="M30,70 Q32,62 33,65 Q35,59 37,65 Q39,61 41,70" fill="#e04040" stroke="none" opacity="0.8"/>
  <!-- Exhaust control panel -->
  <rect x="50" y="55" width="15" height="15" fill="#e8e8e8" stroke="#888" stroke-width="1.5"/>
  <circle cx="55" cy="60" r="2" fill="#60bf40"/>
  <circle cx="60" cy="60" r="2" fill="#f0c040"/>
  <circle cx="58" cy="66" r="2" fill="#c84040"/>
</svg>
