  <rect x="15" y="15" width="70" height="70" rx="5" ry="5" fill="none" stroke="#c89aaa" stroke-width="4"/>
  <rect x="15" y="15" width="70" height="70" rx="5" ry="5" fill="none" stroke="#333" stroke-width="2.5"/>
