  <!-- Bath towel - hanging/folded large towel -->
  <!-- Towel bar -->
  <rect x="10" y="15" width="80" height="7" rx="3" ry="3" fill="#c0c0c0" stroke="#333" stroke-width="2"/>
  <!-- Wall mounts -->
  <rect x="10" y="10" width="10" height="16" rx="2" fill="#aaa" stroke="#333" stroke-width="1.5"/>
  <rect x="80" y="10" width="10" height="16" rx="2" fill="#aaa" stroke="#333" stroke-width="1.5"/>
  <!-- Towel body hanging down -->
  <rect x="22" y="22" width="56" height="68" rx="3" ry="3" fill="#5599cc" stroke="#333" stroke-width="2.5"/>
  <!-- Towel border stripe at top -->
  <rect x="22" y="22" width="56" height="8" rx="3" ry="3" fill="#4488bb" stroke="#333" stroke-width="1.5"/>
  <!-- Bottom border stripe -->
  <rect x="22" y="82" width="56" height="8" rx="3" ry="3" fill="#4488bb" stroke="#333" stroke-width="1.5"/>
  <!-- Towel pile texture lines horizontal -->
  <line x1="25" y1="36" x2="75" y2="36" stroke="#4488bb" stroke-width="1.5"/>
  <line x1="25" y1="44" x2="75" y2="44" stroke="#4488bb" stroke-width="1.5"/>
  <line x1="25" y1="52" x2="75" y2="52" stroke="#4488bb" stroke-width="1.5"/>
  <line x1="25" y1="60" x2="75" y2="60" stroke="#4488bb" stroke-width="1.5"/>
  <line x1="25" y1="68" x2="75" y2="68" stroke="#4488bb" stroke-width="1.5"/>
  <line x1="25" y1="76" x2="75" y2="76" stroke="#4488bb" stroke-width="1.5"/>
  <!-- Loop at top where it hangs over bar -->
  <rect x="30" y="16" width="40" height="10" rx="2" fill="#4d90c2" stroke="#333" stroke-width="1.5"/>
</svg>
