<!-- baby bottle - wide-neck modern style -->
  <!-- nipple/teat -->
  <ellipse cx="50" cy="10" rx="6" ry="7" fill="#f5d4b0" stroke="#333" stroke-width="2"/>
  <ellipse cx="50" cy="16" rx="9" ry="5" fill="#e8c090" stroke="#333" stroke-width="2"/>
  <!-- collar ring -->
  <rect x="38" y="20" width="24" height="7" rx="3" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- bottle neck -->
  <rect x="40" y="26" width="20" height="10" rx="3" fill="#ddf0ff" stroke="#333" stroke-width="2"/>
  <!-- bottle body wide -->
  <path d="M30 36 Q28 40 28 55 Q28 75 50 75 Q72 75 72 55 Q72 40 70 36 Z" fill="#cce8ff" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- wide shoulder -->
  <path d="M40 36 Q50 34 60 36 L70 36 Q62 32 50 32 Q38 32 30 36 Z" fill="#ddf0ff" stroke="#333" stroke-width="2"/>
  <!-- milk level -->
  <path d="M30 58 Q50 55 70 58 L70 75 Q50 78 30 75 Z" fill="#fffce8" stroke="none"/>
  <line x1="30" y1="58" x2="70" y2="58" stroke="#eeddaa" stroke-width="1.5"/>
  <!-- oz measurements on side -->
  <line x1="30" y1="45" x2="34" y2="45" stroke="#aac" stroke-width="1.5"/>
  <text x="36" y="48" font-size="6" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#888">4oz</text>
  <line x1="30" y1="58" x2="34" y2="58" stroke="#aac" stroke-width="1.5"/>
  <text x="36" y="61" font-size="6" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#888">2oz</text>
  <!-- grip texture rings -->
  <path d="M28 50 Q50 47 72 50" fill="none" stroke="#bbddff" stroke-width="2"/>
</svg>
