<!-- Cold sky -->
  <rect x="0" y="0" width="100" height="50" fill="#d8e8f4"/>
  <!-- Ocean water -->
  <rect x="0" y="50" width="100" height="40" fill="#2a7ab5"/>
  <!-- Water line -->
  <line x1="0" y1="50" x2="100" y2="50" stroke="#1a5a8a" stroke-width="2"/>
  <!-- Above-water tip -->
  <polygon points="50,10 32,50 68,50" fill="#d8eef8" stroke="#7aaac8" stroke-width="2.5"/>
  <!-- Below-water mass (larger) -->
  <polygon points="32,50 18,80 82,80 68,50" fill="#90c0e0" stroke="#5a8aaa" stroke-width="2" opacity="0.85"/>
  <!-- Ice cracks above -->
  <path d="M44 30 Q46 38 48 44" stroke="#7aaac8" stroke-width="1.5" fill="none"/>
  <path d="M55 32 Q54 40 52 46" stroke="#7aaac8" stroke-width="1.5" fill="none"/>
  <!-- Underwater cracks -->
  <path d="M40 58 Q42 65 40 72" stroke="#5a8aaa" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M60 60 Q58 68 60 74" stroke="#5a8aaa" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Label -->
</svg>
