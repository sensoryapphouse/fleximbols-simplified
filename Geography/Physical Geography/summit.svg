  <!-- Sky -->
  <rect x="0" y="0" width="100" height="100" fill="#5a7898"/>
  <!-- Stars -->
  <circle cx="15" cy="8" r="1" fill="#fff"/>
  <circle cx="40" cy="5" r="1.2" fill="#fff"/>
  <circle cx="72" cy="10" r="1" fill="#fff"/>
  <circle cx="90" cy="6" r="1.2" fill="#fff"/>
  <!-- Mountain -->
  <polygon points="50,8 95,85 5,85" fill="#8090a0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left face (darker) -->
  <polygon points="50,8 5,85 50,85" fill="#6a7a88" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Snow cap -->
  <polygon points="50,8 65,32 35,32" fill="#e8f0f8" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Summit marker / flag -->
  <line x1="50" y1="8" x2="50" y2="0" stroke="#e53935" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="50,0 60,4 50,8" fill="#e53935" stroke="#c62828" stroke-width="1"/>
  <!-- Ground -->
  <rect x="0" y="85" width="100" height="15" fill="#6a7860"/>
  <!-- Clouds below summit -->
