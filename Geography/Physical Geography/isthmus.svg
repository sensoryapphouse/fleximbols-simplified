<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Isthmus: narrow strip of land connecting two larger land areas - top down -->
  <!-- Sea background -->
  <rect x="0" y="0" width="100" height="100" fill="#4488cc" stroke="none"/>
  <!-- Left landmass -->
  <ellipse cx="18" cy="50" rx="22" ry="38" fill="#88aa55" stroke="#222" stroke-width="2.5"/>
  <!-- Right landmass -->
  <ellipse cx="82" cy="50" rx="22" ry="38" fill="#88aa55" stroke="#222" stroke-width="2.5"/>
  <!-- Narrow isthmus connecting them -->
  <rect x="38" y="40" width="24" height="20" fill="#88aa55" stroke="#222" stroke-width="2"/>
  <!-- Smooth the connection -->
  <rect x="36" y="42" width="28" height="16" fill="#88aa55" stroke="none"/>
  <!-- Canal/road hint through isthmus -->
  <line x1="40" y1="50" x2="60" y2="50" stroke="#336699" stroke-width="3" stroke-linecap="round"/>
  <!-- Hills on landmasses -->
  <ellipse cx="15" cy="42" rx="8" ry="5" fill="#669944" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="85" cy="42" rx="8" ry="5" fill="#669944" stroke="#333" stroke-width="1.5"/>
  <!-- Water ripples on sea sides -->
  <path d="M5,20 Q12,18 18,22" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M5,80 Q12,82 18,78" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M82,22 Q88,18 95,20" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M82,78 Q88,82 95,80" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
</svg>
