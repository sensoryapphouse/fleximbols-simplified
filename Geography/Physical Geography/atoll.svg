<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Atoll: ring-shaped coral island with lagoon - top down -->
  <!-- Open sea (outer) -->
  <rect x="0" y="0" width="100" height="100" fill="#336699" stroke="none"/>
  <!-- Coral ring island -->
  <circle cx="50" cy="50" r="42" fill="#88aa55" stroke="#222" stroke-width="2.5"/>
  <!-- Lagoon water inside (lighter blue) -->
  <circle cx="50" cy="50" r="30" fill="#55aadd" stroke="#336699" stroke-width="2"/>
  <!-- Inner lagoon ripples -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#6699cc" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="8" fill="none" stroke="#6699cc" stroke-width="1.5"/>
  <!-- Sandy beaches on ring -->
  <path d="M50,8 Q60,12 65,18" fill="none" stroke="#ddcc88" stroke-width="4" stroke-linecap="round"/>
  <path d="M50,92 Q40,88 35,82" fill="none" stroke="#ddcc88" stroke-width="4" stroke-linecap="round"/>
  <!-- Gap/channel in ring (typical of atolls) -->
  <path d="M76,36 Q82,43 82,50 Q82,57 76,64" fill="#336699" stroke="#336699" stroke-width="6" stroke-linecap="round"/>
  <!-- Palms on atoll -->
  <line x1="30" y1="32" x2="30" y2="22" stroke="#553322" stroke-width="2" stroke-linecap="round"/>
  <path d="M25,22 Q30,17 35,22" fill="#669944" stroke="#333" stroke-width="1.5"/>
  <line x1="62" y1="28" x2="62" y2="18" stroke="#553322" stroke-width="2" stroke-linecap="round"/>
  <path d="M57,18 Q62,13 67,18" fill="#669944" stroke="#333" stroke-width="1.5"/>
</svg>
