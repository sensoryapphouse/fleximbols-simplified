  <!-- Strait: narrow water passage between two landmasses - top down -->
  <!-- Water background -->
  <rect x="0" y="0" width="100" height="100" fill="#4488cc" stroke="none"/>
  <!-- Upper landmass -->
  <path d="M0,0 L100,0 L100,32 Q75,38 50,35 Q25,32 0,38 Z" fill="#88aa55" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lower landmass -->
  <path d="M0,100 L100,100 L100,68 Q75,62 50,65 Q25,68 0,62 Z" fill="#88aa55" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Strait water channel between -->
  <!-- Water ripples showing current/flow direction -->
  <path d="M5,50 Q25,47 50,50 Q75,53 95,50" fill="none" stroke="#6699cc" stroke-width="2" stroke-linecap="round"/>
  <path d="M5,44 Q25,41 50,44 Q75,47 95,44" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M5,56 Q25,53 50,56 Q75,59 95,56" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Current direction arrow -->
  <polygon points="85,50 75,46 75,54" fill="#336699" stroke="#225588" stroke-width="1"/>
  <!-- Hills on land -->
  <ellipse cx="25" cy="18" rx="12" ry="6" fill="#779944" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="75" cy="18" rx="10" ry="5" fill="#779944" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="25" cy="82" rx="12" ry="6" fill="#779944" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="75" cy="82" rx="10" ry="5" fill="#779944" stroke="#333" stroke-width="1.5"/>
</svg>
