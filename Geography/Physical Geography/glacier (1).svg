<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Modern glacier: retreating glacier in mountain valley -->
  <!-- Sky -->
  <rect x="0" y="0" width="100" height="40" fill="#aaddee" stroke="none"/>
  <!-- Mountain peaks -->
  <polygon points="0,40 15,5 30,40" fill="#888899" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="20,40 40,8 60,40" fill="#777788" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="50,40 70,10 90,40" fill="#888899" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="75,40 90,12 100,40" fill="#777788" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <!-- Snow caps on peaks -->
  <polygon points="15,5 10,20 20,20" fill="#eeeeff" stroke="#aaa" stroke-width="1"/>
  <polygon points="40,8 33,22 47,22" fill="#eeeeff" stroke="#aaa" stroke-width="1"/>
  <polygon points="70,10 63,24 77,24" fill="#eeeeff" stroke="#aaa" stroke-width="1"/>
  <!-- Glacier body (ice) flowing down valley -->
  <path d="M30,38 Q35,50 38,65 Q40,75 42,85" fill="none" stroke="#bbddff" stroke-width="14" stroke-linecap="round"/>
  <path d="M30,38 Q35,50 38,65 Q40,75 42,85" fill="none" stroke="#ddeeff" stroke-width="10" stroke-linecap="round"/>
  <!-- Crevasse lines on glacier -->
  <path d="M32,48 Q36,50 34,55" fill="none" stroke="#99bbdd" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M34,60 Q38,62 36,67" fill="none" stroke="#99bbdd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glacier terminus / melt lake -->
  <ellipse cx="43" cy="87" rx="12" ry="6" fill="#55aacc" stroke="#336699" stroke-width="2"/>
  <!-- Lateral moraine (dark rock margins) -->
  <path d="M25,50 Q27,65 30,80" fill="none" stroke="#776655" stroke-width="3" stroke-linecap="round"/>
  <path d="M45,50 Q47,65 55,80" fill="none" stroke="#776655" stroke-width="3" stroke-linecap="round"/>
  <!-- Ground at bottom -->
  <rect x="0" y="88" width="100" height="12" fill="#776655" stroke="#333" stroke-width="1.5"/>
</svg>
