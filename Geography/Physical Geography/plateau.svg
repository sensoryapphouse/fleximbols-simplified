  <!-- Sky -->
  <rect x="0" y="0" width="100" height="40" fill="#aaccee" stroke="none"/>
  <!-- Lowland ground -->
  <rect x="0" y="78" width="100" height="22" fill="#c8a870" stroke="#333" stroke-width="2"/>
  <!-- Plateau - very wide flat elevated area with gentle cliffs -->
  <!-- Top surface (wide) -->
  <rect x="5" y="35" width="90" height="15" fill="#88aa66" stroke="#222" stroke-width="2.5"/>
  <!-- Left cliff -->
  <polygon points="5,50 5,78 20,78 20,50" fill="#b07840" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <line x1="5" y1="60" x2="20" y2="60" stroke="#996633" stroke-width="1.5"/>
  <line x1="5" y1="68" x2="20" y2="68" stroke="#aa7744" stroke-width="1.5"/>
  <!-- Right cliff -->
  <polygon points="95,50 95,78 80,78 80,50" fill="#b07840" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <line x1="95" y1="60" x2="80" y2="60" stroke="#996633" stroke-width="1.5"/>
  <line x1="95" y1="68" x2="80" y2="68" stroke="#aa7744" stroke-width="1.5"/>
  <!-- Bottom flat area -->
  <rect x="20" y="78" width="60" height="5" fill="#bb9966" stroke="#333" stroke-width="1.5"/>
  <!-- Vegetation on top -->
  <rect x="15" y="30" width="5" height="8" fill="#669944" stroke="#333" stroke-width="1"/>
  <rect x="45" y="28" width="5" height="9" fill="#669944" stroke="#333" stroke-width="1"/>
  <rect x="75" y="30" width="5" height="8" fill="#669944" stroke="#333" stroke-width="1"/>
</svg>
