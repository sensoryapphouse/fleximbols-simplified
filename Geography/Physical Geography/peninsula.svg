  <!-- Peninsula: finger of land jutting into sea - top down -->
  <!-- Sea background -->
  <rect x="0" y="0" width="100" height="100" fill="#4488cc" stroke="none"/>
  <!-- Mainland at top -->
  <rect x="0" y="0" width="100" height="22" fill="#88aa55" stroke="#222" stroke-width="2"/>
  <!-- Peninsula - elongated land mass pointing down -->
  <path d="M30,22 Q28,40 30,60 Q35,80 50,92 Q65,80 70,60 Q72,40 70,22 Z" fill="#88aa55" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Hills/terrain on peninsula -->
  <ellipse cx="50" cy="42" rx="12" ry="7" fill="#669944" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="45" cy="60" rx="8" ry="5" fill="#669944" stroke="#333" stroke-width="1.5"/>
  <!-- Water ripples on either side -->
  <path d="M5,35 Q20,32 28,38" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M5,55 Q18,52 27,58" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M72,38 Q82,32 95,35" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M73,58 Q83,52 95,55" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
</svg>
