<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Cross-section view of permafrost layers -->
  <!-- Active layer (top) - thin thawed soil -->
  <rect x="0" y="0" width="100" height="20" fill="#8a9a50"/>
  <!-- Transitional layer -->
  <rect x="0" y="20" width="100" height="12" fill="#7a8050"/>
  <!-- Permafrost layer - frozen (blue-grey) -->
  <rect x="0" y="32" width="100" height="45" fill="#7090a8"/>
  <!-- Deep bedrock -->
  <rect x="0" y="77" width="100" height="23" fill="#6a7080"/>
  <!-- Layer labels as dividers -->
  <line x1="0" y1="20" x2="100" y2="20" stroke="#333" stroke-width="2"/>
  <line x1="0" y1="32" x2="100" y2="32" stroke="#333" stroke-width="2"/>
  <line x1="0" y1="77" width="100" y2="77" stroke="#333" stroke-width="2"/>
  <line x1="0" y1="77" x2="100" y2="77" stroke="#333" stroke-width="2"/>
  <!-- Ice crystals in permafrost layer -->
  <line x1="20" y1="45" x2="20" y2="55" stroke="#c0d8e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="50" x2="24" y2="50" stroke="#c0d8e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="46" x2="23" y2="54" stroke="#c0d8e8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="46" x2="17" y2="54" stroke="#c0d8e8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="48" x2="55" y2="58" stroke="#c0d8e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="53" x2="59" y2="53" stroke="#c0d8e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="49" x2="58" y2="57" stroke="#c0d8e8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="49" x2="52" y2="57" stroke="#c0d8e8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="43" x2="80" y2="53" stroke="#c0d8e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="48" x2="84" y2="48" stroke="#c0d8e8" stroke-width="2" stroke-linecap="round"/>
  <!-- Surface plants -->
  <line x1="15" y1="20" x2="13" y2="10" stroke="#6a8a28" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="20" x2="33" y2="8" stroke="#6a8a28" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="20" x2="58" y2="11" stroke="#6a8a28" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="78" y2="9" stroke="#6a8a28" stroke-width="2" stroke-linecap="round"/>
</svg>
