  <!-- Fjord: narrow sea inlet flanked by steep cliffs - top down view -->
  <!-- Background water/sea -->
  <rect x="0" y="0" width="100" height="100" fill="#4488cc" stroke="none"/>
  <!-- Left cliff/landmass -->
  <polygon points="0,0 0,100 30,100 38,65 35,40 30,20 20,0" fill="#66aa55" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right cliff/landmass -->
  <polygon points="100,0 100,100 70,100 62,65 65,40 70,20 80,0" fill="#66aa55" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Water channel between (already showing as blue background) -->
  <!-- Ocean opening at top -->
  <!-- Snow on cliff tops -->
  <polygon points="0,0 20,0 15,15 5,18" fill="#eeeeff" stroke="#aaa" stroke-width="1"/>
  <polygon points="100,0 80,0 85,15 95,18" fill="#eeeeff" stroke="#aaa" stroke-width="1"/>
  <!-- Water ripple lines in fjord -->
  <line x1="38" y1="30" x2="62" y2="30" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="50" x2="64" y2="50" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="70" x2="62" y2="70" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cliff rock texture -->
  <line x1="15" y1="30" x2="28" y2="50" stroke="#558844" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="85" y1="30" x2="72" y2="50" stroke="#558844" stroke-width="1.5" stroke-linecap="round"/>
</svg>
