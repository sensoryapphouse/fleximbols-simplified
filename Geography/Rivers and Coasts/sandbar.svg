  <!-- Sandbar: elongated sandy ridge in water - top down -->
  <!-- Water background -->
  <rect x="0" y="0" width="100" height="100" fill="#4488cc" stroke="none"/>
  <!-- Main sandbar - elongated oval -->
  <ellipse cx="50" cy="50" rx="38" ry="12" fill="#ddcc88" stroke="#222" stroke-width="2.5"/>
  <!-- Sand ripple marks on bar -->
  <ellipse cx="50" cy="50" rx="28" ry="8" fill="none" stroke="#ccbb77" stroke-width="1.5"/>
  <ellipse cx="50" cy="50" rx="18" ry="5" fill="none" stroke="#ccbb77" stroke-width="1.5"/>
  <!-- Shallow water wash over part of bar -->
  <ellipse cx="75" cy="50" rx="12" ry="6" fill="#66aacc" stroke="#336699" stroke-width="1.5" opacity="0.6"/>
  <!-- Water ripples around sandbar -->
  <path d="M5,38 Q15,35 20,40" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M5,62 Q15,65 20,60" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80,40 Q88,35 95,38" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80,60 Q88,65 95,62" fill="none" stroke="#6699cc" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Seabird on bar -->
  <path d="M40,44 Q44,40 48,44" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="44" r="2.5" fill="#888" stroke="#222" stroke-width="1.5"/>
</svg>
