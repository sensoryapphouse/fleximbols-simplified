<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Lagoon: sheltered body of water separated from sea by barrier - top down -->
  <!-- Open sea (outer) background -->
  <rect x="0" y="0" width="100" height="100" fill="#336699" stroke="none"/>
  <!-- Barrier island/reef (curved strip) -->
  <path d="M5,20 Q50,8 95,20 L95,32 Q50,22 5,32 Z" fill="#ddcc88" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <!-- Lagoon water (lighter blue, sheltered) -->
  <path d="M8,32 Q50,24 92,32 L90,85 Q50,92 10,85 Z" fill="#55aadd" stroke="#336699" stroke-width="2"/>
  <!-- Lagoon ripples -->
  <path d="M20,50 Q50,45 80,50" fill="none" stroke="#4499cc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M15,65 Q50,60 85,65" fill="none" stroke="#4499cc" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sand/shore at bottom -->
  <ellipse cx="50" cy="88" rx="35" ry="6" fill="#ddcc88" stroke="#333" stroke-width="1.5"/>
  <!-- Palm trees on barrier -->
  <line x1="30" y1="20" x2="30" y2="10" stroke="#553322" stroke-width="2" stroke-linecap="round"/>
  <path d="M25,10 Q30,5 35,10" fill="#66aa44" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="18" x2="65" y2="8" stroke="#553322" stroke-width="2" stroke-linecap="round"/>
  <path d="M60,8 Q65,3 70,8" fill="#66aa44" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gap/channel in barrier -->
  <rect x="47" y="20" width="6" height="12" fill="#336699" stroke="none"/>
</svg>
