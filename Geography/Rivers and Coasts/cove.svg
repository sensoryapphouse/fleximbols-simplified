  <!-- Cove: small sheltered bay - top down -->
  <!-- Sea -->
  <rect x="0" y="0" width="100" height="100" fill="#4488cc" stroke="none"/>
  <!-- Land with small circular cove cutout -->
  <path d="M0,0 L100,0 L100,100 L0,100 L0,55 Q10,52 20,48 Q35,40 50,42 Q65,44 72,52 Q75,58 70,65 Q60,72 50,72 Q35,72 20,65 Q10,60 0,58 Z" fill="#88aa55" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cove water (small enclosed) -->
  <ellipse cx="50" cy="57" rx="22" ry="16" fill="#55aadd" stroke="#336699" stroke-width="1.5"/>
  <!-- Sandy beach at cove head -->
  <path d="M35,42 Q50,36 65,44" fill="none" stroke="#ddcc88" stroke-width="5" stroke-linecap="round"/>
  <!-- Ripples in cove -->
  <ellipse cx="50" cy="57" rx="10" ry="7" fill="none" stroke="#4499cc" stroke-width="1.5"/>
  <!-- Cliff rocks at sides -->
  <circle cx="25" cy="52" r="5" fill="#779944" stroke="#333" stroke-width="1.5"/>
  <circle cx="75" cy="52" r="5" fill="#779944" stroke="#333" stroke-width="1.5"/>
</svg>
