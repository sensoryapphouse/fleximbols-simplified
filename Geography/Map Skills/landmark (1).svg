<!-- Eiffel-style tower modernised -->
  <!-- Base legs -->
  <line x1="22" y1="80" x2="40" y2="36" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="80" x2="60" y2="36" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Center pillar -->
  <line x1="50" y1="36" x2="50" y2="12" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Cross braces -->
  <line x1="28" y1="64" x2="72" y2="64" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="48" x2="64" y2="48" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="36" x2="58" y2="36" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Base platform -->
  <rect x="16" y="78" width="68" height="6" rx="2" fill="#aaa" stroke="#555" stroke-width="2"/>
  <!-- Antenna tip -->
  <line x1="50" y1="8" x2="50" y2="12" stroke="#d44" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="7" r="3" fill="#d44" stroke="#8a1010" stroke-width="1.5"/>
  <!-- Flag at mid point -->
  <line x1="50" y1="24" x2="50" y2="36" stroke="#555" stroke-width="2"/>
  <rect x="50" y="24" width="12" height="7" rx="1" fill="#2a4a8a" stroke="#1a3060" stroke-width="1"/>
  <!-- Ground -->
  <line x1="10" y1="84" x2="90" y2="84" stroke="#8a5a2a" stroke-width="2"/>
</svg>
