<!-- cross-section layers of landfill -->
  <!-- top soil/clay cap -->
  <path d="M5,38 Q50,30 95,38 L95,48 Q50,40 5,48Z" fill="#a0c878" stroke="#5bba5b" stroke-width="2"/>
  <!-- waste layer 1 -->
  <path d="M5,48 Q50,40 95,48 L95,58 Q50,50 5,58Z" fill="#888" stroke="#555" stroke-width="2"/>
  <!-- small waste items in layer -->
  <circle cx="25" cy="53" r="3" fill="#555"/>
  <rect x="40" y="50" width="6" height="4" rx="1" fill="#7aaad4"/>
  <circle cx="60" cy="52" r="2.5" fill="#4a90d9"/>
  <rect x="70" y="49" width="8" height="5" rx="1" fill="#c8940a"/>
  <!-- waste layer 2 -->
  <path d="M5,58 Q50,50 95,58 L95,68 Q50,60 5,68Z" fill="#777" stroke="#555" stroke-width="2"/>
  <circle cx="30" cy="63" r="2.5" fill="#555"/>
  <circle cx="55" cy="62" r="3" fill="#333"/>
  <rect x="65" y="59" width="7" height="5" rx="1" fill="#888"/>
  <!-- bottom gravel/drainage -->
  <path d="M5,68 Q50,60 95,68 L95,80 Q50,72 5,80Z" fill="#c8a878" stroke="#8b5e3c" stroke-width="2"/>
  <!-- gas pipes (venting) -->
  <line x1="30" y1="28" x2="30" y2="45" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="22" x2="70" y2="42" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <!-- gas escaping -->
  <path d="M30,28 Q28,22 30,16" stroke="#5bba5b" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
  <path d="M70,22 Q68,16 70,10" stroke="#5bba5b" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
  <!-- ground surface -->
  <line x1="5" y1="80" x2="95" y2="80" stroke="#8b5e3c" stroke-width="2"/>
</svg>
