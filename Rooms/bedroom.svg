<!-- Floor -->
  <rect x="8" y="72" width="84" height="10" fill="#d4c4a0" stroke="#5a4a2a" stroke-width="1.5"/>
  <!-- Bed frame -->
  <rect x="12" y="44" width="55" height="30" fill="#c8b090" stroke="#6a4a2a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Headboard -->
  <rect x="12" y="36" width="55" height="12" fill="#8a5a2a" stroke="#5a3a1a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Mattress/duvet -->
  <rect x="14" y="46" width="51" height="26" rx="3" fill="#eeeeff" stroke="#aaaacc" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Pillow(s) -->
  <ellipse cx="28" cy="52" rx="10" ry="6" fill="white" stroke="#aaaacc" stroke-width="2"/>
  <ellipse cx="50" cy="52" rx="10" ry="6" fill="white" stroke="#aaaacc" stroke-width="2"/>
  <!-- Duvet pattern -->
  <line x1="15" y1="62" x2="64" y2="62" stroke="#aaaacc" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Bedside lamp -->
  <rect x="72" y="56" width="10" height="16" fill="#d4b890" stroke="#6a4a2a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M68,56 L74,44 L86,44 L82,56 Z" fill="#ffee99" stroke="#cc9900" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lamp glow -->
  <ellipse cx="80" cy="44" rx="5" ry="3" fill="#ffee66" opacity="0.5"/>
  <!-- Legs on bed -->
  <rect x="12" y="72" width="5" height="8" fill="#8a5a2a" stroke="#5a3a1a" stroke-width="1.5"/>
  <rect x="62" y="72" width="5" height="8" fill="#8a5a2a" stroke="#5a3a1a" stroke-width="1.5"/>
  <!-- Moon/window suggestion -->
  <circle cx="85" cy="20" r="8" fill="#ffee99" stroke="#cc9900" stroke-width="1.5"/>
  <!-- Stars -->
  <circle cx="72" cy="16" r="1.5" fill="#ffee66"/>
  <circle cx="94" cy="22" r="1" fill="#ffee66"/>
  <circle cx="76" cy="28" r="1" fill="#ffee66"/>
