<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Staircase - side view -->
  <!-- Step 1 (bottom) -->
  <rect x="10" y="76" width="72" height="10" fill="#d4c4a0" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <rect x="10" y="68" width="12" height="8" fill="#d4c4a0" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <!-- Step 2 -->
  <rect x="22" y="68" width="60" height="8" fill="#d4c4a0" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <rect x="22" y="58" width="12" height="10" fill="#d4c4a0" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <!-- Step 3 -->
  <rect x="34" y="58" width="48" height="10" fill="#c8b890" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <rect x="34" y="48" width="12" height="10" fill="#c8b890" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <!-- Step 4 -->
  <rect x="46" y="48" width="36" height="10" fill="#c0b080" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <rect x="46" y="38" width="12" height="10" fill="#c0b080" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <!-- Step 5 -->
  <rect x="58" y="38" width="24" height="10" fill="#b8a870" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <rect x="58" y="28" width="12" height="10" fill="#b8a870" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <!-- Step 6 (top) -->
  <rect x="70" y="28" width="12" height="10" fill="#b0a060" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <rect x="70" y="18" width="12" height="10" fill="#b0a060" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <!-- Banister/rail -->
  <line x1="12" y1="76" x2="80" y2="18" stroke="#8a5a2a" stroke-width="3" stroke-linecap="round"/>
  <!-- Banister posts -->
  <line x1="12" y1="76" x2="12" y2="86" stroke="#8a5a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="68" x2="24" y2="80" stroke="#8a5a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="58" x2="36" y2="72" stroke="#8a5a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="48" x2="48" y2="62" stroke="#8a5a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="38" x2="60" y2="52" stroke="#8a5a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="28" x2="72" y2="42" stroke="#8a5a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="18" x2="80" y2="32" stroke="#8a5a2a" stroke-width="2" stroke-linecap="round"/>
