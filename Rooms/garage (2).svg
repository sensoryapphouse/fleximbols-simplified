<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Building body -->
  <rect x="8" y="38" width="84" height="47" fill="#d8d0b8" stroke="#6a6050" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Pitched roof -->
  <polygon points="50,10 94,38 6,38" fill="#8a7a5a" stroke="#6a6050" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Large garage door - main feature (closed, with panels) -->
  <rect x="16" y="50" width="68" height="35" fill="#c0b090" stroke="#8a7a5a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Door panels horizontal -->
  <line x1="16" y1="58" x2="84" y2="58" stroke="#8a7a5a" stroke-width="1.5"/>
  <line x1="16" y1="66" x2="84" y2="66" stroke="#8a7a5a" stroke-width="1.5"/>
  <line x1="16" y1="74" x2="84" y2="74" stroke="#8a7a5a" stroke-width="1.5"/>
  <!-- Door panels vertical -->
  <line x1="50" y1="50" x2="50" y2="85" stroke="#8a7a5a" stroke-width="1.5"/>
  <!-- Door handle bar -->
  <rect x="38" y="82" width="24" height="3" rx="1" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Door panel indents -->
  <rect x="18" y="52" width="30" height="4" rx="1" fill="#b0a080" stroke="#8a7a5a" stroke-width="1" opacity="0.5"/>
  <rect x="52" y="52" width="30" height="4" rx="1" fill="#b0a080" stroke="#8a7a5a" stroke-width="1" opacity="0.5"/>
  <!-- Small window on side -->
  <rect x="60" y="42" width="16" height="6" fill="#aaccee" stroke="#6a6050" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Car silhouette peeking under door hint -->
  <!-- Chimney -->
  <rect x="24" y="16" width="7" height="18" fill="#cc8844" stroke="#5a3a1a" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
