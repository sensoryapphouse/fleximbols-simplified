  <!-- DBT: four skills modules (mindfulness, distress tolerance, emotion regulation, interpersonal effectiveness) -->
  <!-- Four quadrant boxes -->
  <!-- Mindfulness (top-left) - lotus/mind -->
  <rect x="5" y="5" width="42" height="42" rx="5" fill="#7b9cd9" stroke="#333" stroke-width="2"/>
  <!-- Mindfulness: simple lotus -->
  <ellipse cx="26" cy="35" rx="8" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="19" cy="32" rx="6" ry="4" fill="#fff" stroke="#333" stroke-width="1.5" transform="rotate(-20,19,32)"/>
  <ellipse cx="33" cy="32" rx="6" ry="4" fill="#fff" stroke="#333" stroke-width="1.5" transform="rotate(20,33,32)"/>
  <circle cx="26" cy="22" r="4" fill="#f0c040" stroke="#333" stroke-width="1.5"/>
  <line x1="26" y1="26" x2="26" y2="30" stroke="#333" stroke-width="1.5"/>
  <!-- Distress Tolerance (top-right) - flame/wave -->
  <rect x="53" y="5" width="42" height="42" rx="5" fill="#e05c6a" stroke="#333" stroke-width="2"/>
  <path d="M74 38 Q74 25 80 18 Q76 22 72 20 Q74 12 68 8 Q64 14 66 20 Q62 17 60 22 Q64 28 62 35 Q66 30 74 38" fill="#f0c040" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Emotion Regulation (bottom-left) - heart with dial -->
  <rect x="5" y="53" width="42" height="42" rx="5" fill="#5ba85a" stroke="#333" stroke-width="2"/>
  <path d="M20 72 Q20 64 26 64 Q29 64 30 68 Q31 64 35 64 Q41 64 41 72 Q41 80 30 87 Q19 80 20 72" fill="#e05c6a" stroke="#333" stroke-width="1.5"/>
  <!-- Dial on heart -->
  <line x1="30" y1="74" x2="34" y2="70" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Interpersonal Effectiveness (bottom-right) - two heads connecting -->
  <rect x="53" y="53" width="42" height="42" rx="5" fill="#f0c040" stroke="#333" stroke-width="2"/>
  <circle cx="66" cy="68" r="6" fill="#f5c060" stroke="#333" stroke-width="1.5"/>
  <circle cx="82" cy="68" r="6" fill="#f5c060" stroke="#333" stroke-width="1.5"/>
  <path d="M66 74 Q74 80 82 74" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="68" x2="76" y2="68" stroke="#333" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- DBT centre label -->

</svg>
