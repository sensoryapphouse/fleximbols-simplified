<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Left lens frame -->
  <rect x="8" y="36" width="34" height="26" rx="9" fill="#E8F4F8" stroke="#3D3D3D" stroke-width="3"/>
  <!-- Right lens frame -->
  <rect x="58" y="36" width="34" height="26" rx="9" fill="#E8F4F8" stroke="#3D3D3D" stroke-width="3"/>
  <!-- Bridge -->
  <path d="M42 49 Q50 44 58 49" stroke="#3D3D3D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="8" y1="49" x2="2" y2="49" stroke="#3D3D3D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="92" y1="49" x2="98" y2="49" stroke="#3D3D3D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lens shine left -->
  <line x1="14" y1="41" x2="18" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Lens shine right -->
  <line x1="64" y1="41" x2="68" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Label -->
  
</svg>
