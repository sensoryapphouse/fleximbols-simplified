  <!-- Large inhaler (typical asthma symbol) -->
  <!-- Mouthpiece -->
  <rect x="14" y="44" width="22" height="22" rx="3" fill="#ffffff" stroke="#000" stroke-width="2.4"/>
  <!-- Canister body -->
  <rect x="34" y="20" width="42" height="60" rx="6" fill="#3a8fd6" stroke="#000" stroke-width="2.4"/>
  <!-- Canister highlight band -->
  <rect x="34" y="44" width="42" height="8" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <!-- Top button / push down -->
  <rect x="44" y="10" width="22" height="12" rx="3" fill="#bdc3c7" stroke="#000" stroke-width="2.4"/>
  <!-- Press arrow -->
  <line x1="55" y1="2" x2="55" y2="10" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="55,10 51,6 59,6" fill="#000"/>
  <!-- Spray puffs from mouthpiece -->
  <circle cx="10" cy="50" r="3" fill="#b3e5fc" stroke="#000" stroke-width="1.8"/>
  <circle cx="6" cy="58" r="2.5" fill="#b3e5fc" stroke="#000" stroke-width="1.8"/>
  <circle cx="10" cy="64" r="2" fill="#b3e5fc" stroke="#000" stroke-width="1.5"/>
  <!-- Label dot -->
  <circle cx="55" cy="68" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="55" y="71" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="8" text-anchor="middle" font-weight="bold" fill="#d63a3a">Rx</text>
</svg>
