<!-- Right triangle -->
  <polygon points="18,72 82,72 82,20" fill="#d4e8f5" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right angle mark -->
  <rect x="76" y="66" width="6" height="6" fill="none" stroke="#333" stroke-width="1.8"/>
  <!-- Angle theta arc at bottom-left -->
  <path d="M30 72 Q26 65 30 60" fill="none" stroke="#e05555" stroke-width="2" stroke-linecap="round"/>
  <text x="34" y="68" font-size="8" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#e05555">θ</text>
  <!-- Labels -->
  <text x="50" y="68" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="#333" font-style="italic">adj</text>
  <text x="88" y="48" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#333" font-style="italic">opp</text>
  <text x="46" y="44" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#6a3d8a" font-style="italic" transform="rotate(-45,46,44)">hyp</text>
  <!-- sin/cos/tan formulas -->
  <text x="8" y="18" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#e05555">sin θ = opp/hyp</text>
  <text x="8" y="27" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#6a9fd8">cos θ = adj/hyp</text>
  <text x="8" y="36" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#5aaa5a">tan θ = opp/adj</text>
</svg>
