  <g transform="translate(0.049 5.908)">
<!-- Blackboard/whiteboard -->
  <rect x="8" y="12" width="84" height="62" rx="4" fill="#2d5a27" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Board frame -->
  <rect x="8" y="12" width="84" height="62" rx="4" fill="none" stroke="#8b6914" stroke-width="3"/>
  <!-- Chalk tray -->
  <rect x="8" y="72" width="84" height="5" rx="2" fill="#8b6914" stroke="#333" stroke-width="1.5"/>
  <!-- Equation line 1: ax² + bx = c -->
  <text x="50" y="35" font-size="13" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="#ffffff" font-style="italic">ax² + bx = c</text>
  <!-- Equation line 2: x = (-b ± √) / 2a -->
  <text x="50" y="55" font-size="10" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="#ffffaa">x = -b ± √b²-4ac</text>
