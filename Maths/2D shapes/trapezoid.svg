<!-- Trapezoid - 4 sides with one pair of parallel sides -->
  <polygon points="25,25 75,25 90,75 10,75" fill="#c8e8a0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Parallel side indicators -->
  <line x1="25" y1="20" x2="75" y2="20" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="10" y1="80" x2="90" y2="80" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
