<!-- Calculator body -->
  <rect x="22" y="14" width="56" height="72" rx="6" fill="#d0d8e8" stroke="#333" stroke-width="2.5"/>
  <!-- Display -->
  <rect x="28" y="20" width="44" height="18" rx="3" fill="#c0e0c0" stroke="#555" stroke-width="1.5"/>
  <!-- Number on display -->
  <text x="68" y="33" font-size="10" text-anchor="end" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">42</text>
  <!-- Buttons - 4 rows of 4 -->
  <!-- Row 1: C, /, *, - -->
  <rect x="28" y="44" width="9" height="7" rx="2" fill="#e08080" stroke="#555" stroke-width="1"/>
  <rect x="40" y="44" width="9" height="7" rx="2" fill="#b0c0d8" stroke="#555" stroke-width="1"/>
  <rect x="52" y="44" width="9" height="7" rx="2" fill="#b0c0d8" stroke="#555" stroke-width="1"/>
  <rect x="64" y="44" width="9" height="7" rx="2" fill="#b0c0d8" stroke="#555" stroke-width="1"/>
  <!-- Row 2: 7, 8, 9, + -->
  <rect x="28" y="54" width="9" height="7" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1"/>
  <rect x="40" y="54" width="9" height="7" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1"/>
  <rect x="52" y="54" width="9" height="7" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1"/>
  <rect x="64" y="54" width="9" height="7" rx="2" fill="#b0c0d8" stroke="#555" stroke-width="1"/>
  <!-- Row 3: 4, 5, 6 -->
  <rect x="28" y="64" width="9" height="7" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1"/>
  <rect x="40" y="64" width="9" height="7" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1"/>
  <rect x="52" y="64" width="9" height="7" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1"/>
  <!-- Row 4: 1, 2, 3, = -->
  <rect x="28" y="74" width="9" height="7" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1"/>
  <rect x="40" y="74" width="9" height="7" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1"/>
  <rect x="52" y="74" width="9" height="7" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1"/>
  <rect x="64" y="64" width="9" height="17" rx="2" fill="#6090c0" stroke="#555" stroke-width="1"/>
  <!-- Small labels on buttons -->
  <text x="32" y="50" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">C</text>
  <text x="43" y="50" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">/</text>
  <text x="55" y="50" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">x</text>
  <text x="67" y="50" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">-</text>
  <text x="30" y="60" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">7</text>
  <text x="42" y="60" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">8</text>
  <text x="54" y="60" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">9</text>
  <text x="67" y="60" font-size="5" fill="white" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">+</text>
  <text x="30" y="70" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">4</text>
  <text x="42" y="70" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">5</text>
  <text x="54" y="70" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">6</text>
  <text x="66" y="73" font-size="7" fill="white" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">=</text>
  <text x="30" y="80" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">1</text>
  <text x="42" y="80" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">2</text>
  <text x="54" y="80" font-size="5" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">3</text>
