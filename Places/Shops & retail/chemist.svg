<!-- building -->
  <rect x="12" y="38" width="76" height="44" rx="2" fill="#e8f0e8" stroke="#333" stroke-width="2.5"/>
  <!-- sign bar -->
  <rect x="8" y="28" width="84" height="12" rx="2" fill="#2060a0" stroke="#333" stroke-width="2"/>
  <!-- pharmacy cross on sign (UK green) -->
  <g stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round">
    <rect x="16" y="30" width="8" height="8" rx="1" fill="#ffffff"/>
    <rect x="19.2" y="30.6" width="1.6" height="6.8" fill="#3aa83a" stroke="none"/>
    <rect x="16.6" y="33.2" width="6.8" height="1.6" fill="#3aa83a" stroke="none"/>
  </g>
  <!-- pills / capsules in the shop window -->
  <g stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round">
    <!-- capsule (red / white) -->
    <rect x="30" y="48" width="20" height="9" rx="4.5" fill="#ffffff"/>
    <path d="M30 52.5 a4.5 4.5 0 0 1 4.5 -4.5 h5.5 v9 h-5.5 a4.5 4.5 0 0 1 -4.5 -4.5 z" fill="#e23b3b" stroke="none"/>
    <rect x="30" y="48" width="20" height="9" rx="4.5" fill="none"/>
    <!-- round tablet with score line -->
    <circle cx="64" cy="52.5" r="6" fill="#f0c020"/>
    <line x1="64" y1="47.5" x2="64" y2="57.5" stroke="#1a1a1a" stroke-width="1.4"/>
  </g>
  <!-- door -->
  <rect x="38" y="63" width="24" height="19" rx="2" fill="#90c8f0" stroke="#333" stroke-width="2"/>
  <!-- door handle -->
  <circle cx="59" cy="72" r="1.5" fill="#333"/>
  <!-- ground -->
  <line x1="8" y1="82" x2="92" y2="82" stroke="#333" stroke-width="2"/>
</svg>