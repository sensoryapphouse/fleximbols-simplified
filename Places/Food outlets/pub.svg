<!-- Building - traditional pub style -->
  <rect x="8" y="25" width="84" height="60" fill="#EEE0CC" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Timber frame effect -->
  <line x1="8" y1="40" x2="92" y2="40" stroke="#7A5533" stroke-width="2.5"/>
  <line x1="8" y1="58" x2="92" y2="58" stroke="#7A5533" stroke-width="2.5"/>
  <line x1="30" y1="25" x2="30" y2="85" stroke="#7A5533" stroke-width="2"/>
  <line x1="70" y1="25" x2="70" y2="85" stroke="#7A5533" stroke-width="2"/>
  <!-- Hanging pub sign -->
  <line x1="42" y1="8" x2="58" y2="8" stroke="#7A5533" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="8" x2="45" y2="13" stroke="#7A5533" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="8" x2="55" y2="13" stroke="#7A5533" stroke-width="2" stroke-linecap="round"/>
  <rect x="35" y="13" width="30" height="12" rx="2" fill="#FFEECC" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Beer mug on sign -->
  <rect x="42" y="15" width="10" height="8" rx="1" fill="#DDBB44" stroke="#555" stroke-width="1.5"/>
  <path d="M52,17 Q55,17 55,20 Q55,22 52,22" fill="none" stroke="#DDBB44" stroke-width="2" stroke-linecap="round"/>
  <!-- Foam -->
  <path d="M41,15 Q46,12 52,15" fill="white" stroke="#555" stroke-width="1"/>
  <!-- Windows -->
  <rect x="10" y="27" width="17" height="11" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <line x1="18" y1="27" x2="18" y2="38" stroke="#555" stroke-width="1.5"/>
  <rect x="73" y="27" width="17" height="11" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <line x1="81" y1="27" x2="81" y2="38" stroke="#555" stroke-width="1.5"/>
  <!-- Lower windows -->
  <rect x="10" y="43" width="17" height="12" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <rect x="73" y="43" width="17" height="12" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
