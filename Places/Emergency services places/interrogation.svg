  <!-- Dark room background -->
  <rect x="0" y="0" width="100" height="100" fill="#1a1a2a"/>
  <!-- Table -->
  <rect x="20" y="65" width="60" height="8" rx="2" fill="#5a4a30" stroke="#333" stroke-width="2"/>
  <rect x="25" y="73" width="5" height="22" rx="2" fill="#4a3a20" stroke="#333" stroke-width="1.5"/>
  <rect x="70" y="73" width="5" height="22" rx="2" fill="#4a3a20" stroke="#333" stroke-width="1.5"/>
  <!-- Interrogation lamp from ceiling -->
  <line x1="50" y1="0" x2="50" y2="20" stroke="#888" stroke-width="3"/>
  <path d="M36 20 L50 20 L64 20 L58 36 L42 36 Z" fill="#888" stroke="#555" stroke-width="2"/>
  <!-- Light cone -->
  <path d="M42 36 L20 80 L80 80 L58 36 Z" fill="#f0e870" opacity="0.15"/>
  <!-- Seated suspect figure -->
  <circle cx="50" cy="50" r="10" fill="#e8c89a" stroke="#333" stroke-width="2"/>
  <!-- Eyes squinting in bright light -->
  <path d="M44 48 Q46 47 48 48" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M52 48 Q54 47 56 48" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sweat drop -->
  <ellipse cx="58" cy="53" rx="2" ry="3" fill="#70c0e0"/>
  <!-- Body at table -->
  <rect x="38" y="60" width="24" height="20" rx="3" fill="#6a6a8a" stroke="#333" stroke-width="2"/>
  <!-- Handcuffed hands on table -->
  <rect x="38" y="65" width="10" height="5" rx="2.5" fill="#e8c89a" stroke="#333" stroke-width="1.5"/>
  <rect x="52" y="65" width="10" height="5" rx="2.5" fill="#e8c89a" stroke="#333" stroke-width="1.5"/>
  <rect x="46" y="66" width="8" height="3" rx="1.5" fill="#a0a0a0" stroke="#555" stroke-width="1.5"/>
  <!-- Interrogator silhouette -->
  <circle cx="80" cy="48" r="8" fill="#2a2a3a" stroke="#555" stroke-width="1.5"/>
  <rect x="72" y="56" width="16" height="20" rx="3" fill="#2a2a3a" stroke="#555" stroke-width="1.5"/>
  <!-- Question mark shadow on wall -->
  <text x="12" y="40" font-size="28" fill="#2a2a40" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">?</text>
</svg>
