  <!-- Sky -->
  <rect x="0" y="0" width="100" height="65" fill="#87ceeb"/>
  <!-- Cloud band around Fuji -->
  <path d="M0,50 Q25,46 50,50 Q75,54 100,48 L100,56 Q75,60 50,56 Q25,52 0,56 Z" fill="#fff" opacity="0.8"/>
  <!-- Mount Fuji - iconic symmetrical cone -->
  <path d="M0,90 L10,75 L20,62 L30,52 L38,45 L44,40 L50,12 L56,40 L62,45 L70,52 L80,62 L90,75 L100,90 Z" fill="#7a8898" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Snow cap - distinctive Fuji snow -->
  <path d="M50,12 L56,40 L53,38 L52,30 L51,20 L50,12 Z" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <path d="M50,12 L44,40 L47,38 L48,30 L49,20 L50,12 Z" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <!-- Snow spread wider at bottom of cap -->
  <path d="M44,40 L47,38 L50,36 L53,38 L56,40 L53,42 L50,43 L47,42 Z" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <!-- Foreground lake and reflection -->
  <ellipse cx="50" cy="88" rx="40" ry="8" fill="#6ab0d0" stroke="#4a90b0" stroke-width="1.5"/>
  <!-- Fuji reflection in lake -->
  <path d="M30,92 L38,88 L44,86 L50,84 L56,86 L62,88 L70,92" fill="none" stroke="#7a8898" stroke-width="2" opacity="0.5"/>
  <!-- Cherry blossoms -->
  <circle cx="12" cy="72" r="8" fill="#ffb7c5" stroke="#e91e8c" stroke-width="1.5"/>
  <circle cx="8" cy="78" r="6" fill="#ffb7c5" stroke="#e91e8c" stroke-width="1.5"/>
  <rect x="11" y="77" width="3" height="12" fill="#5d4037"/>
  <circle cx="88" cy="72" r="8" fill="#ffb7c5" stroke="#e91e8c" stroke-width="1.5"/>
  <rect x="87" y="77" width="3" height="12" fill="#5d4037"/>
</svg>
