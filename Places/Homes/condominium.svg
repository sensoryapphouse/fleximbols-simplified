<!-- Tall apartment building -->
  <rect x="18" y="18" width="64" height="60" fill="#C8C8D8" stroke="#444" stroke-width="2.5"/>
  <!-- Flat roof detail -->
  <rect x="16" y="15" width="68" height="5" fill="#A0A0B0" stroke="#444" stroke-width="2"/>
  <!-- Floor lines -->
  <line x1="18" y1="33" x2="82" y2="33" stroke="#666" stroke-width="1"/>
  <line x1="18" y1="48" x2="82" y2="48" stroke="#666" stroke-width="1"/>
  <line x1="18" y1="63" x2="82" y2="63" stroke="#666" stroke-width="1"/>
  <!-- Vertical divider -->
  <line x1="50" y1="18" x2="50" y2="78" stroke="#666" stroke-width="1"/>
  <!-- Windows floor 1 -->
  <rect x="22" y="20" width="10" height="10" fill="#AED6F1" stroke="#444" stroke-width="1"/>
  <rect x="56" y="20" width="10" height="10" fill="#AED6F1" stroke="#444" stroke-width="1"/>
  <!-- Windows floor 2 -->
  <rect x="22" y="36" width="10" height="10" fill="#AED6F1" stroke="#444" stroke-width="1"/>
  <rect x="56" y="36" width="10" height="10" fill="#F5D67A" stroke="#444" stroke-width="1"/>
  <!-- Windows floor 3 -->
  <rect x="22" y="51" width="10" height="10" fill="#AED6F1" stroke="#444" stroke-width="1"/>
  <rect x="56" y="51" width="10" height="10" fill="#AED6F1" stroke="#444" stroke-width="1"/>
  <!-- Balconies -->
  <rect x="36" y="36" width="10" height="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="36" y="51" width="10" height="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- Entrance -->
  <rect x="40" y="64" width="20" height="14" fill="#8B5E3C" stroke="#4A2800" stroke-width="2"/>
  <!-- Extra balconies (right column) to read as condo apartments -->
  <rect x="68" y="36" width="10" height="6" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="68" y="51" width="10" height="6" fill="none" stroke="#888" stroke-width="1.5"/>
</svg>