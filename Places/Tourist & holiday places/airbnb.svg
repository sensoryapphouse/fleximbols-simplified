  <path d="M40,54 Q36,54 36,78 L40,78 Z" fill="#f5e87a" stroke="#8a5a2a" stroke-width="1"/>
  <!-- Airbnb-style heart/person in door -->
  <circle cx="53" cy="62" r="3" fill="#d44" stroke="#333" stroke-width="1.5"/>
  <!-- Welcome mat -->
  <rect x="36" y="76" width="28" height="6" rx="2" fill="#9b5ca5" stroke="#333" stroke-width="1.5"/>
  <text x="50" y="80" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="5" text-anchor="middle" fill="white">WELCOME</text>
