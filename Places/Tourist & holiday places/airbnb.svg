<!-- House body -->
  <rect x="16" y="44" width="68" height="34" rx="3" fill="#ffe8e0" stroke="#333" stroke-width="2.5"/>
  <!-- Roof -->
  <polygon points="12,46 50,16 88,46" fill="#d44" stroke="#333" stroke-width="2.5"/>
  <!-- Welcoming open door -->
  <rect x="40" y="54" width="20" height="24" rx="2" fill="#8a5a2a" stroke="#333" stroke-width="2"/>
