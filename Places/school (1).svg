<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Ground -->
  <rect x="0" y="78" width="100" height="12" fill="#b8d4a0" stroke="#555" stroke-width="1"/>
  <!-- Building -->
  <rect x="10" y="38" width="80" height="40" fill="#f0d888" stroke="#444" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="5,38 95,38 85,22 15,22" fill="#c87850" stroke="#444" stroke-width="2"/>
  <!-- Bell tower -->
  <rect x="43" y="12" width="14" height="12" fill="#e8c870" stroke="#444" stroke-width="2"/>
  <polygon points="40,12 60,12 50,5" fill="#c87850" stroke="#444" stroke-width="1.5"/>
  <!-- Bell -->
  <ellipse cx="50" cy="20" rx="4" ry="3" fill="#d4a830" stroke="#444" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="42" y="58" width="16" height="20" fill="#8b6040" stroke="#444" stroke-width="1.5"/>
  <path d="M42,58 Q50,50 58,58" fill="#8b6040" stroke="#444" stroke-width="1.5"/>
  <!-- Windows with ABC -->
  <rect x="14" y="44" width="14" height="10" fill="#a0c8e8" stroke="#444" stroke-width="1.5"/>
  <text x="21" y="52" text-anchor="middle" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="5" font-weight="bold" fill="#444">ABC</text>
  <rect x="72" y="44" width="14" height="10" fill="#a0c8e8" stroke="#444" stroke-width="1.5"/>
  <text x="79" y="52" text-anchor="middle" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="5" font-weight="bold" fill="#444">123</text>
  <!-- Label -->
</svg>
