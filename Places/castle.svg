<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Main wall -->
  <rect x="16" y="45" width="68" height="40" fill="#c0b8a8" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <!-- Battlements on main wall -->
  <rect x="16" y="38" width="10" height="10" fill="#c0b8a8" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <rect x="30" y="38" width="10" height="10" fill="#c0b8a8" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <rect x="44" y="38" width="12" height="10" fill="#c0b8a8" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <rect x="60" y="38" width="10" height="10" fill="#c0b8a8" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <rect x="74" y="38" width="10" height="10" fill="#c0b8a8" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left tower -->
  <rect x="6" y="28" width="22" height="57" fill="#b0a898" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left tower battlements -->
  <rect x="6" y="20" width="6" height="10" fill="#b0a898" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <rect x="16" y="20" width="6" height="10" fill="#b0a898" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <rect x="22" y="20" width="6" height="10" fill="#b0a898" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right tower -->
  <rect x="72" y="28" width="22" height="57" fill="#b0a898" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right tower battlements -->
  <rect x="72" y="20" width="6" height="10" fill="#b0a898" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <rect x="82" y="20" width="6" height="10" fill="#b0a898" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <rect x="88" y="20" width="6" height="10" fill="#b0a898" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <!-- Tower windows (arrow slits) -->
  <rect x="14" y="36" width="4" height="10" fill="#334455" stroke="#6a6050" stroke-width="1" stroke-linejoin="round"/>
  <rect x="82" y="36" width="4" height="10" fill="#334455" stroke="#6a6050" stroke-width="1" stroke-linejoin="round"/>
  <rect x="14" y="52" width="4" height="10" fill="#334455" stroke="#6a6050" stroke-width="1" stroke-linejoin="round"/>
  <rect x="82" y="52" width="4" height="10" fill="#334455" stroke="#6a6050" stroke-width="1" stroke-linejoin="round"/>
  <!-- Main gate/portcullis -->
  <path d="M38,85 L38,58 Q50,52 62,58 L62,85 Z" fill="#2a2a2a" stroke="#6a6050" stroke-width="2" stroke-linejoin="round"/>
  <!-- Portcullis grate -->
  <line x1="42" y1="58" x2="42" y2="85" stroke="#888" stroke-width="1.5"/>
  <line x1="50" y1="55" x2="50" y2="85" stroke="#888" stroke-width="1.5"/>
  <line x1="58" y1="58" x2="58" y2="85" stroke="#888" stroke-width="1.5"/>
  <line x1="38" y1="65" x2="62" y2="65" stroke="#888" stroke-width="1.5"/>
  <line x1="38" y1="72" x2="62" y2="72" stroke="#888" stroke-width="1.5"/>
  <line x1="38" y1="79" x2="62" y2="79" stroke="#888" stroke-width="1.5"/>
  <!-- Flag -->
  <line x1="50" y1="38" x2="50" y2="28" stroke="#6a6050" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="50,28 60,31 50,34" fill="#cc2222" stroke="#882211" stroke-width="1"/>
</svg>
