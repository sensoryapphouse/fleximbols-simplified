<!-- Ground -->
  <line x1="5" y1="82" x2="95" y2="82" stroke="#8a6030" stroke-width="2" stroke-linecap="round"/>
  <!-- Walls - simple rectangular hut -->
  <rect x="20" y="52" width="60" height="30" fill="#ddc890" stroke="#8a6030" stroke-width="2" stroke-linejoin="round"/>
  <!-- Thatched conical roof -->
  <polygon points="50,12 85,52 15,52" fill="#aa8833" stroke="#6a5a1a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Thatch texture -->
  <line x1="50" y1="12" x2="17" y2="50" stroke="#886622" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="12" x2="26" y2="50" stroke="#886622" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="12" x2="36" y2="50" stroke="#886622" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="12" x2="50" y2="50" stroke="#886622" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="12" x2="64" y2="50" stroke="#886622" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="12" x2="74" y2="50" stroke="#886622" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="12" x2="83" y2="50" stroke="#886622" stroke-width="1.5" opacity="0.5"/>
  <!-- Horizontal thatch bands -->
  <path d="M20,50 Q50,44 80,50" fill="none" stroke="#886622" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M28,42 Q50,35 72,42" fill="none" stroke="#886622" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M36,32 Q50,26 64,32" fill="none" stroke="#886622" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Window -->
  <rect x="26" y="58" width="16" height="14" fill="#aaccee" stroke="#8a6030" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="34" y1="58" x2="34" y2="72" stroke="#8a6030" stroke-width="1"/>
  <!-- Door - simple arch -->
  <path d="M45,82 L45,64 Q50,58 55,64 L55,82 Z" fill="#8a6030" stroke="#5a3a1a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Bamboo/stick wall texture -->
  <line x1="22" y1="52" x2="22" y2="82" stroke="#8a6030" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="52" x2="30" y2="82" stroke="#8a6030" stroke-width="1" opacity="0.4"/>
  <line x1="70" y1="52" x2="70" y2="82" stroke="#8a6030" stroke-width="1" opacity="0.4"/>
  <line x1="78" y1="52" x2="78" y2="82" stroke="#8a6030" stroke-width="1" opacity="0.4"/>
</svg>
