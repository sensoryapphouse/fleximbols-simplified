<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Main building -->
  <rect x="15" y="45" width="70" height="40" fill="#EEE8D8" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Roof of main building -->
  <polygon points="10,45 50,25 90,45" fill="#CC6644" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tower/steeple -->
  <rect x="38" y="18" width="24" height="28" fill="#EEE8D8" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Steeple top -->
  <polygon points="38,18 50,5 62,18" fill="#CC6644" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cross on top -->
  <line x1="50" y1="5" x2="50" y2="1" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="3" x2="53" y2="3" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tower window -->
  <rect x="44" y="22" width="12" height="10" rx="4" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Main windows -->
  <rect x="20" y="52" width="14" height="18" rx="5" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <rect x="66" y="52" width="14" height="18" rx="5" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Door with arch -->
  <rect x="40" y="63" width="20" height="22" rx="6" fill="#C8A87A" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cross on door -->
  <line x1="50" y1="66" x2="50" y2="80" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="71" x2="55" y2="71" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
</svg>
