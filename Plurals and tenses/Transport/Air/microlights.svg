<!-- trike-style microlight: hang-glider wing on tricycle -->
  <!-- delta wing -->
  <path d="M50 30 L5 70 L50 60 L95 70 Z" fill="#d4b483" stroke="#8b6914" stroke-width="2" stroke-linejoin="round"/>
  <!-- wing leading edge highlight -->
  <line x1="50" y1="30" x2="5" y2="70" stroke="#8b6914" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="30" x2="95" y2="70" stroke="#8b6914" stroke-width="2.5" stroke-linecap="round"/>
  <!-- keel tube -->
  <line x1="50" y1="30" x2="50" y2="68" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>
  <!-- hang struts -->
  <line x1="50" y1="52" x2="20" y2="68" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="52" x2="80" y2="68" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/>
  <!-- trike pod -->
  <ellipse cx="50" cy="70" rx="10" ry="5" fill="#6a8faf" stroke="#4a5568" stroke-width="2"/>
  <!-- engine/prop -->
  <circle cx="50" cy="54" r="3" fill="#555" stroke="#333" stroke-width="1.5"/>
  <!-- wheels -->
  <circle cx="42" cy="74" r="3" fill="none" stroke="#4a5568" stroke-width="2"/>
  <circle cx="58" cy="74" r="3" fill="none" stroke="#4a5568" stroke-width="2"/>
  <circle cx="50" cy="68" r="2.5" fill="none" stroke="#4a5568" stroke-width="2"/>
