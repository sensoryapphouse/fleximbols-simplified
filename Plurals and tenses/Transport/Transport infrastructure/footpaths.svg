  <!-- Sky -->
  <rect x="0" y="0" width="100" height="40" fill="#bfe8f5"/>
  <!-- distant hills -->
  <path d="M0 40 q22 -12 46 -3 q26 -9 54 -2 v6 h-100 z" fill="#8fd06a"/>
  <!-- Grass field -->
  <rect x="0" y="40" width="100" height="60" fill="#6cbf48"/>
  <!-- Footpath: trapezoid, flat wide far end at horizon, widening to viewer -->
  <path d="M22 100 L40 41 L60 41 L78 100 Z" fill="#caa06a" stroke="#9a7642" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- horizontal "rungs" across the path to read as a track surface in perspective -->
  <g stroke="#a8814e" stroke-width="2" opacity="0.55" fill="none">
    <line x1="38" y1="48" x2="62" y2="48"/>
    <line x1="34" y1="62" x2="66" y2="62"/>
    <line x1="29" y1="78" x2="71" y2="78"/>
  </g>
  <!-- grass tufts edging both sides of the path -->
  <g fill="none" stroke="#3f8f3a" stroke-width="2.2" stroke-linecap="round">
    <path d="M40 56 q-5 -3 -6 -9 M36 70 q-6 -3 -8 -10 M30 88 q-7 -3 -10 -11"/>
    <path d="M60 56 q5 -3 6 -9 M64 70 q6 -3 8 -10 M70 88 q7 -3 10 -11"/>
  </g>
  <!-- footprints walking away (alternating) -->
  <g fill="#6e5230">
    <ellipse cx="46" cy="88" rx="3.4" ry="5" transform="rotate(-4 46 88)"/>
    <ellipse cx="55" cy="78" rx="2.9" ry="4.3" transform="rotate(5 55 78)"/>
    <ellipse cx="47" cy="66" rx="2.3" ry="3.5" transform="rotate(-3 47 66)"/>
    <ellipse cx="53" cy="56" rx="1.9" ry="3" transform="rotate(5 53 56)"/>
  </g>
