  <!-- Snow plow: large truck with angled plow blade at front -->
  <!-- Truck body/cab -->
  <rect x="38" y="36" width="52" height="30" rx="4" fill="#f0c040" stroke="#222" stroke-width="2.5"/>
  <!-- Cab roof -->
  <rect x="46" y="26" width="36" height="12" rx="3" fill="#d4a800" stroke="#222" stroke-width="2"/>
  <!-- Cab windows -->
  <rect x="50" y="30" width="14" height="10" rx="2" fill="#aaddff" stroke="#222" stroke-width="1.5"/>
  <!-- Headlights -->
  <rect x="82" y="44" width="8" height="6" rx="2" fill="#fffff0" stroke="#222" stroke-width="1.5"/>
  <!-- Truck bed/body back -->
  <!-- Wheels -->
  <circle cx="52" cy="72" r="13" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="52" cy="72" r="7" fill="#777" stroke="#222" stroke-width="1.5"/>
  <circle cx="80" cy="72" r="13" fill="#333" stroke="#222" stroke-width="2"/>
