  <polygon points="8,42 38,48 38,68 8,78" fill="#888" stroke="#222" stroke-width="2.5"/>
  <!-- Plow blade highlight -->
  <line x1="10" y1="44" x2="36" y2="50" stroke="#aaa" stroke-width="1.5"/>
  <!-- Plow mount arm -->
  <line x1="38" y1="56" x2="48" y2="56" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Salt/sand chute at rear (optional) -->
