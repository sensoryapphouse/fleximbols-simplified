  <!-- Snowcat: tracked vehicle for snow, cab on top, large tracks -->
  <!-- Left track (bottom) -->
  <rect x="6" y="66" width="88" height="16" rx="8" fill="#444" stroke="#222" stroke-width="2.5"/>
  <!-- Track pattern (cleats) -->
  <line x1="18" y1="66" x2="18" y2="82" stroke="#666" stroke-width="2"/>
  <line x1="30" y1="66" x2="30" y2="82" stroke="#666" stroke-width="2"/>
  <line x1="42" y1="66" x2="42" y2="82" stroke="#666" stroke-width="2"/>
  <line x1="54" y1="66" x2="54" y2="82" stroke="#666" stroke-width="2"/>
  <line x1="66" y1="66" x2="66" y2="82" stroke="#666" stroke-width="2"/>
  <line x1="78" y1="66" x2="78" y2="82" stroke="#666" stroke-width="2"/>
  <!-- Drive wheels inside track -->
  <circle cx="18" cy="74" r="6" fill="#777" stroke="#222" stroke-width="1.5"/>
  <circle cx="82" cy="74" r="6" fill="#777" stroke="#222" stroke-width="1.5"/>
  <!-- Cab body -->
  <rect x="14" y="36" width="72" height="32" rx="4" fill="#e07020" stroke="#222" stroke-width="2.5"/>
  <!-- Cab roof -->
  <rect x="20" y="28" width="60" height="10" rx="3" fill="#cc5a10" stroke="#222" stroke-width="2"/>
  <!-- Windows -->
  <rect x="22" y="40" width="22" height="16" rx="2" fill="#aaddff" stroke="#222" stroke-width="2"/>
  <rect x="56" y="40" width="22" height="16" rx="2" fill="#aaddff" stroke="#222" stroke-width="2"/>
  <!-- Headlights -->
  <circle cx="82" cy="52" r="5" fill="#f0f070" stroke="#222" stroke-width="1.5"/>
  <!-- Plow blade at front -->
  <path d="M6,56 L6,70 L14,66 L14,62 Z" fill="#888" stroke="#222" stroke-width="2"/>
  <!-- Exhaust stack -->
  <rect x="28" y="18" width="6" height="12" rx="2" fill="#555" stroke="#222" stroke-width="1.5"/>
  <!-- Smoke puff -->
  <circle cx="31" cy="15" r="4" fill="#ccc" stroke="#aaa" stroke-width="1"/>
  <circle cx="27" cy="12" r="3" fill="#ddd" stroke="#aaa" stroke-width="1"/>
