<!-- Full-size Class A motorhome (bus conversion style) -->
  <!-- Body - very boxy, bus-like -->
  <rect x="4" y="28" width="92" height="40" rx="3" fill="#778866" stroke="#333" stroke-width="2.5"/>
  <!-- Flat roof -->
  <rect x="4" y="20" width="92" height="10" rx="2" fill="#667755" stroke="#333" stroke-width="2"/>
  <!-- Cab-over windshield (full width) -->
  <rect x="6" y="24" width="22" height="18" rx="3" fill="#aaddff" stroke="#333" stroke-width="2"/>
  <!-- Living quarters windows -->
  <rect x="32" y="32" width="12" height="12" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="48" y="32" width="12" height="12" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <rect x="64" y="32" width="12" height="12" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <!-- Rear window -->
  <rect x="82" y="30" width="10" height="16" rx="2" fill="#aaddff" stroke="#333" stroke-width="1.5"/>
  <!-- Horizontal trim stripe -->
  <line x1="4" y1="46" x2="96" y2="46" stroke="#c8b400" stroke-width="2"/>
  <line x1="4" y1="48" x2="96" y2="48" stroke="#c8b400" stroke-width="1"/>
  <!-- Motorhome text / badge -->
  
  <!-- Entry door with steps -->
  <rect x="82" y="44" width="12" height="22" rx="2" fill="#667755" stroke="#333" stroke-width="1.5"/>
  <rect x="83" y="46" width="10" height="10" rx="1" fill="#aaddff" stroke="#333" stroke-width="1"/>
  <circle cx="84" cy="53" r="1.5" fill="#c8b400"/>
  <!-- Steps -->
  <rect x="80" y="64" width="16" height="3" rx="1" fill="#888" stroke="#333" stroke-width="1"/>
  <rect x="80" y="67" width="16" height="3" rx="1" fill="#777" stroke="#333" stroke-width="1"/>
  <!-- Satellite dish on roof -->
  <ellipse cx="70" cy="20" rx="8" ry="4" fill="#888" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="20" x2="70" y2="16" stroke="#333" stroke-width="1.5"/>
  <!-- Wheels - dual rear axle on full motorhome -->
  <circle cx="16" cy="68" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="16" cy="68" r="5" fill="#666"/>
  <circle cx="74" cy="68" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="74" cy="68" r="5" fill="#666"/>
  <circle cx="86" cy="68" r="10" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="86" cy="68" r="5" fill="#666"/>
