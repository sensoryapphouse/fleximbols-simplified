  <!-- Medlar - brown round fruit with distinctive open calyx at top -->
  <!-- Main body -->
  <circle cx="50" cy="58" r="34" fill="#a06830" stroke="#5a3a10" stroke-width="2.5"/>
  <!-- Open calyx at top - distinctive large open crown -->
  <path d="M30 32 Q35 20 42 26 Q45 16 50 22 Q55 16 58 26 Q65 20 70 32 Q58 36 50 34 Q42 36 30 32 Z"
        fill="#7a5020" stroke="#5a3a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- Five sepals of calyx -->
  <path d="M50 34 L44 24 Q50 22 56 24 Z" fill="#6a4018" stroke="#5a3a10" stroke-width="1.5"/>
  <!-- Brown russet texture -->
  <circle cx="38" cy="52" r="5" fill="#b07838" stroke="none" opacity="0.5"/>
  <circle cx="56" cy="48" r="4" fill="#b07838" stroke="none" opacity="0.5"/>
  <circle cx="62" cy="62" r="4" fill="#b07838" stroke="none" opacity="0.5"/>
  <circle cx="40" cy="68" r="5" fill="#b07838" stroke="none" opacity="0.5"/>
  <!-- Stem (short, at bottom since fruit is displayed upright) -->
  <line x1="50" y1="92" x2="50" y2="98" stroke="#5a3a1a" stroke-width="3" stroke-linecap="round"/>
