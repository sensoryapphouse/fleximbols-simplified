  <!-- Reamer: handheld citrus reamer (wooden/silicone cone shape with handle) -->
  <!-- Handle (long, wooden) -->
  <rect x="44" y="52" width="16" height="40" rx="6" fill="#8B4513" stroke="#222" stroke-width="2.5"/>
  <!-- Handle wood grain lines -->
  <line x1="46" y1="58" x2="58" y2="58" stroke="#6B3410" stroke-width="1"/>
  <line x1="46" y1="64" x2="58" y2="64" stroke="#6B3410" stroke-width="1"/>
  <line x1="46" y1="70" x2="58" y2="70" stroke="#6B3410" stroke-width="1"/>
  <line x1="46" y1="76" x2="58" y2="76" stroke="#6B3410" stroke-width="1"/>
  <line x1="46" y1="82" x2="58" y2="82" stroke="#6B3410" stroke-width="1"/>
  <!-- Handle end knob -->
  <ellipse cx="52" cy="90" rx="8" ry="4" fill="#6B3410" stroke="#222" stroke-width="1.5"/>
  <!-- Reamer cone/dome head -->
  <path d="M20 52 Q20 22 52 8 Q84 22 84 52Z" fill="#f5a623" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Reamer ridges spiralling from tip -->
  <line x1="52" y1="8" x2="52" y2="52" stroke="#e67e22" stroke-width="2.5"/>
  <!-- Left ridges -->
  <path d="M52 8 Q35 20 28 38" fill="none" stroke="#e67e22" stroke-width="2"/>
  <path d="M52 8 Q30 25 25 45" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <path d="M52 18 Q37 28 30 46" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <!-- Right ridges -->
  <path d="M52 8 Q69 20 76 38" fill="none" stroke="#e67e22" stroke-width="2"/>
  <path d="M52 8 Q74 25 79 45" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <path d="M52 18 Q67 28 74 46" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <!-- Shoulder collar where handle meets head -->
  <ellipse cx="52" cy="52" rx="16" ry="5" fill="#e67e22" stroke="#222" stroke-width="2"/>
  <!-- Juice drops -->
  <circle cx="22" cy="44" r="3" fill="#fff700" stroke="#e67e22" stroke-width="1.5"/>
  <circle cx="18" cy="52" r="2.5" fill="#fff700" stroke="#e67e22" stroke-width="1.5"/>
  <circle cx="82" cy="44" r="3" fill="#fff700" stroke="#e67e22" stroke-width="1.5"/>
