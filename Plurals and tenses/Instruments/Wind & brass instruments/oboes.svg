<!-- Oboe - vertical double-reed woodwind -->
  <!-- Body - slightly flared at bottom, dark wood -->
  <rect x="44" y="22" width="12" height="55" rx="4" fill="#5A3010" stroke="#2A1008" stroke-width="2"/>
  <!-- Slight flare at bell -->
  <path d="M 44 72 Q 40 82 38 85 Q 50 88 62 85 Q 60 82 56 72 Z" fill="#5A3010" stroke="#2A1008" stroke-width="1.5"/>
  <!-- Double reed at top -->
  <rect x="47" y="14" width="6" height="10" rx="2" fill="#8B6B3A" stroke="#3A2008" stroke-width="1.5"/>
  <path d="M 47 18 Q 50 16 53 18" fill="none" stroke="#2A1008" stroke-width="1"/>
  <!-- Tone holes / key pads -->
  <circle cx="50" cy="32" r="2" fill="#4A2800" stroke="#1A0800" stroke-width="1"/>
  <circle cx="50" cy="40" r="2" fill="#4A2800" stroke="#1A0800" stroke-width="1"/>
  <circle cx="50" cy="48" r="2" fill="#4A2800" stroke="#1A0800" stroke-width="1"/>
  <circle cx="50" cy="56" r="2" fill="#4A2800" stroke="#1A0800" stroke-width="1"/>
  <!-- Key mechanism left -->
  <rect x="38" y="35" width="8" height="3" rx="1" fill="#C8C8C8" stroke="#555" stroke-width="1"/>
  <rect x="38" y="45" width="8" height="3" rx="1" fill="#C8C8C8" stroke="#555" stroke-width="1"/>
  <!-- Key mechanism right -->
  <rect x="54" y="38" width="8" height="3" rx="1" fill="#C8C8C8" stroke="#555" stroke-width="1"/>
  <rect x="54" y="50" width="8" height="3" rx="1" fill="#C8C8C8" stroke="#555" stroke-width="1"/>
