<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Microphone - standing mic on base -->
  <!-- Stand base -->
  <ellipse cx="50" cy="88" rx="22" ry="5" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- Stand pole -->
  <line x1="50" y1="83" x2="50" y2="60" stroke="#777" stroke-width="3" stroke-linecap="round"/>
  <!-- Boom arm -->
  <line x1="50" y1="62" x2="50" y2="55" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Microphone head (capsule) -->
  <rect x="40" y="25" width="20" height="32" rx="10" fill="#ddd" stroke="#333" stroke-width="2.5"/>
  <!-- Grille pattern -->
  <line x1="40" y1="35" x2="60" y2="35" stroke="#aaa" stroke-width="1"/>
  <line x1="40" y1="42" x2="60" y2="42" stroke="#aaa" stroke-width="1"/>
  <line x1="40" y1="49" x2="60" y2="49" stroke="#aaa" stroke-width="1"/>
  <line x1="50" y1="25" x2="50" y2="57" stroke="#aaa" stroke-width="1"/>
  <!-- Top dome -->
  <ellipse cx="50" cy="25" rx="10" ry="5" fill="#ccc" stroke="#333" stroke-width="2"/>
  <!-- On/off indicator dot -->
  <circle cx="50" cy="20" r="2.5" fill="#e44" stroke="#333" stroke-width="1"/>
