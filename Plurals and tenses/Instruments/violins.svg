  <path d="M44,74 L56,74 L54,80 L46,80 Z" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
  <!-- bridge -->
  <rect x="46" y="60" width="8" height="4" rx="0" fill="#c8a06e" stroke="#795548" stroke-width="1.5"/>
  <!-- neck -->
  <rect x="47" y="13" width="6" height="28" rx="2" fill="#8d6e63" stroke="#5d4037" stroke-width="1.5"/>
  <!-- scroll -->
  <path d="M46,13 Q44,8 48,6 Q52,8 54,13" fill="#795548" stroke="#5d4037" stroke-width="1.5"/>
  <path d="M49,8 Q51,7 51,9 Q51,11 49,10" fill="none" stroke="#5d4037" stroke-width="1"/>
  <!-- pegs (4) -->
  <line x1="44" y1="15" x2="56" y2="15" stroke="#c0a080" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="20" x2="56" y2="20" stroke="#c0a080" stroke-width="2" stroke-linecap="round"/>
  <!-- 4 strings -->
  <line x1="48" y1="9" x2="47" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="49" y1="9" x2="49" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="51" y1="9" x2="51" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="52" y1="9" x2="53" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <!-- bow -->
  <line x1="14" y1="20" x2="14" y2="82" stroke="#8d6e63" stroke-width="2" stroke-linecap="round"/>
  <path d="M16,20 Q22,52 16,82" fill="none" stroke="#c0a080" stroke-width="1.5" stroke-linecap="round"/>
