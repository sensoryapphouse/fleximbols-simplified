<!-- violin body -->
  <!-- upper bout -->
  <ellipse cx="50" cy="38" rx="14" ry="12" fill="#c8a06e" stroke="#795548" stroke-width="2"/>
  <!-- lower bout (larger) -->
  <ellipse cx="50" cy="65" rx="17" ry="15" fill="#c8a06e" stroke="#795548" stroke-width="2"/>
  <!-- waist -->
  <rect x="39" y="44" width="22" height="16" fill="#c8a06e" stroke="none"/>
  <path d="M39,44 Q34,52 39,60" fill="none" stroke="#795548" stroke-width="2.5"/>
  <path d="M61,44 Q66,52 61,60" fill="none" stroke="#795548" stroke-width="2.5"/>
  <!-- f-holes -->
  <path d="M42,52 Q40,56 42,60" fill="none" stroke="#5d4037" stroke-width="2" stroke-linecap="round"/>
  <path d="M58,52 Q60,56 58,60" fill="none" stroke="#5d4037" stroke-width="2" stroke-linecap="round"/>
  <!-- f-hole dots -->
  <circle cx="42" cy="51" r="1.5" fill="#5d4037"/>
  <circle cx="42" cy="61" r="1.5" fill="#5d4037"/>
  <circle cx="58" cy="51" r="1.5" fill="#5d4037"/>
  <circle cx="58" cy="61" r="1.5" fill="#5d4037"/>
  <!-- chin rest -->
  <ellipse cx="50" cy="77" rx="8" ry="4" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
