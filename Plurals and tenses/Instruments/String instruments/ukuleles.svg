<!-- ukulele - smaller, 4-string, rounder body -->
  <!-- lower bout (round) -->
  <ellipse cx="50" cy="70" rx="20" ry="18" fill="#f9a825" stroke="#f57f00" stroke-width="2.5"/>
  <!-- upper bout -->
  <ellipse cx="50" cy="50" rx="14" ry="12" fill="#f9a825" stroke="#f57f00" stroke-width="2.5"/>
  <!-- waist -->
  <rect x="40" y="55" width="20" height="10" fill="#f9a825" stroke="none"/>
  <line x1="40" y1="55" x2="40" y2="65" stroke="#f57f00" stroke-width="2.5"/>
  <line x1="60" y1="55" x2="60" y2="65" stroke="#f57f00" stroke-width="2.5"/>
  <!-- sound hole -->
  <circle cx="50" cy="62" r="7" fill="#e65100" stroke="#bf360c" stroke-width="1.5"/>
  <circle cx="50" cy="62" r="5.5" fill="none" stroke="#f9a825" stroke-width="1"/>
  <!-- neck (shorter than guitar) -->
  <rect x="46" y="18" width="8" height="36" rx="3" fill="#a1887f" stroke="#795548" stroke-width="2"/>
  <!-- headstock -->
  <rect x="43" y="10" width="14" height="10" rx="3" fill="#8d6e63" stroke="#795548" stroke-width="2"/>
  <!-- frets -->
  <line x1="46" y1="26" x2="54" y2="26" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="46" y1="32" x2="54" y2="32" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="46" y1="38" x2="54" y2="38" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="46" y1="44" x2="54" y2="44" stroke="#c0a080" stroke-width="1.5"/>
  <!-- 4 tuning pegs -->
  <circle cx="44" cy="12" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="56" cy="12" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="44" cy="17" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="56" cy="17" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <!-- 4 strings -->
  <line x1="48" y1="12" x2="46" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="50" y1="12" x2="49" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="52" y1="12" x2="51" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="54" y1="12" x2="54" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <!-- bridge -->
  <rect x="44" y="76" width="12" height="4" rx="1" fill="#795548" stroke="#5d4037" stroke-width="1.5"/>
<g transform="translate(0,0) scale(0.1953) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl2436" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl2436)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
