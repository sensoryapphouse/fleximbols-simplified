<!-- harp - tall triangular string instrument -->
  <!-- soundboard (vertical pillar) - right side -->
  <rect x="62" y="12" width="10" height="75" rx="4" fill="#c8a06e" stroke="#795548" stroke-width="2.5"/>
  <!-- neck (curved top) -->
  <path d="M30,15 Q20,10 18,20 Q16,32 35,38" fill="none" stroke="#8d6e63" stroke-width="5" stroke-linecap="round"/>
  <path d="M30,15 Q20,10 18,20 Q16,32 35,38" fill="none" stroke="#a1887f" stroke-width="3" stroke-linecap="round"/>
  <!-- forepillar (left column) -->
  <rect x="20" y="14" width="8" height="73" rx="3" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
  <!-- base -->
  <rect x="18" y="80" width="56" height="8" rx="4" fill="#795548" stroke="#5d4037" stroke-width="2.5"/>
  <!-- feet -->
  <rect x="14" y="86" width="12" height="5" rx="2" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
  <rect x="62" y="86" width="14" height="5" rx="2" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
  <!-- strings (7-8 strings, graduated lengths) -->
  <line x1="27" y1="20" x2="62" y2="78" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="27" y1="26" x2="62" y2="78" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="27" y1="32" x2="62" y2="78" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="27" y1="38" x2="62" y2="78" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="27" y1="45" x2="62" y2="78" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="27" y1="52" x2="62" y2="78" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="27" y1="59" x2="62" y2="78" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="27" y1="66" x2="62" y2="78" stroke="#c0a080" stroke-width="1.5"/>
  <!-- tuning pins on neck curve -->
  <circle cx="22" cy="20" r="1.5" fill="#9e9e9e"/>
  <circle cx="22" cy="28" r="1.5" fill="#9e9e9e"/>
  <circle cx="22" cy="36" r="1.5" fill="#9e9e9e"/>
