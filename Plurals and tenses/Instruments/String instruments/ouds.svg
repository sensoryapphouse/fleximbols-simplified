<!-- Oud body: large round-backed lute -->
  <ellipse cx="50" cy="65" rx="28" ry="25" fill="#c8a464" stroke="#5a3a10" stroke-width="2.5"/>
  <!-- Decorative sound holes (3 rosettes) -->
  <circle cx="50" cy="60" r="6" fill="none" stroke="#5a3a10" stroke-width="1.2"/>
  <circle cx="50" cy="60" r="3" fill="none" stroke="#5a3a10" stroke-width="0.8"/>
  <circle cx="37" cy="68" r="4" fill="none" stroke="#5a3a10" stroke-width="1"/>
  <circle cx="63" cy="68" r="4" fill="none" stroke="#5a3a10" stroke-width="1"/>
  <!-- Short neck -->
  <rect x="44" y="28" width="12" height="18" rx="4" fill="#a07840" stroke="#5a3a10" stroke-width="2"/>
  <!-- Peg box angled back -->
  <path d="M44,28 Q46,18 50,14 Q54,18 56,28 Z" fill="#a07840" stroke="#5a3a10" stroke-width="1.5"/>
  <!-- Multiple pegs (oud has many) -->
  <circle cx="47" cy="19" r="2" fill="#5a3a10"/>
  <circle cx="53" cy="19" r="2" fill="#5a3a10"/>
  <circle cx="46" cy="24" r="2" fill="#5a3a10"/>
  <circle cx="54" cy="24" r="2" fill="#5a3a10"/>
  <!-- 5 courses of strings -->
  <line x1="47" y1="28" x2="42" y2="83" stroke="#bbb" stroke-width="0.7"/>
  <line x1="48.5" y1="28" x2="47" y2="84" stroke="#bbb" stroke-width="0.7"/>
  <line x1="50" y1="28" x2="50" y2="84" stroke="#bbb" stroke-width="0.7"/>
  <line x1="51.5" y1="28" x2="53" y2="84" stroke="#bbb" stroke-width="0.7"/>
  <line x1="53" y1="28" x2="58" y2="83" stroke="#bbb" stroke-width="0.7"/>
  <!-- Bridge -->
  <rect x="40" y="82" width="20" height="3" rx="1" fill="#5a3a10"/>
