<!-- Sarod body: rounded with flat top section -->
  <path d="M32,58 Q28,50 30,42 Q35,35 50,35 Q65,35 70,42 Q72,50 68,58 Q65,72 50,78 Q35,72 32,58 Z" fill="#c8a464" stroke="#5a3a10" stroke-width="2.5" stroke-linejoin="round"/>
