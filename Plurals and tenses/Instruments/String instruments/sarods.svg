  <!-- Peg box -->
  <path d="M43,12 L47,7 L53,7 L57,12 Z" fill="#a07840" stroke="#5a3a10" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Pegs -->
  <circle cx="47" cy="9" r="2" fill="#5a3a10"/>
  <circle cx="53" cy="9" r="2" fill="#5a3a10"/>
  <!-- Metal fingerboard (sarod has no frets, metal neck) -->
  <rect x="46" y="13" width="8" height="30" rx="1" fill="#c0c0c0" stroke="#888" stroke-width="1"/>
  <!-- Sound hole -->
  <circle cx="50" cy="56" r="5" fill="none" stroke="#5a3a10" stroke-width="1.5"/>
