  <g transform="translate(-5.664 -37.054) scale(1.4286)">
<!-- Bongo drums - two small joined drums -->
  <!-- Left smaller drum -->
  <path d="M12 48 Q10 48 9 58 Q8 70 10 78 L34 78 Q36 70 35 58 Q34 48 32 48Z" fill="#a07040" stroke="#333" stroke-width="2"/>
  <ellipse cx="22" cy="48" rx="12" ry="5" fill="#e0d0b0" stroke="#333" stroke-width="2"/>
  <!-- Connector between drums -->
  <rect x="34" y="50" width="6" height="28" rx="2" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Right larger drum -->
  <path d="M40 45 Q38 45 37 57 Q36 70 38 78 L68 78 Q70 70 69 57 Q68 45 66 45Z" fill="#a07040" stroke="#333" stroke-width="2"/>
  <ellipse cx="54" cy="45" rx="16" ry="6" fill="#e0d0b0" stroke="#333" stroke-width="2"/>
  <!-- Tension rods on left drum -->
  <line x1="12" y1="55" x2="12" y2="75" stroke="#888" stroke-width="1.5"/>
  <line x1="32" y1="55" x2="32" y2="75" stroke="#888" stroke-width="1.5"/>
  <!-- Tension rods on right drum -->
  <line x1="40" y1="52" x2="40" y2="75" stroke="#888" stroke-width="1.5"/>
  <line x1="68" y1="52" x2="68" y2="75" stroke="#888" stroke-width="1.5"/>
  <!-- Base -->
  <ellipse cx="22" cy="78" rx="13" ry="4" fill="#8a6030" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="54" cy="78" rx="17" ry="5" fill="#8a6030" stroke="#333" stroke-width="1.5"/>
</g>
