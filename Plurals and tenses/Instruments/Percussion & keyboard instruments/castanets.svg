  <line x1="22" y1="43" x2="48" y2="44" stroke="#5a2a00" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="75" y1="28" x2="55" y2="28" stroke="#5a2a00" stroke-width="0.8" stroke-dasharray="3,2"/>
