  <!-- Cowbell on leather strap -->
  <!-- Strap going across top -->
  <path d="M6 26 L94 26 L94 34 L6 34 Z" fill="#8b5a2b" stroke="#000" stroke-width="2.4"/>
  <!-- Strap stitching -->
  <line x1="6" y1="28" x2="94" y2="28" stroke="#fff" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="6" y1="32" x2="94" y2="32" stroke="#fff" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Bell loop attachment -->
  <rect x="42" y="22" width="16" height="14" rx="4" fill="#7f8c8d" stroke="#000" stroke-width="2.4"/>
  <!-- Cowbell body (trapezoidal, wider at bottom) -->
  <path d="M34 36 L66 36 L82 88 L18 88 Z" fill="#d4b483" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Top edge / shoulder of bell -->
  <path d="M34 36 L66 36 L62 44 L38 44 Z" fill="#a8845e" stroke="#000" stroke-width="2"/>
  <!-- Center seam -->
  <line x1="50" y1="44" x2="50" y2="86" stroke="#000" stroke-width="1.8"/>
  <!-- Open bottom rim -->
  <ellipse cx="50" cy="88" rx="32" ry="5" fill="#5a4a2a" stroke="#000" stroke-width="2.4"/>
  <!-- Clapper visible inside (small) -->
  <line x1="50" y1="50" x2="50" y2="80" stroke="#000" stroke-width="2"/>
  <circle cx="50" cy="82" r="4" fill="#5a4a2a" stroke="#000" stroke-width="2"/>
  <!-- Sound waves left and right -->
  <path d="M10 56 Q4 62 10 68" fill="none" stroke="#3a8fd6" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M14 50 Q4 62 14 74" fill="none" stroke="#3a8fd6" stroke-width="2" stroke-linecap="round"/>
  <path d="M90 56 Q96 62 90 68" fill="none" stroke="#3a8fd6" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M86 50 Q96 62 86 74" fill="none" stroke="#3a8fd6" stroke-width="2" stroke-linecap="round"/>
  <!-- Musical note for sound -->
  <circle cx="84" cy="12" r="3" fill="#000"/>
  <line x1="87" y1="12" x2="87" y2="2" stroke="#000" stroke-width="2"/>
  <path d="M87 2 L94 4" stroke="#000" stroke-width="2" fill="none"/>
</g><g transform="translate(0,0) scale(0.1953) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl2387" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl2387)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
