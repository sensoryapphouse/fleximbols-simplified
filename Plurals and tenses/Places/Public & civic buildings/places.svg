  <g transform="translate(-15.530 -8.108) scale(1.2358)">
<!-- Surface / table to place on -->
  <rect x="26" y="68" width="54" height="8" rx="3" fill="#ECF0F1" stroke="#333" stroke-width="2"/>
  <!-- Target spot on surface (cross-hair) -->
  <line x1="50" y1="64" x2="50" y2="72" stroke="#5B9BD5" stroke-width="1.5"/>
  <line x1="46" y1="68" x2="54" y2="68" stroke="#5B9BD5" stroke-width="1.5"/>
  <!-- Object being placed (cube/block) -->
  <rect x="40" y="50" width="20" height="18" rx="3" fill="#7DC97D" stroke="#333" stroke-width="2.5"/>
  <!-- Shadow under object -->
  <ellipse cx="50" cy="68" rx="10" ry="2" fill="#BDC3C7" opacity="0.6"/>
  <!-- Hand carefully placing (from above) -->
  <!-- Thumb + index pinch grip -->
  <ellipse cx="42" cy="44" rx="5" ry="8" fill="#FDDCB5" stroke="#333" stroke-width="2" transform="rotate(30,42,44)"/>
  <ellipse cx="58" cy="44" rx="5" ry="8" fill="#FDDCB5" stroke="#333" stroke-width="2" transform="rotate(-30,58,44)"/>
  <!-- Wrist / forearm -->
  <rect x="39" y="28" width="22" height="14" rx="7" fill="#FDDCB5" stroke="#333" stroke-width="2"/>
  <!-- Precision / gentle motion dashes -->
  <line x1="50" y1="18" x2="50" y2="26" stroke="#E67E22" stroke-width="2" stroke-dasharray="2,2" stroke-linecap="round"/>
  <polygon points="50,28 46,22 54,22" fill="#E67E22"/>
</g>
