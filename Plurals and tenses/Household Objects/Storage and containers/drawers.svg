  <!-- Front panel handle -->
  <rect x="35" y="57" width="30" height="6" rx="3" fill="#888" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Handle screws -->
  <circle cx="40" cy="60" r="2" fill="#666" stroke="#555" stroke-width="1"/>
  <circle cx="60" cy="60" r="2" fill="#666" stroke="#555" stroke-width="1"/>
