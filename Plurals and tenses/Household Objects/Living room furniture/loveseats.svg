  <rect x="81" y="65" width="5" height="7" rx="1" fill="#4A2800" stroke="#2A1800" stroke-width="1.5"/>
  <rect x="36" y="65" width="5" height="7" rx="1" fill="#4A2800" stroke="#2A1800" stroke-width="1.5"/>
  <rect x="59" y="65" width="5" height="7" rx="1" fill="#4A2800" stroke="#2A1800" stroke-width="1.5"/>
