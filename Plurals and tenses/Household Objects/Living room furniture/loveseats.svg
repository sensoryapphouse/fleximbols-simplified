<!-- Loveseat - compact 2-seat sofa -->
  <!-- Back rest -->
  <rect x="12" y="32" width="76" height="16" rx="3" fill="#C4956A" stroke="#7A4A2C" stroke-width="2.5"/>
  <!-- Seat cushions (two) -->
  <rect x="12" y="47" width="36" height="18" rx="2" fill="#D4A870" stroke="#7A4A2C" stroke-width="2"/>
  <rect x="52" y="47" width="36" height="18" rx="2" fill="#D4A870" stroke="#7A4A2C" stroke-width="2"/>
  <!-- Divider line between cushions -->
  <line x1="50" y1="48" x2="50" y2="65" stroke="#7A4A2C" stroke-width="1.5"/>
  <!-- Left arm rest -->
  <rect x="8" y="30" width="10" height="38" rx="3" fill="#8B5E3C" stroke="#4A2800" stroke-width="2.5"/>
  <!-- Right arm rest -->
  <rect x="82" y="30" width="10" height="38" rx="3" fill="#8B5E3C" stroke="#4A2800" stroke-width="2.5"/>
  <!-- Small heart on center (love-seat hint) -->
  <path d="M46,40 Q46,36 50,38 Q54,36 54,40 Q54,44 50,48 Q46,44 46,40 Z" fill="#C0392B" stroke="#7A1A00" stroke-width="1"/>
