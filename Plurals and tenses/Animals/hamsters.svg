  <circle cx="58" cy="38" r="3.5" fill="#222"/>
  <circle cx="43" cy="37" r="1.2" fill="white"/>
  <circle cx="59" cy="37" r="1.2" fill="white"/>
  <!-- Nose: small pink -->
  <ellipse cx="50" cy="46" rx="2.5" ry="2" fill="#d8789a"/>
  <!-- Whiskers -->
  <line x1="49" y1="46" x2="28" y2="43" stroke="#888" stroke-width="1"/>
  <line x1="51" y1="46" x2="72" y2="43" stroke="#888" stroke-width="1"/>
