  <line x1="51" y1="47" x2="72" y2="50" stroke="#888" stroke-width="1"/>
  <!-- Belly stripe: lighter -->
  <ellipse cx="50" cy="66" rx="14" ry="16" fill="#f0e0b0" stroke="none"/>
  <!-- Tiny tail -->
  <ellipse cx="76" cy="72" rx="4" ry="3" fill="#e0b880" stroke="#444" stroke-width="1.5"/>
  <!-- Feet -->
  <ellipse cx="38" cy="84" rx="7" ry="3.5" fill="#d8b870" stroke="#444" stroke-width="1.5"/>
