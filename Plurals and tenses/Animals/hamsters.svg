  <ellipse cx="69" cy="46" rx="9" ry="8" fill="#f0d8a0" stroke="#444" stroke-width="1.5"/>
  <!-- Ears: small round -->
  <ellipse cx="36" cy="21" rx="8" ry="7" fill="#e8c88a" stroke="#444" stroke-width="2"/>
  <ellipse cx="36" cy="21" rx="5" ry="4.5" fill="#e8a898"/>
  <ellipse cx="64" cy="21" rx="8" ry="7" fill="#e8c88a" stroke="#444" stroke-width="2"/>
  <ellipse cx="64" cy="21" rx="5" ry="4.5" fill="#e8a898"/>
  <!-- Eyes -->
