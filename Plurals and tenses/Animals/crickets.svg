<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Body -->
  <ellipse cx="50" cy="57" rx="20" ry="9" fill="#8a7a4a" stroke="#4a3a1a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="30" cy="54" r="9" fill="#9a8a5a" stroke="#4a3a1a" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="26" cy="51" r="3" fill="white" stroke="#4a3a1a" stroke-width="1"/>
  <circle cx="26" cy="51" r="1.5" fill="#111"/>
  <!-- Long antennae -->
  <line x1="26" y1="45" x2="10" y2="28" stroke="#4a3a1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="45" x2="16" y2="26" stroke="#4a3a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Abdomen -->
  <ellipse cx="70" cy="60" rx="10" ry="7" fill="#7a6a3a" stroke="#4a3a1a" stroke-width="1.5"/>
  <!-- Wing covers (chirping) -->
  <ellipse cx="52" cy="50" rx="16" ry="5" fill="#aa9a6a" stroke="#4a3a1a" stroke-width="1.5"/>
  <line x1="44" y1="50" x2="66" y2="50" stroke="#4a3a1a" stroke-width="1" stroke-linecap="round"/>
  <!-- Back jumping legs (longer than grasshopper) -->
  <path d="M63,65 L78,48 L90,72" fill="none" stroke="#4a3a1a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M56,66 L72,50 L84,73" fill="none" stroke="#4a3a1a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Middle legs -->
  <line x1="48" y1="65" x2="42" y2="78" stroke="#4a3a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Front legs -->
  <line x1="38" y1="62" x2="30" y2="74" stroke="#4a3a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- Abdomen stripes -->
  <line x1="62" y1="56" x2="62" y2="64" stroke="#4a3a1a" stroke-width="1" stroke-linecap="round"/>
  <line x1="67" y1="55" x2="67" y2="65" stroke="#4a3a1a" stroke-width="1" stroke-linecap="round"/>
