  <!-- Stocky body (low and wide) -->
  <ellipse cx="50" cy="78" rx="36" ry="14" fill="#dcb88a" stroke="#000" stroke-width="2.4"/>
  <!-- Short stubby legs -->
  <rect x="20" y="82" width="10" height="12" rx="3" fill="#dcb88a" stroke="#000" stroke-width="2.2"/>
  <rect x="70" y="82" width="10" height="12" rx="3" fill="#dcb88a" stroke="#000" stroke-width="2.2"/>
  <!-- Big square head -->
  <path d="M14 36 Q14 14 50 14 Q86 14 86 36 L86 56 Q86 72 50 72 Q14 72 14 56 Z" fill="#dcb88a" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Rose ears (small, fold-back) -->
  <path d="M14 24 L4 18 L8 32 Z" fill="#a87a4a" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M86 24 L96 18 L92 32 Z" fill="#a87a4a" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Forehead wrinkles (signature bulldog) -->
  <path d="M30 28 Q50 22 70 28" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 36 Q50 30 72 36" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes (wide set) -->
  <circle cx="30" cy="44" r="5" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <circle cx="30" cy="44" r="2.5" fill="#000"/>
  <circle cx="70" cy="44" r="5" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <circle cx="70" cy="44" r="2.5" fill="#000"/>
  <!-- Muzzle / jowls (wide, drooping) -->
  <path d="M22 52 Q22 72 50 74 Q78 72 78 52 Q70 56 50 56 Q30 56 22 52 Z" fill="#e8c89c" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Wrinkle on muzzle -->
  <path d="M34 56 Q50 58 66 56" fill="none" stroke="#000" stroke-width="1.8"/>
  <!-- Flat smushed nose -->
  <ellipse cx="50" cy="54" rx="9" ry="5" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <circle cx="46" cy="54" r="1.4" fill="#fff"/>
  <circle cx="54" cy="54" r="1.4" fill="#fff"/>
  <!-- Mouth with underbite -->
  <path d="M38 66 Q50 70 62 66" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Lower fangs (bottom teeth poking up - bulldog underbite) -->
  <polygon points="44,66 42,72 46,68" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <polygon points="56,66 58,72 54,68" fill="#fff" stroke="#000" stroke-width="1.5"/>
