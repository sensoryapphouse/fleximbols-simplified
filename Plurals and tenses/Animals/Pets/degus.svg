  <g transform="translate(-10.318 -16.333) scale(1.2075)">
<!-- Body: small slim rodent -->
  <ellipse cx="50" cy="65" rx="20" ry="16" fill="#c8b484" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Head -->
  <ellipse cx="50" cy="42" rx="14" ry="13" fill="#c8b484" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Ears: rounded -->
  <ellipse cx="40" cy="28" rx="6" ry="8" fill="#c8b484" stroke="#444" stroke-width="2"/>
  <ellipse cx="40" cy="28" rx="4" ry="5.5" fill="#e8a898"/>
  <ellipse cx="60" cy="28" rx="6" ry="8" fill="#c8b484" stroke="#444" stroke-width="2"/>
  <ellipse cx="60" cy="28" rx="4" ry="5.5" fill="#e8a898"/>
  <!-- Eyes: large -->
  <circle cx="44" cy="40" r="3" fill="#222"/>
  <circle cx="56" cy="40" r="3" fill="#222"/>
  <circle cx="45" cy="39" r="1" fill="white"/>
  <circle cx="57" cy="39" r="1" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="47" rx="2" ry="1.5" fill="#b08"/>
  <!-- Whiskers -->
  <line x1="50" y1="47" x2="32" y2="44" stroke="#888" stroke-width="1"/>
  <line x1="50" y1="47" x2="68" y2="44" stroke="#888" stroke-width="1"/>
  <line x1="50" y1="48" x2="32" y2="50" stroke="#888" stroke-width="1"/>
  <line x1="50" y1="48" x2="68" y2="50" stroke="#888" stroke-width="1"/>
  <!-- Tail: long slender with tuft -->
  <path d="M68,70 Q82,72 84,82" stroke="#a89464" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="85" cy="83" r="3" fill="#888" stroke="#444" stroke-width="1.5"/>
  <!-- Feet -->
  <ellipse cx="40" cy="80" rx="6" ry="3.5" fill="#b8a474" stroke="#444" stroke-width="1.5"/>
  <ellipse cx="60" cy="80" rx="6" ry="3.5" fill="#b8a474" stroke="#444" stroke-width="1.5"/>
  <!-- Front paws -->
  <ellipse cx="38" cy="70" rx="4" ry="3" fill="#b8a474" stroke="#444" stroke-width="1.5"/>
  <ellipse cx="62" cy="70" rx="4" ry="3" fill="#b8a474" stroke="#444" stroke-width="1.5"/>
</g>
