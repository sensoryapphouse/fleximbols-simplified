<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- high domed shell - tortoise has much higher dome than turtle -->
  <ellipse cx="50" cy="52" rx="32" ry="28" fill="#6a7a2a" stroke="#3a4a10" stroke-width="2.5"/>
  <!-- shell scute pattern -->
  <ellipse cx="50" cy="46" rx="14" ry="13" fill="#5a6a1a" stroke="#3a4a10" stroke-width="1.5"/>
  <ellipse cx="33" cy="49" rx="10" ry="9" fill="#5a6a1a" stroke="#3a4a10" stroke-width="1.5"/>
  <ellipse cx="67" cy="49" rx="10" ry="9" fill="#5a6a1a" stroke="#3a4a10" stroke-width="1.5"/>
  <ellipse cx="50" cy="62" rx="12" ry="8" fill="#5a6a1a" stroke="#3a4a10" stroke-width="1.5"/>
  <ellipse cx="36" cy="62" rx="8" ry="6" fill="#5a6a1a" stroke="#3a4a10" stroke-width="1.5"/>
  <ellipse cx="64" cy="62" rx="8" ry="6" fill="#5a6a1a" stroke="#3a4a10" stroke-width="1.5"/>
  <!-- head - wrinkled, pushed forward -->
  <ellipse cx="50" cy="32" rx="12" ry="10" fill="#8a8a4a" stroke="#3a4a10" stroke-width="2"/>
  <!-- neck wrinkles -->
  <path d="M43,38 Q50,35 57,38" fill="none" stroke="#3a4a10" stroke-width="1.5"/>
  <path d="M44,41 Q50,38 56,41" fill="none" stroke="#3a4a10" stroke-width="1.5"/>
  <!-- eyes -->
  <circle cx="44" cy="29" r="3" fill="#1a1a1a"/>
  <circle cx="44.8" cy="28.2" r="0.8" fill="white"/>
  <!-- hooked mouth -->
  <path d="M45,35 Q50,38 55,35" fill="none" stroke="#3a4a10" stroke-width="2" stroke-linecap="round"/>
  <!-- stumpy legs - elephant-like -->
  <ellipse cx="22" cy="72" rx="9" ry="6" fill="#8a8a4a" stroke="#3a4a10" stroke-width="2"/>
  <ellipse cx="78" cy="72" rx="9" ry="6" fill="#8a8a4a" stroke="#3a4a10" stroke-width="2"/>
  <ellipse cx="26" cy="82" rx="8" ry="5" fill="#8a8a4a" stroke="#3a4a10" stroke-width="2"/>
  <ellipse cx="74" cy="82" rx="8" ry="5" fill="#8a8a4a" stroke="#3a4a10" stroke-width="2"/>
