  <g transform="translate(-16.234 -16.946) scale(1.3260)">
<!-- Muscular body -->
  <ellipse cx="50" cy="62" rx="24" ry="19" fill="#c88840" stroke="#7a5520" stroke-width="2"/>
  <!-- White chest flash -->
  <ellipse cx="50" cy="66" rx="12" ry="10" fill="white" stroke="#ccc" stroke-width="1"/>
  <!-- Head - broad boxy -->
  <ellipse cx="50" cy="34" rx="18" ry="15" fill="#c88840" stroke="#7a5520" stroke-width="2"/>
  <!-- Black mask on face -->
  <ellipse cx="50" cy="38" rx="12" ry="10" fill="#2a1a0a" stroke="#111" stroke-width="1"/>
  <!-- White blaze -->
  <ellipse cx="50" cy="34" rx="4" ry="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <!-- Ears - floppy small -->
  <ellipse cx="35" cy="26" rx="6" ry="9" fill="#b07030" stroke="#7a5520" stroke-width="1.5" transform="rotate(10 35 26)"/>
  <ellipse cx="65" cy="26" rx="6" ry="9" fill="#b07030" stroke="#7a5520" stroke-width="1.5" transform="rotate(-10 65 26)"/>
  <!-- Eyes - dark alert -->
  <circle cx="43" cy="31" r="4" fill="#2c1810" stroke="#111" stroke-width="1.5"/>
  <circle cx="57" cy="31" r="4" fill="#2c1810" stroke="#111" stroke-width="1.5"/>
  <circle cx="42" cy="30" r="1.5" fill="white"/>
  <!-- Broad flat nose -->
  <ellipse cx="50" cy="40" rx="5" ry="4" fill="#1a0a00"/>
  <!-- Wide mouth/jowls -->
  <path d="M43 44 Q50 49 57 44" fill="none" stroke="#4a2810" stroke-width="2"/>
  <!-- Jowl wrinkles -->
  <path d="M44 44 Q42 47 44 49" fill="none" stroke="#4a2810" stroke-width="1"/>
  <path d="M56 44 Q58 47 56 49" fill="none" stroke="#4a2810" stroke-width="1"/>
  <!-- Short tail - docked -->
  <line x1="74" y1="63" x2="78" y2="58" stroke="#7a5520" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs - muscular -->
  <rect x="32" y="77" width="12" height="8" rx="3" fill="#c88840" stroke="#7a5520" stroke-width="1.5"/>
  <rect x="56" y="77" width="12" height="8" rx="3" fill="#c88840" stroke="#7a5520" stroke-width="1.5"/>
