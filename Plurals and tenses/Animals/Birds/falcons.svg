  <path d="M44 82 Q40 88 36 90" stroke="#d0a020" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M46 82 Q44 90 42 92" stroke="#d0a020" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M54 82 Q58 88 62 90" stroke="#d0a020" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M52 82 Q54 90 56 92" stroke="#d0a020" stroke-width="2" stroke-linecap="round" fill="none"/>
