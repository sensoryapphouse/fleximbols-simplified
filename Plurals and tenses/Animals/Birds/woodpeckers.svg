<!-- Tree trunk -->
  <rect x="58" y="20" width="12" height="65" fill="#a0724a" stroke="#5a3a1a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Tree top -->
  <ellipse cx="64" cy="22" rx="14" ry="18" fill="#4a7a3a" stroke="#2a4a1a" stroke-width="2"/>
  <!-- Woodpecker body -->
  <ellipse cx="42" cy="48" rx="12" ry="8" fill="#cc2200" stroke="#661100" stroke-width="2" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="32" cy="44" r="7" fill="#cc2200" stroke="#661100" stroke-width="2"/>
  <!-- Red crest -->
  <polygon points="32,37 29,30 35,36" fill="#ff3300" stroke="#661100" stroke-width="1.5"/>
  <!-- Black and white face -->
  <ellipse cx="29" cy="45" rx="4" ry="3" fill="white" stroke="#661100" stroke-width="1"/>
  <!-- Eye -->
  <circle cx="29" cy="44" r="1.5" fill="#111"/>
