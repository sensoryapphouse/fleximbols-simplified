  <polygon points="24,47 20,49 24,50" fill="#cc9900" stroke="#886600" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Wing -->
  <ellipse cx="44" cy="50" rx="9" ry="5" fill="#222" stroke="#111" stroke-width="1.5"/>
  <!-- White wing stripe -->
  <line x1="38" y1="48" x2="52" y2="52" stroke="white" stroke-width="1.5"/>
  <!-- Tail -->
  <polygon points="54,52 62,58 54,58" fill="#222" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Feet gripping tree -->
  <line x1="52" y1="54" x2="58" y2="52" stroke="#cc9900" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="57" x2="58" y2="56" stroke="#cc9900" stroke-width="2" stroke-linecap="round"/>
  <!-- Hammering marks -->
