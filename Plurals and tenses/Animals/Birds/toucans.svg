  <g transform="translate(-17.135 -24.219) scale(1.3559)">
<!-- Branch -->
  <rect x="20" y="78" width="60" height="7" rx="3" fill="#8a6040" stroke="#5a3818" stroke-width="2"/>
  <!-- Body: round black -->
  <ellipse cx="50" cy="62" rx="20" ry="18" fill="#222" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- White chest -->
  <ellipse cx="50" cy="64" rx="12" ry="12" fill="#f8f8e8" stroke="#ddd" stroke-width="1"/>
  <!-- Red belly band -->
  <path d="M40,72 Q50,76 60,72" stroke="#d03020" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Head: black round -->
  <ellipse cx="50" cy="38" rx="16" ry="15" fill="#222" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Huge colourful bill: iconic toucan feature -->
  <path d="M34,40 Q20,44 16,52 Q20,58 34,54 Q46,58 48,48 Z" fill="#e8b020" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
