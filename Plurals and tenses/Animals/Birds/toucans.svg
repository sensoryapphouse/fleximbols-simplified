  <path d="M34,42 Q24,45 20,50" stroke="#d82020" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Bill tip: darker -->
  <path d="M16,52 Q18,56 22,55" stroke="#8a6018" stroke-width="2" fill="none"/>
  <!-- Bill ridge line -->
  <line x1="48" y1="47" x2="16" y2="52" stroke="#c89010" stroke-width="1.5"/>
  <!-- Eye: white ring -->
  <circle cx="44" cy="34" r="4" fill="#5a8040" stroke="#333" stroke-width="1.5"/>
  <circle cx="44" cy="34" r="2.5" fill="#222"/>
  <circle cx="43" cy="33" r="0.8" fill="white"/>
  <!-- Tail: black pointed -->
  <path d="M62,72 Q72,78 70,86" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Feet on branch -->
  <line x1="42" y1="80" x2="38" y2="84" stroke="#555" stroke-width="2"/>
  <line x1="46" y1="80" x2="46" y2="85" stroke="#555" stroke-width="2"/>
  <line x1="54" y1="80" x2="54" y2="85" stroke="#555" stroke-width="2"/>
  <line x1="58" y1="80" x2="62" y2="84" stroke="#555" stroke-width="2"/>
