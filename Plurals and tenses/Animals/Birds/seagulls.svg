  <path d="M6 48 Q4 44 8 42 Q10 46 12 48" fill="#2a2a2a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- right wing -->
  <path d="M50 48 Q64 42 86 44 Q90 50 78 54 Q64 52 50 54 Z" fill="#f0f0f0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- right wing tip - black -->
  <path d="M86 44 Q92 42 94 48 Q90 54 78 54" fill="#2a2a2a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M94 48 Q96 44 92 42 Q90 46 88 48" fill="#2a2a2a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
