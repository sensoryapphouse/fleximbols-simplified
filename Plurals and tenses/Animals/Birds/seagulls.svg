<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- sky/sea context -->
  <path d="M5 70 Q20 66 35 70 Q50 74 65 70 Q80 66 95 70" fill="none" stroke="#5599cc" stroke-width="2" stroke-linecap="round"/>
  <path d="M5 76 Q20 72 35 76 Q50 80 65 76 Q80 72 95 76" fill="none" stroke="#88bbdd" stroke-width="1.5" stroke-linecap="round"/>
