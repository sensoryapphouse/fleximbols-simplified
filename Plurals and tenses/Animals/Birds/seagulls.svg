  <ellipse cx="50" cy="52" rx="10" ry="8" fill="#f0f0f0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- tail -->
  <path d="M44 58 Q50 62 56 58 Q54 66 50 68 Q46 66 44 58 Z" fill="#f0f0f0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
