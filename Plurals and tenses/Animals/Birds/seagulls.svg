  <circle cx="46" cy="34" r="10" fill="#f0f0f0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- yellow hooked bill (herring gull) -->
  <path d="M36 36 Q42 32 48 34 Q46 40 40 42 Z" fill="#e0c020" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- red spot on lower bill -->
  <circle cx="38" cy="39" r="2" fill="#e03020" stroke="#333" stroke-width="0.5"/>
  <!-- eye - pale yellow -->
  <circle cx="42" cy="30" r="3" fill="#e8d020" stroke="#333" stroke-width="1"/>
  <circle cx="42" cy="30" r="2" fill="#333"/>
  <circle cx="41.5" cy="29.5" r="0.7" fill="white"/>
  <!-- grey back/wing cover -->
  <path d="M34 50 Q50 46 66 50" fill="none" stroke="#9898a8" stroke-width="2" stroke-linecap="round"/>
