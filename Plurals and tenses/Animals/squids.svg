<!-- Squid: torpedo mantle, tail fin, tentacles -->
  <!-- Mantle: elongated tapered -->
  <path d="M50,15 Q68,18 72,40 Q70,55 50,62 Q30,55 28,40 Q32,18 50,15 Z" fill="#a888b0" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
