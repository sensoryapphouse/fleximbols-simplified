<!-- Ocean background -->
  <rect x="0" y="55" width="100" height="45" fill="#b3d9f0" rx="2"/>
  <!-- Blue whale body - enormous elongated -->
  <ellipse cx="46" cy="46" rx="38" ry="12" fill="#5575a0" stroke="#2a4060" stroke-width="2" stroke-linejoin="round"/>
  <!-- Head - rounded and large -->
  <ellipse cx="10" cy="48" rx="10" ry="9" fill="#5575a0" stroke="#2a4060" stroke-width="2"/>
  <!-- Belly light patch -->
  <ellipse cx="40" cy="53" rx="28" ry="5" fill="#8099b8" stroke="none"/>
  <!-- Pectoral fin -->
  <path d="M28 54 Q22 68 14 70 Q22 62 34 58Z" fill="#4060808" stroke="#2a4060" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Dorsal fin (tiny in blue whale) -->
  <path d="M68 36 Q70 30 72 36Z" fill="#406080" stroke="#2a4060" stroke-width="1.5"/>
  <!-- Tail flukes -->
  <path d="M82 38 Q93 28 96 36 Q91 41 87 43 Q92 49 94 54 Q89 49 84 44Z" fill="#406080" stroke="#2a4060" stroke-width="2" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle cx="7" cy="46" r="2" fill="#1a2530"/>
  <!-- Baleen plates hint -->
  <path d="M12 50 L14 54 M15 50 L17 54 M18 50 L20 54" stroke="#3a5070" stroke-width="1" stroke-linecap="round"/>
