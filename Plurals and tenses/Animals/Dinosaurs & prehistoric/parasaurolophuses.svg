  <!-- parasaurolophus - duck-billed dino with long backward crest -->
  <!-- tail -->
  <path d="M78,62 Q88,56 94,48 Q96,40 92,36" fill="none" stroke="#8aaa80" stroke-width="7" stroke-linecap="round"/>
  <path d="M78,62 Q88,56 94,48 Q96,40 92,36" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- body -->
  <path d="M26,62 Q28,44 40,36 Q55,28 72,36 Q82,44 80,62 Q76,74 52,76 Q30,76 26,62 Z" fill="#8aaa80" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- neck -->
  <path d="M30,56 Q22,44 20,30 Q24,18 32,20 Q38,22 38,38 Q38,50 40,58" fill="#8aaa80" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- head - duck bill -->
  <path d="M10,30 Q10,16 20,12 Q30,10 36,18 Q40,26 36,36 Q30,42 20,40 Z" fill="#8aaa80" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- long CREST pointing back-up -->
  <path d="M30,12 Q40,4 52,6 Q58,10 54,18 Q46,16 36,18 Q34,14 30,12 Z" fill="#9aba90" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- crest tube interior hint -->
  <path d="M32,14 Q42,8 52,10" fill="none" stroke="#7a9a70" stroke-width="1.5" stroke-linecap="round"/>
  <!-- duck bill extension -->
  <path d="M10,30 Q4,32 2,38 Q4,42 10,40" fill="#9aba90" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="20" cy="22" r="3" fill="#222"/>
  <!-- arm -->
  <path d="M38,54 Q30,60 26,68 Q28,70 32,70 Q36,64 42,58" fill="#7a9a70" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- legs -->
  <path d="M44,74 Q42,84 40,94 Q44,98 48,96 Q50,86 52,76" fill="#6a8a60" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M62,74 Q62,84 62,94 Q66,98 70,96 Q70,86 70,76" fill="#6a8a60" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
