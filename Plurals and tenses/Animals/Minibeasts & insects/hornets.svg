<!-- Hornet - large wasp, bold yellow-black -->
  <!-- Wings - large and papery -->
  <ellipse cx="36" cy="40" rx="20" ry="11" fill="#c8e0f8" stroke="#406090" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="64" cy="40" rx="20" ry="11" fill="#c8e0f8" stroke="#406090" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="38" cy="50" rx="15" ry="7" fill="#c8e0f8" stroke="#406090" stroke-width="1" opacity="0.7"/>
  <ellipse cx="62" cy="50" rx="15" ry="7" fill="#c8e0f8" stroke="#406090" stroke-width="1" opacity="0.7"/>
  <!-- Narrow waist (petiole) -->
  <rect x="46" y="54" width="8" height="6" rx="3" fill="#8a2010" stroke="#5a1008" stroke-width="1.5"/>
  <!-- Abdomen - large, bold pattern -->
  <ellipse cx="50" cy="70" rx="18" ry="14" fill="#e8b818" stroke="#806010" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bold black and reddish-brown stripes (hornet colours) -->
  <path d="M33 64 Q50 60 67 64" fill="none" stroke="#2a1408" stroke-width="6"/>
  <path d="M32 73 Q50 69 68 73" fill="none" stroke="#2a1408" stroke-width="6"/>
  <path d="M35 80 Q50 84 65 80 Q58 82 50 82 Q42 82 35 80Z" fill="#2a1408" stroke="#2a1408" stroke-width="1"/>
  <!-- Sharp stinger -->
  <path d="M50 84 Q52 90 50 93 Q48 90 50 84Z" fill="#2a1408" stroke="#1a0808" stroke-width="1"/>
  <!-- Thorax - robust -->
  <ellipse cx="50" cy="52" rx="12" ry="10" fill="#2a1408" stroke="#1a0808" stroke-width="2"/>
  <!-- Head - large -->
  <circle cx="50" cy="40" r="10" fill="#e8b818" stroke="#806010" stroke-width="2"/>
  <!-- Head pattern -->
  <path d="M40 36 Q50 32 60 36" fill="none" stroke="#2a1408" stroke-width="4"/>
  <!-- Large compound eyes -->
  <ellipse cx="42" cy="40" rx="5" ry="6" fill="#2a1408" stroke="#1a0808" stroke-width="1.5"/>
  <ellipse cx="58" cy="40" rx="5" ry="6" fill="#2a1408" stroke="#1a0808" stroke-width="1.5"/>
  <!-- Antennae -->
  <path d="M46 31 Q42 22 40 16" fill="none" stroke="#2a1408" stroke-width="2" stroke-linecap="round"/>
  <path d="M54 31 Q58 22 60 16" fill="none" stroke="#2a1408" stroke-width="2" stroke-linecap="round"/>
  <!-- Mandibles -->
  <path d="M44 46 L38 50 M56 46 L62 50" stroke="#8a4010" stroke-width="2" stroke-linecap="round"/>
