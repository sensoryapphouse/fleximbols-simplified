  <g transform="translate(-7.705 -12.444) scale(1.1552)">
<!-- Bumblebee - fat fuzzy body -->
  <!-- Wings -->
  <ellipse cx="38" cy="38" rx="18" ry="10" fill="#c8e0f8" stroke="#406090" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="62" cy="38" rx="18" ry="10" fill="#c8e0f8" stroke="#406090" stroke-width="1.5" opacity="0.85"/>
  <!-- Lower wings (smaller) -->
  <ellipse cx="40" cy="46" rx="14" ry="7" fill="#c8e0f8" stroke="#406090" stroke-width="1" opacity="0.7"/>
  <ellipse cx="60" cy="46" rx="14" ry="7" fill="#c8e0f8" stroke="#406090" stroke-width="1" opacity="0.7"/>
  <!-- Large fat abdomen -->
  <ellipse cx="50" cy="62" rx="22" ry="16" fill="#e8c020" stroke="#806010" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Black stripes on abdomen -->
  <path d="M28 58 Q50 54 72 58" fill="none" stroke="#1a1010" stroke-width="6"/>
  <path d="M28 68 Q50 64 72 68" fill="none" stroke="#1a1010" stroke-width="5"/>
  <!-- Black tip of abdomen -->
  <path d="M34 75 Q50 82 66 75 Q60 80 50 82 Q40 80 34 75Z" fill="#1a1010" stroke="#1a1010" stroke-width="1"/>
  <!-- Thorax -->
  <ellipse cx="50" cy="48" rx="12" ry="10" fill="#e8c020" stroke="#806010" stroke-width="2"/>
  <!-- Fuzzy thorax texture -->
  <path d="M40 44 L38 40 M43 42 L41 38 M47 41 L46 37 M53 41 L54 37 M57 42 L59 38 M60 44 L62 40" stroke="#c09010" stroke-width="1" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="50" cy="38" r="8" fill="#1a1010" stroke="#1a1010" stroke-width="1.5"/>
  <!-- Eyes (yellow) -->
  <circle cx="46" cy="35" r="3" fill="#d4c020" stroke="#1a1010" stroke-width="1"/>
  <circle cx="54" cy="35" r="3" fill="#d4c020" stroke="#1a1010" stroke-width="1"/>
  <!-- Antennae -->
  <path d="M47 31 Q44 22 42 16" fill="none" stroke="#1a1010" stroke-width="2" stroke-linecap="round"/>
  <path d="M53 31 Q56 22 58 16" fill="none" stroke="#1a1010" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="16" r="2.5" fill="#1a1010"/>
  <circle cx="58" cy="16" r="2.5" fill="#1a1010"/>
  <!-- Pollen baskets on legs -->
  <path d="M36 68 L28 76" stroke="#806010" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 68 L72 76" stroke="#806010" stroke-width="3" stroke-linecap="round"/>
  <!-- Pollen ball (yellow) -->
  <circle cx="26" cy="78" r="4" fill="#e8d040" stroke="#a08020" stroke-width="1.5"/>
  <circle cx="74" cy="78" r="4" fill="#e8d040" stroke="#a08020" stroke-width="1.5"/>
</g>
