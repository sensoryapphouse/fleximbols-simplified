<!-- Termite - pale/cream coloured, ant-like -->
  <!-- Abdomen - large, pale, soft-bodied -->
  <ellipse cx="68" cy="60" rx="20" ry="14" fill="#d8c8a0" stroke="#8a7840" stroke-width="2" stroke-linejoin="round"/>
  <!-- Abdomen segments -->
  <path d="M50 56 Q68 52 86 56" fill="none" stroke="#8a7840" stroke-width="1.5"/>
  <path d="M49 62 Q68 58 87 62" fill="none" stroke="#8a7840" stroke-width="1.5"/>
  <path d="M51 68 Q68 65 85 68" fill="none" stroke="#8a7840" stroke-width="1.5"/>
  <!-- Constricted waist (less narrow than ant) -->
  <path d="M46 58 Q50 56 54 58 Q52 64 46 64Z" fill="#c8b890" stroke="#8a7840" stroke-width="1.5"/>
  <!-- Thorax -->
  <ellipse cx="38" cy="58" rx="10" ry="8" fill="#d0c098" stroke="#8a7840" stroke-width="2"/>
  <!-- Head - large with mandibles -->
  <ellipse cx="22" cy="54" rx="13" ry="11" fill="#c0b088" stroke="#8a7840" stroke-width="2"/>
  <!-- Large mandibles (soldier termite) -->
  <path d="M10 50 Q4 46 3 50 Q4 54 10 56Z" fill="#c0b088" stroke="#8a7840" stroke-width="2" stroke-linejoin="round"/>
  <!-- Compound eyes (small, or absent in workers) -->
  <circle cx="18" cy="50" r="2.5" fill="#706050" stroke="#5a4830" stroke-width="1"/>
  <!-- Short antennae (beaded, not elbowed) -->
  <path d="M18 44 Q16 36 18 28" fill="none" stroke="#8a7840" stroke-width="2" stroke-linecap="round"/>
  <!-- Beaded antennae dots -->
  <circle cx="18" cy="40" r="1.5" fill="#8a7840"/>
  <circle cx="18" cy="34" r="1.5" fill="#8a7840"/>
  <circle cx="18" cy="28" r="1.5" fill="#8a7840"/>
  <path d="M24 44 Q26 36 24 28" fill="none" stroke="#8a7840" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="40" r="1.5" fill="#8a7840"/>
  <circle cx="24" cy="34" r="1.5" fill="#8a7840"/>
  <circle cx="24" cy="28" r="1.5" fill="#8a7840"/>
  <!-- Six legs - pale -->
  <path d="M34 54 Q26 50 20 54" stroke="#8a7840" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M34 62 Q24 60 18 66 Q16 72 18 76" stroke="#8a7840" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M42 54 Q50 48 56 52" stroke="#8a7840" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M42 62 Q52 60 58 66 Q62 72 60 76" stroke="#8a7840" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M58 56 Q68 50 74 54" stroke="#8a7840" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M60 66 Q70 68 76 74 Q78 80 76 82" stroke="#8a7840" stroke-width="2" stroke-linecap="round" fill="none"/>
