<!-- Damselfly - narrow wings held along body when resting -->
  <!-- Slender body -->
  <rect x="46" y="22" width="8" height="55" rx="4" fill="#3070b8" stroke="#102850" stroke-width="2"/>
  <!-- Head -->
  <circle cx="50" cy="19" r="7" fill="#3070b8" stroke="#102850" stroke-width="2"/>
  <!-- Large compound eyes -->
  <circle cx="45" cy="16" r="4" fill="#20a020" stroke="#102850" stroke-width="1.5"/>
  <circle cx="55" cy="16" r="4" fill="#20a020" stroke="#102850" stroke-width="1.5"/>
  <!-- Wing pairs - narrow and held along body (damselfly not dragonfly) -->
  <!-- Upper wings -->
  <path d="M50 35 Q30 28 14 30 Q10 36 16 40 Q30 42 50 38" fill="#c8e0f8" stroke="#102850" stroke-width="1.5" stroke-linejoin="round" opacity="0.85"/>
  <path d="M50 35 Q70 28 86 30 Q90 36 84 40 Q70 42 50 38" fill="#c8e0f8" stroke="#102850" stroke-width="1.5" stroke-linejoin="round" opacity="0.85"/>
  <!-- Lower wings (slightly shorter) -->
  <path d="M50 42 Q32 36 18 38 Q14 43 20 47 Q34 49 50 46" fill="#c8e0f8" stroke="#102850" stroke-width="1.5" stroke-linejoin="round" opacity="0.85"/>
  <path d="M50 42 Q68 36 82 38 Q86 43 80 47 Q66 49 50 46" fill="#c8e0f8" stroke="#102850" stroke-width="1.5" stroke-linejoin="round" opacity="0.85"/>
  <!-- Wing veins -->
  <path d="M50 37 L20 33 M50 37 L80 33" stroke="#a0b8d0" stroke-width="0.5"/>
  <path d="M50 44 L22 41 M50 44 L78 41" stroke="#a0b8d0" stroke-width="0.5"/>
  <!-- Body segments -->
  <path d="M46 30 L54 30 M46 38 L54 38 M46 46 L54 46 M46 54 L54 54 M46 62 L54 62 M46 70 L54 70" stroke="#102850" stroke-width="1" opacity="0.5"/>
  <!-- Body colour bands (metallic blue) -->
  <rect x="46" y="50" width="8" height="8" rx="1" fill="#60a0e8" stroke="none"/>
  <rect x="46" y="62" width="8" height="8" rx="1" fill="#60a0e8" stroke="none"/>
  <!-- Tail tip -->
  <ellipse cx="50" cy="76" rx="4" ry="3" fill="#60a0e8" stroke="#102850" stroke-width="1.5"/>
  <!-- Antennae -->
  <path d="M47 13 Q44 8 42 4" fill="none" stroke="#102850" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M53 13 Q56 8 58 4" fill="none" stroke="#102850" stroke-width="1.5" stroke-linecap="round"/>
