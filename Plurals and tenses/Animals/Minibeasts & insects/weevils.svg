  <g transform="translate(-25.280 -31.902) scale(1.5071)">
<!-- Weevil - long-snouted beetle -->
  <!-- Elytra - oval body -->
  <ellipse cx="50" cy="60" rx="22" ry="18" fill="#5a3820" stroke="#2a1808" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Elytra line -->
  <path d="M50 43 L50 77" stroke="#2a1808" stroke-width="1.5"/>
  <!-- Textured elytra striae -->
  <path d="M38 50 Q42 48 44 56 Q42 64 38 68" fill="none" stroke="#3a2810" stroke-width="1" opacity="0.6"/>
  <path d="M62 50 Q58 48 56 56 Q58 64 62 68" fill="none" stroke="#3a2810" stroke-width="1" opacity="0.6"/>
  <!-- Pronotum -->
  <ellipse cx="50" cy="44" rx="14" ry="9" fill="#5a3820" stroke="#2a1808" stroke-width="2"/>
  <!-- Head - small -->
  <circle cx="50" cy="35" r="7" fill="#4a2818" stroke="#2a1808" stroke-width="2"/>
  <!-- LONG ROSTRUM/SNOUT - key weevil feature -->
  <path d="M50 40 Q50 52 50 60" fill="none" stroke="#4a2818" stroke-width="4" stroke-linecap="round"/>
  <rect x="47" y="38" width="6" height="22" rx="3" fill="#4a2818" stroke="#2a1808" stroke-width="1.5"/>
  <!-- Antennae emerging from snout midpoint (elbowed) -->
  <path d="M47 48 Q38 44 32 40" fill="none" stroke="#2a1808" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M53 48 Q62 44 68 40" fill="none" stroke="#2a1808" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Club ends on antennae -->
  <circle cx="31" cy="39" r="2.5" fill="#2a1808"/>
  <circle cx="69" cy="39" r="2.5" fill="#2a1808"/>
  <!-- Eyes on head -->
  <circle cx="44" cy="33" r="2.5" fill="#2a1808" stroke="#1a0808" stroke-width="1"/>
  <circle cx="56" cy="33" r="2.5" fill="#2a1808" stroke="#1a0808" stroke-width="1"/>
  <!-- Legs -->
  <path d="M34 50 L22 56 M32 60 L20 66 M34 70 L24 78" stroke="#2a1808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M66 50 L78 56 M68 60 L80 66 M66 70 L76 78" stroke="#2a1808" stroke-width="2" stroke-linecap="round" fill="none"/>
</g>
