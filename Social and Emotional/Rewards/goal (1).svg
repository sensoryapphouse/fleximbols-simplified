<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Bullseye target -->
  <circle cx="50" cy="45" r="34" fill="#e07070" stroke="#333" stroke-width="2.5"/>
  <circle cx="50" cy="45" r="24" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="50" cy="45" r="15" fill="#e07070" stroke="#333" stroke-width="2"/>
  <circle cx="50" cy="45" r="6" fill="#cc2020" stroke="#333" stroke-width="2"/>
  <!-- Arrow hitting bullseye -->
  <line x1="82" y1="13" x2="53" y2="42" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="53,42 62,18 74,28" fill="#555"/>
  <!-- Arrow tail flights -->
  <line x1="82" y1="13" x2="88" y2="8" stroke="#555" stroke-width="2"/>
  <line x1="80" y1="16" x2="86" y2="8" stroke="#555" stroke-width="2"/>
</svg>
