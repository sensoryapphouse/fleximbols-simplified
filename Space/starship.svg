<!-- rocket body - tall stainless steel look -->
  <rect x="35" y="15" width="30" height="60" rx="5" fill="#d8d8d8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- nose cone -->
  <path d="M35 15 Q50 5 65 15" fill="#c8c8c8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- grid fins at top -->
  <rect x="28" y="18" width="7" height="10" rx="1" fill="#b0b0b8" stroke="#555" stroke-width="1.5"/>
  <rect x="65" y="18" width="7" height="10" rx="1" fill="#b0b0b8" stroke="#555" stroke-width="1.5"/>
  <!-- body flaps at bottom -->
  <polygon points="35,62 22,72 35,70" fill="#b8b8c0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="65,62 78,72 65,70" fill="#b8b8c0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- engines - raptor ring -->
  <ellipse cx="50" cy="76" rx="15" ry="5" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- flames -->
  <polygon points="38,76 50,90 62,76" fill="#f5c842" stroke="#e07820" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="42,76 50,85 58,76" fill="#f07020" stroke="none"/>
  <!-- windows -->
  <circle cx="50" cy="28" r="4" fill="#c0d8f0" stroke="#555" stroke-width="2"/>
  <!-- stripes -->
  <line x1="35" y1="45" x2="65" y2="45" stroke="#c0c0c0" stroke-width="2"/>
</svg>