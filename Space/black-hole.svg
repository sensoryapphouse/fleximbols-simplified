<!-- Accretion disk - light bending around black hole -->
  <!-- Outer glow ring -->
  <ellipse cx="50" cy="48" rx="38" ry="12" fill="none" stroke="#e8a020" stroke-width="4" opacity="0.8"/>
  <ellipse cx="50" cy="48" rx="38" ry="12" fill="none" stroke="#ffcc60" stroke-width="2" opacity="0.6"/>
  <!-- Hot gas disk behind -->
  <ellipse cx="50" cy="50" rx="34" ry="10" fill="#c06010" opacity="0.5"/>
  <!-- Upper half of disk (in front) -->
  <path d="M12,48 A38,12 0 0,1 88,48" fill="#c06010" stroke="#e8a020" stroke-width="2" opacity="0.7"/>
  <!-- Black hole shadow -->
  <circle cx="50" cy="48" r="18" fill="#05050f" stroke="none"/>
  <!-- Photon sphere / event horizon glow -->
  <circle cx="50" cy="48" r="20" fill="none" stroke="#ffaa30" stroke-width="2" opacity="0.5"/>
  <circle cx="50" cy="48" r="17" fill="none" stroke="#ff8010" stroke-width="1" opacity="0.4"/>
  <!-- Gravitational lensing arcs -->
  <path d="M18,38 Q10,25 30,20" fill="none" stroke="#ffcc60" stroke-width="1.5" opacity="0.6"/>
  <path d="M82,38 Q90,25 70,20" fill="none" stroke="#ffcc60" stroke-width="1.5" opacity="0.6"/>
  <!-- Stars distorted near edges -->
  <circle cx="15" cy="30" r="1" fill="white" opacity="0.8"/>
  <circle cx="85" cy="28" r="1" fill="white" opacity="0.8"/>
  <circle cx="8" cy="55" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="92" cy="52" r="0.8" fill="white" opacity="0.6"/>
</svg>
