<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Central body -->
  <rect x="38" y="38" width="24" height="24" rx="3" fill="#b0b8c8" stroke="#333" stroke-width="2.5"/>
  <!-- Solar panel left -->
  <rect x="8" y="42" width="26" height="16" rx="2" fill="#4a6ea8" stroke="#333" stroke-width="2"/>
  <!-- Solar panel right -->
  <rect x="66" y="42" width="26" height="16" rx="2" fill="#4a6ea8" stroke="#333" stroke-width="2"/>
  <!-- Panel cells left -->
  <line x1="21" y1="42" x2="21" y2="58" stroke="#2a4e88" stroke-width="1.5"/>
  <line x1="8" y1="50" x2="34" y2="50" stroke="#2a4e88" stroke-width="1.5"/>
  <!-- Panel cells right -->
  <line x1="79" y1="42" x2="79" y2="58" stroke="#2a4e88" stroke-width="1.5"/>
  <line x1="66" y1="50" x2="92" y2="50" stroke="#2a4e88" stroke-width="1.5"/>
  <!-- Arms -->
  <line x1="34" y1="50" x2="38" y2="50" stroke="#333" stroke-width="3"/>
  <line x1="62" y1="50" x2="66" y2="50" stroke="#333" stroke-width="3"/>
  <!-- Antenna -->
  <line x1="50" y1="38" x2="50" y2="26" stroke="#333" stroke-width="2"/>
  <circle cx="50" cy="24" r="4" fill="#e8b040" stroke="#333" stroke-width="2"/>
  <!-- Body detail -->
  <circle cx="50" cy="50" r="5" fill="#d8e0f0" stroke="#333" stroke-width="1.5"/>
</svg>
