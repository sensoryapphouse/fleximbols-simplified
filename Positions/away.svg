<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Open box shifted LEFT to make the motion-distance clear -->
  <rect x="20" y="270" width="232" height="44" fill="#7a5028" stroke="#000000" stroke-width="5"/>
  <path d="M 20 314 L 252 314 L 268 326 L 4 326 Z" fill="#a06840" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="2" y="326" width="270" height="94" fill="#caa379" stroke="#000000" stroke-width="5"/>

  <!-- Long, thick rightward arrow from the box edge to just behind the ball -->
  <rect x="272" y="356" width="120" height="28" fill="#2eb05a" stroke="#000000" stroke-width="5"/>
  <polygon points="430,370 388,338 388,402" fill="#2eb05a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Ball clearly distant from the box, with motion-trail behind it -->
  <line x1="436" y1="350" x2="448" y2="350" stroke="#000000" stroke-width="5"/>
  <line x1="436" y1="370" x2="448" y2="370" stroke="#000000" stroke-width="5"/>
  <line x1="436" y1="390" x2="448" y2="390" stroke="#000000" stroke-width="5"/>
  <circle cx="468" cy="370" r="38" fill="#e74c3c" stroke="#000000" stroke-width="5"/>
  <circle cx="454" cy="356" r="11" fill="#f7b8b0"/>
</svg>
