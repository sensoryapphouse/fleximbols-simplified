<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- three boxes in a row -->
  <rect x="50"  y="180" width="120" height="140" fill="#cccccc" stroke="#000000" stroke-width="5" rx="6"/>
  <rect x="196" y="148" width="120" height="204" fill="#f1c40f" stroke="#000000" stroke-width="6" rx="6"/>
  <rect x="342" y="180" width="120" height="140" fill="#cccccc" stroke="#000000" stroke-width="5" rx="6"/>
  <!-- arrows pointing at center box from both sides -->
  <line x1="110" y1="418" x2="196" y2="370" stroke="#27ae60" stroke-width="10" stroke-linecap="round"/>
  <line x1="402" y1="418" x2="316" y2="370" stroke="#27ae60" stroke-width="10" stroke-linecap="round"/>
  <polygon points="256,350 234,376 278,376" fill="#27ae60" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- dot in exact centre of middle box -->
  <circle cx="256" cy="250" r="12" fill="#1a1a1a"/>
</svg>
