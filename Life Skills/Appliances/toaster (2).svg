<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Toaster body -->
  <rect x="12" y="42" width="76" height="40" rx="6" fill="#d0c8b0" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Slots (2) -->
  <rect x="24" y="36" width="18" height="20" rx="3" fill="#555" stroke="#555" stroke-width="2"/>
  <rect x="58" y="36" width="18" height="20" rx="3" fill="#555" stroke="#555" stroke-width="2"/>
  <!-- Toast sticking up -->
  <rect x="27" y="24" width="12" height="16" rx="2" fill="#f5d97a" stroke="#c8a046" stroke-width="2"/>
  <rect x="61" y="26" width="12" height="14" rx="2" fill="#e8b840" stroke="#c8a046" stroke-width="2"/>
  <!-- Crumb tray -->
  <rect x="14" y="78" width="72" height="5" rx="2" fill="#c0b898" stroke="#555" stroke-width="1.5"/>
  <!-- Side lever -->
  <rect x="82" y="50" width="6" height="20" rx="2" fill="#aaa" stroke="#555" stroke-width="2"/>
  <rect x="80" y="54" width="10" height="5" rx="2" fill="#999" stroke="#555" stroke-width="1.5"/>
  <!-- Dial -->
  <circle cx="24" cy="66" r="7" fill="#aaa" stroke="#555" stroke-width="2"/>
  <line x1="24" y1="66" x2="24" y2="60" stroke="#555" stroke-width="2" stroke-linecap="round"/>
</svg>
