  <!-- Tenant: person with key, small apartment/door behind -->
  <!-- Door/apartment entrance -->
  <rect x="55" y="20" width="36" height="72" rx="4" fill="#f5e6c8" stroke="#333" stroke-width="2.5"/>
  <path d="M53 24 L73 6 L93 24Z" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- Door proper -->
  <rect x="63" y="45" width="20" height="47" rx="3" fill="#c8a96e" stroke="#333" stroke-width="2"/>
  <!-- Door knob -->
  <circle cx="77" cy="70" r="3" fill="#333"/>
  <!-- Apartment number -->
  <text x="65" y="40" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="10" font-weight="bold" fill="#555">3B</text>
  <!-- Letterbox/mailbox -->
  <rect x="58" y="30" width="12" height="8" rx="2" fill="#888" stroke="#333" stroke-width="1.5"/>
  <line x1="58" y1="34" x2="70" y2="34" stroke="#333" stroke-width="1"/>
  <!-- Tenant person (left, holding key) -->
  <circle cx="24" cy="26" r="12" fill="#f5c87a" stroke="#333" stroke-width="2.5"/>
  <circle cx="19" cy="23" r="2" fill="#333"/>
  <circle cx="29" cy="23" r="2" fill="#333"/>
  <path d="M19 31 Q24 35 29 31" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <rect x="13" y="39" width="22" height="22" rx="4" fill="#5577e0" stroke="#333" stroke-width="2.5"/>
  <line x1="17" y1="61" x2="14" y2="82" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="61" x2="33" y2="82" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Key in extended hand (reaching toward door) -->
  <line x1="35" y1="46" x2="52" y2="52" stroke="#f5c87a" stroke-width="3" stroke-linecap="round"/>
  <!-- Key -->
  <circle cx="56" cy="54" r="5" fill="#f5c87a" stroke="#333" stroke-width="2"/>
  <circle cx="56" cy="54" r="2" fill="none" stroke="#333" stroke-width="1.5"/>
