<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Probate: legal validation of a will (document with signature + wax seal, plus a judge's gavel) -->
  <!-- Will / document -->
  <rect x="30" y="10" width="44" height="62" rx="3" fill="#f9f3df" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ruled text lines -->
  <g stroke="#9a9a8c" stroke-width="2" stroke-linecap="round">
    <line x1="37" y1="20" x2="67" y2="20"/>
    <line x1="37" y1="27" x2="67" y2="27"/>
    <line x1="37" y1="34" x2="67" y2="34"/>
    <line x1="37" y1="41" x2="60" y2="41"/>
  </g>
  <!-- signature line + signature scribble -->
  <line x1="37" y1="55" x2="67" y2="55" stroke="#333" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M39 53 q3 -5 6 0 t6 0 q3 -4 5 -1" fill="none" stroke="#2a4a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- red wax seal (validated) -->
  <circle cx="62" cy="64" r="7" fill="#d23b3b" stroke="#9a1f1f" stroke-width="2"/>
  <path d="M62 60 l1.2 2.4 2.6 .3 -1.9 1.8 .5 2.6 -2.4 -1.3 -2.4 1.3 .5 -2.6 -1.9 -1.8 2.6 -.3 z" fill="#f0b0b0" stroke="none"/>

  <!-- Judge's gavel across the front -->
  <g transform="rotate(38 46 76)">
    <!-- handle -->
    <rect x="46" y="72" width="28" height="8" rx="4" fill="#c8a87c" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- head -->
    <rect x="16" y="66" width="32" height="20" rx="5" fill="#b98e5e" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- end bands on head -->
    <rect x="20" y="66" width="5" height="20" rx="1.5" fill="#9a704a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
    <rect x="39" y="66" width="5" height="20" rx="1.5" fill="#9a704a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- sound block -->
  <rect x="16" y="88" width="40" height="9" rx="4" fill="#d4b48c" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
