<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Soccer/football ball -->
  <circle cx="50" cy="50" r="36" fill="white" stroke="#333" stroke-width="2.5"/>
  <!-- Pentagon patches (black) - classic soccer ball pattern -->
  <!-- Centre pentagon -->
  <polygon points="50,26 60,34 56,46 44,46 40,34" fill="#333" stroke="#333" stroke-width="1"/>
  <!-- Top left -->
  <polygon points="28,30 38,26 40,34 30,40 22,36" fill="#333" stroke="#333" stroke-width="1"/>
  <!-- Top right -->
  <polygon points="72,30 78,36 70,40 60,34 62,26" fill="#333" stroke="#333" stroke-width="1"/>
  <!-- Left -->
  <polygon points="16,52 22,44 30,50 26,62 18,62" fill="#333" stroke="#333" stroke-width="1"/>
  <!-- Right -->
  <polygon points="84,52 82,62 74,62 70,50 78,44" fill="#333" stroke="#333" stroke-width="1"/>
  <!-- Bottom left -->
  <polygon points="26,70 30,60 40,64 38,76 28,78" fill="#333" stroke="#333" stroke-width="1"/>
  <!-- Bottom right -->
  <polygon points="74,70 72,78 62,76 60,64 70,60" fill="#333" stroke="#333" stroke-width="1"/>
  <!-- Bottom -->
  <polygon points="44,78 56,78 58,68 50,64 42,68" fill="#333" stroke="#333" stroke-width="1"/>
</svg>
