<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- House outline -->
  <polygon points="50,10 85,35 85,82 15,82 15,35" fill="#f0e8d8" stroke="#334" stroke-width="2"/>
  <polygon points="50,10 85,35 15,35" fill="#c09870" stroke="#334" stroke-width="2"/>
  <!-- Door -->
  <rect x="42" y="60" width="16" height="22" rx="2" fill="#8a6040" stroke="#334" stroke-width="2"/>
  <circle cx="55" cy="72" r="1.5" fill="#f5c842"/>
  <!-- Window left -->
  <rect x="20" y="44" width="16" height="14" rx="2" fill="#d0e8f8" stroke="#334" stroke-width="2"/>
  <line x1="28" y1="44" x2="28" y2="58" stroke="#334" stroke-width="1"/>
  <line x1="20" y1="51" x2="36" y2="51" stroke="#334" stroke-width="1"/>
  <!-- Window right -->
  <rect x="64" y="44" width="16" height="14" rx="2" fill="#d0e8f8" stroke="#334" stroke-width="2"/>
  <line x1="72" y1="44" x2="72" y2="58" stroke="#334" stroke-width="1"/>
  <line x1="64" y1="51" x2="80" y2="51" stroke="#334" stroke-width="1"/>
  <!-- Figures in front: tall (dad), tall (mum), small (child) -->
  <!-- Dad -->
  <circle cx="22" cy="66" r="5" fill="#f5c8a0" stroke="#c09070" stroke-width="1.5"/>
  <rect x="19" y="71" width="6" height="10" rx="2" fill="#5a8fb5" stroke="#334" stroke-width="1.5"/>
  <!-- Mum -->
  <circle cx="78" cy="66" r="5" fill="#f5c8a0" stroke="#c09070" stroke-width="1.5"/>
  <path d="M73,71 Q78,68 83,71 L83,81 L73,81 Z" fill="#e06080" stroke="#334" stroke-width="1.5"/>
  <!-- Child -->
  <circle cx="50" cy="70" r="4" fill="#f5c8a0" stroke="#c09070" stroke-width="1.5"/>
  <rect x="47" y="74" width="6" height="8" rx="2" fill="#8bc4a0" stroke="#334" stroke-width="1.5"/>
</svg>
