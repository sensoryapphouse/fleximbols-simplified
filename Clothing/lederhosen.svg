<!-- lederhosen - leather breeches -->
  <!-- bib front -->
  <rect x="33" y="20" width="34" height="28" rx="4" fill="#8b5e3c" stroke="#333" stroke-width="2.5"/>
  <!-- bib top edge decorative -->
  <path d="M33 28 h34" stroke="#c8a050" stroke-width="2"/>
  <!-- H-strap left -->
  <rect x="36" y="14" width="6" height="20" rx="2" fill="#8b5e3c" stroke="#333" stroke-width="2"/>
  <!-- H-strap right -->
  <rect x="58" y="14" width="6" height="20" rx="2" fill="#8b5e3c" stroke="#333" stroke-width="2"/>
  <!-- cross strap on shoulders -->
  <path d="M36 18 L64 18" stroke="#8b5e3c" stroke-width="4" stroke-linecap="round"/>
  <path d="M36 18 L64 18" stroke="#333" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- decorative embroidery on bib -->
  <path d="M40 32 Q50 26 60 32" stroke="#4a7c3f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="28" r="2" fill="#4a7c3f"/>
  <!-- oak leaf embroidery -->
  <path d="M44 36 Q47 32 50 36 Q53 32 56 36" stroke="#c8a050" stroke-width="1.5" fill="none"/>
  <!-- pant legs -->
  <path d="M33 46 L28 82 L46 82 L50 60 L54 82 L72 82 L67 46 Z" fill="#8b5e3c" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- knee crease lines -->
  <path d="M32 66 Q39 63 46 66" stroke="#6b4020" stroke-width="1.5" fill="none"/>
  <path d="M54 66 Q61 63 68 66" stroke="#6b4020" stroke-width="1.5" fill="none"/>
  <!-- belt/waistband area -->
  <rect x="30" y="44" width="40" height="6" rx="1" fill="#6b4020" stroke="#333" stroke-width="1.5"/>
  <!-- buckle -->
  <rect x="46" y="44" width="8" height="6" rx="1" fill="#c8a050" stroke="#333" stroke-width="1.5"/>
