  <!-- left sleeve -->
  <path d="M25 35 L10 42 L12 52 L25 46 Z" fill="#aed6f1" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- right sleeve -->
  <path d="M75 35 L90 42 L88 52 L75 46 Z" fill="#aed6f1" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- collar left -->
  <path d="M38 28 L45 38 L50 32 Z" fill="white" stroke="#555" stroke-width="2"/>
  <!-- collar right -->
  <path d="M62 28 L55 38 L50 32 Z" fill="white" stroke="#555" stroke-width="2"/>
  <!-- buttons -->
  <circle cx="50" cy="47" r="2" fill="white" stroke="#555" stroke-width="1.5"/>
  <circle cx="50" cy="56" r="2" fill="white" stroke="#555" stroke-width="1.5"/>
  <circle cx="50" cy="65" r="2" fill="white" stroke="#555" stroke-width="1.5"/>
  <!-- label -->
</svg>
