<!-- Vermicomposting: stacked trays + worms -->
  <!-- Bottom tray -->
  <rect x="15" y="65" width="70" height="14" rx="3" fill="#8B6914" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Middle tray -->
  <rect x="15" y="48" width="70" height="14" rx="3" fill="#a07820" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top tray (with lid slightly open showing contents) -->
  <rect x="15" y="31" width="70" height="14" rx="3" fill="#b08c30" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lid -->
  <rect x="13" y="25" width="74" height="8" rx="3" fill="#5d4037" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lid handle -->
  <rect x="42" y="21" width="16" height="6" rx="2" fill="#3a2018" stroke="#222" stroke-width="1.5"/>
  <!-- Worms in top tray (squiggly lines) -->
  <path d="M25,37 Q28,34 31,37 Q34,40 37,37" fill="none" stroke="#c84a20" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42,39 Q45,36 48,39 Q51,42 54,39" fill="none" stroke="#c84a20" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M58,36 Q62,33 66,36 Q70,39 74,36" fill="none" stroke="#c84a20" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tray ventilation holes (middle tray) -->
  <circle cx="28" cy="55" r="2" fill="#3a2018" stroke="#333" stroke-width="1"/>
  <circle cx="40" cy="55" r="2" fill="#3a2018" stroke="#333" stroke-width="1"/>
  <circle cx="52" cy="55" r="2" fill="#3a2018" stroke="#333" stroke-width="1"/>
  <circle cx="64" cy="55" r="2" fill="#3a2018" stroke="#333" stroke-width="1"/>
  <circle cx="76" cy="55" r="2" fill="#3a2018" stroke="#333" stroke-width="1"/>
  <!-- Legs -->
  <rect x="18" y="79" width="6" height="6" rx="1" fill="#555" stroke="#333" stroke-width="1.5"/>
  <rect x="76" y="79" width="6" height="6" rx="1" fill="#555" stroke="#333" stroke-width="1.5"/>
