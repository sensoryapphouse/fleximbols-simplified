  <g transform="translate(-6.109 -6.584) scale(1.2160)">
<!-- Hand with fingers raised for counting -->
  <!-- Palm -->
  <rect x="32" y="52" width="36" height="24" rx="8" fill="#f5c8a0" stroke="#333" stroke-width="2"/>
  <!-- Fingers - all raised -->
  <!-- Finger 1 (pinky) -->
  <rect x="34" y="34" width="6" height="22" rx="3" fill="#f5c8a0" stroke="#333" stroke-width="1.5"/>
  <!-- Finger 2 (ring) -->
  <rect x="42" y="28" width="6" height="28" rx="3" fill="#f5c8a0" stroke="#333" stroke-width="1.5"/>
  <!-- Finger 3 (middle) -->
  <rect x="50" y="24" width="6" height="32" rx="3" fill="#f5c8a0" stroke="#333" stroke-width="1.5"/>
  <!-- Finger 4 (index) -->
  <rect x="58" y="28" width="6" height="28" rx="3" fill="#f5c8a0" stroke="#333" stroke-width="1.5"/>
  <!-- Thumb -->
  <rect x="24" y="46" width="12" height="6" rx="3" fill="#f5c8a0" stroke="#333" stroke-width="1.5"/>
  <!-- Count numbers next to fingers -->
  <text x="28" y="32" font-size="8" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">1</text>
  <text x="36" y="26" font-size="8" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">2</text>
  <text x="44" y="22" font-size="8" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">3</text>
  <text x="52" y="26" font-size="8" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">4</text>
  <text x="60" y="28" font-size="8" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">5</text>
</g>
  </svg>
