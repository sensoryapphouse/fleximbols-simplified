<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="white"/>
  <!-- Red "100" emoji style -->
  <!-- "1" -->
  <text x="30" y="290" font-family="Arial Black, Arial, sans-serif" font-size="240" font-weight="900" fill="#e60026" stroke="#1a1a1a" stroke-width="5" paint-order="stroke fill">1</text>
  <!-- "00" -->
  <text x="145" y="290" font-family="Arial Black, Arial, sans-serif" font-size="240" font-weight="900" fill="#e60026" stroke="#1a1a1a" stroke-width="5" paint-order="stroke fill">00</text>
  <!-- Double underline -->
  <line x1="30" y1="320" x2="482" y2="320" stroke="#e60026" stroke-width="14" stroke-linecap="round"/>
  <line x1="30" y1="348" x2="482" y2="348" stroke="#e60026" stroke-width="10" stroke-linecap="round"/>
</svg>
