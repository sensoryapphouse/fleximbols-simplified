<!-- tambourine - circular hand drum with jingles -->
  <!-- main frame ring -->
  <circle cx="50" cy="48" r="32" fill="none" stroke="#795548" stroke-width="8"/>
  <!-- drum head (membrane) -->
  <circle cx="50" cy="48" r="28" fill="#ffe0b2" stroke="#a1887f" stroke-width="1.5"/>
  <!-- skin texture lines -->
  <circle cx="50" cy="48" r="20" fill="none" stroke="#d7ccc8" stroke-width="1"/>
  <circle cx="50" cy="48" r="12" fill="none" stroke="#d7ccc8" stroke-width="1"/>
  <!-- jingles/zills in slots around the frame -->
  <!-- top -->
  <ellipse cx="50" cy="16" rx="5" ry="3" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5"/>
  <ellipse cx="50" cy="14" rx="5" ry="3" fill="#ffcc02" stroke="#f9a825" stroke-width="1.5"/>
  <!-- top-right -->
  <ellipse cx="68" cy="24" rx="5" ry="3" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" transform="rotate(45 68 24)"/>
  <ellipse cx="70" cy="22" rx="5" ry="3" fill="#ffcc02" stroke="#f9a825" stroke-width="1.5" transform="rotate(45 70 22)"/>
  <!-- right -->
  <ellipse cx="80" cy="42" rx="5" ry="3" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" transform="rotate(90 80 42)"/>
  <ellipse cx="82" cy="42" rx="5" ry="3" fill="#ffcc02" stroke="#f9a825" stroke-width="1.5" transform="rotate(90 82 42)"/>
  <!-- bottom-right -->
  <ellipse cx="72" cy="62" rx="5" ry="3" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" transform="rotate(135 72 62)"/>
  <ellipse cx="74" cy="64" rx="5" ry="3" fill="#ffcc02" stroke="#f9a825" stroke-width="1.5" transform="rotate(135 74 64)"/>
  <!-- bottom -->
  <ellipse cx="50" cy="79" rx="5" ry="3" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5"/>
  <ellipse cx="50" cy="81" rx="5" ry="3" fill="#ffcc02" stroke="#f9a825" stroke-width="1.5"/>
  <!-- bottom-left -->
  <ellipse cx="28" cy="64" rx="5" ry="3" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" transform="rotate(45 28 64)"/>
  <ellipse cx="26" cy="66" rx="5" ry="3" fill="#ffcc02" stroke="#f9a825" stroke-width="1.5" transform="rotate(45 26 66)"/>
  <!-- left -->
  <ellipse cx="18" cy="42" rx="5" ry="3" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" transform="rotate(90 18 42)"/>
  <ellipse cx="16" cy="42" rx="5" ry="3" fill="#ffcc02" stroke="#f9a825" stroke-width="1.5" transform="rotate(90 16 42)"/>
  <!-- top-left -->
  <ellipse cx="30" cy="24" rx="5" ry="3" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" transform="rotate(-45 30 24)"/>
  <ellipse cx="28" cy="22" rx="5" ry="3" fill="#ffcc02" stroke="#f9a825" stroke-width="1.5" transform="rotate(-45 28 22)"/>
  <!-- hand grip hint at bottom -->
  <path d="M40,78 Q50,86 60,78" fill="none" stroke="#a1887f" stroke-width="2" stroke-linecap="round"/>
</svg>
