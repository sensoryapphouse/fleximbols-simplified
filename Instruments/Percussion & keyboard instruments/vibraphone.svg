<!-- Vibraphone: metal bars with resonators and motor fan -->
  <!-- Frame rails -->
  <line x1="8" y1="38" x2="92" y2="38" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="8" y1="48" x2="92" y2="48" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <!-- Metal bars (natural notes) - silver/aluminium -->
  <rect x="10" y="30" width="8" height="22" rx="1" fill="#c0c8d0" stroke="#607080" stroke-width="1.5"/>
  <rect x="20" y="31" width="8" height="21" rx="1" fill="#c0c8d0" stroke="#607080" stroke-width="1.5"/>
  <rect x="30" y="32" width="8" height="20" rx="1" fill="#c0c8d0" stroke="#607080" stroke-width="1.5"/>
  <rect x="40" y="33" width="8" height="19" rx="1" fill="#c0c8d0" stroke="#607080" stroke-width="1.5"/>
  <rect x="50" y="34" width="8" height="18" rx="1" fill="#c0c8d0" stroke="#607080" stroke-width="1.5"/>
  <rect x="60" y="35" width="8" height="17" rx="1" fill="#c0c8d0" stroke="#607080" stroke-width="1.5"/>
  <rect x="70" y="36" width="8" height="16" rx="1" fill="#c0c8d0" stroke="#607080" stroke-width="1.5"/>
  <rect x="80" y="37" width="8" height="15" rx="1" fill="#c0c8d0" stroke="#607080" stroke-width="1.5"/>
  <!-- Accidental bars (darker metal) -->
  <rect x="15" y="28" width="6" height="14" rx="1" fill="#506070" stroke="#304050" stroke-width="1.5"/>
  <rect x="35" y="30" width="6" height="13" rx="1" fill="#506070" stroke="#304050" stroke-width="1.5"/>
  <rect x="55" y="32" width="6" height="12" rx="1" fill="#506070" stroke="#304050" stroke-width="1.5"/>
  <rect x="65" y="33" width="6" height="12" rx="1" fill="#506070" stroke="#304050" stroke-width="1.5"/>
  <!-- Resonator tubes -->
  <rect x="12" y="52" width="6" height="20" rx="3" fill="#bbb" stroke="#888" stroke-width="1"/>
  <rect x="22" y="52" width="6" height="18" rx="3" fill="#bbb" stroke="#888" stroke-width="1"/>
  <rect x="32" y="52" width="6" height="16" rx="3" fill="#bbb" stroke="#888" stroke-width="1"/>
  <rect x="42" y="52" width="6" height="14" rx="3" fill="#bbb" stroke="#888" stroke-width="1"/>
  <rect x="52" y="52" width="6" height="13" rx="3" fill="#bbb" stroke="#888" stroke-width="1"/>
  <rect x="62" y="52" width="6" height="12" rx="3" fill="#bbb" stroke="#888" stroke-width="1"/>
  <rect x="72" y="52" width="6" height="11" rx="3" fill="#bbb" stroke="#888" stroke-width="1"/>
  <rect x="82" y="52" width="6" height="10" rx="3" fill="#bbb" stroke="#888" stroke-width="1"/>
  <!-- Motor/fan at left end (vibraphone specific) -->
  <circle cx="8" cy="43" r="4" fill="#c04020" stroke="#801000" stroke-width="1.5"/>
  <line x1="8" y1="39" x2="8" y2="47" stroke="#801000" stroke-width="1"/>
  <line x1="4" y1="43" x2="12" y2="43" stroke="#801000" stroke-width="1"/>
  <!-- Legs -->
  <line x1="15" y1="73" x2="15" y2="82" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="85" y1="68" x2="85" y2="77" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
