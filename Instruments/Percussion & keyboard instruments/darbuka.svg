<!-- Darbuka: chalice/goblet drum -->
  <!-- Drum head -->
  <ellipse cx="50" cy="20" rx="26" ry="7" fill="#d4b090" stroke="#5a3a10" stroke-width="2.5"/>
  <!-- Upper cylindrical body -->
  <path d="M24,20 Q22,38 28,50 L72,50 Q78,38 76,20" fill="#c04020" stroke="#5a3a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Middle section -->
  <path d="M28,50 Q32,60 38,65 L62,65 Q68,60 72,50 Z" fill="#a03010" stroke="#5a3a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- Stem -->
  <rect x="40" y="65" width="20" height="16" rx="8" fill="#c04020" stroke="#5a3a10" stroke-width="2"/>
  <!-- Open bottom -->
  <ellipse cx="50" cy="81" rx="10" ry="3" fill="none" stroke="#5a3a10" stroke-width="2"/>
  <!-- Decorative band -->
  <ellipse cx="50" cy="35" rx="26" ry="3" fill="none" stroke="#d4a020" stroke-width="1.5"/>
  <!-- Geometric decoration -->
  <line x1="30" y1="20" x2="30" y2="50" stroke="#d4a020" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="70" y1="20" x2="70" y2="50" stroke="#d4a020" stroke-width="1" stroke-dasharray="2,3"/>
</svg>
