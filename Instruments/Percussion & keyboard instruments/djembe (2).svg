<!-- Djembe goblet drum -->
  <!-- Head (top) -->
  <ellipse cx="50" cy="22" rx="28" ry="8" fill="#d4b090" stroke="#5a3a10" stroke-width="2.5"/>
  <!-- Upper body -->
  <path d="M22,22 Q20,45 30,58 L70,58 Q80,45 78,22" fill="#8B4513" stroke="#5a3a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Narrow waist / neck -->
  <rect x="33" y="58" width="34" height="10" rx="3" fill="#6b3a10" stroke="#5a3a10" stroke-width="2"/>
  <!-- Base / foot -->
  <path d="M33,68 Q28,78 30,82 L70,82 Q72,78 67,68 Z" fill="#8B4513" stroke="#5a3a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- Open bottom -->
  <ellipse cx="50" cy="82" rx="20" ry="5" fill="none" stroke="#5a3a10" stroke-width="2"/>
  <!-- Rope tuning lines -->
  <line x1="25" y1="26" x2="30" y2="55" stroke="#c04020" stroke-width="1"/>
  <line x1="35" y1="22" x2="34" y2="57" stroke="#c04020" stroke-width="1"/>
  <line x1="50" y1="20" x2="50" y2="57" stroke="#c04020" stroke-width="1"/>
  <line x1="65" y1="22" x2="66" y2="57" stroke="#c04020" stroke-width="1"/>
  <line x1="75" y1="26" x2="70" y2="55" stroke="#c04020" stroke-width="1"/>
</svg>
