<!-- Cajon: wooden box drum -->
  <!-- Main box body (3D perspective) -->
  <rect x="25" y="20" width="50" height="60" rx="2" fill="#c8a464" stroke="#5a3a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Front face (playing surface - slightly different shade) -->
  <rect x="27" y="22" width="46" height="56" rx="1" fill="#d4b474" stroke="#7a5a20" stroke-width="1"/>
  <!-- Sound hole on back (shown as circle on front for icon clarity) -->
  <circle cx="50" cy="75" r="6" fill="#8a6030" stroke="#5a3a10" stroke-width="1.5"/>
  <!-- Tapa (front plate) line at top -->
  <line x1="27" y1="30" x2="73" y2="30" stroke="#7a5a20" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Grain lines on wood -->
  <line x1="30" y1="35" x2="70" y2="35" stroke="#b8944a" stroke-width="0.7" stroke-dasharray="8,4"/>
  <line x1="30" y1="45" x2="70" y2="45" stroke="#b8944a" stroke-width="0.7" stroke-dasharray="6,5"/>
  <line x1="30" y1="55" x2="70" y2="55" stroke="#b8944a" stroke-width="0.7" stroke-dasharray="7,4"/>
  <line x1="30" y1="65" x2="70" y2="65" stroke="#b8944a" stroke-width="0.7" stroke-dasharray="5,5"/>
  <!-- Side perspective -->
  <path d="M75,22 L85,14 L85,70 L75,78 Z" fill="#a07840" stroke="#5a3a10" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Top perspective -->
  <path d="M25,20 L35,12 L85,12 L75,20 Z" fill="#b89050" stroke="#5a3a10" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
