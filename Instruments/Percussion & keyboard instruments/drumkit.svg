<!-- full drum kit - simplified overview -->
  <!-- bass drum (large, floor) -->
  <ellipse cx="50" cy="78" rx="22" ry="14" fill="#bc8f5f" stroke="#795548" stroke-width="2"/>
  <ellipse cx="50" cy="72" rx="22" ry="14" fill="#c8a06e" stroke="#795548" stroke-width="2"/>
  <ellipse cx="50" cy="72" rx="18" ry="10" fill="#ffe0b2" stroke="#9e9e9e" stroke-width="1"/>
  <!-- snare drum (small, center front) -->
  <rect x="36" y="58" width="20" height="12" rx="2" fill="#bcaaa4" stroke="#795548" stroke-width="1.5"/>
  <ellipse cx="46" cy="58" rx="10" ry="4" fill="#ffe0b2" stroke="#795548" stroke-width="1.5"/>
  <!-- hi-hat stand (left) -->
  <line x1="18" y1="82" x2="22" y2="42" stroke="#9e9e9e" stroke-width="1.5"/>
  <!-- hi-hat cymbals -->
  <ellipse cx="22" cy="40" rx="10" ry="3" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5"/>
  <ellipse cx="22" cy="43" rx="10" ry="3" fill="#ffcc02" stroke="#f9a825" stroke-width="1.5"/>
  <!-- floor tom (right) -->
  <rect x="70" y="58" width="22" height="15" rx="2" fill="#a1887f" stroke="#795548" stroke-width="1.5"/>
  <ellipse cx="81" cy="58" rx="11" ry="4" fill="#ffe0b2" stroke="#795548" stroke-width="1.5"/>
  <!-- rack toms (above bass drum) -->
  <rect x="34" y="30" width="16" height="12" rx="2" fill="#bcaaa4" stroke="#795548" stroke-width="1.5"/>
  <ellipse cx="42" cy="30" rx="8" ry="3.5" fill="#ffe0b2" stroke="#795548" stroke-width="1.5"/>
  <rect x="52" y="28" width="16" height="12" rx="2" fill="#a1887f" stroke="#795548" stroke-width="1.5"/>
  <ellipse cx="60" cy="28" rx="8" ry="3.5" fill="#ffe0b2" stroke="#795548" stroke-width="1.5"/>
  <!-- crash cymbal (right) -->
  <line x1="78" y1="10" x2="72" y2="35" stroke="#9e9e9e" stroke-width="1.5"/>
  <ellipse cx="86" cy="14" rx="12" ry="4" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" transform="rotate(-20 86 14)"/>
  <!-- ride cymbal (far right, bigger) -->
  <line x1="92" y1="42" x2="88" y2="42" stroke="#9e9e9e" stroke-width="1.5"/>
  <!-- bass drum pedal -->
  <rect x="44" y="82" width="12" height="5" rx="2" fill="#9e9e9e" stroke="#757575" stroke-width="1"/>
  <!-- drum sticks -->
  <line x1="42" y1="10" x2="46" y2="28" stroke="#a1887f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="8" x2="56" y2="26" stroke="#a1887f" stroke-width="2.5" stroke-linecap="round"/>
</svg>
