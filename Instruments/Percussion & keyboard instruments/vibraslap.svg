<!-- Vibraslap: hinged metal rod with wooden ball and rattle box -->
  <!-- U-shaped metal rod -->
  <path d="M20,25 Q20,60 35,65 L65,65 Q80,60 80,25" fill="none" stroke="#888" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wooden ball on one end -->
  <circle cx="20" cy="22" r="8" fill="#c8a464" stroke="#5a3a10" stroke-width="2"/>
  <!-- Wooden rattle box on other end -->
  <rect x="65" y="12" width="20" height="16" rx="3" fill="#c8a464" stroke="#5a3a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- Rivets/teeth inside box (visible as dots) -->
  <circle cx="70" cy="17" r="1.5" fill="#5a3a10"/>
  <circle cx="75" cy="17" r="1.5" fill="#5a3a10"/>
  <circle cx="80" cy="17" r="1.5" fill="#5a3a10"/>
  <circle cx="70" cy="23" r="1.5" fill="#5a3a10"/>
  <circle cx="75" cy="23" r="1.5" fill="#5a3a10"/>
  <circle cx="80" cy="23" r="1.5" fill="#5a3a10"/>
  <!-- Motion/vibration lines near box -->
  <line x1="64" y1="14" x2="58" y2="12" stroke="#888" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="64" y1="18" x2="57" y2="18" stroke="#888" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="64" y1="22" x2="58" y2="25" stroke="#888" stroke-width="1.2" stroke-dasharray="2,2"/>
  <!-- Hinge/pivot point -->
  <circle cx="50" cy="65" r="5" fill="#aaa" stroke="#666" stroke-width="1.5"/>
</svg>
