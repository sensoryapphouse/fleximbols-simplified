<!-- Recorder - simple flute-like instrument, held at angle -->
  <!-- Body of recorder (slightly angled) -->
  <rect x="42" y="8" width="12" height="72" rx="5" fill="#c8a06a" stroke="#333" stroke-width="2" transform="rotate(-10 48 44)"/>
  <!-- Mouthpiece (fipple) at top -->
  <rect x="44" y="7" width="10" height="8" rx="3" fill="#a07848" stroke="#333" stroke-width="1.5" transform="rotate(-10 49 11)"/>
  <!-- Window (sound hole at top) -->
  <rect x="46" y="14" width="6" height="3" rx="1" fill="#333" transform="rotate(-10 49 15)"/>
  <!-- Finger holes -->
  <circle cx="50" cy="30" r="2" fill="#333" transform="rotate(-10 50 44)"/>
  <circle cx="50" cy="38" r="2" fill="#333" transform="rotate(-10 50 44)"/>
  <circle cx="50" cy="46" r="2" fill="#333" transform="rotate(-10 50 44)"/>
  <circle cx="50" cy="54" r="2" fill="#333" transform="rotate(-10 50 44)"/>
  <circle cx="50" cy="62" r="2" fill="#333" transform="rotate(-10 50 44)"/>
  <!-- Bell end (slightly wider) -->
  <ellipse cx="46" cy="82" rx="7" ry="4" fill="#a07848" stroke="#333" stroke-width="1.5" transform="rotate(-10 46 82)"/>
</svg>
