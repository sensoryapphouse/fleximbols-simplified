<!-- Bagpipes - bag with pipes -->
  <!-- Bag -->
  <ellipse cx="45" cy="58" rx="28" ry="22" fill="#7a9" stroke="#333" stroke-width="2.5"/>
  <!-- Tartan pattern on bag -->
  <ellipse cx="45" cy="58" rx="28" ry="22" fill="none" stroke="#559" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Chanter (melody pipe) going down -->
  <rect x="42" y="72" width="7" height="18" rx="2" fill="#c8a06a" stroke="#444" stroke-width="1.5"/>
  <!-- Tone holes on chanter -->
  <circle cx="45.5" cy="76" r="1.2" fill="#333"/>
  <circle cx="45.5" cy="80" r="1.2" fill="#333"/>
  <circle cx="45.5" cy="84" r="1.2" fill="#333"/>
  <!-- Blowpipe (mouthpiece going up-left) -->
  <line x1="30" y1="45" x2="20" y2="20" stroke="#c8a06a" stroke-width="4" stroke-linecap="round"/>
  <rect x="17" y="12" width="5" height="9" rx="2" fill="#8a8" stroke="#444" stroke-width="1.5"/>
  <!-- Drone pipes (three going up-right) -->
  <line x1="55" y1="42" x2="62" y2="12" stroke="#c8a06a" stroke-width="4" stroke-linecap="round"/>
  <line x1="62" y1="42" x2="70" y2="10" stroke="#c8a06a" stroke-width="4" stroke-linecap="round"/>
  <line x1="68" y1="44" x2="78" y2="14" stroke="#c8a06a" stroke-width="4" stroke-linecap="round"/>
  <!-- Drone tips -->
  <rect x="59" y="8" width="5" height="5" rx="1" fill="#c8a06a" stroke="#444" stroke-width="1.5"/>
  <rect x="67" y="6" width="5" height="5" rx="1" fill="#c8a06a" stroke="#444" stroke-width="1.5"/>
  <rect x="76" y="10" width="5" height="5" rx="1" fill="#c8a06a" stroke="#444" stroke-width="1.5"/>
</svg>
