  <g transform="translate(-2.276 -0.447) scale(1.1014)">
<!-- Kazoo - small humming instrument, tube with resonator dome -->
  <!-- Main tube body (angled) -->
  <rect x="15" y="44" width="60" height="14" rx="6" fill="#e8a" stroke="#333" stroke-width="2.5" transform="rotate(-15 45 51)"/>
  <!-- Mouthpiece end (left, slightly wider) -->
  <ellipse cx="20" cy="56" rx="5" ry="7" fill="#c77" stroke="#333" stroke-width="2" transform="rotate(-15 20 56)"/>
  <!-- Resonator dome (turret on top) -->
  <ellipse cx="55" cy="42" rx="8" ry="5" fill="#d8a" stroke="#333" stroke-width="2"/>
  <rect x="47" y="38" width="16" height="10" rx="3" fill="#d8a" stroke="#333" stroke-width="2"/>
  <!-- Membrane cover on resonator -->
  <ellipse cx="55" cy="38" rx="8" ry="3" fill="#ecc" stroke="#444" stroke-width="1.5"/>
  <!-- Vibration lines from resonator -->
  <line x1="47" y1="33" x2="44" y2="28" stroke="#bbb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="32" x2="55" y2="27" stroke="#bbb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="63" y1="33" x2="66" y2="28" stroke="#bbb" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Music note -->
  <text x="72" y="45" font-size="14" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#aaa">&#9835;</text>
</g>
  </svg>
