<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- acoustic guitar body - lower bout -->
  <ellipse cx="50" cy="68" rx="24" ry="20" fill="#a1887f" stroke="#5d4037" stroke-width="2.5"/>
  <!-- upper bout -->
  <ellipse cx="50" cy="46" rx="16" ry="14" fill="#a1887f" stroke="#5d4037" stroke-width="2.5"/>
  <!-- waist -->
  <rect x="38" y="52" width="24" height="10" fill="#a1887f" stroke="none"/>
  <line x1="38" y1="52" x2="38" y2="62" stroke="#5d4037" stroke-width="2.5"/>
  <line x1="62" y1="52" x2="62" y2="62" stroke="#5d4037" stroke-width="2.5"/>
  <!-- sound hole -->
  <circle cx="50" cy="58" r="8" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
  <circle cx="50" cy="58" r="6" fill="none" stroke="#795548" stroke-width="1"/>
  <!-- rosette rings -->
  <circle cx="50" cy="58" r="9" fill="none" stroke="#8d6e63" stroke-width="1"/>
  <!-- neck -->
  <rect x="45" y="14" width="10" height="36" rx="3" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
  <!-- headstock -->
  <rect x="42" y="8" width="16" height="10" rx="3" fill="#795548" stroke="#5d4037" stroke-width="2"/>
  <!-- frets -->
  <line x1="45" y1="24" x2="55" y2="24" stroke="#bdbdbd" stroke-width="1.5"/>
  <line x1="45" y1="32" x2="55" y2="32" stroke="#bdbdbd" stroke-width="1.5"/>
  <line x1="45" y1="40" x2="55" y2="40" stroke="#bdbdbd" stroke-width="1.5"/>
  <!-- tuning pegs -->
  <circle cx="44" cy="10" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="56" cy="10" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="44" cy="14" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="56" cy="14" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <!-- strings -->
  <line x1="47" y1="12" x2="46" y2="78" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="50" y1="12" x2="50" y2="78" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="53" y1="12" x2="54" y2="78" stroke="#9e9e9e" stroke-width="1"/>
  <!-- bridge -->
  <rect x="43" y="72" width="14" height="4" rx="1" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
</svg>
