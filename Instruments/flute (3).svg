<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Main body - long thin cylinder, horizontal -->
  <rect x="8" y="44" width="84" height="10" rx="4" fill="#C8C8C8" stroke="#444" stroke-width="2"/>
  <!-- Embouchure hole -->
  <ellipse cx="20" cy="49" rx="3" ry="2" fill="#888" stroke="#444" stroke-width="1"/>
  <!-- Tone holes / keys along the body -->
  <circle cx="35" cy="49" r="2.5" fill="#AAAAAA" stroke="#444" stroke-width="1"/>
  <circle cx="44" cy="49" r="2.5" fill="#AAAAAA" stroke="#444" stroke-width="1"/>
  <circle cx="52" cy="49" r="2.5" fill="#AAAAAA" stroke="#444" stroke-width="1"/>
  <circle cx="60" cy="49" r="2.5" fill="#AAAAAA" stroke="#444" stroke-width="1"/>
  <circle cx="68" cy="49" r="2.5" fill="#AAAAAA" stroke="#444" stroke-width="1"/>
  <circle cx="76" cy="49" r="2.5" fill="#AAAAAA" stroke="#444" stroke-width="1"/>
  <!-- Key pads (small rods above holes) -->
  <line x1="35" y1="44" x2="35" y2="41" stroke="#888" stroke-width="1.5"/>
  <line x1="44" y1="44" x2="44" y2="41" stroke="#888" stroke-width="1.5"/>
  <line x1="52" y1="44" x2="52" y2="41" stroke="#888" stroke-width="1.5"/>
  <line x1="60" y1="44" x2="60" y2="41" stroke="#888" stroke-width="1.5"/>
  <!-- Closed end cap -->
  <rect x="84" y="43" width="8" height="12" rx="3" fill="#B0B0B0" stroke="#444" stroke-width="1.5"/>
  <!-- Label -->
</svg>
