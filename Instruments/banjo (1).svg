<!-- banjo round body (pot) -->
  <circle cx="52" cy="66" r="24" fill="#f5f5f5" stroke="#795548" stroke-width="2.5"/>
  <!-- rim (metal hoop) -->
  <circle cx="52" cy="66" r="24" fill="none" stroke="#9e9e9e" stroke-width="2"/>
  <!-- drumhead -->
  <circle cx="52" cy="66" r="21" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <!-- tension hooks around rim -->
  <circle cx="52" cy="42" r="1.5" fill="#9e9e9e"/>
  <circle cx="64" cy="44" r="1.5" fill="#9e9e9e"/>
  <circle cx="74" cy="52" r="1.5" fill="#9e9e9e"/>
  <circle cx="76" cy="66" r="1.5" fill="#9e9e9e"/>
  <circle cx="74" cy="79" r="1.5" fill="#9e9e9e"/>
  <circle cx="64" cy="87" r="1.5" fill="#9e9e9e"/>
  <circle cx="52" cy="89" r="1.5" fill="#9e9e9e"/>
  <circle cx="40" cy="87" r="1.5" fill="#9e9e9e"/>
  <circle cx="30" cy="79" r="1.5" fill="#9e9e9e"/>
  <circle cx="28" cy="66" r="1.5" fill="#9e9e9e"/>
  <circle cx="30" cy="53" r="1.5" fill="#9e9e9e"/>
  <circle cx="40" cy="44" r="1.5" fill="#9e9e9e"/>
  <!-- bridge on head -->
  <rect x="49" y="63" width="6" height="3" rx="1" fill="#795548" stroke="#5d4037" stroke-width="1"/>
  <!-- coordinator rods -->
  <line x1="30" y1="66" x2="74" y2="66" stroke="#9e9e9e" stroke-width="1"/>
  <!-- neck (long) -->
  <rect x="44" y="8" width="8" height="44" rx="3" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
  <!-- headstock -->
  <rect x="41" y="6" width="14" height="8" rx="2" fill="#795548" stroke="#5d4037" stroke-width="2"/>
  <!-- frets -->
  <line x1="44" y1="16" x2="52" y2="16" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="44" y1="23" x2="52" y2="23" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="44" y1="30" x2="52" y2="30" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="44" y1="37" x2="52" y2="37" stroke="#c0a080" stroke-width="1.5"/>
  <line x1="44" y1="43" x2="52" y2="43" stroke="#c0a080" stroke-width="1.5"/>
  <!-- 5 tuning pegs (banjo has 5 strings) -->
  <circle cx="43" cy="8" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="55" cy="8" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="43" cy="12" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="55" cy="12" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <!-- 5th string peg on neck -->
  <circle cx="44" cy="30" r="2" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <!-- strings (5) -->
  <line x1="46" y1="10" x2="45" y2="64" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="48" y1="10" x2="47" y2="64" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="50" y1="10" x2="50" y2="64" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="52" y1="10" x2="53" y2="64" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="46" y1="30" x2="55" y2="64" stroke="#9e9e9e" stroke-width="1"/>
