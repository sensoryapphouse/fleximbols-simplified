<!-- Saxophone - curved brass body with keys -->
  <!-- Mouthpiece at top -->
  <rect x="52" y="8" width="14" height="8" rx="3" fill="#2A2A2A" stroke="#111" stroke-width="1.5"/>
  <!-- Neck -->
  <path d="M 59 16 Q 62 25 60 32" fill="none" stroke="#C8960A" stroke-width="6" stroke-linecap="round"/>
  <!-- Main body (curved) -->
  <path d="M 60 32 Q 65 45 62 60 Q 58 72 45 78 Q 32 82 25 72 Q 18 62 25 52 Q 32 42 42 42 Q 52 42 55 32" fill="none" stroke="#D4A800" stroke-width="8" stroke-linecap="round"/>
  <!-- Highlight on body -->
  <path d="M 60 32 Q 65 45 62 60 Q 58 72 45 78 Q 32 82 25 72 Q 18 62 25 52 Q 32 42 42 42 Q 52 42 55 32" fill="none" stroke="#E8C030" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bell flare at bottom -->
  <ellipse cx="32" cy="80" rx="12" ry="6" fill="#D4A800" stroke="#8B6000" stroke-width="2"/>
  <!-- Key pads (circles along body) -->
  <circle cx="60" cy="38" r="3" fill="#B88000" stroke="#665500" stroke-width="1"/>
  <circle cx="63" cy="48" r="3" fill="#B88000" stroke="#665500" stroke-width="1"/>
  <circle cx="61" cy="58" r="3" fill="#B88000" stroke="#665500" stroke-width="1"/>
  <circle cx="54" cy="67" r="3" fill="#B88000" stroke="#665500" stroke-width="1"/>
  <circle cx="44" cy="73" r="3" fill="#B88000" stroke="#665500" stroke-width="1"/>
  <!-- Label -->
</svg>
