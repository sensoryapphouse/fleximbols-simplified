<!-- electric guitar - solid body Stratocaster style -->
  <!-- upper horn -->
  <path d="M50,45 Q38,38 32,42 Q26,46 28,56 Q30,64 40,66" 
        fill="#c62828" stroke="#b71c1c" stroke-width="2" stroke-linejoin="round"/>
  <!-- lower bout -->
  <path d="M40,66 Q32,72 34,80 Q38,88 50,88 Q62,88 66,80 Q68,72 60,66" 
        fill="#c62828" stroke="#b71c1c" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- body top -->
  <path d="M50,45 Q62,40 68,46 Q72,52 68,58 Q64,64 60,66" 
        fill="#c62828" stroke="#b71c1c" stroke-width="2" stroke-linejoin="round"/>
  <!-- pickguard -->
  <path d="M42,55 L38,72 L48,80 L58,78 L60,65 L54,54 Z" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <!-- 3 pickups -->
  <rect x="42" y="56" width="14" height="5" rx="1" fill="#212121" stroke="#333" stroke-width="1"/>
  <rect x="42" y="63" width="14" height="5" rx="1" fill="#212121" stroke="#333" stroke-width="1"/>
  <rect x="42" y="70" width="14" height="4" rx="1" fill="#212121" stroke="#333" stroke-width="1"/>
  <!-- neck -->
  <rect x="46" y="8" width="8" height="40" rx="3" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
  <!-- headstock (angled) -->
  <path d="M43,6 L57,6 L58,15 L42,15 Z" fill="#795548" stroke="#5d4037" stroke-width="2"/>
  <!-- frets -->
  <line x1="46" y1="18" x2="54" y2="18" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="46" y1="26" x2="54" y2="26" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="46" y1="34" x2="54" y2="34" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="46" y1="41" x2="54" y2="41" stroke="#9e9e9e" stroke-width="1.5"/>
  <!-- tuning pegs (3 per side) -->
  <circle cx="43" cy="8" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="43" cy="11" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="43" cy="14" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="57" cy="8" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="57" cy="11" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="57" cy="14" r="2.5" fill="#c0a080" stroke="#8d6e63" stroke-width="1"/>
  <!-- strings -->
  <line x1="47" y1="9" x2="44" y2="78" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="49" y1="9" x2="48" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="51" y1="9" x2="52" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="53" y1="9" x2="56" y2="78" stroke="#9e9e9e" stroke-width="1"/>
  <!-- bridge -->
  <rect x="44" y="76" width="12" height="4" rx="1" fill="#9e9e9e" stroke="#757575" stroke-width="1.5"/>
  <!-- output jack dot -->
  <circle cx="65" cy="72" r="2.5" fill="#9e9e9e" stroke="#757575" stroke-width="1"/>
</svg>
