<!-- Large round body -->
  <ellipse cx="50" cy="78" rx="20" ry="17" fill="#c8a464" stroke="#5a3a10" stroke-width="2.5"/>
  <!-- Long neck -->
  <rect x="46" y="12" width="8" height="55" rx="3" fill="#a07840" stroke="#5a3a10" stroke-width="2"/>
  <!-- Peg head with multiple pegs -->
  <rect x="43" y="8" width="14" height="10" rx="3" fill="#a07840" stroke="#5a3a10" stroke-width="1.5"/>
  <!-- Tuning pegs (4 strings) -->
  <circle cx="46" cy="10" r="2" fill="#5a3a10"/>
  <circle cx="50" cy="10" r="2" fill="#5a3a10"/>
  <circle cx="54" cy="10" r="2" fill="#5a3a10"/>
  <!-- Sound hole on body -->
  <circle cx="50" cy="78" r="6" fill="none" stroke="#5a3a10" stroke-width="1.5"/>
  <!-- Strings -->
  <line x1="48" y1="14" x2="47" y2="88" stroke="#aaa" stroke-width="0.7"/>
  <line x1="50" y1="14" x2="50" y2="90" stroke="#aaa" stroke-width="0.7"/>
  <line x1="52" y1="14" x2="53" y2="88" stroke="#aaa" stroke-width="0.7"/>
  <!-- Bridge -->
  <rect x="44" y="87" width="12" height="3" rx="1" fill="#5a3a10"/>
  <!-- Nut frets on neck -->
  <line x1="46" y1="30" x2="54" y2="30" stroke="#5a3a10" stroke-width="1"/>
  <line x1="46" y1="42" x2="54" y2="42" stroke="#5a3a10" stroke-width="1"/>
</svg>
