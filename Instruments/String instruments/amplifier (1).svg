<!-- Amplifier - box with dials and grille -->
  <!-- Main cabinet -->
  <rect x="8" y="20" width="84" height="62" rx="4" fill="#444" stroke="#222" stroke-width="2.5"/>
  <!-- Top panel with dials -->
  <rect x="8" y="20" width="84" height="22" rx="4" fill="#555" stroke="#222" stroke-width="1.5"/>
  <!-- Dials -->
  <circle cx="25" cy="31" r="7" fill="#333" stroke="#888" stroke-width="1.5"/>
  <line x1="25" y1="31" x2="25" y2="25" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="45" cy="31" r="7" fill="#333" stroke="#888" stroke-width="1.5"/>
  <line x1="45" y1="31" x2="49" y2="26" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="65" cy="31" r="7" fill="#333" stroke="#888" stroke-width="1.5"/>
  <line x1="65" y1="31" x2="61" y2="26" stroke="#ddd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Power indicator -->
  <circle cx="83" cy="27" r="3" fill="#4e4" stroke="#222" stroke-width="1"/>
  <!-- Speaker grille area -->
  <rect x="12" y="46" width="76" height="32" rx="2" fill="#333" stroke="#555" stroke-width="1.5"/>
  <!-- Grille lines -->
  <line x1="12" y1="53" x2="88" y2="53" stroke="#555" stroke-width="1"/>
  <line x1="12" y1="60" x2="88" y2="60" stroke="#555" stroke-width="1"/>
  <line x1="12" y1="67" x2="88" y2="67" stroke="#555" stroke-width="1"/>
  <line x1="12" y1="74" x2="88" y2="74" stroke="#555" stroke-width="1"/>
  <!-- Brand logo placeholder -->
  <rect x="30" y="78" width="40" height="5" rx="2" fill="#666"/>
  <!-- Feet -->
  <rect x="15" y="82" width="8" height="5" rx="1" fill="#333" stroke="#222" stroke-width="1"/>
  <rect x="77" y="82" width="8" height="5" rx="1" fill="#333" stroke="#222" stroke-width="1"/>
