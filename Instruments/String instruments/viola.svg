<!-- viola - slightly larger than violin, same shape -->
  <!-- upper bout -->
  <ellipse cx="50" cy="36" rx="15" ry="13" fill="#b8866a" stroke="#795548" stroke-width="2"/>
  <!-- lower bout (larger) -->
  <ellipse cx="50" cy="64" rx="18" ry="16" fill="#b8866a" stroke="#795548" stroke-width="2"/>
  <!-- waist -->
  <rect x="38" y="42" width="24" height="18" fill="#b8866a" stroke="none"/>
  <path d="M38,42 Q32,51 38,60" fill="none" stroke="#795548" stroke-width="2.5"/>
  <path d="M62,42 Q68,51 62,60" fill="none" stroke="#795548" stroke-width="2.5"/>
  <!-- f-holes -->
  <path d="M42,50 Q40,54 42,59" fill="none" stroke="#5d4037" stroke-width="2" stroke-linecap="round"/>
  <path d="M58,50 Q60,54 58,59" fill="none" stroke="#5d4037" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="49" r="1.5" fill="#5d4037"/>
  <circle cx="42" cy="60" r="1.5" fill="#5d4037"/>
  <circle cx="58" cy="49" r="1.5" fill="#5d4037"/>
  <circle cx="58" cy="60" r="1.5" fill="#5d4037"/>
  <!-- chin rest -->
  <ellipse cx="50" cy="77" rx="8" ry="4" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
  <!-- tailpiece -->
  <path d="M44,74 L56,74 L54,80 L46,80 Z" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
  <!-- bridge -->
  <rect x="46" y="58" width="8" height="4" rx="0" fill="#b8866a" stroke="#795548" stroke-width="1.5"/>
  <!-- neck -->
  <rect x="47" y="11" width="6" height="28" rx="2" fill="#8d6e63" stroke="#5d4037" stroke-width="1.5"/>
  <!-- scroll -->
  <path d="M46,11 Q44,6 48,4 Q52,6 54,11" fill="#795548" stroke="#5d4037" stroke-width="1.5"/>
  <!-- pegs -->
  <line x1="44" y1="13" x2="56" y2="13" stroke="#c0a080" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="18" x2="56" y2="18" stroke="#c0a080" stroke-width="2" stroke-linecap="round"/>
  <!-- strings -->
  <line x1="48" y1="7" x2="47" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="49" y1="7" x2="49" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="51" y1="7" x2="51" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="52" y1="7" x2="53" y2="80" stroke="#9e9e9e" stroke-width="1"/>
  <!-- bow (slightly thicker than violin) -->
  <line x1="14" y1="18" x2="14" y2="82" stroke="#8d6e63" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M17,18 Q23,50 17,82" fill="none" stroke="#c0a080" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="12" y="17" width="5" height="4" rx="1" fill="#5d4037"/>
  <rect x="12" y="80" width="5" height="4" rx="1" fill="#5d4037"/>
  <!-- label: viola text (slightly bigger than violin = clue) -->
</svg>
