<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Xylophone bars on a frame -->
  <!-- Frame rails -->
  <line x1="8" y1="35" x2="92" y2="35" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="75" x2="92" y2="75" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="12" y1="35" x2="8" y2="82" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <line x1="88" y1="35" x2="92" y2="82" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <!-- Bars (different lengths, coloured) -->
  <rect x="12" y="37" width="10" height="36" rx="1" fill="#e85" stroke="#333" stroke-width="1.5"/>
  <rect x="25" y="39" width="10" height="34" rx="1" fill="#ee5" stroke="#333" stroke-width="1.5"/>
  <rect x="38" y="41" width="10" height="32" rx="1" fill="#5a5" stroke="#333" stroke-width="1.5"/>
  <rect x="51" y="43" width="10" height="30" rx="1" fill="#55a" stroke="#333" stroke-width="1.5"/>
  <rect x="64" y="45" width="10" height="28" rx="1" fill="#a55" stroke="#333" stroke-width="1.5"/>
  <rect x="77" y="47" width="10" height="26" rx="1" fill="#858" stroke="#333" stroke-width="1.5"/>
  <!-- Mallets -->
  <line x1="28" y1="12" x2="22" y2="37" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  <circle cx="28" cy="10" r="3.5" fill="#c77" stroke="#555" stroke-width="1.5"/>
  <line x1="68" y1="12" x2="62" y2="37" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  <circle cx="68" cy="10" r="3.5" fill="#c77" stroke="#555" stroke-width="1.5"/>
</svg>
