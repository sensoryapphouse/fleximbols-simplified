  <rect x="8" y="25" width="84" height="50" rx="4" fill="#212121" stroke="#333" stroke-width="2.5"/>
  <!-- white keys (7) -->

<!-- black keys (5) -->
  <rect x="20" y="35" width="7" height="22" rx="2" fill="#212121" stroke="#555" stroke-width="1"/>
  <rect x="32" y="35" width="7" height="22" rx="2" fill="#212121" stroke="#555" stroke-width="1"/>
  <rect x="56" y="35" width="7" height="22" rx="2" fill="#212121" stroke="#555" stroke-width="1"/>
  <rect x="68" y="35" width="7" height="22" rx="2" fill="#212121" stroke="#555" stroke-width="1"/>
  <rect x="80" y="35" width="7" height="22" rx="2" fill="#212121" stroke="#555" stroke-width="1"/>
  <!-- piano lid/top -->
