<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Glue gun body -->
  <rect x="30" y="28" width="42" height="22" rx="5" fill="#666" stroke="#333" stroke-width="2"/>
  <!-- Glue gun handle -->
  <path d="M38,50 L34,72 Q34,76 38,76 L48,76 Q52,76 52,72 L52,50 Z" fill="#666" stroke="#333" stroke-width="2"/>
  <!-- Trigger -->
  <path d="M42,55 L40,66 Q40,68 42,68 L46,68 Q48,68 48,66 L46,55 Z" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Glue gun nozzle -->
  <rect x="70" y="34" width="16" height="10" rx="3" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- Glue coming out -->
  <path d="M86,39 Q90,39 90,44 Q90,50 86,52 Q82,54 80,56 Q78,58 82,60" stroke="#f5c842" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Glue pool/dot at end -->
  <circle cx="82" cy="62" r="4" fill="#f5c842" stroke="#c9a830" stroke-width="1.5"/>
  <!-- Surface being glued -->
  <rect x="10" y="68" width="60" height="8" rx="2" fill="#e8c99a" stroke="#333" stroke-width="1.5"/>
  <!-- Cord on glue gun -->
  <path d="M36,76 Q28,82 20,80 Q12,78 12,70" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
