<!-- Fabric piece -->
  <rect x="10" y="50" width="50" height="30" rx="3" fill="#9b7bc9" stroke="#333" stroke-width="2.5"/>
  <!-- Fabric pattern (stitching lines) -->
  <line x1="20" y1="60" x2="50" y2="60" stroke="#7b5ba9" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="20" y1="70" x2="50" y2="70" stroke="#7b5ba9" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Sewing needle -->
  <line x1="54" y1="20" x2="66" y2="62" stroke="#aaa" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="55" cy="18" rx="5" ry="4" fill="#aaa" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="55" cy="18" rx="2" ry="1.5" fill="white" stroke="#333" stroke-width="1"/>
  <!-- Thread from needle -->
  <path d="M54,22 Q42,36 46,55 Q48,65 42,72" fill="none" stroke="#e07b54" stroke-width="2" stroke-linecap="round"/>
  <!-- Thread spool -->
  <rect x="70" y="30" width="20" height="40" rx="3" fill="#f5c842" stroke="#333" stroke-width="2.5"/>
  <rect x="66" y="28" width="28" height="8" rx="2" fill="#c9a96e" stroke="#333" stroke-width="2"/>
  <rect x="66" y="58" width="28" height="8" rx="2" fill="#c9a96e" stroke="#333" stroke-width="2"/>
  <!-- Thread on spool -->
  <line x1="70" y1="38" x2="90" y2="38" stroke="#e07b54" stroke-width="1.5"/>
  <line x1="70" y1="44" x2="90" y2="44" stroke="#e07b54" stroke-width="1.5"/>
  <line x1="70" y1="50" x2="90" y2="50" stroke="#e07b54" stroke-width="1.5"/>
  <!-- Thread to needle -->
  <line x1="66" y1="32" x2="58" y2="26" stroke="#e07b54" stroke-width="2" stroke-linecap="round"/>
</svg>
