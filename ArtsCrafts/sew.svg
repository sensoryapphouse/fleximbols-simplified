<!-- Fabric piece -->
  <rect x="10" y="48" width="80" height="28" rx="3" fill="#e8c99a" stroke="#333" stroke-width="2"/>
  <!-- Needle -->
  <line x1="55" y1="18" x2="42" y2="55" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Needle eye hole at top -->
  <ellipse cx="56" cy="17" rx="4" ry="3" fill="none" stroke="#888" stroke-width="2"/>
  <!-- Needle tip (sharp) -->
  <polygon points="40,58 44,52 38,54" fill="#888"/>
  <!-- Thread through needle eye -->
  <path d="M58,16 Q62,10 72,12 Q80,14 78,22 Q76,30 70,32" stroke="#e07070" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Thread going into fabric -->
  <path d="M42,55 Q38,60 40,65 Q44,72 38,76" stroke="#e07070" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="3,2"/>
  <!-- Stitches in fabric -->
  <line x1="20" y1="62" x2="28" y2="62" stroke="#e07070" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="62" x2="40" y2="62" stroke="#e07070" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="68" x2="26" y2="68" stroke="#e07070" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="68" x2="38" y2="68" stroke="#e07070" stroke-width="2" stroke-linecap="round"/>
  <!-- Hand holding needle -->
  <ellipse cx="60" cy="42" rx="8" ry="6" fill="#f5c5a3" stroke="#333" stroke-width="1.5"/>
</svg>
