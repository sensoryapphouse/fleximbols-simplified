  <!-- Funnel/filter shape -->
  <polygon points="10,14 90,14 60,52 60,86 40,86 40,52" fill="#d8e8f8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top bar of filter -->
  <rect x="10" y="10" width="80" height="8" rx="2" fill="#b0c8e8" stroke="#333" stroke-width="2"/>
  <!-- Lines inside funnel indicating filter levels -->
  <line x1="28" y1="34" x2="72" y2="34" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="46" x2="64" y2="46" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom stem -->
  <rect x="40" y="72" width="20" height="14" rx="2" fill="#b0c8e8" stroke="#333" stroke-width="2"/>
  <!-- Checkmark indicating active filter -->
  <circle cx="76" cy="76" r="12" fill="#88c870" stroke="#333" stroke-width="2"/>
  <polyline points="70,76 74,80 83,70" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
