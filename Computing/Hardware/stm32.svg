<!-- STM32 Nucleo/Blue Pill style board -->
  <rect x="20" y="10" width="60" height="68" rx="4" fill="#2a2a6a" stroke="#1a1a4a" stroke-width="2.5"/>
  <!-- STM32 chip (black square IC) -->
  <rect x="30" y="24" width="40" height="32" rx="2" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="2"/>
  <!-- Chip label -->
  
  
  <!-- Chip pins left -->
  <line x1="30" y1="28" x2="26" y2="28" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="30" y1="32" x2="26" y2="32" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="30" y1="36" x2="26" y2="36" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="30" y1="40" x2="26" y2="40" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="30" y1="44" x2="26" y2="44" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="30" y1="48" x2="26" y2="48" stroke="#c0c0c0" stroke-width="1.5"/>
  <!-- Chip pins right -->
  <line x1="70" y1="28" x2="74" y2="28" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="70" y1="32" x2="74" y2="32" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="70" y1="36" x2="74" y2="36" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="74" y2="40" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="70" y1="44" x2="74" y2="44" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="70" y1="48" x2="74" y2="48" stroke="#c0c0c0" stroke-width="1.5"/>
  <!-- Pin headers bottom left and right -->
  <rect x="20" y="60" width="8" height="18" rx="1" fill="#1a1a1a" stroke="#1a1a4a" stroke-width="1"/>
  <rect x="72" y="60" width="8" height="18" rx="1" fill="#1a1a1a" stroke="#1a1a4a" stroke-width="1"/>
  <!-- Crystal -->
  <rect x="44" y="58" width="12" height="5" rx="1" fill="#c0c090" stroke="#8a8a50" stroke-width="1"/>
  <!-- USB connector top -->
  <rect x="38" y="10" width="14" height="8" rx="2" fill="#c0c0b0" stroke="#8a8a70" stroke-width="1.5"/>
  <!-- Boot jumpers -->
  <rect x="30" y="60" width="8" height="5" rx="1" fill="#f0f050" stroke="#8a8a10" stroke-width="1"/>
  <!-- LEDs -->
  <circle cx="62" cy="62" r="2.5" fill="#50e050"/>
  <circle cx="62" cy="69" r="2.5" fill="#e05050"/>
  <!-- Reset button -->
  <rect x="28" y="16" width="8" height="6" rx="2" fill="#e0e0d0" stroke="#8a8a70" stroke-width="1"/>
  <circle cx="32" cy="19" r="1.5" fill="#c0a0a0"/>
</svg>
