<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Green PCB board -->
  <rect x="10" y="20" width="80" height="60" rx="6" fill="#2e8b57" stroke="#1d5c39" stroke-width="2.5"/>
  <!-- mounting holes -->
  <circle cx="17" cy="27" r="2.5" fill="none" stroke="#cfe8d8" stroke-width="2"/>
  <circle cx="83" cy="27" r="2.5" fill="none" stroke="#cfe8d8" stroke-width="2"/>
  <circle cx="17" cy="73" r="2.5" fill="none" stroke="#cfe8d8" stroke-width="2"/>
  <circle cx="83" cy="73" r="2.5" fill="none" stroke="#cfe8d8" stroke-width="2"/>
  <!-- GPIO header (gold pins) -->
  <rect x="22" y="24" width="48" height="7" rx="1.5" fill="#1a1a1a" stroke="#111" stroke-width="1.5"/>
  <g fill="#e8c84c">
    <circle cx="26" cy="27.5" r="1.5"/><circle cx="31" cy="27.5" r="1.5"/><circle cx="36" cy="27.5" r="1.5"/>
    <circle cx="41" cy="27.5" r="1.5"/><circle cx="46" cy="27.5" r="1.5"/><circle cx="51" cy="27.5" r="1.5"/>
    <circle cx="56" cy="27.5" r="1.5"/><circle cx="61" cy="27.5" r="1.5"/><circle cx="66" cy="27.5" r="1.5"/>
  </g>
  <!-- main processor chip (black square) -->
  <rect x="34" y="40" width="24" height="22" rx="2" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <rect x="39" y="45" width="14" height="12" rx="1" fill="#3a3a3a"/>
  <!-- small chip -->
  <rect x="20" y="44" width="9" height="9" rx="1" fill="#1a1a1a" stroke="#000" stroke-width="1.5"/>
  <!-- USB ports (silver, right) -->
  <rect x="74" y="38" width="14" height="9" rx="1.5" fill="#b8b8b8" stroke="#333" stroke-width="2"/>
  <rect x="74" y="50" width="14" height="9" rx="1.5" fill="#b8b8b8" stroke="#333" stroke-width="2"/>
  <!-- ethernet port -->
  <rect x="74" y="62" width="14" height="11" rx="1.5" fill="#b8b8b8" stroke="#333" stroke-width="2"/>
  <!-- HDMI port (bottom) -->
  <rect x="36" y="70" width="16" height="7" rx="1.5" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- micro USB power -->
  <rect x="18" y="70" width="10" height="6" rx="1" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- LEDs -->
  <circle cx="22" cy="38" r="2" fill="#e74c3c"/>
  <circle cx="28" cy="38" r="2" fill="#2ecc71"/>
  <!-- capacitors -->
  <circle cx="66" cy="45" r="3" fill="#c0902c" stroke="#7a5a18" stroke-width="1.5"/>
  <circle cx="66" cy="55" r="3" fill="#c0902c" stroke="#7a5a18" stroke-width="1.5"/>
</svg>
