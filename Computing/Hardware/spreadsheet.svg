<!-- Spreadsheet outer -->
<!-- Header row -->
  <rect x="10" y="12" width="80" height="12" rx="3" fill="#2e7d32"/>
  <rect x="10" y="18" width="80" height="6" fill="#2e7d32"/>
  <!-- Column headers -->
  <text x="30" y="21" font-size="6" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="white">A</text>
  <text x="50" y="21" font-size="6" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="white">B</text>
  <text x="70" y="21" font-size="6" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="white">C</text>
  <!-- Row number column -->
  <rect x="10" y="24" width="16" height="60" fill="#f1f8e9"/>
  <!-- Grid horizontal lines -->
  <line x1="10" y1="34" x2="90" y2="34" stroke="#c8e6c9" stroke-width="1"/>
  <line x1="10" y1="44" x2="90" y2="44" stroke="#c8e6c9" stroke-width="1"/>
  <line x1="10" y1="54" x2="90" y2="54" stroke="#c8e6c9" stroke-width="1"/>
  <line x1="10" y1="64" x2="90" y2="64" stroke="#c8e6c9" stroke-width="1"/>
  <line x1="10" y1="74" x2="90" y2="74" stroke="#c8e6c9" stroke-width="1"/>
  <!-- Grid vertical lines -->
  <line x1="26" y1="24" x2="26" y2="84" stroke="#c8e6c9" stroke-width="1"/>
  <line x1="46" y1="24" x2="46" y2="84" stroke="#c8e6c9" stroke-width="1"/>
  <line x1="66" y1="24" x2="66" y2="84" stroke="#c8e6c9" stroke-width="1"/>
  <!-- Selected cell highlight -->
  <rect x="46" y="44" width="20" height="10" fill="#bbdefb" stroke="#2266cc" stroke-width="1.5"/>
  <!-- Data cells (small rectangles for text) -->
  <rect x="28" y="27" width="14" height="3" rx="1" fill="#aaa"/>
  <rect x="48" y="27" width="12" height="3" rx="1" fill="#aaa"/>
  <rect x="68" y="27" width="16" height="3" rx="1" fill="#aaa"/>
  <rect x="28" y="37" width="10" height="3" rx="1" fill="#888"/>
  <rect x="48" y="37" width="14" height="3" rx="1" fill="#888"/>
