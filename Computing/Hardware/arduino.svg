<!-- board -->
  <rect x="12" y="24" width="76" height="54" rx="6" fill="#006696" stroke="#003050" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- USB connector -->
  <rect x="12" y="38" width="10" height="16" rx="2" fill="#C8C820" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- power barrel jack -->
  <circle cx="20" cy="32" r="6" fill="#222" stroke="#555" stroke-width="2"/>
  <circle cx="20" cy="32" r="2.5" fill="#888"/>
  <!-- microcontroller chip -->
  <rect x="38" y="34" width="28" height="28" rx="2" fill="#222" stroke="#444" stroke-width="2" stroke-linejoin="round"/>
  <!-- chip markings -->
  <text x="52" y="52" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="#60A0D0" font-weight="bold">ATmega</text>
  <!-- digital pin headers top -->
  <g fill="#C8C820" stroke="#888" stroke-width="1">
    <rect x="30" y="24" width="5" height="6" rx="1"/>
    <rect x="40" y="24" width="5" height="6" rx="1"/>
    <rect x="50" y="24" width="5" height="6" rx="1"/>
    <rect x="60" y="24" width="5" height="6" rx="1"/>
    <rect x="70" y="24" width="5" height="6" rx="1"/>
  </g>
  <!-- analog pin headers bottom -->
  <g fill="#C8C820" stroke="#888" stroke-width="1">
    <rect x="30" y="72" width="5" height="6" rx="1"/>
    <rect x="40" y="72" width="5" height="6" rx="1"/>
    <rect x="50" y="72" width="5" height="6" rx="1"/>
    <rect x="60" y="72" width="5" height="6" rx="1"/>
  </g>
  <!-- reset button -->
  <circle cx="78" cy="36" r="5" fill="#E04040" stroke="#333" stroke-width="2"/>
</svg>
