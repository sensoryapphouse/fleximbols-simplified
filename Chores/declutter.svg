<!-- Pile of random items on left (cluttered) -->
  <rect x="8" y="55" width="14" height="18" rx="2" fill="#c9a84c" stroke="#333" stroke-width="1.5"/>
  <circle cx="26" cy="60" r="8" fill="#e07070" stroke="#333" stroke-width="1.5"/>
  <rect x="14" y="46" width="18" height="12" rx="2" fill="#4a90d9" stroke="#333" stroke-width="1.5"/>
  <line x1="8" y1="73" x2="38" y2="73" stroke="#888" stroke-width="1.5"/>
  <!-- Arrow sweeping out items -->
  <path d="M38,62 L55,52" stroke="#e05c2a" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="53,48 60,54 52,56" fill="#e05c2a"/>
