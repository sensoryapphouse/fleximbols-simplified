<!-- Open cage -->
  <!-- Cage base -->
  <rect x="15" y="55" width="36" height="28" rx="3" fill="none" stroke="#8090a0" stroke-width="2.5"/>
  <!-- Cage bars -->
  <line x1="25" y1="55" x2="25" y2="83" stroke="#8090a0" stroke-width="2"/>
  <line x1="35" y1="55" x2="35" y2="83" stroke="#8090a0" stroke-width="2"/>
  <line x1="45" y1="55" x2="45" y2="83" stroke="#8090a0" stroke-width="2"/>
  <!-- Cage top (open - door swung open) -->
  <line x1="15" y1="55" x2="51" y2="55" stroke="#8090a0" stroke-width="2.5"/>
  <!-- Open door swung to right -->
  <path d="M51,55 Q65,45 68,38" fill="none" stroke="#8090a0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hinge point -->
  <circle cx="51" cy="55" r="3" fill="#8090a0"/>
  <!-- Bird flying free (upper right) -->
  <!-- Body -->
  <ellipse cx="76" cy="28" rx="10" ry="6" fill="#f5e8d0" stroke="#c0a880" stroke-width="2"/>
  <!-- Wing left spread -->
  <path d="M66,28 Q60,16 50,18 Q58,24 66,28" fill="#d4c8b0" stroke="#c0a880" stroke-width="1.5"/>
  <!-- Wing right spread -->
  <path d="M86,28 Q92,16 98,18 Q92,24 86,28" fill="#d4c8b0" stroke="#c0a880" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="86" cy="24" r="5" fill="#f5e8d0" stroke="#c0a880" stroke-width="2"/>
  <!-- Beak -->
  <polygon points="90,23 96,24 90,25" fill="#f5a000" stroke="#c07010" stroke-width="1"/>
  <!-- Eye -->
  <circle cx="88" cy="23" r="1.5" fill="#334"/>
  <!-- Motion lines -->
  <line x1="70" y1="24" x2="65" y2="20" stroke="#c0a880" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="72" y1="28" x2="66" y2="28" stroke="#c0a880" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
