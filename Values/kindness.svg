<!-- Giver figure -->
  <circle cx="22" cy="24" r="8" fill="#a8c8e8" stroke="#444" stroke-width="2.5"/>
  <rect x="15" y="34" width="14" height="20" rx="4" fill="#a8c8e8" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Arm extending with gift -->
  <line x1="29" y1="40" x2="46" y2="46" stroke="#a8c8e8" stroke-width="4" stroke-linecap="round"/>
  <!-- Gift box -->
  <rect x="44" y="38" width="20" height="18" rx="2" fill="#f5a8a8" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Gift lid -->
  <rect x="42" y="34" width="24" height="6" rx="1" fill="#e85c8a" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Ribbon vertical -->
  <line x1="54" y1="34" x2="54" y2="56" stroke="#c84060" stroke-width="2"/>
  <!-- Ribbon horizontal -->
  <line x1="44" y1="44" x2="64" y2="44" stroke="#c84060" stroke-width="2"/>
  <!-- Bow -->
  <path d="M 51,34 C 48,30 44,31 46,34 C 48,37 51,34 54,34 C 57,34 60,37 62,34 C 64,31 60,30 57,34" fill="none" stroke="#c84060" stroke-width="2" stroke-linecap="round"/>
