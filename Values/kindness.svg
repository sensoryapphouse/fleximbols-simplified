  <!-- Legs giver -->
  <line x1="19" y1="54" x2="17" y2="68" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="54" x2="27" y2="68" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs recipient -->
