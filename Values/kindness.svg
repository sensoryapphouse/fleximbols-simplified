  <circle cx="78" cy="24" r="8" fill="#c8e8a8" stroke="#444" stroke-width="2.5"/>
  <rect x="71" y="34" width="14" height="20" rx="4" fill="#c8e8a8" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
