<!-- Pointing hand + nearby object (close proximity) -->
  <!-- Object (circle, nearby = large) -->
  <circle cx="72" cy="42" r="18" fill="#f5d020" stroke="black" stroke-width="2.5"/>
  <!-- Pointing hand (finger extended right) -->
  <path d="M8,52 L8,44 Q8,40 12,40 L28,40 Q32,40 32,44 L44,44 Q46,44 46,46 L46,48 Q46,50 44,50 L32,50 L32,56 Q32,60 28,60 L12,60 Q8,60 8,56 Z" fill="#f5c5a3" stroke="black" stroke-width="2" stroke-linejoin="round"/>
  <!-- Finger pointing -->
  <path d="M32,44 L54,44 Q58,44 58,48 Q58,52 54,52 L32,52" fill="#f5c5a3" stroke="black" stroke-width="2" stroke-linejoin="round"/>
  <!-- Short distance line from finger to object -->
