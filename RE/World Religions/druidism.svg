  <path d="M44,90 Q36,95 30,98" fill="none" stroke="#8a5020" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M56,90 Q64,95 70,98" fill="none" stroke="#8a5020" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Canopy -->
  <circle cx="50" cy="48" r="20" fill="#3a7a30" stroke="#333" stroke-width="2"/>
  <circle cx="34" cy="55" r="16" fill="#4a8a40" stroke="#333" stroke-width="2"/>
  <circle cx="66" cy="55" r="16" fill="#4a8a40" stroke="#333" stroke-width="2"/>
  <circle cx="50" cy="35" r="16" fill="#3a7a30" stroke="#333" stroke-width="2"/>
  <!-- Acorn -->
