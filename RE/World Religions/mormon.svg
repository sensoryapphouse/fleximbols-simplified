  <!-- Mormon: LDS Temple with Angel Moroni atop -->
  <!-- Angel Moroni figure (simplified silhouette with trumpet) -->
  <circle cx="50" cy="8" r="3" fill="#f5c842" stroke="#000" stroke-width="1.6"/>
  <path d="M 47 11 L 53 11 L 54 18 L 46 18 Z" fill="#f5c842" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Trumpet -->
  <line x1="53" y1="13" x2="62" y2="11" stroke="#000" stroke-width="2"/>
  <polygon points="60,9 64,9 64,13 60,13" fill="#f5c842" stroke="#000" stroke-width="1.4"/>
  <!-- Spire/tower -->
  <polygon points="50,18 44,30 56,30" fill="#e8e8e8" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="44" y="30" width="12" height="14" fill="#e8e8e8" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Main temple body -->
  <rect x="22" y="44" width="56" height="38" fill="#e8e8e8" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Pointed arch windows -->
  <path d="M 30 76 L 30 60 Q 30 54 34 54 Q 38 54 38 60 L 38 76 Z" fill="#3a6abf" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 46 76 L 46 60 Q 46 54 50 54 Q 54 54 54 60 L 54 76 Z" fill="#3a6abf" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 62 76 L 62 60 Q 62 54 66 54 Q 70 54 70 60 L 70 76 Z" fill="#3a6abf" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Base -->
  <rect x="14" y="82" width="72" height="8" fill="#b0b0b0" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
