  <!-- Main shaft -->
  <rect x="47" y="20" width="6" height="60" rx="2" fill="#c8a96e" stroke="#333" stroke-width="2"/>
  <!-- Top prongs -->
  <path d="M50,20 L42,8 M50,20 L50,8 M50,20 L58,8" stroke="#c8a96e" stroke-width="3" stroke-linecap="round"/>
  <!-- Top ring -->
