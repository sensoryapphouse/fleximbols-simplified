  <!-- Shaivism: Shiva lingam with trident (trishula) -->
  <!-- Lingam -->
  <ellipse cx="50" cy="72" rx="18" ry="22" fill="#888" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="50" cy="65" rx="12" ry="8" fill="#aaa" stroke="#333" stroke-width="2"/>
  <!-- Base (yoni) -->
  <ellipse cx="50" cy="88" rx="28" ry="8" fill="#c8a96e" stroke="#333" stroke-width="2"/>
  <!-- Trishula (trident) on top -->
  <line x1="50" y1="45" x2="50" y2="12" stroke="#c8a96e" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="16" x2="42" y2="8" stroke="#c8a96e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="16" x2="58" y2="8" stroke="#c8a96e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="12" x2="50" y2="5" stroke="#c8a96e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Horizontal bar on trident -->
  <line x1="40" y1="22" x2="60" y2="22" stroke="#c8a96e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Third eye dot -->
  <circle cx="50" cy="58" r="3" fill="#e05050" stroke="#333" stroke-width="1"/>
</svg>
