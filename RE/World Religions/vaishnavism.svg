  <!-- Vaishnavism: Vishnu's conch, lotus, and tilak mark -->
  <!-- Tilak (Vaishnava forehead mark - U shape with line) -->
  <path d="M35,15 Q35,35 50,38 Q65,35 65,15" fill="none" stroke="#f5c040" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="15" x2="50" y2="38" stroke="#e05050" stroke-width="4" stroke-linecap="round"/>
  <!-- Lotus -->
  <ellipse cx="50" cy="65" rx="8" ry="12" fill="#e87090" stroke="#333" stroke-width="2"/>
  <ellipse cx="35" cy="68" rx="8" ry="10" fill="#e87090" stroke="#333" stroke-width="2" transform="rotate(-20,35,68)"/>
  <ellipse cx="65" cy="68" rx="8" ry="10" fill="#e87090" stroke="#333" stroke-width="2" transform="rotate(20,65,68)"/>
  <ellipse cx="42" cy="60" rx="7" ry="9" fill="#f0a0b0" stroke="#333" stroke-width="2" transform="rotate(-35,42,60)"/>
  <ellipse cx="58" cy="60" rx="7" ry="9" fill="#f0a0b0" stroke="#333" stroke-width="2" transform="rotate(35,58,60)"/>
  <circle cx="50" cy="62" r="8" fill="#f5c040" stroke="#333" stroke-width="2"/>
  <!-- Conch -->
  <path d="M62,88 Q72,78 70,68 Q68,60 62,58 Q56,56 54,62 Q52,68 58,72 Q64,76 62,84 Q61,88 62,92Z" fill="#f5f0e0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
</svg>
