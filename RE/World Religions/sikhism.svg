  <!-- Sikhism: Khanda symbol -->
  <!-- Double-edged sword (khanda) in center -->
  <path d="M50,10 L45,50 L50,92 L55,50Z" fill="#c8a96e" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Circular chakkar (ring) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#c8a96e" stroke-width="6"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Left kirpan -->
  <path d="M20,20 L48,52 L44,56 L16,24Z" fill="#c8a96e" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right kirpan -->
  <path d="M80,20 L52,52 L56,56 L84,24Z" fill="#c8a96e" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
