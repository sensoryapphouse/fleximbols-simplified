  <!-- Humanism: Happy Human figure (International Humanist symbol) -->
  <!-- Arching body (the "Happy Human" pose) -->
  <!-- Head -->
  <circle cx="50" cy="22" r="10" fill="#f5ddb0" stroke="#333" stroke-width="2.5"/>
  <!-- Body arching upward joyfully -->
  <path d="M30,82 Q18,55 28,42 Q36,32 50,35 Q64,32 72,42 Q82,55 70,82" fill="none" stroke="#3a7aba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arms raised -->
  <path d="M35,52 Q22,38 18,28" fill="none" stroke="#3a7aba" stroke-width="5" stroke-linecap="round"/>
  <path d="M65,52 Q78,38 82,28" fill="none" stroke="#3a7aba" stroke-width="5" stroke-linecap="round"/>
  <!-- Ground line -->
  <line x1="15" y1="90" x2="85" y2="90" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
</svg>
