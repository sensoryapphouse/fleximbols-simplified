  <!-- Rastafarianism: Lion of Judah + Rasta colours -->
  <!-- Red/Gold/Green banner -->
  <rect x="5" y="5" width="90" height="20" rx="3" fill="#cc2222" stroke="#333" stroke-width="2"/>
  <rect x="5" y="25" width="90" height="20" rx="3" fill="#f5c040" stroke="#333" stroke-width="2"/>
  <rect x="5" y="45" width="90" height="20" rx="3" fill="#2a8a2a" stroke="#333" stroke-width="2"/>
  <!-- Lion head (simplified) -->
  <circle cx="50" cy="78" r="16" fill="#c8a050" stroke="#333" stroke-width="2"/>
  <!-- Mane -->
  <circle cx="50" cy="78" r="22" fill="none" stroke="#8a5020" stroke-width="6"/>
  <!-- Eyes -->
  <circle cx="44" cy="75" r="3" fill="#333"/>
  <circle cx="56" cy="75" r="3" fill="#333"/>
  <!-- Nose -->
  <ellipse cx="50" cy="82" rx="4" ry="2" fill="#8a5020" stroke="#333" stroke-width="1"/>
  <!-- Star of David (Judah) -->
  <polygon points="50,3 52,7 56,7 53,10 54.5,14 50,11.5 45.5,14 47,10 44,7 48,7" fill="#f5c040" stroke="#333" stroke-width="1"/>
