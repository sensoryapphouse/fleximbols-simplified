  <!-- Kaaba - black cube with gold band -->
  <rect x="25" y="30" width="50" height="55" rx="2" fill="#1a1a1a" stroke="#222" stroke-width="2.5"/>
  <!-- Kiswa gold band -->
  <rect x="25" y="50" width="50" height="8" fill="#c8a030" stroke="#222" stroke-width="1"/>
  <!-- Door of Kaaba -->
  <rect x="38" y="60" width="14" height="25" rx="1" fill="#c8a030" stroke="#222" stroke-width="1.5"/>
  <!-- Top edge highlight -->
  <line x1="25" y1="30" x2="75" y2="30" stroke="#333" stroke-width="1"/>
  <!-- Perspective top face -->
  <polygon points="25,30 40,14 90,14 75,30" fill="#2a2a2a" stroke="#222" stroke-width="2"/>
  <!-- Perspective right face -->
  <polygon points="75,30 90,14 90,70 75,85" fill="#111" stroke="#222" stroke-width="2"/>
  <!-- Crescent and star symbol above -->
  <path d="M44 8 C44 2 48 0 52 2 C47 4 45 8 47 12 C44 10 44 8 44 8Z" fill="#c8a030" stroke="#222" stroke-width="1.5"/>
  <polygon points="54,4 55,7 58,7 56,9 57,12 54,10 51,12 52,9 50,7 53,7" fill="#c8a030" stroke="#222" stroke-width="1"/>
  <!-- Pilgrims (tiny dots representing crowd) -->
  <circle cx="15" cy="80" r="3" fill="#f5c87a" stroke="#222" stroke-width="1"/>
  <circle cx="8" cy="84" r="3" fill="#f5c87a" stroke="#222" stroke-width="1"/>
  <circle cx="85" cy="76" r="3" fill="#f5c87a" stroke="#222" stroke-width="1"/>
  <circle cx="92" cy="80" r="3" fill="#f5c87a" stroke="#222" stroke-width="1"/>
</svg>
