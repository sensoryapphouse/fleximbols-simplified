  <!-- Mawlid: Prophet's birthday - mosque dome + crescent, candles/lanterns -->
  <!-- Mosque dome -->
  <path d="M20 60 Q20 25 50 22 Q80 25 80 60Z" fill="#27ae60" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Mosque body -->
  <rect x="20" y="60" width="60" height="25" rx="2" fill="#3498db" stroke="#222" stroke-width="2.5"/>
  <!-- Arched door -->
  <path d="M42 85 L42 70 Q50 62 58 70 L58 85Z" fill="#e8d5a3" stroke="#222" stroke-width="2"/>
  <!-- Windows -->
  <path d="M25 68 Q30 63 35 68 L35 78 L25 78Z" fill="#f5a623" stroke="#222" stroke-width="1.5"/>
  <path d="M65 68 Q70 63 75 68 L75 78 L65 78Z" fill="#f5a623" stroke="#222" stroke-width="1.5"/>
  <!-- Minaret left -->
  <rect x="8" y="42" width="10" height="43" rx="2" fill="#3498db" stroke="#222" stroke-width="2"/>
  <path d="M8 42 Q13 32 18 42Z" fill="#27ae60" stroke="#222" stroke-width="2"/>
  <!-- Minaret right -->
  <rect x="82" y="42" width="10" height="43" rx="2" fill="#3498db" stroke="#222" stroke-width="2"/>
  <path d="M82 42 Q87 32 92 42Z" fill="#27ae60" stroke="#222" stroke-width="2"/>
  <!-- Crescent on top of dome -->
  <path d="M50 8 A8 8 0 1 1 43 14 A6 6 0 1 0 50 8Z" fill="#f5a623" stroke="#222" stroke-width="1.5"/>
  <!-- Small star -->
  <polygon points="57,10 58,13 61,13 58.5,15 59.5,18 57,16.5 54.5,18 55.5,15 53,13 56,13" fill="#fff700" stroke="#222" stroke-width="1"/>
  <!-- Decorative string lights / bunting -->
  <path d="M10 30 Q50 20 90 30" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
