  <!-- Ramadan: crescent moon + star on night sky -->
  <!-- Night sky background feel - no rect per rules, just shapes -->
  <!-- Crescent moon -->
  <circle cx="48" cy="45" r="28" fill="#f5a623" stroke="#222" stroke-width="2.5"/>
  <circle cx="58" cy="38" r="22" fill="#e8d5a3" stroke="none"/>
  <!-- The crescent shape is moon minus offset circle -->
  <!-- Redraw using path for clean crescent -->
  <path d="M48 17 A28 28 0 1 1 20 48 A22 22 0 1 0 48 17Z" fill="#f5a623" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Star (5-pointed) -->
  <polygon points="75,22 77,30 85,30 79,35 81,43 75,38 69,43 71,35 65,30 73,30" fill="#fff700" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Small stars in sky -->
  <circle cx="20" cy="20" r="2" fill="#fff700"/>
  <circle cx="30" cy="12" r="1.5" fill="#fff700"/>
  <circle cx="88" cy="55" r="2" fill="#fff700"/>
  <circle cx="15" cy="70" r="1.5" fill="#fff700"/>
  <!-- Lantern hanging beneath -->
  <line x1="50" y1="73" x2="50" y2="78" stroke="#222" stroke-width="2"/>
  <path d="M38 78 Q38 95 50 95 Q62 95 62 78Z" fill="#e63b2e" stroke="#222" stroke-width="2"/>
  <ellipse cx="50" cy="78" rx="12" ry="4" fill="#c0392b" stroke="#222" stroke-width="2"/>
  <line x1="44" y1="85" x2="56" y2="85" stroke="#f5a623" stroke-width="1.5"/>
  <line x1="42" y1="89" x2="58" y2="89" stroke="#f5a623" stroke-width="1.5"/>
</svg>
