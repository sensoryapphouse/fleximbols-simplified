  <rect x="35" y="28" width="30" height="5" fill="#998877" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Arched windows -->
  <rect x="12" y="42" width="16" height="20" rx="6" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <rect x="72" y="42" width="16" height="20" rx="6" fill="#A8D4F5" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
