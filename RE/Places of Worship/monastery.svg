<!-- Main building - simple stone -->
  <rect x="8" y="35" width="84" height="50" fill="#C8BBAA" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Stone texture lines -->
  <line x1="8" y1="45" x2="92" y2="45" stroke="#AAA" stroke-width="1"/>
  <line x1="8" y1="55" x2="92" y2="55" stroke="#AAA" stroke-width="1"/>
  <line x1="8" y1="65" x2="92" y2="65" stroke="#AAA" stroke-width="1"/>
