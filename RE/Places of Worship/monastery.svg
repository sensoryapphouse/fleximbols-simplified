  <line x1="75" y1="35" x2="75" y2="85" stroke="#AAA" stroke-width="1"/>
  <!-- Roof -->
  <rect x="5" y="30" width="90" height="8" fill="#998877" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
