<!-- Japanese Torii gate -->
  <!-- Ground -->
  <line x1="10" y1="80" x2="90" y2="80" stroke="#8B5E3C" stroke-width="2"/>
  <!-- Left post -->
  <rect x="24" y="34" width="8" height="46" rx="2" fill="#CC4422" stroke="#333" stroke-width="2.5"/>
  <!-- Right post -->
  <rect x="68" y="34" width="8" height="46" rx="2" fill="#CC4422" stroke="#333" stroke-width="2.5"/>
  <!-- Top beam (slightly curved upward at ends) -->
  <path d="M16 28 Q50 18 84 28" fill="none" stroke="#CC4422" stroke-width="8" stroke-linecap="round"/>
  <path d="M16 28 Q50 18 84 28" fill="none" stroke="#AA3311" stroke-width="4" stroke-linecap="round"/>
  <!-- Second beam below -->
  <rect x="22" y="38" width="56" height="6" rx="2" fill="#CC4422" stroke="#333" stroke-width="2"/>
  <!-- Shimenawa (rope) hanging between posts -->
  <path d="M32 46 Q50 50 68 46" fill="none" stroke="#8B5E3C" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Zigzag paper strips (shide) -->
  <path d="M46 50 L44 56 L48 58 L44 62" fill="none" stroke="white" stroke-width="1.5"/>
  <path d="M50 50 L48 56 L52 58 L48 62" fill="none" stroke="white" stroke-width="1.5"/>
  <path d="M54 50 L52 56 L56 58 L52 62" fill="none" stroke="white" stroke-width="1.5"/>
</svg>
