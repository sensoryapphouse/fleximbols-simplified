<!-- Ground -->
  <rect x="10" y="74" width="80" height="4" rx="1" fill="#DDD" stroke="#999" stroke-width="1"/>
  <!-- Main building -->
  <rect x="22" y="48" width="56" height="26" rx="2" fill="#FFFBE6" stroke="#333" stroke-width="2.5"/>
  <!-- Central dome (white) -->
  <path d="M34 48 Q34 28 50 24 Q66 28 66 48Z" fill="white" stroke="#333" stroke-width="2.5"/>
  <!-- Smaller side domes -->
  <path d="M22 48 Q22 38 32 36 Q36 36 36 48Z" fill="white" stroke="#333" stroke-width="2"/>
  <path d="M64 48 Q64 36 74 36 Q78 36 78 48Z" fill="white" stroke="#333" stroke-width="2"/>
  <!-- Nishan Sahib (flag) on top -->
  <line x1="50" y1="24" x2="50" y2="10" stroke="#CC8800" stroke-width="2"/>
  <!-- Khanda on flagpole area -->
  <text x="50" y="22" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="8" text-anchor="middle" fill="#FF8800">✦</text>
  <!-- Orange triangular flags -->
  <polygon points="50,12 60,16 50,20" fill="#FF6600" stroke="#AA4400" stroke-width="1"/>
  <!-- Arched doorway -->
  <path d="M43 74 L43 60 Q50 54 57 60 L57 74Z" fill="#FFAA00" stroke="#333" stroke-width="1.5"/>
  <!-- Windows with arches -->
  <path d="M26 60 Q30 54 34 60 L34 66 L26 66Z" fill="#FFEEAA" stroke="#333" stroke-width="1"/>
  <path d="M66 60 Q70 54 74 60 L74 66 L66 66Z" fill="#FFEEAA" stroke="#333" stroke-width="1"/>
</svg>
