<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Pagoda-style temple -->
  <!-- Ground -->
  <rect x="10" y="74" width="80" height="4" rx="1" fill="#DDD" stroke="#999" stroke-width="1"/>
  <!-- Base platform -->
  <rect x="22" y="68" width="56" height="6" rx="1" fill="#CC8822" stroke="#333" stroke-width="2"/>
  <!-- Ground floor walls -->
  <rect x="28" y="52" width="44" height="16" fill="#FFEECC" stroke="#333" stroke-width="2"/>
  <!-- Ground floor roof -->
  <polygon points="22,52 78,52 72,42 28,42" fill="#CC4444" stroke="#333" stroke-width="2"/>
  <line x1="22" y1="52" x2="15" y2="52" stroke="#CC4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="52" x2="85" y2="52" stroke="#CC4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Second floor walls -->
  <rect x="34" y="32" width="32" height="10" fill="#FFEECC" stroke="#333" stroke-width="2"/>
  <!-- Second floor roof -->
  <polygon points="28,32 72,32 66,24 34,24" fill="#CC4444" stroke="#333" stroke-width="2"/>
  <line x1="28" y1="32" x2="22" y2="32" stroke="#CC4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="32" x2="78" y2="32" stroke="#CC4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top roof/spire -->
  <polygon points="34,24 66,24 50,14" fill="#CC4444" stroke="#333" stroke-width="2"/>
  <!-- Finial -->
  <line x1="50" y1="14" x2="50" y2="8" stroke="#AA6600" stroke-width="2"/>
  <circle cx="50" cy="7" r="2" fill="#FFCC00" stroke="#AA6600" stroke-width="1"/>
  <!-- Door -->
  <path d="M44 68 L44 58 Q50 54 56 58 L56 68Z" fill="#AA6600" stroke="#333" stroke-width="1.5"/>
</svg>
