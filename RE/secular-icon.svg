<!-- Simple person figure with no religious symbols -->
  <!-- Head -->
  <circle cx="50" cy="24" r="10" fill="#FFCC99" stroke="#333" stroke-width="2.5"/>
  <!-- Body -->
  <rect x="38" y="36" width="24" height="26" rx="4" fill="#4488CC" stroke="#333" stroke-width="2.5"/>
  <!-- Arms -->
  <line x1="38" y1="42" x2="24" y2="50" stroke="#4488CC" stroke-width="5" stroke-linecap="round"/>
  <line x1="62" y1="42" x2="76" y2="50" stroke="#4488CC" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="44" y1="62" x2="40" y2="80" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="56" y1="62" x2="60" y2="80" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Cross-out circle indicating secular/no religion -->
  <circle cx="72" cy="22" r="10" fill="none" stroke="#CC2222" stroke-width="2.5"/>
  <line x1="65" y1="29" x2="79" y2="15" stroke="#CC2222" stroke-width="2.5"/>
</svg>
