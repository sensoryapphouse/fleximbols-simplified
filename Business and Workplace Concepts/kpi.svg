<!-- Gauge background arc -->
  <path d="M15 70 A35 35 0 0 1 85 70" stroke="#e0e0e0" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Gauge colored segments -->
  <!-- Red zone (left) -->
  <path d="M15 70 A35 35 0 0 1 29 38" stroke="#cc5544" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Yellow zone (middle) -->
  <path d="M29 38 A35 35 0 0 1 71 38" stroke="#d4a820" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Green zone (right) -->
  <path d="M71 38 A35 35 0 0 1 85 70" stroke="#338866" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Center point -->
  <circle cx="50" cy="70" r="4" fill="#333"/>
  <!-- Needle pointing to green zone (~75%) -->
  <line x1="50" y1="70" x2="74" y2="42" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Labels -->
  <text x="12" y="82" font-size="6" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="#cc5544">0</text>
  <text x="88" y="82" font-size="6" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="#338866">100</text>
  <!-- KPI value -->
  <text x="50" y="62" font-size="12" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold" text-anchor="middle" fill="#333">78</text>
</svg>