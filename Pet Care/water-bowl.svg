<!-- Water bowl: bowl with water ripple inside -->
  <!-- Bowl outer rim -->
  <ellipse cx="50" cy="62" rx="40" ry="12" fill="#4488cc" stroke="#333" stroke-width="2.5"/>
  <!-- Bowl body -->
  <path d="M10,62 Q10,82 50,82 Q90,82 90,62Z" fill="#5599dd" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Water surface inside (lighter blue) -->
  <ellipse cx="50" cy="62" rx="36" ry="10" fill="#88bbee" stroke="#4488cc" stroke-width="1.5"/>
  <!-- Water ripples -->
  <ellipse cx="50" cy="62" rx="20" ry="5" fill="none" stroke="#4488cc" stroke-width="1.5"/>
  <ellipse cx="50" cy="62" rx="10" ry="3" fill="none" stroke="#4488cc" stroke-width="1"/>
  <!-- Water drop about to fall (above bowl) -->
  <path d="M50,30 Q50,42 46,46 Q42,50 46,54 Q50,58 54,54 Q58,50 54,46 Q50,42 50,30Z" fill="#4488cc" stroke="#333" stroke-width="1.5"/>
</svg>
