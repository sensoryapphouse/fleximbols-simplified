<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Globe outline -->
  <circle cx="50" cy="48" r="36" fill="#d0e8f8" stroke="#333" stroke-width="2.5"/>
  <!-- Latitude lines -->
  <ellipse cx="50" cy="48" rx="36" ry="14" fill="none" stroke="#5a8ab0" stroke-width="1.5"/>
  <ellipse cx="50" cy="36" rx="30" ry="8" fill="none" stroke="#5a8ab0" stroke-width="1.5"/>
  <ellipse cx="50" cy="60" rx="30" ry="8" fill="none" stroke="#5a8ab0" stroke-width="1.5"/>
  <!-- Meridian lines -->
  <ellipse cx="50" cy="48" rx="14" ry="36" fill="none" stroke="#5a8ab0" stroke-width="1.5"/>
  <line x1="50" y1="12" x2="50" y2="84" stroke="#5a8ab0" stroke-width="1.5"/>
  <!-- Connection dots -->
  <circle cx="30" cy="35" r="3" fill="#e87830" stroke="#333" stroke-width="1.5"/>
  <circle cx="65" cy="30" r="3" fill="#e87830" stroke="#333" stroke-width="1.5"/>
  <circle cx="70" cy="58" r="3" fill="#e87830" stroke="#333" stroke-width="1.5"/>
  <circle cx="35" cy="62" r="3" fill="#e87830" stroke="#333" stroke-width="1.5"/>
  <!-- Connection lines -->
  <line x1="30" y1="35" x2="65" y2="30" stroke="#e87830" stroke-width="1.5" opacity="0.7"/>
  <line x1="65" y1="30" x2="70" y2="58" stroke="#e87830" stroke-width="1.5" opacity="0.7"/>
  <line x1="35" y1="62" x2="70" y2="58" stroke="#e87830" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="35" x2="35" y2="62" stroke="#e87830" stroke-width="1.5" opacity="0.7"/>
  <!-- Label -->
</svg>
