<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Folded blanket -->
  <!-- Bottom fold -->
  <rect x="15" y="62" width="70" height="16" rx="3" fill="#8899CC" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Middle layer -->
  <rect x="12" y="48" width="76" height="18" rx="3" fill="#99AADD" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top layer (folded over) -->
  <rect x="10" y="34" width="80" height="18" rx="3" fill="#AABBEE" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Blanket pattern - plaid lines on top -->
  <line x1="10" y1="40" x2="90" y2="40" stroke="#8899CC" stroke-width="1.5"/>
  <line x1="10" y1="46" x2="90" y2="46" stroke="#8899CC" stroke-width="1.5"/>
  <line x1="25" y1="34" x2="25" y2="52" stroke="#8899CC" stroke-width="1.5"/>
  <line x1="40" y1="34" x2="40" y2="52" stroke="#8899CC" stroke-width="1.5"/>
  <line x1="55" y1="34" x2="55" y2="52" stroke="#8899CC" stroke-width="1.5"/>
  <line x1="70" y1="34" x2="70" y2="52" stroke="#8899CC" stroke-width="1.5"/>
  <!-- Fringe at bottom edge -->
  <line x1="15" y1="78" x2="15" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="78" x2="22" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="78" x2="29" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="78" x2="36" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="78" x2="43" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="78" x2="50" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="57" y1="78" x2="57" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="78" x2="64" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="71" y1="78" x2="71" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="78" x2="78" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="85" y1="78" x2="85" y2="83" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
</svg>
