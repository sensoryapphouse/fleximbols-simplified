  <circle cx="20" cy="62" r="9" fill="#6baed6" stroke="#333" stroke-width="2"/>
  <!-- more dots on right -->
  <circle cx="70" cy="30" r="9" fill="#6baed6" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="51" r="9" fill="#6baed6" stroke="#333" stroke-width="2"/>
  <circle cx="85" cy="40" r="9" fill="#6baed6" stroke="#333" stroke-width="2"/>
  <circle cx="85" cy="62" r="9" fill="#6baed6" stroke="#333" stroke-width="2"/>
  <!-- plus sign in middle -->
  <line x1="44" y1="51" x2="56" y2="51" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="45" x2="50" y2="57" stroke="#333" stroke-width="3" stroke-linecap="round"/>
</svg>
