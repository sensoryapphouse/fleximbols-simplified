<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Horizon line -->
  <line x1="10" y1="62" x2="90" y2="62" stroke="#888" stroke-width="2"/>
  <!-- Sun partially risen (bottom half below horizon) -->
  <clipPath id="aboveHorizonM">
    <rect x="0" y="0" width="100" height="62"/>
  </clipPath>
  <circle cx="50" cy="62" r="22" fill="#f0c030" stroke="#cc8800" stroke-width="2" clip-path="url(#aboveHorizonM)"/>
  <!-- Sun rays -->
  <line x1="50" y1="36" x2="50" y2="28" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="40" x2="74" y2="34" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="26" y2="34" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="55" x2="82" y2="52" stroke="#f0a830" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="55" x2="18" y2="52" stroke="#f0a830" stroke-width="2" stroke-linecap="round"/>
</svg>
