<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dashed elliptical orbit around box, drawn first -->
  <ellipse cx="256" cy="345" rx="230" ry="140"
    fill="none" stroke="#2eb05a" stroke-width="5" stroke-dasharray="14,10"/>

  <!-- Small clockwise arrowhead on orbit at right side (~485,345) -->
  <polygon points="485,345 470,330 478,360"
    fill="#2eb05a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- OPEN BOX (canonical position) -->
  <rect x="140" y="270" width="232" height="44" fill="#7a5028" stroke="#000000" stroke-width="5"/>
  <path d="M 140 314 L 372 314 L 388 326 L 124 326 Z" fill="#a06840" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="120" y="326" width="272" height="94" fill="#caa379" stroke="#000000" stroke-width="5"/>

  <!-- Ball at top of orbit (12 o'clock) -->
  <circle cx="256" cy="170" r="54" fill="#e74c3c" stroke="#000000" stroke-width="5"/>
  <circle cx="236" cy="150" r="16" fill="#f7b8b0"/>
</svg>
