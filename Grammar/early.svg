  <!-- Hands pointing to ~6am -->
  <line x1="50" y1="46" x2="50" y2="72" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="46" x2="68" y2="36" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="46" r="3" fill="#333"/>
  <!-- Small sun rising at top -->
