  <!-- Canonical OPEN BOX shifted LEFT by -80 -->
  <!-- Interior back wall: x=60 y=270 w=232 h=44 -->
  <rect x="60" y="270" width="232" height="44" fill="#7a5028" stroke="#000000" stroke-width="5"/>
  <!-- Interior floor sloping forward -->
  <path d="M 60 314 L 292 314 L 308 326 L 44 326 Z" fill="#a06840" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Front face: x=40 y=326 w=272 h=94 -->
  <rect x="40" y="326" width="272" height="94" fill="#caa379" stroke="#000000" stroke-width="5"/>

  <!-- Short LEFT-pointing arrow: shaft from box right edge (x=312) to arrowhead base; tip near ball left edge (x=394) -->
  <!-- Shaft: x=316 y=359 w=72 h=22 (from x=316 to x=388) -->
  <rect x="316" y="359" width="72" height="22" fill="#2eb05a" stroke="#000000" stroke-width="5"/>
  <!-- Arrowhead tip at x=394 (ball left edge), base at x=352 -->
  <polygon points="394,370 354,348 354,392" fill="#2eb05a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Ball RIGHT of the box -->
  <circle cx="448" cy="370" r="54" fill="#e74c3c" stroke="#000000" stroke-width="5"/>
  <circle cx="428" cy="350" r="16" fill="#f7b8b0"/>

</svg>
