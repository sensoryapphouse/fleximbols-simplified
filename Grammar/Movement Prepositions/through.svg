<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Open box drawn first -->
  <rect x="140" y="270" width="232" height="44" fill="#7a5028" stroke="#000000" stroke-width="5"/>
  <path d="M 140 314 L 372 314 L 388 326 L 124 326 Z" fill="#a06840" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="120" y="326" width="272" height="94" fill="#caa379" stroke="#000000" stroke-width="5"/>
  <!-- Entry hole on left face -->
  <ellipse cx="120" cy="370" rx="8" ry="14" fill="#1a1a1a"/>
  <!-- Exit hole on right face -->
  <ellipse cx="392" cy="370" rx="8" ry="14" fill="#1a1a1a"/>
  <!-- Horizontal arrow piercing box, drawn over box -->
  <rect x="40" y="363" width="380" height="14" fill="#2eb05a" stroke="#000000" stroke-width="5"/>
  <!-- Arrowhead pointing right toward ball -->
  <polygon points="436,370 410,346 410,394" fill="#2eb05a" stroke="#000000" stroke-width="5"/>
  <!-- Ball to the right -->
  <circle cx="470" cy="370" r="42" fill="#e74c3c" stroke="#000000" stroke-width="5"/>
  <circle cx="450" cy="350" r="13" fill="#f7b8b0"/>
</svg>
