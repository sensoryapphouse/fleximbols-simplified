<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Open box -->
  <rect x="140" y="270" width="232" height="44" fill="#7a5028" stroke="#000000" stroke-width="5"/>
  <path d="M 140 314 L 372 314 L 388 326 L 124 326 Z" fill="#a06840" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="120" y="326" width="272" height="94" fill="#caa379" stroke="#000000" stroke-width="5"/>
  <!-- Curved arc arrow arching UP and OVER the box from left to right -->
  <!-- Thick green fill drawn first -->
  <path d="M 60 380 Q 256 100 460 370" fill="none" stroke="#2eb05a" stroke-width="5"/>
  <!-- Black outline -->
  <path d="M 60 380 Q 256 100 460 370" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- Arrowhead near ball -->
  <polygon points="460,370 428,358 446,388" fill="#2eb05a" stroke="#000000" stroke-width="5"/>
  <!-- Ball to the right -->
  <circle cx="470" cy="370" r="42" fill="#e74c3c" stroke="#000000" stroke-width="5"/>
  <circle cx="450" cy="350" r="13" fill="#f7b8b0"/>
</svg>
