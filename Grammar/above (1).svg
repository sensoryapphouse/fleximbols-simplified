<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- Ball ABOVE the box -->
  <circle cx="256" cy="120" r="54" fill="#e74c3c" stroke="#000000" stroke-width="5"/>
  <circle cx="236" cy="100" r="16" fill="#f7b8b0"/>

  <!-- Up-arrow: shaft from box top (y=270) down to arrowhead base, tip touches ball bottom (y=174) -->
  <!-- Shaft: x=244 y=210 w=24 h=60 — runs from y=210 to y=270 (box top) -->
  <rect x="244" y="210" width="24" height="60" fill="#2eb05a" stroke="#000000" stroke-width="5"/>
  <!-- Arrowhead tip at y=174 (ball bottom), base at y=214 -->
  <polygon points="256,174 230,214 282,214" fill="#2eb05a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Canonical OPEN BOX -->
  <!-- Interior back wall -->
  <rect x="140" y="270" width="232" height="44" fill="#7a5028" stroke="#000000" stroke-width="5"/>
  <!-- Interior floor sloping forward -->
  <path d="M 140 314 L 372 314 L 388 326 L 124 326 Z" fill="#a06840" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Front face -->
  <rect x="120" y="326" width="272" height="94" fill="#caa379" stroke="#000000" stroke-width="5"/>

</svg>
