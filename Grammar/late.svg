<!-- Clock with hands at late hour (11pm ish) -->
  <circle cx="50" cy="46" r="26" fill="#e8eaf8" stroke="#333" stroke-width="2.5"/>
  <!-- Hands pointing nearly to midnight -->
  <line x1="50" y1="46" x2="50" y2="22" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="46" x2="44" y2="22" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="46" r="3" fill="#333"/>
  <!-- Moon indicating night/late -->
  <path d="M 76 20 A 10 10 0 1 1 88 28 A 6 6 0 1 0 76 20 Z" fill="#f0e060" stroke="#aaa" stroke-width="1.5"/>
</svg>
