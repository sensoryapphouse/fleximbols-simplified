<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(-6.836 13.770)">
<!-- Horizon line -->
  <line x1="10" y1="70" x2="90" y2="70" stroke="#888" stroke-width="2"/>
  <!-- Sun high in sky, slightly past zenith (afternoon position - right of centre) -->
  <circle cx="62" cy="36" r="18" fill="#f0c030" stroke="#cc8800" stroke-width="2"/>
  <!-- Sun rays -->
  <line x1="62" y1="14" x2="62" y2="20" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="20" x2="74" y2="24" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="36" x2="78" y2="36" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="20" x2="50" y2="24" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="36" x2="46" y2="36" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Light rays down toward ground -->
  <line x1="55" y1="52" x2="52" y2="64" stroke="#f0c030" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="62" y1="54" x2="62" y2="66" stroke="#f0c030" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="69" y1="52" x2="72" y2="64" stroke="#f0c030" stroke-width="1.5" stroke-dasharray="3,2"/>
</g>
  </svg>
