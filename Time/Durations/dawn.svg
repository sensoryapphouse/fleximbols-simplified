<!-- Pale dawn sky -->
  <rect x="0" y="0" width="100" height="70" fill="#e8eef8"/>
  <!-- Horizon -->
  <rect x="0" y="68" width="100" height="12" fill="#c8a96e" stroke="#333" stroke-width="1.5"/>
  <!-- First light strips on horizon -->
  <rect x="0" y="58" width="100" height="10" fill="#ffd0a0" stroke="none"/>
  <rect x="0" y="52" width="100" height="6" fill="#ffe0c0" stroke="none"/>
  <rect x="0" y="47" width="100" height="5" fill="#fff0e0" stroke="none"/>
  <!-- Thin horizon line separator -->
  <line x1="0" y1="68" x2="100" y2="68" stroke="#333" stroke-width="1.5"/>
  <!-- Tiny sun just barely rising -->
  <clipPath id="dh">
    <rect x="0" y="0" width="100" height="68"/>
  </clipPath>
  <circle cx="50" cy="68" r="8" fill="#ffcc00" stroke="#e87722" stroke-width="2" clip-path="url(#dh)"/>
  <!-- Soft rays -->
  <line x1="50" y1="56" x2="50" y2="50" stroke="#ffaa44" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="58" x2="63" y2="53" stroke="#ffaa44" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="58" x2="37" y2="53" stroke="#ffaa44" stroke-width="1.5" stroke-linecap="round"/>
</svg>