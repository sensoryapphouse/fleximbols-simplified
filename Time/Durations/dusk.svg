<!-- Orange sky -->
  <rect x="0" y="0" width="100" height="66" fill="#ffe0a0"/>
  <!-- Darker lower sky -->
  <rect x="0" y="45" width="100" height="21" fill="#ffcc80"/>
  <!-- Ground/horizon -->
  <rect x="0" y="66" width="100" height="14" fill="#8b6030" stroke="#333" stroke-width="1.5"/>
  <!-- Silhouette hills -->
  <ellipse cx="20" cy="66" rx="22" ry="8" fill="#5a4020"/>
  <ellipse cx="80" cy="66" rx="22" ry="7" fill="#5a4020"/>
  <!-- Setting sun at horizon -->
  <clipPath id="dk">
    <rect x="0" y="0" width="100" height="66"/>
  </clipPath>
  <circle cx="50" cy="66" r="16" fill="#ff8800" stroke="#cc5500" stroke-width="2" clip-path="url(#dk)"/>
  <!-- Warm rays -->
  <line x1="50" y1="45" x2="50" y2="38" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="48" x2="68" y2="42" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="48" x2="32" y2="42" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="56" x2="78" y2="52" stroke="#ff6600" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="56" x2="22" y2="52" stroke="#ff6600" stroke-width="1.5" stroke-linecap="round"/>
</svg>