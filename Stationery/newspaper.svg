<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- newspaper body -->
  <rect x="10" y="18" width="70" height="58" rx="2" fill="#f5f5dc" stroke="#555" stroke-width="2.5"/>
  <!-- fold line -->
  <line x1="10" y1="46" x2="80" y2="46" stroke="#888" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- bottom folded page -->
  <rect x="15" y="46" width="60" height="28" rx="1" fill="#ece9d0" stroke="#888" stroke-width="1.5"/>
  <!-- headline bar -->
  <rect x="14" y="22" width="62" height="8" rx="1" fill="#555" stroke="none"/>
  <text x="45" y="29" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="6" text-anchor="middle" fill="white" font-weight="bold">THE DAILY NEWS</text>
  <!-- columns -->
  <rect x="14" y="34" width="28" height="10" rx="1" fill="#ccc" stroke="none"/>
  <rect x="46" y="34" width="30" height="10" rx="1" fill="#ccc" stroke="none"/>
  <!-- text lines lower -->
  <line x1="19" y1="51" x2="71" y2="51" stroke="#aaa" stroke-width="1.5"/>
  <line x1="19" y1="57" x2="65" y2="57" stroke="#aaa" stroke-width="1.5"/>
  <line x1="19" y1="63" x2="68" y2="63" stroke="#aaa" stroke-width="1.5"/>
  <!-- label -->
</svg>
