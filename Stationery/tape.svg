<!-- Tape dispenser body -->
  <rect x="30" y="28" width="42" height="35" rx="8" fill="#6ab0e8" stroke="#333" stroke-width="2.5"/>
  <!-- Roll of tape inside (hole) -->
  <circle cx="50" cy="45" r="13" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="50" cy="45" r="6" fill="#dce8f8" stroke="#333" stroke-width="1.5"/>
  <!-- Tape dispenser blade/cutter on right -->
  <path d="M72 40 L82 35 L80 42 Z" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Tape strip coming out -->
  <rect x="72" y="38" width="18" height="8" rx="2" fill="#f9f9c0" stroke="#aaa" stroke-width="1.5" opacity="0.8"/>
  <!-- Pieces being joined with tape strip -->
  <rect x="5" y="65" width="28" height="12" rx="3" fill="#e8dcc8" stroke="#333" stroke-width="2"/>
  <rect x="67" y="65" width="28" height="12" rx="3" fill="#e8dcc8" stroke="#333" stroke-width="2"/>
  <!-- Tape over the join -->
  <rect x="28" y="64" width="44" height="7" rx="2" fill="#f9f9c0" stroke="#aaa" stroke-width="1" opacity="0.8"/>
