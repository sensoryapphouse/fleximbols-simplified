<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Microwave body -->
  <rect x="8" y="28" width="84" height="55" rx="6" fill="#ddd" stroke="#333" stroke-width="2.5"/>
  <!-- Microwave door window -->
  <rect x="14" y="33" width="56" height="45" rx="4" fill="#b0cce0" stroke="#555" stroke-width="2"/>
  <!-- Food plate inside -->
  <ellipse cx="42" cy="57" rx="18" ry="6" fill="#f5deb3" stroke="#8b6914" stroke-width="1.5"/>
  <ellipse cx="42" cy="54" rx="14" ry="5" fill="#f5c842" stroke="#8b8000" stroke-width="1.5"/>
  <!-- Control panel -->
  <rect x="74" y="33" width="14" height="45" rx="3" fill="#ccc" stroke="#555" stroke-width="1.5"/>
  <circle cx="81" cy="42" r="4" fill="#888" stroke="#555" stroke-width="1.5"/>
  <rect x="77" y="52" width="8" height="4" rx="2" fill="#4a9" stroke="#333" stroke-width="1"/>
  <rect x="77" y="60" width="8" height="4" rx="2" fill="#4a9" stroke="#333" stroke-width="1"/>
  <rect x="77" y="68" width="8" height="4" rx="2" fill="#4a9" stroke="#333" stroke-width="1"/>
  <!-- Microwave waves -->
  <path d="M25 50 Q30 46 35 50" fill="none" stroke="#cc6600" stroke-width="1.5"/>
  <path d="M25 57 Q30 53 35 57" fill="none" stroke="#cc6600" stroke-width="1.5"/>
</svg>
