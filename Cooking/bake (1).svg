<!-- Oven body -->
  <rect x="12" y="30" width="76" height="52" rx="5" fill="#c8c8c0" stroke="#444" stroke-width="2.5"/>
  <!-- Oven door window -->
  <rect x="20" y="40" width="60" height="34" rx="4" fill="#888" stroke="#444" stroke-width="2"/>
  <rect x="24" y="44" width="52" height="26" rx="3" fill="#333" stroke="#555" stroke-width="1.5"/>
