<!-- Item breaking down: bottle on left becoming earth on right -->
  <!-- Bottle (solid) -->
  <rect x="12" y="28" width="18" height="28" rx="4" fill="#d0e8f8" stroke="#3070a0" stroke-width="2"/>
  <rect x="15" y="22" width="12" height="8" rx="2" fill="#d0e8f8" stroke="#3070a0" stroke-width="2"/>
  <!-- Arrow of breakdown -->
  <line x1="32" y1="42" x2="48" y2="42" stroke="#606060" stroke-width="2" stroke-dasharray="3,2" stroke-linecap="round"/>
  <polygon points="48,38 55,42 48,46" fill="#606060"/>
  <!-- Breaking apart fragments -->
  <rect x="58" y="30" width="8" height="12" rx="2" fill="#d0e8f8" stroke="#3070a0" stroke-width="1.5" opacity="0.7"/>
  <rect x="70" y="36" width="6" height="8" rx="2" fill="#d0e8f8" stroke="#3070a0" stroke-width="1.5" opacity="0.5"/>
  <!-- Earth/soil -->
  <path d="M55 58 Q70 52 85 58 L85 72 Q70 78 55 72 Z" fill="#a07840" stroke="#604020" stroke-width="2" stroke-linejoin="round"/>
  <!-- Plants sprouting -->
  <line x1="62" y1="58" x2="62" y2="46" stroke="#4a8020" stroke-width="2" stroke-linecap="round"/>
  <path d="M62 50 Q68 44 68 52" fill="#70b840" stroke="#3a7020" stroke-width="1.5"/>
  <line x1="72" y1="58" x2="72" y2="50" stroke="#4a8020" stroke-width="2" stroke-linecap="round"/>
  <path d="M72 53 Q78 47 78 55" fill="#70b840" stroke="#3a7020" stroke-width="1.5"/>
</svg>
