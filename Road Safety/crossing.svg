  <!-- Road -->
  <rect x="0" y="14" width="100" height="86" fill="#6b6f73"/>
  <!-- Zebra crossing stripes -->
  <g fill="#f2f2f2">
    <rect x="9" y="18" width="11" height="78"/>
    <rect x="28" y="18" width="11" height="78"/>
    <rect x="47" y="18" width="11" height="78"/>
    <rect x="66" y="18" width="11" height="78"/>
    <rect x="85" y="18" width="11" height="78"/>
  </g>
  <!-- Walking pedestrian (crossing-sign style), facing right -->
  <g fill="#15233f" stroke="#15233f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs: front stepping forward, back trailing -->
    <path d="M50 52 L58 72" fill="none"/>
    <path d="M50 52 L43 72" fill="none"/>
    <!-- torso -->
    <path d="M48 30 L51 53" fill="none"/>
    <!-- front arm swinging forward, back arm trailing -->
    <path d="M49 36 L57 44" fill="none"/>
    <path d="M49 36 L42 45" fill="none"/>
  </g>
  <!-- head (on top of torso) -->
  <circle cx="48" cy="24" r="7" fill="#15233f"/>
</svg>
