<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Swing frame -->
  <line x1="15" y1="8" x2="85" y2="8" stroke="#a0783c" stroke-width="3"/>
  <line x1="20" y1="8" x2="10" y2="88" stroke="#a0783c" stroke-width="2.5"/>
  <line x1="80" y1="8" x2="90" y2="88" stroke="#a0783c" stroke-width="2.5"/>
  <!-- Swing ropes -->
  <line x1="35" y1="8" x2="38" y2="48" stroke="#888" stroke-width="1.5"/>
  <line x1="65" y1="8" x2="62" y2="48" stroke="#888" stroke-width="1.5"/>
  <!-- Swing seat -->
  <line x1="38" y1="48" x2="62" y2="48" stroke="#a0783c" stroke-width="3"/>
  <!-- Person on swing -->
  <circle cx="50" cy="38" r="8" fill="#f5c89a" stroke="#333" stroke-width="2"/>
  <!-- Body sitting -->
  <line x1="50" y1="46" x2="50" y2="56" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms holding ropes -->
  <line x1="50" y1="50" x2="40" y2="47" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="60" y2="47" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs dangling -->
  <line x1="50" y1="56" x2="44" y2="68" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="56" x2="56" y2="68" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
</svg>