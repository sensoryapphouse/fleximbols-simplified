  <!-- Bottom -->
  <rect x="66" y="76" width="12" height="12" rx="2" fill="#70c070" stroke="#555" stroke-width="1.5"/>
  <rect x="52" y="76" width="12" height="12" rx="2" fill="#7090d0" stroke="#555" stroke-width="1.5"/>
  <rect x="38" y="76" width="12" height="12" rx="2" fill="#e0c040" stroke="#555" stroke-width="1.5"/>
  <rect x="24" y="76" width="12" height="12" rx="2" fill="#e07070" stroke="#555" stroke-width="1.5"/>
  <rect x="10" y="76" width="12" height="12" rx="2" fill="#d0d0d0" stroke="#555" stroke-width="1.5"/>
