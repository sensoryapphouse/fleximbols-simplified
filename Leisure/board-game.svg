  <rect x="78" y="20" width="12" height="12" rx="2" fill="#d0d0d0" stroke="#555" stroke-width="1.5"/>
  <!-- Side squares -->
  <rect x="78" y="34" width="12" height="12" rx="2" fill="#70c070" stroke="#555" stroke-width="1.5"/>
