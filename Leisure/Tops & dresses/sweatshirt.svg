  <rect x="14" y="80" width="8" height="5" rx="2" fill="#6688bb" stroke="#333" stroke-width="2"/>
  <rect x="78" y="80" width="8" height="5" rx="2" fill="#6688bb" stroke="#333" stroke-width="2"/>
  <!-- Ribbed hem -->
