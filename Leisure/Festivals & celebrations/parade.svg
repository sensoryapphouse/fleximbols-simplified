<!-- Ground line -->
  <line x1="5" y1="80" x2="95" y2="80" stroke="#888" stroke-width="2"/>
  <!-- Three marching figures -->
  <!-- Figure 1 -->
  <circle cx="20" cy="34" r="7" fill="#f5c5a0" stroke="#333" stroke-width="2"/>
  <rect x="15" y="42" width="10" height="14" rx="3" fill="#e06060" stroke="#333" stroke-width="2"/>
  <!-- Marching legs - alternating -->
  <line x1="18" y1="56" x2="14" y2="68" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="56" x2="26" y2="65" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Figure 1 arm with flag -->
  <line x1="25" y1="45" x2="32" y2="35" stroke="#f5c5a0" stroke-width="3" stroke-linecap="round"/>
  <!-- Flag -->
  <line x1="32" y1="35" x2="32" y2="20" stroke="#555" stroke-width="1.5"/>
  <rect x="32" y="20" width="16" height="10" rx="1" fill="#e06020" stroke="#333" stroke-width="1.5"/>
  <!-- Figure 2 -->
  <circle cx="50" cy="34" r="7" fill="#f0b898" stroke="#333" stroke-width="2"/>
  <rect x="45" y="42" width="10" height="14" rx="3" fill="#6080c0" stroke="#333" stroke-width="2"/>
  <line x1="48" y1="56" x2="52" y2="68" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="56" x2="48" y2="65" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Figure 2 arm with flag -->
  <line x1="55" y1="45" x2="62" y2="35" stroke="#f0b898" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="35" x2="62" y2="20" stroke="#555" stroke-width="1.5"/>
  <rect x="62" y="20" width="16" height="10" rx="1" fill="#60a060" stroke="#333" stroke-width="1.5"/>
  <!-- Figure 3 -->
  <circle cx="80" cy="34" r="7" fill="#f5d0b0" stroke="#333" stroke-width="2"/>
  <rect x="75" y="42" width="10" height="14" rx="3" fill="#e06060" stroke="#333" stroke-width="2"/>
  <line x1="78" y1="56" x2="74" y2="68" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="56" x2="86" y2="65" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Confetti -->
  <rect x="8" y="12" width="4" height="3" rx="1" fill="#f0d040" transform="rotate(30 10 13)"/>
  <rect x="40" y="8" width="4" height="3" rx="1" fill="#e05080" transform="rotate(-20 42 9)"/>
  <rect x="75" y="10" width="4" height="3" rx="1" fill="#60a060" transform="rotate(15 77 11)"/>
  <rect x="90" y="15" width="4" height="3" rx="1" fill="#6080c0" transform="rotate(-35 92 16)"/>
  <!-- Label -->
</svg>