<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- dartboard -->
  <circle cx="42" cy="48" r="36" fill="#212121" stroke="#333" stroke-width="2"/>
  <circle cx="42" cy="48" r="30" fill="#c62828" stroke="#b71c1c" stroke-width="1.5"/>
  <circle cx="42" cy="48" r="24" fill="#212121" stroke="#333" stroke-width="1.5"/>
  <circle cx="42" cy="48" r="18" fill="#c62828" stroke="#b71c1c" stroke-width="1.5"/>
  <circle cx="42" cy="48" r="12" fill="#212121" stroke="#333" stroke-width="1.5"/>
  <circle cx="42" cy="48" r="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <circle cx="42" cy="48" r="3" fill="#c62828" stroke="#b71c1c" stroke-width="1"/>
  <!-- sector lines -->
  <line x1="42" y1="12" x2="42" y2="84" stroke="#555" stroke-width="1"/>
  <line x1="6" y1="48" x2="78" y2="48" stroke="#555" stroke-width="1"/>
  <line x1="18" y1="18" x2="66" y2="78" stroke="#555" stroke-width="1"/>
  <line x1="66" y1="18" x2="18" y2="78" stroke="#555" stroke-width="1"/>
  <!-- dart in bullseye -->
  <line x1="42" y1="48" x2="80" y2="25" stroke="#78909c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dart tip -->
  <circle cx="42" cy="48" r="1.5" fill="#90a4ae"/>
  <!-- dart barrel -->
  <rect x="58" y="33" width="14" height="4" rx="2" fill="#78909c" stroke="#546e7a" stroke-width="1.5" transform="rotate(-30 65 35)"/>
  <!-- dart flights -->
  <polygon points="80,25 88,18 84,28" fill="#e53935" stroke="#b71c1c" stroke-width="1" transform="rotate(-30 80 25)"/>
</svg>
