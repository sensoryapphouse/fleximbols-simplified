  <!-- Catan: hexagonal tile arrangement (3 hexes visible) with settlements -->
  <!-- Central hex (wheat/grain - yellow) -->
  <polygon points="50,20 65,29 65,47 50,56 35,47 35,29" fill="#e8c820" stroke="#333" stroke-width="2.5"/>
  <!-- Wheat icon in hex -->
  <line x1="50" y1="30" x2="50" y2="50" stroke="#a08010" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="34" x2="56" y2="34" stroke="#a08010" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="40" x2="56" y2="40" stroke="#a08010" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="30" r="3" fill="#a08010"/>
  <!-- Left hex (forest - green) -->
  <polygon points="20,38 35,29 35,47 20,56 5,47 5,29" fill="#3a8020" stroke="#333" stroke-width="2.5"/>
  <!-- Tree -->
  <polygon points="20,34 27,47 13,47" fill="#226010" stroke="#333" stroke-width="1.5"/>
  <rect x="18" y="47" width="4" height="5" fill="#8a5a20"/>
  <!-- Right hex (ore/mountain - gray) -->
  <polygon points="80,38 95,29 95,47 80,56 65,47 65,29" fill="#9090a0" stroke="#333" stroke-width="2.5"/>
  <!-- Mountain peaks -->
  <polygon points="72,50 80,36 88,50" fill="#707080" stroke="#333" stroke-width="1.5"/>
  <polygon points="78,50 85,40 92,50" fill="#707080" stroke="#333" stroke-width="1.5"/>
  <!-- Bottom hex (pasture - light green) -->
  <polygon points="50,56 65,47 65,65 50,74 35,65 35,47" fill="#80c040" stroke="#333" stroke-width="2.5"/>
  <!-- Sheep -->
  <ellipse cx="50" cy="62" rx="8" ry="6" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <circle cx="56" cy="60" r="4" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <line x1="44" y1="68" x2="42" y2="74" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="68" x2="58" y2="74" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Settlement piece (house shape) -->
  <path d="M46 26 L50 20 L54 26 L54 32 L46 32 Z" fill="#e03030" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Road -->
  <line x1="54" y1="29" x2="65" y2="29" stroke="#e03030" stroke-width="3" stroke-linecap="round"/>
  <line x1="54" y1="29" x2="65" y2="29" stroke="#333" stroke-width="1" stroke-linecap="round"/>
</svg>
