  <!-- Twister: spotted mat with hands and feet, colorful dots -->
  <!-- Mat border -->
  <rect x="5" y="12" width="90" height="76" rx="6" fill="#f0f0e8" stroke="#333" stroke-width="2.5"/>
  <!-- Columns of colored dots (4 cols x 4 rows) -->
  <!-- Red column -->
  <circle cx="18" cy="26" r="9" fill="#d02020" stroke="#333" stroke-width="1.5"/>
  <circle cx="18" cy="46" r="9" fill="#d02020" stroke="#333" stroke-width="1.5"/>
  <circle cx="18" cy="66" r="9" fill="#d02020" stroke="#333" stroke-width="1.5"/>
  <circle cx="18" cy="80" r="7" fill="#d02020" stroke="#333" stroke-width="1.5"/>
  <!-- Yellow column -->
  <circle cx="38" cy="26" r="9" fill="#e0c020" stroke="#333" stroke-width="1.5"/>
  <circle cx="38" cy="46" r="9" fill="#e0c020" stroke="#333" stroke-width="1.5"/>
  <circle cx="38" cy="66" r="9" fill="#e0c020" stroke="#333" stroke-width="1.5"/>
  <circle cx="38" cy="80" r="7" fill="#e0c020" stroke="#333" stroke-width="1.5"/>
  <!-- Green column -->
  <circle cx="62" cy="26" r="9" fill="#20a040" stroke="#333" stroke-width="1.5"/>
  <circle cx="62" cy="46" r="9" fill="#20a040" stroke="#333" stroke-width="1.5"/>
  <circle cx="62" cy="66" r="9" fill="#20a040" stroke="#333" stroke-width="1.5"/>
  <circle cx="62" cy="80" r="7" fill="#20a040" stroke="#333" stroke-width="1.5"/>
  <!-- Blue column -->
  <circle cx="82" cy="26" r="9" fill="#2060d0" stroke="#333" stroke-width="1.5"/>
  <circle cx="82" cy="46" r="9" fill="#2060d0" stroke="#333" stroke-width="1.5"/>
  <circle cx="82" cy="66" r="9" fill="#2060d0" stroke="#333" stroke-width="1.5"/>
  <circle cx="82" cy="80" r="7" fill="#2060d0" stroke="#333" stroke-width="1.5"/>
  <!-- Dividing lines between columns -->
  <line x1="27" y1="12" x2="27" y2="88" stroke="#ccc" stroke-width="1.5"/>
  <line x1="50" y1="12" x2="50" y2="88" stroke="#ccc" stroke-width="1.5"/>
  <line x1="72" y1="12" x2="72" y2="88" stroke="#ccc" stroke-width="1.5"/>
</svg>
