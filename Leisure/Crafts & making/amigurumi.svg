  <!-- Head -->
  <circle cx="50" cy="40" rx="22" ry="22" fill="#d4a76a" stroke="#333" stroke-width="2.5" r="22"/>
  <!-- Ears -->
  <circle cx="30" cy="22" r="10" fill="#d4a76a" stroke="#333" stroke-width="2.5"/>
  <circle cx="70" cy="22" r="10" fill="#d4a76a" stroke="#333" stroke-width="2.5"/>
  <circle cx="30" cy="22" r="6" fill="#c8a46e" stroke="none"/>
  <circle cx="70" cy="22" r="6" fill="#c8a46e" stroke="none"/>
  <!-- Face -->
  <!-- Snout -->
  <ellipse cx="50" cy="46" rx="10" ry="7" fill="#f0d9b5" stroke="#a07825" stroke-width="1.5"/>
  <!-- Nose -->
  <ellipse cx="50" cy="42" rx="4" ry="3" fill="#333"/>
