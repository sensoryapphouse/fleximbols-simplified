<!-- Embroidery hoop (outer ring) -->
  <circle cx="50" cy="48" r="34" fill="none" stroke="#8B6914" stroke-width="4"/>
  <!-- Hoop inner ring -->
  <circle cx="50" cy="48" r="30" fill="#e8c99a" stroke="#c9a87a" stroke-width="2"/>
  <!-- Hoop screw/clasp at top -->
  <rect x="44" y="11" width="12" height="8" rx="3" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Decorative embroidery pattern - flower -->
  <circle cx="50" cy="48" r="5" fill="#f5c842" stroke="#c9a830" stroke-width="1.5"/>
  <!-- Flower petals in different colours -->
  <ellipse cx="50" cy="36" rx="4" ry="8" fill="#e07070" stroke="#c05050" stroke-width="1.5"/>
  <ellipse cx="50" cy="60" rx="4" ry="8" fill="#e07070" stroke="#c05050" stroke-width="1.5"/>
  <ellipse cx="38" cy="48" rx="8" ry="4" fill="#5cb85c" stroke="#3d8b3d" stroke-width="1.5"/>
  <ellipse cx="62" cy="48" rx="8" ry="4" fill="#5cb85c" stroke="#3d8b3d" stroke-width="1.5"/>
  <ellipse cx="42" cy="40" rx="4" ry="8" fill="#e07070" stroke="#c05050" stroke-width="1.5" transform="rotate(45,42,40)"/>
  <ellipse cx="58" cy="56" rx="4" ry="8" fill="#e07070" stroke="#c05050" stroke-width="1.5" transform="rotate(45,58,56)"/>
  <!-- Center flower again on top -->
  <circle cx="50" cy="48" r="5" fill="#f5c842" stroke="#c9a830" stroke-width="1.5"/>
  <!-- Needle and thread coming from fabric -->
  <line x1="62" y1="38" x2="72" y2="22" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <circle cx="72" cy="21" r="2.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <path d="M73,20 Q78,14 82,16" stroke="#e07070" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
