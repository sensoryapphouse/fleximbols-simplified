<!-- figure en pointe -->
  <!-- head -->
  <circle cx="50" cy="18" r="7" fill="#ffe0b2" stroke="#ad1457" stroke-width="2"/>
  <!-- bun -->
  <circle cx="50" cy="11" r="4" fill="#c0a080" stroke="#ad1457" stroke-width="1.5"/>
  <!-- tutu body -->
  <ellipse cx="50" cy="38" rx="10" ry="13" fill="#f8bbd0" stroke="#ad1457" stroke-width="2"/>
  <!-- tutu skirt -->
  <ellipse cx="50" cy="50" rx="18" ry="6" fill="#f8bbd0" stroke="#ad1457" stroke-width="2"/>
  <!-- standing leg on pointe -->
  <line x1="50" y1="51" x2="50" y2="76" stroke="#ad1457" stroke-width="2.5" stroke-linecap="round"/>
  <!-- pointe shoe -->
  <ellipse cx="53" cy="77" rx="6" ry="3" fill="#f8bbd0" stroke="#ad1457" stroke-width="2"/>
  <!-- raised leg -->
  <line x1="50" y1="51" x2="68" y2="62" stroke="#ad1457" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="72" cy="63" rx="4" ry="3" fill="#f8bbd0" stroke="#ad1457" stroke-width="2"/>
  <!-- arms in arabesque -->
  <line x1="42" y1="33" x2="24" y2="26" stroke="#ad1457" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="33" x2="74" y2="26" stroke="#ad1457" stroke-width="2" stroke-linecap="round"/>
</svg>
