  <!-- Inflatable ring/donut floatie -->
  <!-- Outer ring -->
  <circle cx="50" cy="55" r="38" fill="#e74c3c" stroke="#333" stroke-width="2.5"/>
  <!-- Inner ring (hole) -->
  <circle cx="50" cy="55" r="18" fill="#85c1e9" stroke="#333" stroke-width="2.5"/>
  <!-- Water in the hole/around -->
  <circle cx="50" cy="55" r="14" fill="#85c1e9" stroke="none"/>
  <!-- Stripe pattern on floatie -->
  <path d="M15,38 Q50,20 85,38" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M14,72 Q50,90 86,72" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- Person's head in center -->
  <circle cx="50" cy="47" r="8" fill="#f5cba7" stroke="#333" stroke-width="2"/>
  <!-- Arms over floatie -->
  <line x1="38" y1="52" x2="26" y2="55" stroke="#f5cba7" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="52" x2="74" y2="55" stroke="#f5cba7" stroke-width="3" stroke-linecap="round"/>
