<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- checkered blanket -->
  <rect x="10" y="60" width="80" height="24" rx="3" fill="#e84040" stroke="#8b1010" stroke-width="2"/>
  <!-- checker pattern -->
  <rect x="10" y="60" width="20" height="12" fill="#e84040"/>
<rect x="50" y="60" width="20" height="12" fill="#e84040"/>

<rect x="30" y="72" width="20" height="12" fill="#e84040"/>
<rect x="70" y="72" width="20" height="12" fill="#e84040"/>
  <rect x="10" y="60" width="80" height="24" rx="3" fill="none" stroke="#8b1010" stroke-width="2"/>
  <!-- picnic basket -->
  <rect x="30" y="30" width="40" height="32" rx="5" fill="#c8903a" stroke="#7a5010" stroke-width="2.5"/>
  <!-- basket weave lines -->
  <line x1="30" y1="40" x2="70" y2="40" stroke="#8b6020" stroke-width="2"/>
  <line x1="30" y1="50" x2="70" y2="50" stroke="#8b6020" stroke-width="2"/>
  <line x1="40" y1="30" x2="40" y2="62" stroke="#8b6020" stroke-width="1.5"/>
  <line x1="50" y1="30" x2="50" y2="62" stroke="#8b6020" stroke-width="1.5"/>
  <line x1="60" y1="30" x2="60" y2="62" stroke="#8b6020" stroke-width="1.5"/>
  <!-- handle -->
  <path d="M38,30 Q50,16 62,30" fill="none" stroke="#7a5010" stroke-width="4" stroke-linecap="round"/>
  <!-- lid -->
  <rect x="28" y="26" width="44" height="8" rx="3" fill="#d4a050" stroke="#7a5010" stroke-width="2"/>
</svg>
