<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Flask -->
  <path d="M40,14 L40,44 L22,72 Q20,78 26,80 L74,80 Q80,78 78,72 L60,44 L60,14 Z" fill="#d0e8f5" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Flask neck -->
  <rect x="36" y="12" width="28" height="6" rx="2" fill="#aaa" stroke="#333" stroke-width="2"/>
  <!-- Liquid in flask -->
  <path d="M30,65 Q35,58 50,60 Q65,58 70,65 L74,80 Q50,84 26,80 Z" fill="#8ec6e6" opacity="0.8"/>
  <!-- Bubbles -->
  <circle cx="38" cy="70" r="3" fill="white" stroke="#6aabcc" stroke-width="1.5"/>
  <circle cx="54" cy="66" r="2" fill="white" stroke="#6aabcc" stroke-width="1.5"/>
  <circle cx="62" cy="72" r="2.5" fill="white" stroke="#6aabcc" stroke-width="1.5"/>
  <!-- Atom ring -->
  <ellipse cx="50" cy="30" rx="16" ry="8" fill="none" stroke="#9b7bc9" stroke-width="1.5"/>
  <ellipse cx="50" cy="30" rx="16" ry="8" fill="none" stroke="#9b7bc9" stroke-width="1.5" transform="rotate(60,50,30)"/>
  <ellipse cx="50" cy="30" rx="16" ry="8" fill="none" stroke="#9b7bc9" stroke-width="1.5" transform="rotate(-60,50,30)"/>
  <circle cx="50" cy="30" r="3" fill="#9b7bc9"/>
</svg>
