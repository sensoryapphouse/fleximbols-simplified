<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Headphones - over-ear style -->
  <!-- Headband arc -->
  <path d="M22,55 Q22,18 50,18 Q78,18 78,55" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Left ear cup -->
  <ellipse cx="22" cy="60" rx="12" ry="16" fill="#555" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="22" cy="60" rx="7" ry="10" fill="#777" stroke="#444" stroke-width="1.5"/>
  <!-- Right ear cup -->
  <ellipse cx="78" cy="60" rx="12" ry="16" fill="#555" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="78" cy="60" rx="7" ry="10" fill="#777" stroke="#444" stroke-width="1.5"/>
  <!-- Padding indicator on earcups -->
  <path d="M12,50 Q10,60 12,70" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <path d="M88,50 Q90,60 88,70" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
</svg>
