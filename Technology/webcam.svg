<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Webcam: modern clip-on style webcam with lens and indicator -->
  <!-- Monitor clip base -->
  <rect x="25" y="8" width="50" height="12" rx="4" fill="#444" stroke="#222" stroke-width="2.5"/>
  <!-- Clip arm (grips monitor) -->
  <rect x="30" y="18" width="40" height="6" rx="2" fill="#555" stroke="#222" stroke-width="2"/>
  <rect x="32" y="22" width="36" height="8" rx="2" fill="#333" stroke="#222" stroke-width="1.5"/>
  <!-- Webcam body (rounded square) -->
  <rect x="20" y="30" width="60" height="44" rx="12" fill="#333" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lens housing -->
  <circle cx="50" cy="52" r="18" fill="#222" stroke="#222" stroke-width="2.5"/>
  <circle cx="50" cy="52" r="14" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <!-- Lens glass -->
  <circle cx="50" cy="52" r="10" fill="#2c3e50" stroke="#555" stroke-width="1.5"/>
  <circle cx="50" cy="52" r="6" fill="#3d5a80" stroke="none"/>
  <!-- Lens reflection highlight -->
  <circle cx="45" cy="47" r="3" fill="#74b9ff" opacity="0.5"/>
  <circle cx="47" cy="46" r="1.5" fill="#fff" opacity="0.6"/>
  <!-- Recording LED -->
  <circle cx="76" cy="35" r="5" fill="#e63b2e" stroke="#222" stroke-width="1.5"/>
  <!-- Privacy cover slider -->
  <rect x="62" y="48" width="12" height="8" rx="2" fill="#888" stroke="#222" stroke-width="1.5"/>
  <!-- Microphone holes (small dots) -->
  <circle cx="30" cy="52" r="1.5" fill="#555"/>
  <circle cx="30" cy="57" r="1.5" fill="#555"/>
  <circle cx="30" cy="47" r="1.5" fill="#555"/>
  <!-- USB cable from bottom -->
  <line x1="50" y1="74" x2="50" y2="88" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <rect x="44" y="85" width="12" height="8" rx="3" fill="#27ae60" stroke="#222" stroke-width="1.5"/>
</svg>
