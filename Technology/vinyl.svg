<!-- vinyl record - black disc -->
  <circle cx="50" cy="50" r="40" fill="#2c3e50" stroke="#2c3e50" stroke-width="2.5"/>
  <!-- groove rings -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#34495e" stroke-width="1"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#34495e" stroke-width="1"/>
  <circle cx="50" cy="50" r="24" fill="none" stroke="#34495e" stroke-width="1"/>
  <!-- centre label area -->
  <circle cx="50" cy="50" r="16" fill="#e74c3c" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- label text area -->
  <circle cx="50" cy="50" r="12" fill="#c0392b"/>
  <!-- label details -->
  <line x1="38" y1="50" x2="62" y2="50" stroke="#f5b7b1" stroke-width="1" opacity="0.7"/>
  <line x1="42" y1="44" x2="58" y2="44" stroke="#f5b7b1" stroke-width="1" opacity="0.5"/>
  <line x1="42" y1="56" x2="58" y2="56" stroke="#f5b7b1" stroke-width="1" opacity="0.5"/>
  <!-- centre spindle hole -->
