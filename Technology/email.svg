<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Envelope body -->
  <rect x="8" y="25" width="68" height="48" rx="5" fill="#ECF0F1" stroke="#333" stroke-width="2.5"/>
  <!-- Envelope flap (V shape) -->
  <polyline points="8,25 42,54 76,25" stroke="#333" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <!-- Bottom fold lines -->
  <line x1="8" y1="73" x2="30" y2="50" stroke="#BDC3C7" stroke-width="1.5"/>
  <line x1="76" y1="73" x2="54" y2="50" stroke="#BDC3C7" stroke-width="1.5"/>
  <!-- @ symbol -->
  <circle cx="83" cy="36" r="12" fill="none" stroke="#E67E22" stroke-width="2.5"/>
  <circle cx="83" cy="36" r="5" fill="none" stroke="#E67E22" stroke-width="2"/>
  <line x1="88" y1="31" x2="96" y2="30" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
  <line x1="88" y1="41" x2="96" y2="42" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
</svg>
