<!-- Centre body -->
  <rect x="36" y="40" width="28" height="20" rx="5" fill="#444" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Camera underneath -->
  <circle cx="50" cy="60" r="5" fill="#222" stroke="#444" stroke-width="1.5"/>
  <circle cx="50" cy="60" r="2.5" fill="#5b8dd9"/>
  <!-- Arms (diagonal) -->
  <line x1="36" y1="40" x2="18" y2="24" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="40" x2="82" y2="24" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="60" x2="18" y2="76" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="60" x2="82" y2="76" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Motor hubs -->
  <circle cx="18" cy="24" r="6" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="82" cy="24" r="6" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="18" cy="76" r="6" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="82" cy="76" r="6" fill="#333" stroke="#222" stroke-width="2"/>
  <!-- Propeller blades (rotors) -->
  <ellipse cx="18" cy="24" rx="12" ry="3" fill="#aaa" stroke="#222" stroke-width="1.5" opacity="0.7" transform="rotate(-30,18,24)"/>
  <ellipse cx="82" cy="24" rx="12" ry="3" fill="#aaa" stroke="#222" stroke-width="1.5" opacity="0.7" transform="rotate(30,82,24)"/>
  <ellipse cx="18" cy="76" rx="12" ry="3" fill="#aaa" stroke="#222" stroke-width="1.5" opacity="0.7" transform="rotate(30,18,76)"/>
  <ellipse cx="82" cy="76" rx="12" ry="3" fill="#aaa" stroke="#222" stroke-width="1.5" opacity="0.7" transform="rotate(-30,82,76)"/>
  <!-- LED light on body -->
  <circle cx="50" cy="45" r="3" fill="#e85c5c" stroke="#222" stroke-width="1"/>
</svg>
