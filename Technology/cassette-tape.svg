  <!-- Cassette tape: modern styled cassette -->
  <!-- Cassette body -->
  <rect x="5" y="20" width="90" height="62" rx="6" fill="#3a3a3a" stroke="#222" stroke-width="2.5"/>
  <!-- Label area -->
  <rect x="12" y="26" width="76" height="28" rx="3" fill="#f0c040" stroke="#333" stroke-width="2"/>
  <!-- Label lines -->
  <line x1="16" y1="33" x2="84" y2="33" stroke="#c8a800" stroke-width="1.5"/>
  <line x1="16" y1="38" x2="84" y2="38" stroke="#c8a800" stroke-width="1.5"/>
  <line x1="16" y1="43" x2="70" y2="43" stroke="#c8a800" stroke-width="1.5"/>
  <!-- Window area -->
  <rect x="20" y="57" width="60" height="18" rx="4" fill="#5a5a5a" stroke="#444" stroke-width="1.5"/>
  <!-- Tape spools -->
  <circle cx="36" cy="66" r="9" fill="#333" stroke="#888" stroke-width="1.5"/>
  <circle cx="36" cy="66" r="5" fill="#555" stroke="#888" stroke-width="1"/>
  <circle cx="36" cy="66" r="2" fill="#888"/>
  <circle cx="64" cy="66" r="9" fill="#333" stroke="#888" stroke-width="1.5"/>
  <circle cx="64" cy="66" r="5" fill="#555" stroke="#888" stroke-width="1"/>
  <circle cx="64" cy="66" r="2" fill="#888"/>
  <!-- Tape path between spools -->
  <path d="M27 70 Q50 75 73 70" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- Notches bottom -->
  <rect x="8" y="76" width="10" height="5" rx="1" fill="#555" stroke="#333" stroke-width="1"/>
  <rect x="82" y="76" width="10" height="5" rx="1" fill="#555" stroke="#333" stroke-width="1"/>
  <!-- Record notch top corners -->
  <rect x="5" y="20" width="8" height="8" fill="#3a3a3a"/>
  <rect x="87" y="20" width="8" height="8" fill="#3a3a3a"/>
</svg>
