  <circle cx="50" cy="42" r="9" fill="#444" stroke="#555" stroke-width="2"/>
  <circle cx="50" cy="42" r="6" fill="#333" stroke="#555" stroke-width="1.5"/>
  <circle cx="50" cy="42" r="3" fill="#111"/>
  <!-- Screen on back of cam -->
