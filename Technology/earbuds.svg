<!-- Earbuds - two in-ear earphones with wire -->
  <!-- Left earbud -->
  <circle cx="22" cy="40" r="11" fill="#ddd" stroke="#333" stroke-width="2.5"/>
  <circle cx="22" cy="40" r="5" fill="#aaa" stroke="#444" stroke-width="1.5"/>
  <!-- Left earbud tip -->
  <ellipse cx="32" cy="40" rx="5" ry="3.5" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Right earbud -->
  <circle cx="78" cy="40" r="11" fill="#ddd" stroke="#333" stroke-width="2.5"/>
  <circle cx="78" cy="40" r="5" fill="#aaa" stroke="#444" stroke-width="1.5"/>
  <!-- Right earbud tip -->
  <ellipse cx="68" cy="40" rx="5" ry="3.5" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Wire from left bud going down and across -->
  <path d="M22,51 Q22,68 50,72 Q78,68 78,51" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <!-- Control inline (small rectangle on wire) -->
  <rect x="45" y="69" width="10" height="6" rx="2" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Jack connector at bottom -->
  <line x1="50" y1="75" x2="50" y2="86" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <rect x="47" y="84" width="6" height="4" rx="2" fill="#333" stroke="#222" stroke-width="1"/>
</svg>
