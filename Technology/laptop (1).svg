  <rect x="22" y="18" width="56" height="36" rx="2" fill="#A8C8E8" stroke="none"/>
  <!-- Screen content -->
  <rect x="28" y="24" width="36" height="5" rx="1" fill="#5B8CC8"/>
  <rect x="28" y="33" x2="66" y2="33" width="44" height="3" rx="1" fill="#D4C5A9"/>
