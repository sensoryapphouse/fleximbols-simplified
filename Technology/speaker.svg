<!-- Speaker - cone in a box -->
  <!-- Cabinet box -->
  <rect x="15" y="12" width="70" height="72" rx="4" fill="#555" stroke="#222" stroke-width="2.5"/>
  <!-- Speaker cone frame (circle) -->
  <circle cx="50" cy="50" r="26" fill="#444" stroke="#222" stroke-width="2"/>
  <!-- Outer surround ring -->
  <circle cx="50" cy="50" r="26" fill="none" stroke="#777" stroke-width="3"/>
  <!-- Spider / cone -->
  <circle cx="50" cy="50" r="18" fill="#666" stroke="#333" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="10" fill="#777" stroke="#333" stroke-width="1.5"/>
  <!-- Dust cap (center) -->
  <circle cx="50" cy="50" r="5" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Tweeter (small circle top right of cabinet) -->
  <circle cx="72" cy="20" r="5" fill="#555" stroke="#777" stroke-width="1.5"/>
  <!-- Sound waves -->
  <path d="M88,38 Q95,50 88,62" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <path d="M92,32 Q102,50 92,68" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
</svg>
