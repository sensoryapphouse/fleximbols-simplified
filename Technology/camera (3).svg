<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Camera body -->
  <rect x="10" y="35" width="80" height="48" rx="6" fill="#d0c8b8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Viewfinder hump -->
  <rect x="30" y="26" width="36" height="12" rx="4" fill="#c0b8a8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lens circle (outer) -->
  <circle cx="42" cy="59" r="18" fill="#444" stroke="#333" stroke-width="2.5"/>
  <!-- Lens inner rings -->
  <circle cx="42" cy="59" r="13" fill="#555" stroke="#666" stroke-width="1.5"/>
  <circle cx="42" cy="59" r="8" fill="#222" stroke="#666" stroke-width="1.5"/>
  <circle cx="42" cy="59" r="3" fill="#888"/>
  <!-- Flash -->
  <rect x="68" y="41" width="12" height="8" rx="3" fill="#f8f060" stroke="#333" stroke-width="2"/>
  <!-- Shutter button -->
  <circle cx="72" cy="32" r="5" fill="#c0b0a0" stroke="#333" stroke-width="2"/>
  <!-- Label -->
</svg>
