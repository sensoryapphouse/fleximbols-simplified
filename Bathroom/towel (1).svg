<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Towel hang bar -->
  <rect x="15" y="18" width="70" height="6" rx="3" fill="#999" stroke="#555" stroke-width="2"/>
  <!-- Folded towel hanging -->
  <rect x="25" y="24" width="50" height="55" rx="3" fill="#d47a7a" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Fold line at top -->
  <rect x="25" y="24" width="50" height="10" rx="3" fill="#c06060" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Decorative stripe -->
  <rect x="25" y="55" width="50" height="6" fill="#c06060"/>
  <!-- Texture lines -->
  <line x1="30" y1="38" x2="70" y2="38" stroke="#c06060" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="30" y1="46" x2="70" y2="46" stroke="#c06060" stroke-width="1" stroke-dasharray="4,4"/>
</svg>
