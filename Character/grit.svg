<!-- Raised fist (bold, strong) -->
  <!-- Fist body -->
  <rect x="30" y="38" width="40" height="34" rx="8" fill="#f5d5a0" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Fingers folded -->
  <rect x="30" y="28" width="38" height="12" rx="4" fill="#f5d5a0" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Finger lines -->
  <line x1="39" y1="28" x2="39" y2="40" stroke="#444" stroke-width="1.5"/>
  <line x1="49" y1="28" x2="49" y2="40" stroke="#444" stroke-width="1.5"/>
  <line x1="59" y1="28" x2="59" y2="40" stroke="#444" stroke-width="1.5"/>
  <!-- Thumb on side -->
  <path d="M 30,44 C 24,42 22,48 26,52 L 30,52" fill="#f5d5a0" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Motion/impact lines around fist -->
  <line x1="18" y1="28" x2="24" y2="34" stroke="#e84444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="38" x2="23" y2="40" stroke="#e84444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="28" x2="76" y2="34" stroke="#e84444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="38" x2="77" y2="40" stroke="#e84444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="12" x2="50" y2="20" stroke="#e84444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cracks/difficulty marks on ground -->
  <line x1="20" y1="76" x2="35" y2="72" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="78" x2="45" y2="74" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="74" x2="80" y2="76" stroke="#888" stroke-width="2" stroke-linecap="round"/>
