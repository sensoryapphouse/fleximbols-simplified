<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Flexible: one connected figure bending deeply to touch the floor -->
  <!-- Floor -->
  <line x1="20" y1="88" x2="80" y2="88" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs, straight, standing -->
  <path d="M55,58 L52,86" fill="none" stroke="#5d6d7e" stroke-width="8" stroke-linecap="round"/>
  <path d="M62,58 L66,86" fill="none" stroke="#5d6d7e" stroke-width="8" stroke-linecap="round"/>
  <!-- Hips -->
  <ellipse cx="59" cy="56" rx="11" ry="7" fill="#5d6d7e" stroke="#333" stroke-width="2"/>
  <!-- Torso bent fully forward, connected hips to shoulders -->
  <path d="M52,52 Q38,50 30,58" fill="none" stroke="#2e86c1" stroke-width="13" stroke-linecap="round"/>
  <!-- Arms reaching down to floor/ankles -->
  <path d="M30,58 Q28,72 32,84" fill="none" stroke="#f5c5a3" stroke-width="6" stroke-linecap="round"/>
  <circle cx="33" cy="85" r="4" fill="#f5c5a3" stroke="#333" stroke-width="1.5"/>
  <!-- Head, connected to front of torso -->
  <circle cx="27" cy="60" r="9" fill="#f5c5a3" stroke="#333" stroke-width="2.5"/>
  <!-- Hair -->
  <path d="M19,57 Q18,52 24,52" fill="none" stroke="#7a4a28" stroke-width="4" stroke-linecap="round"/>
  <!-- Motion / flex arc showing bend -->
  <path d="M48,30 Q34,32 28,48" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
  <path d="M48,30 L52,33 M48,30 L45,35" fill="none" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
</svg>
