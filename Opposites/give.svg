<!-- Hand offering object -->
  <!-- Forearm from left -->
  <rect x="8" y="55" width="38" height="12" rx="6" fill="#FDDCB5" stroke="#333" stroke-width="2.5"/>
  <!-- Palm / open hand -->
  <ellipse cx="50" cy="55" rx="12" ry="8" fill="#FDDCB5" stroke="#333" stroke-width="2.5"/>
  <!-- Fingers -->
  <rect x="42" y="42" width="6" height="13" rx="3" fill="#FDDCB5" stroke="#333" stroke-width="2"/>
  <rect x="50" y="40" width="6" height="14" rx="3" fill="#FDDCB5" stroke="#333" stroke-width="2"/>
  <rect x="58" y="42" width="6" height="13" rx="3" fill="#FDDCB5" stroke="#333" stroke-width="2"/>
  <!-- Object being offered (gift/ball) -->
  <circle cx="72" cy="44" r="12" fill="#7DC97D" stroke="#333" stroke-width="2.5"/>
  <!-- Gift bow -->
  <line x1="72" y1="32" x2="72" y2="56" stroke="#C0392B" stroke-width="2"/>
  <line x1="60" y1="44" x2="84" y2="44" stroke="#C0392B" stroke-width="2"/>
  <!-- Arrow indicating giving (left to right) -->
  <line x1="46" y1="36" x2="58" y2="36" stroke="#E67E22" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="60,36 55,32 55,40" fill="#E67E22"/>
</svg>
