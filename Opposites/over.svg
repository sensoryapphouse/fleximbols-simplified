<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- Ball above the box -->
  <circle cx="256" cy="120" r="54" fill="#e74c3c" stroke="#000000" stroke-width="5"/>
  <circle cx="236" cy="100" r="16" fill="#f7b8b0"/>

  <!-- Canonical OPEN BOX -->
  <!-- Interior back wall -->
  <rect x="140" y="270" width="232" height="44" fill="#7a5028" stroke="#000000" stroke-width="5"/>
  <!-- Interior floor sloping forward -->
  <path d="M 140 314 L 372 314 L 388 326 L 124 326 Z" fill="#a06840" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Front face -->
  <rect x="120" y="326" width="272" height="94" fill="#caa379" stroke="#000000" stroke-width="5"/>

  <!-- Curved arc arrow OVER the box — green drawn FIRST so black outline appears on top -->
  <path d="M 100 380 Q 256 30 412 380" fill="none" stroke="#2eb05a" stroke-width="5" stroke-linecap="round"/>
  <path d="M 100 380 Q 256 30 412 380" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Arrowhead at end of curve at (412, 380) pointing down-right -->
  <polygon points="412,380 380,360 396,400" fill="#2eb05a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

</svg>
