<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Head -->
  <circle cx="50" cy="22" r="10" fill="#f5c89a" stroke="#222" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="46" cy="21" r="1.5" fill="#333"/>
  <circle cx="54" cy="21" r="1.5" fill="#333"/>
  <!-- Smile -->
  <path d="M46 26 Q50 29 54 26" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Very narrow body -->
  <rect x="43" y="32" width="14" height="38" rx="4" fill="#5d8aab" stroke="#222" stroke-width="2"/>
  <!-- Narrow legs -->
  <rect x="43" y="68" width="5" height="14" rx="2" fill="#2d3e6e" stroke="#222" stroke-width="1.5"/>
  <rect x="52" y="68" width="5" height="14" rx="2" fill="#2d3e6e" stroke="#222" stroke-width="1.5"/>
  <!-- Thin arms -->
  <line x1="43" y1="40" x2="33" y2="52" stroke="#5d8aab" stroke-width="3" stroke-linecap="round"/>
  <line x1="57" y1="40" x2="67" y2="52" stroke="#5d8aab" stroke-width="3" stroke-linecap="round"/>
</svg>
