<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Container (tilted / upside-down look) -->
  <path d="M28 18 L32 78 L68 78 L72 18 Z" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <line x1="28" y1="18" x2="72" y2="18" stroke="#333" stroke-width="2.5"/>
  <!-- Only a small residue at bottom -->
  <path d="M32 74 L32 78 L68 78 L68 74 Z" fill="#6ab4d8" opacity="0.5"/>
  <!-- Liquid drops falling out the bottom -->
  <circle cx="42" cy="85" r="3" fill="#6ab4d8" stroke="#336699" stroke-width="1.5"/>
  <circle cx="54" cy="88" r="2.5" fill="#6ab4d8" stroke="#336699" stroke-width="1.5"/>
  <circle cx="62" cy="84" r="2" fill="#6ab4d8" stroke="#336699" stroke-width="1.5"/>
  <!-- Arrow pointing down/out -->
  <line x1="50" y1="30" x2="50" y2="10" stroke="#cc6600" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="44,12 50,4 56,12" fill="#cc6600"/>
</svg>
