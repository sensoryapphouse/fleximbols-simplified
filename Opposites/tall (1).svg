<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Tall figure -->
  <!-- Head -->
  <circle cx="50" cy="16" r="10" fill="#f5c89a" stroke="#222" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="46" cy="15" r="1.5" fill="#333"/>
  <circle cx="54" cy="15" r="1.5" fill="#333"/>
  <!-- Smile -->
  <path d="M46 20 Q50 23 54 20" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body (long) -->
  <rect x="38" y="26" width="24" height="42" rx="4" fill="#5d8aab" stroke="#222" stroke-width="2"/>
  <!-- Legs -->
  <rect x="39" y="66" width="10" height="14" rx="2" fill="#2d3e6e" stroke="#222" stroke-width="1.5"/>
  <rect x="51" y="66" width="10" height="14" rx="2" fill="#2d3e6e" stroke="#222" stroke-width="1.5"/>
  <!-- Arms -->
  <line x1="38" y1="34" x2="28" y2="48" stroke="#5d8aab" stroke-width="4" stroke-linecap="round"/>
  <line x1="62" y1="34" x2="72" y2="48" stroke="#5d8aab" stroke-width="4" stroke-linecap="round"/>
  <!-- Up arrow -->
  <line x1="82" y1="70" x2="82" y2="20" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="77,30 82,20 87,30" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
