<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(-8.770 -7.852) scale(1.1063)">
<!-- Short figure - sits lower, body short -->
  <!-- Head -->
  <circle cx="44" cy="52" r="11" fill="#f5c89a" stroke="#222" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="40" cy="51" r="1.5" fill="#333"/>
  <circle cx="48" cy="51" r="1.5" fill="#333"/>
  <!-- Smile -->
  <path d="M40 56 Q44 59 48 56" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Short body -->
  <rect x="33" y="63" width="22" height="16" rx="4" fill="#e07b54" stroke="#222" stroke-width="2"/>
  <!-- Legs -->
  <rect x="34" y="77" width="9" height="8" rx="2" fill="#5d8aab" stroke="#222" stroke-width="1.5"/>
  <rect x="45" y="77" width="9" height="8" rx="2" fill="#5d8aab" stroke="#222" stroke-width="1.5"/>
  <!-- Arms -->
  <line x1="33" y1="69" x2="24" y2="75" stroke="#e07b54" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="69" x2="64" y2="75" stroke="#e07b54" stroke-width="4" stroke-linecap="round"/>
  <!-- Down arrow -->
  <line x1="78" y1="20" x2="78" y2="70" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="73,60 78,70 83,60" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</g>
  </svg>
