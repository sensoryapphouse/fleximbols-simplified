  <!-- Banshee: wailing female spirit with flowing hair/robes -->
  <!-- Flowing robe/body -->
  <path d="M50 8 C38 8 30 18 30 30 L28 90 Q40 80 50 90 Q60 80 72 90 L70 30 C70 18 62 8 50 8 Z" fill="#c8d8e8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Face -->
  <ellipse cx="50" cy="28" rx="12" ry="14" fill="#f5e6d0" stroke="#333" stroke-width="2"/>
  <!-- Wild hair flowing left and right -->
  <path d="M38 22 C28 15 20 20 15 28 C22 26 30 28 38 30" fill="#a0785a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M62 22 C72 15 80 20 85 28 C78 26 70 28 62 30" fill="#a0785a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Eyes: wide open -->
  <ellipse cx="44" cy="26" rx="4" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="56" cy="26" rx="4" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="44" cy="27" r="2" fill="#333"/>
  <circle cx="56" cy="27" r="2" fill="#333"/>
  <!-- Open mouth (wailing) -->
  <ellipse cx="50" cy="38" rx="5" ry="7" fill="#333"/>
  <!-- Sound waves -->
  <path d="M15 50 Q20 45 15 40" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <path d="M10 55 Q17 45 10 35" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <path d="M85 50 Q80 45 85 40" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <path d="M90 55 Q83 45 90 35" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
</svg>
