  <!-- minotaur - bull head, human body -->
  <!-- body muscular human-like -->
  <path d="M34,50 Q30,44 32,36 Q36,26 50,24 Q64,22 68,32 Q72,42 68,52 Q62,62 50,64 Q36,62 34,50 Z" fill="#8a7060" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- legs -->
  <path d="M38,62 Q36,74 34,86 Q38,90 44,88 Q46,78 48,66" fill="#7a6050" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M62,62 Q64,74 66,86 Q62,90 56,88 Q54,78 52,66" fill="#7a6050" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- hooves -->
  <path d="M34,86 Q32,92 36,94 Q40,92 40,88" fill="#3a2818" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <path d="M66,86 Q68,92 64,94 Q60,92 60,88" fill="#3a2818" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- arms muscular raised -->
  <path d="M34,48 Q24,42 16,36 Q12,38 14,44 Q22,46 30,52" fill="#8a7060" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M66,46 Q76,40 84,34 Q88,36 86,42 Q78,44 70,50" fill="#8a7060" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- bull head on human shoulders -->
  <ellipse cx="50" cy="20" rx="16" ry="14" fill="#9a8070" stroke="#333" stroke-width="2.5"/>
  <!-- muzzle -->
  <ellipse cx="50" cy="24" rx="8" ry="6" fill="#7a6050" stroke="#333" stroke-width="2"/>
  <ellipse cx="47" cy="26" rx="2" ry="1.5" fill="#4a3020"/>
  <ellipse cx="53" cy="26" rx="2" ry="1.5" fill="#4a3020"/>
  <!-- horns curved -->
  <path d="M36,12 Q28,4 24,8 Q26,12 32,14" fill="#c8a868" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M64,12 Q72,4 76,8 Q74,12 68,14" fill="#c8a868" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ears -->
  <ellipse cx="35" cy="18" rx="5" ry="7" fill="#9a8070" stroke="#333" stroke-width="2" transform="rotate(-20 35 18)"/>
  <ellipse cx="65" cy="18" rx="5" ry="7" fill="#9a8070" stroke="#333" stroke-width="2" transform="rotate(20 65 18)"/>
  <!-- eyes -->
  <circle cx="43" cy="16" r="3" fill="#222"/>
  <circle cx="57" cy="16" r="3" fill="#222"/>
  <!-- ring in nose -->
  <path d="M46,26 Q50,28 54,26" fill="none" stroke="#c8a040" stroke-width="2" stroke-linecap="round"/>
</svg>
