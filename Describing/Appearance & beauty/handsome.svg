  <circle cx="40" cy="43" r="2.5" fill="#3e5ea8"/>
  <circle cx="40" cy="42" r="1" fill="black"/>
  <ellipse cx="60" cy="43" rx="5" ry="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <circle cx="60" cy="43" r="2.5" fill="#3e5ea8"/>
  <circle cx="60" cy="42" r="1" fill="black"/>
  <!-- Nose -->
  <path d="M50 47 Q48 53 46 55 Q50 57 54 55 Q52 53 50 47" fill="none" stroke="#c09070" stroke-width="1.5" stroke-linecap="round"/>
