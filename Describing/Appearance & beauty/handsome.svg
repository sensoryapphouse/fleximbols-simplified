  <path d="M33 37 Q40 34 46 37" fill="none" stroke="#5c3a1e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M54 37 Q60 34 67 37" fill="none" stroke="#5c3a1e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes -->
