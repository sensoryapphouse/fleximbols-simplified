  <!-- Sparkles -->
  <text font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" x="12" y="30" font-size="12" fill="#f9d71c">✦</text>
  <text font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" x="78" y="30" font-size="11" fill="#f9d71c">✦</text>
</svg>
