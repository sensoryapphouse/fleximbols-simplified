<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Face (uneven) -->
  <ellipse cx="50" cy="48" rx="27" ry="26" fill="#c8b98a" stroke="#222" stroke-width="2"/>
  <!-- Messy hair -->
  <path d="M23 40 Q25 18 50 16 Q75 18 77 40" fill="#6b5030" stroke="#222" stroke-width="2"/>
  <line x1="30" y1="20" x2="26" y2="12" stroke="#6b5030" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="17" x2="40" y2="10" stroke="#6b5030" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="17" x2="57" y2="10" stroke="#6b5030" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="67" y1="21" x2="72" y2="14" stroke="#6b5030" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Uneven eyes -->
  <ellipse cx="39" cy="44" rx="6" ry="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <circle cx="40" cy="44" r="2.5" fill="#555"/>
  <ellipse cx="62" cy="45" rx="5" ry="5" fill="white" stroke="#222" stroke-width="1.5"/>
  <circle cx="62" cy="45" r="2.5" fill="#555"/>
  <!-- Uneven frowning brows -->
  <path d="M33 38 Q38 41 45 38" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M55 40 Q61 36 68 39" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Big nose -->
  <ellipse cx="50" cy="52" rx="5" ry="4" fill="#b8a070" stroke="#888" stroke-width="1.5"/>
  <!-- Frown / grimace -->
  <path d="M38 62 Q50 55 62 62" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <!-- Wart on chin area -->
  <circle cx="42" cy="66" r="2.5" fill="#7a6030" stroke="#555" stroke-width="1"/>
  <!-- X marks around face -->
  <text font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" x="10" y="30" font-size="12" fill="#888">✗</text>
  <text font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" x="80" y="30" font-size="12" fill="#888">✗</text>
</svg>
