  <!-- Microscope with tiny specimen -->
  <!-- Base -->
  <path d="M 22 85 L 70 85 L 65 75 L 27 75 Z" fill="#7a7a7a" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Stage -->
  <rect x="28" y="60" width="36" height="6" fill="#9c9c9c" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Slide on stage -->
  <rect x="32" y="58" width="28" height="3" fill="#d0e8ff" stroke="#000" stroke-width="1.6"/>
  <!-- Tiny red dot (microscopic sample) -->
  <circle cx="46" cy="59.5" r="1.4" fill="#e63946"/>
  <!-- Arm/vertical body -->
  <path d="M 50 75 L 50 30 Q 50 26 54 26 L 64 26 L 64 32 L 56 32 L 56 60" fill="none" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="50" y="32" width="6" height="28" fill="#9c9c9c" stroke="#000" stroke-width="2.2"/>
  <!-- Objective lens -->
  <rect x="46" y="46" width="10" height="14" fill="#555" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Eyepiece -->
  <rect x="58" y="12" width="14" height="14" fill="#555" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="60" y="6" width="10" height="8" fill="#555" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Magnification rays from sample upward -->
  <line x1="46" y1="58" x2="40" y2="50" stroke="#000" stroke-width="1.6" stroke-dasharray="2,2"/>
  <line x1="46" y1="58" x2="52" y2="50" stroke="#000" stroke-width="1.6" stroke-dasharray="2,2"/>
</svg>
