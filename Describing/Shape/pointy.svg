  <!-- Highlight showing sharpness of the angle -->
  <path d="M75,44 L85,50 L75,56" fill="none" stroke="#c8a840" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lines showing the acute angle -->
  <line x1="76" y1="44" x2="82" y2="50" stroke="#555" stroke-width="1" stroke-linecap="round"/>
  <line x1="76" y1="56" x2="82" y2="50" stroke="#555" stroke-width="1" stroke-linecap="round"/>
