<!-- Flat/plain plate with boring food -->
  <ellipse cx="50" cy="66" rx="34" ry="11" fill="#e8e8e8" stroke="#888" stroke-width="2.5"/>
  <ellipse cx="50" cy="61" rx="26" ry="7" fill="#f0f0f0" stroke="#bbb" stroke-width="2"/>
  <!-- Plain flat item on plate (toast/cracker shape, no detail) -->
  <rect x="36" y="50" width="28" height="12" rx="3" fill="#e8d8c0" stroke="#888" stroke-width="2"/>
  <!-- Bored/flat face expression above -->
  <circle cx="50" cy="34" r="14" fill="#ffd9a0" stroke="#888" stroke-width="2"/>
  <!-- Flat mouth (no expression) -->
  <line x1="42" y1="40" x2="58" y2="40" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes half-closed -->
  <line x1="44" y1="30" x2="48" y2="30" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="30" x2="56" y2="30" stroke="#888" stroke-width="2" stroke-linecap="round"/>
