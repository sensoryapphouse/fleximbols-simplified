  <path d="M34 36 Q40 32 44 36" fill="none" stroke="#6b4a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M56 36 Q60 32 66 36" fill="none" stroke="#6b4a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyebrow furrowed inward -->
