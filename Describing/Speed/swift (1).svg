<!-- Diving swift bird -->
  <!-- Body diving diagonally -->
  <ellipse cx="60" cy="45" rx="18" ry="8" fill="#4466aa" stroke="#223366" stroke-width="2.5" transform="rotate(-40 60 45)"/>
  <!-- Head -->
  <ellipse cx="72" cy="30" rx="7" ry="6" fill="#4466aa" stroke="#223366" stroke-width="2"/>
  <!-- Beak -->
  <path d="M78 28 L86 24" stroke="#cc8820" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wing sweep left -->
  <path d="M60 44 Q48 35 28 32 Q20 32 18 36 Q26 42 60 44 Z" fill="#3355aa" stroke="#223366" stroke-width="2" stroke-linejoin="round"/>
  <!-- Wing sweep right -->
  <path d="M62 47 Q70 56 78 62 Q82 66 80 70 Q74 66 62 47 Z" fill="#3355aa" stroke="#223366" stroke-width="2" stroke-linejoin="round"/>
  <!-- Speed trail lines -->
  <line x1="12" y1="45" x2="35" y2="55" stroke="#cc4400" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="52" x2="32" y2="60" stroke="#cc4400" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="38" x2="36" y2="48" stroke="#cc4400" stroke-width="2" stroke-linecap="round"/>
