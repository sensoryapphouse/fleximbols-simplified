<!-- Three sizes side by side, the MIDDLE one highlighted = medium -->
<!-- Small (left, grey) -->
  <circle cx="22" cy="62" r="13" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="2.5"/>
<!-- Large (right, grey) -->
  <circle cx="78" cy="50" r="22" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="2.5"/>
<!-- Medium (centre, highlighted colour) -->
  <circle cx="50" cy="55" r="17.5" fill="#e67e22" stroke="#a85812" stroke-width="3"/>
<!-- Highlight ring / selection on the medium one -->
  <circle cx="50" cy="55" r="22" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4 3"/>
<!-- Tick to mark the chosen medium -->
  <path d="M43 56 l5 6 9 -12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
