  <g transform="translate(-8.983 -0.911) scale(1.1808)">
<!-- Serious straight-faced figure -->
  <!-- Head -->
  <circle cx="50" cy="28" r="14" fill="#f5c89a" stroke="#222" stroke-width="2"/>
  <!-- Flat, serious brows -->
  <line x1="36" y1="24" x2="46" y2="24" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="24" x2="64" y2="24" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes (neutral, direct gaze) -->
  <ellipse cx="41" cy="28" rx="4" ry="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <circle cx="41" cy="28" r="2.5" fill="#333"/>
  <ellipse cx="59" cy="28" rx="4" ry="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <circle cx="59" cy="28" r="2.5" fill="#333"/>
  <!-- Perfectly straight mouth -->
  <line x1="42" y1="37" x2="58" y2="37" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <!-- Body (straight, upright) -->
  <rect x="36" y="42" width="28" height="28" rx="3" fill="#4a6fa5" stroke="#222" stroke-width="2"/>
  <!-- Tie -->
  <polygon points="50,42 53,46 50,64 47,46" fill="#2d3e6e" stroke="#222" stroke-width="1"/>
  <!-- Legs -->
  <rect x="37" y="68" width="11" height="14" rx="2" fill="#2d3e6e" stroke="#222" stroke-width="1.5"/>
  <rect x="52" y="68" width="11" height="14" rx="2" fill="#2d3e6e" stroke="#222" stroke-width="1.5"/>
  <!-- Arms straight at sides -->
  <line x1="36" y1="52" x2="26" y2="65" stroke="#4a6fa5" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="52" x2="74" y2="65" stroke="#4a6fa5" stroke-width="5" stroke-linecap="round"/>
</g>
  </svg>
