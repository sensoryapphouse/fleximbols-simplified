<!-- Open cage (door swung open) -->
  <!-- Cage frame -->
  <rect x="14" y="18" width="42" height="52" rx="4" fill="none" stroke="#888" stroke-width="2.5"/>
  <!-- Cage bars (vertical) -->
  <line x1="22" y1="18" x2="22" y2="70" stroke="#aaa" stroke-width="2"/>
  <line x1="30" y1="18" x2="30" y2="70" stroke="#aaa" stroke-width="2"/>
  <line x1="38" y1="18" x2="38" y2="70" stroke="#aaa" stroke-width="2"/>
  <!-- Door open (swung out to right, partially open) -->
  <rect x="46" y="34" width="20" height="36" rx="2" fill="#f5f0e0" stroke="#8B6914" stroke-width="2" transform="rotate(50 46 52)"/>
  <line x1="58" y1="32" x2="60" y2="38" stroke="#8B6914" stroke-width="2"/>
  <line x1="58" y1="40" x2="62" y2="44" stroke="#8B6914" stroke-width="2"/>
  <!-- Bird/figure flying free -->
  <!-- Simple bird silhouette (or figure with open arms) -->
  <circle cx="78" cy="28" r="8" fill="#f5c89a" stroke="#222" stroke-width="2"/>
  <!-- Happy face -->
  <circle cx="75" cy="27" r="1.2" fill="#333"/>
  <circle cx="81" cy="27" r="1.2" fill="#333"/>
  <path d="M74 31 Q78 34 82 31" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arms spread wide (freedom) -->
  <line x1="70" y1="36" x2="56" y2="28" stroke="#7bc87b" stroke-width="4" stroke-linecap="round"/>
  <line x1="86" y1="36" x2="98" y2="28" stroke="#7bc87b" stroke-width="4" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="70" y="36" width="16" height="16" rx="3" fill="#7bc87b" stroke="#222" stroke-width="1.5"/>
  <!-- Motion lines -->
  <line x1="60" y1="24" x2="52" y2="22" stroke="#bbb" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="62" y1="30" x2="54" y2="30" stroke="#bbb" stroke-width="1.5" stroke-dasharray="2,2"/>
</svg>
