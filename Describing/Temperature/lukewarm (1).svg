  <!-- Thermometer at middle (lukewarm) -->
  <!-- Bulb -->
  <circle cx="35" cy="78" r="11" fill="#f4a261" stroke="#000" stroke-width="2.4"/>
  <!-- Tube -->
  <rect x="30" y="18" width="10" height="58" fill="#ffffff" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Mercury fill - half (lukewarm) -->
  <rect x="32" y="48" width="6" height="30" fill="#f4a261"/>
  <line x1="32" y1="48" x2="38" y2="48" stroke="#000" stroke-width="2"/>
  <!-- Scale marks -->
  <line x1="42" y1="26" x2="48" y2="26" stroke="#000" stroke-width="2"/>
  <line x1="42" y1="38" x2="46" y2="38" stroke="#000" stroke-width="2"/>
  <line x1="42" y1="48" x2="50" y2="48" stroke="#e63946" stroke-width="2.4"/>
  <line x1="42" y1="58" x2="46" y2="58" stroke="#000" stroke-width="2"/>
  <line x1="42" y1="68" x2="48" y2="68" stroke="#000" stroke-width="2"/>
  <!-- Top cap -->
  <rect x="28" y="14" width="14" height="6" rx="1" fill="#c0c0c0" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- "Lukewarm" indicator: hand touching water -->
  <!-- Water drop label -->
  <path d="M 70 40 Q 60 52 70 60 Q 80 52 70 40 Z" fill="#a0d0e0" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Equal/medium sign inside drop -->
  <line x1="65" y1="50" x2="75" y2="50" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="65" y1="54" x2="75" y2="54" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
</svg>
