<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Fridge body -->
  <rect x="18" y="10" width="64" height="80" rx="4" fill="#e8eef4" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Freezer section divider -->
  <line x1="18" y1="34" x2="82" y2="34" stroke="#555" stroke-width="2.5"/>
  <!-- Freezer door handle -->
  <rect x="54" y="18" width="5" height="12" rx="2.5" fill="#999" stroke="#555" stroke-width="1.5"/>
  <!-- Fridge door handle -->
  <rect x="54" y="42" width="5" height="24" rx="2.5" fill="#999" stroke="#555" stroke-width="1.5"/>
  <!-- Hinge marks -->
  <circle cx="22" cy="22" r="2" fill="#aaa" stroke="#555" stroke-width="1"/>
  <circle cx="22" cy="58" r="2" fill="#aaa" stroke="#555" stroke-width="1"/>
  <!-- Vent bottom -->
  <rect x="24" y="82" width="52" height="5" rx="1" fill="#d0d8e0" stroke="#555" stroke-width="1.5"/>
</svg>
