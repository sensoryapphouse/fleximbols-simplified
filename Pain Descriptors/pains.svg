<!-- Person in pain, clutching, with pain-burst marks -->
<!-- Head -->
  <circle cx="50" cy="24" r="14" fill="#f5c5a3" stroke="#333" stroke-width="2.5"/>
<!-- Pained eyes (scrunched) -->
  <path d="M40 22 Q44 19 48 22" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 22 Q56 19 60 22" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
<!-- Grimace mouth -->
  <path d="M44 31 Q50 27 56 31" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
<!-- Brow furrow -->
  <path d="M44 14 Q50 17 56 14" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
<!-- Torso -->
  <path d="M34 40 Q34 36 40 36 L60 36 Q66 36 66 40 L64 74 Q50 80 36 74 Z" fill="#5b89c4" stroke="#2e4f7c" stroke-width="2.5" stroke-linejoin="round"/>
<!-- Arms clutching belly -->
  <path d="M36 44 Q26 54 40 60 Q48 62 50 58" fill="none" stroke="#f5c5a3" stroke-width="6" stroke-linecap="round"/>
  <path d="M64 44 Q74 54 60 60 Q52 62 50 58" fill="none" stroke="#f5c5a3" stroke-width="6" stroke-linecap="round"/>
<!-- Hands on belly -->
  <circle cx="44" cy="59" r="4.5" fill="#f5c5a3" stroke="#333" stroke-width="2"/>
  <circle cx="56" cy="59" r="4.5" fill="#f5c5a3" stroke="#333" stroke-width="2"/>
<!-- Legs -->
  <rect x="40" y="74" width="8" height="16" rx="3" fill="#34495e" stroke="#1b2631" stroke-width="2"/>
  <rect x="52" y="74" width="8" height="16" rx="3" fill="#34495e" stroke="#1b2631" stroke-width="2"/>
<!-- Pain-burst star at belly -->
  <path d="M50 50 l4 6 7 -1 -4 6 4 6 -7 -1 -4 6 -4 -6 -7 1 4 -6 -4 -6 7 1 z" fill="#e74c3c" stroke="#922b21" stroke-width="1.5" opacity="0.55"/>
<!-- Small pain flashes -->
  <path d="M22 46 l3 4 -4 1 z" fill="#e74c3c" stroke="#922b21" stroke-width="1"/>
  <path d="M78 46 l-3 4 4 1 z" fill="#e74c3c" stroke="#922b21" stroke-width="1"/>
</svg>
