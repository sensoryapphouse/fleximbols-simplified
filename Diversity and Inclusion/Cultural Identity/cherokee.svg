<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Cherokee Nation seven-pointed star (central tribal emblem) inside an oak wreath -->
  <!-- Background circular field -->
  <circle cx="50" cy="50" r="44" fill="#f4d35e" stroke="#000" stroke-width="2.4"/>
  <!-- Oak wreath (simple leaf ring) -->
  <g stroke="#000" stroke-width="2" fill="#2e7d32">
    <ellipse cx="50" cy="12" rx="6" ry="3" transform="rotate(0 50 50)"/>
    <ellipse cx="50" cy="12" rx="6" ry="3" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="12" rx="6" ry="3" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="12" rx="6" ry="3" transform="rotate(135 50 50)"/>
    <ellipse cx="50" cy="12" rx="6" ry="3" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="12" rx="6" ry="3" transform="rotate(225 50 50)"/>
    <ellipse cx="50" cy="12" rx="6" ry="3" transform="rotate(270 50 50)"/>
    <ellipse cx="50" cy="12" rx="6" ry="3" transform="rotate(315 50 50)"/>
  </g>
  <!-- Inner field -->
  <circle cx="50" cy="50" r="28" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <!-- Seven-pointed star (Cherokee symbol) -->
  <polygon points="50,26 56,42 72,40 60,52 66,68 50,60 34,68 40,52 28,40 44,42"
           fill="#d63a3a" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Cherokee syllabary characters along bottom -->
  <text x="50" y="92" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#000">ᏣᎳᎩ</text>
</svg>
