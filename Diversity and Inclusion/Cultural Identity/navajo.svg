  <!-- Navajo: traditional rug / blanket geometric pattern -->
  <rect x="14" y="20" width="72" height="60" fill="#e8d4a8" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Border stripes -->
  <rect x="14" y="20" width="72" height="6" fill="#9c3a2a" stroke="#000" stroke-width="2"/>
  <rect x="14" y="74" width="72" height="6" fill="#9c3a2a" stroke="#000" stroke-width="2"/>
  <!-- Central diamond -->
  <polygon points="50,32 70,50 50,68 30,50" fill="#3a4a7a" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Inner diamond -->
  <polygon points="50,40 62,50 50,60 38,50" fill="#e8d4a8" stroke="#000" stroke-width="2"/>
  <!-- Center small diamond -->
  <polygon points="50,46 54,50 50,54 46,50" fill="#9c3a2a" stroke="#000" stroke-width="1.6"/>
  <!-- Side stepped chevrons left -->
  <polygon points="14,40 22,40 22,46 18,46 18,52 14,52" fill="#3a4a7a" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Side stepped chevrons right -->
  <polygon points="86,40 78,40 78,46 82,46 82,52 86,52" fill="#3a4a7a" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Fringe lines bottom -->
  <line x1="18" y1="80" x2="18" y2="88" stroke="#000" stroke-width="1.5"/>
  <line x1="26" y1="80" x2="26" y2="88" stroke="#000" stroke-width="1.5"/>
  <line x1="34" y1="80" x2="34" y2="88" stroke="#000" stroke-width="1.5"/>
  <line x1="42" y1="80" x2="42" y2="88" stroke="#000" stroke-width="1.5"/>
  <line x1="50" y1="80" x2="50" y2="88" stroke="#000" stroke-width="1.5"/>
  <line x1="58" y1="80" x2="58" y2="88" stroke="#000" stroke-width="1.5"/>
  <line x1="66" y1="80" x2="66" y2="88" stroke="#000" stroke-width="1.5"/>
  <line x1="74" y1="80" x2="74" y2="88" stroke="#000" stroke-width="1.5"/>
  <line x1="82" y1="80" x2="82" y2="88" stroke="#000" stroke-width="1.5"/>
</svg>
