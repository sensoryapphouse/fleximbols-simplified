<!-- Needle - long thin tapered shaft -->
  <!-- Hub/top end -->
  <rect x="12" y="46" width="16" height="8" rx="3" fill="#c0c0c0" stroke="#555" stroke-width="2"/>
  <!-- Needle shaft -->
  <rect x="28" y="48" width="52" height="4" rx="1" fill="#a8a8a8" stroke="#555" stroke-width="1.5"/>
  <!-- Needle tip (tapered point) -->
  <polygon points="80,48 80,52 92,50" fill="#888" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Highlight on shaft -->
  <line x1="28" y1="49" x2="80" y2="49" stroke="white" stroke-width="1" opacity="0.6"/>
  <!-- Scale markings on hub -->
  <line x1="18" y1="46" x2="18" y2="43" stroke="#888" stroke-width="1"/>
  <line x1="22" y1="46" x2="22" y2="43" stroke="#888" stroke-width="1"/>
  <!-- Small droplet at tip -->
  <ellipse cx="91" cy="50" rx="3" ry="2.5" fill="#a8d8e8" stroke="#2c5f8a" stroke-width="1.5"/>
</svg>
