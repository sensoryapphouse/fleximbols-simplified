  <rect x="44" y="70" width="12" height="12" rx="4" fill="#d0b090" stroke="#6a4820" stroke-width="2"/>
  <circle cx="50" cy="45" r="28" fill="#d0b090" stroke="#6a4820" stroke-width="2.5"/>
  <!-- Neck -->
  
