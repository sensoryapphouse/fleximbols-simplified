  <path d="M68 32 Q78 32 82 38" fill="none" stroke="#c04040" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M66 42 Q76 42 80 48" fill="none" stroke="#c04040" stroke-width="1" stroke-linecap="round"/>
  <!-- Face features - squinting in pain -->
