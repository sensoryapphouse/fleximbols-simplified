  <path d="M50 18 Q72 18 72 45 Q72 62 50 72" fill="#e07070" stroke="none" opacity="0.3"/>
  <!-- LIGHTNING BOLT pain symbol - key migraine indicator -->
  <path d="M58 15 L48 38 L56 38 L44 62 L54 62 L42 82" fill="#e0a020" stroke="#c07010" stroke-width="2" stroke-linejoin="round"/>
