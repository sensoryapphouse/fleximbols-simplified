  <!-- Chemotherapy: IV bag hanging with chemo drug, drip tubing, port -->
  <!-- IV pole -->
  <line x1="72" y1="4" x2="72" y2="92" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="88" x2="86" y2="88" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <!-- Hanging hook -->
  <path d="M72,8 Q76,4 80,8" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <!-- IV bag (chemo - often red or clear with label) -->
  <path d="M44,14 Q30,14 28,28 L28,54 Q28,62 50,62 Q72,62 72,54 L72,28 Q70,14 56,14 Z" fill="#f0d0e0" stroke="#222" stroke-width="2.5"/>
  <!-- Chemo liquid level -->
  <path d="M30,42 L30,54 Q30,60 50,60 Q70,60 70,54 L70,42 Z" fill="#cc6699"/>
  <!-- IV bag hanger port -->
  <ellipse cx="50" cy="14" rx="4" ry="3" fill="#ddd" stroke="#222" stroke-width="1.5"/>
  <!-- Bag label (CHEMO) -->

  <!-- Drip tubing -->
  <line x1="50" y1="62" x2="50" y2="70" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <!-- Drip chamber -->
  <rect x="44" y="70" width="12" height="16" rx="4" fill="#ddeeff" stroke="#222" stroke-width="1.5"/>
  <!-- Drop in chamber -->
  <ellipse cx="50" cy="76" rx="2" ry="2.5" fill="#cc6699"/>
  <!-- Line continuing down -->
  <line x1="50" y1="86" x2="50" y2="96" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <!-- Arm with port/cannula -->
  <path d="M12,82 Q14,70 20,68 Q30,66 38,70" fill="#ffd0a0" stroke="#222" stroke-width="2"/>
  <!-- Port/cannula -->
  <circle cx="38" cy="72" r="5" fill="#ddd" stroke="#222" stroke-width="1.5"/>
  <line x1="38" y1="72" x2="50" y2="94" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
</svg>
