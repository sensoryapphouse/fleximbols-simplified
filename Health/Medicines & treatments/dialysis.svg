  <!-- Dialysis machine: box with display, tubing, blood lines -->
  <!-- Machine body -->
  <rect x="8" y="18" width="52" height="70" rx="6" fill="#ddeeff" stroke="#222" stroke-width="2.5"/>
  <!-- Machine display screen -->
  <rect x="14" y="24" width="40" height="22" rx="3" fill="#222" stroke="#444" stroke-width="1.5"/>
  <!-- Screen content (vitals) -->
  <line x1="18" y1="32" x2="50" y2="32" stroke="#4af" stroke-width="1.5"/>
  <polyline points="18,36 24,30 28,40 34,34 40,38 46,34 50,36" fill="none" stroke="#22cc44" stroke-width="1.5"/>
  <!-- Control knobs/buttons -->
  <circle cx="20" cy="56" r="5" fill="#888" stroke="#222" stroke-width="1.5"/>
  <circle cx="34" cy="56" r="5" fill="#888" stroke="#222" stroke-width="1.5"/>
  <circle cx="48" cy="56" r="5" fill="#cc2222" stroke="#222" stroke-width="1.5"/>
  <!-- Pump rollers indicator -->
  <rect x="14" y="66" width="40" height="14" rx="3" fill="#aaa" stroke="#222" stroke-width="1.5"/>
  <circle cx="28" cy="73" r="5" fill="#888" stroke="#222" stroke-width="1.5"/>
  <circle cx="42" cy="73" r="5" fill="#888" stroke="#222" stroke-width="1.5"/>
  <!-- Blood lines (red out, blue back) -->
  <!-- Arterial line (red, patient to machine) -->
  <path d="M64,36 Q72,36 72,48 Q72,60 80,60 Q88,60 90,70" fill="none" stroke="#cc2222" stroke-width="3" stroke-linecap="round"/>
  <!-- Venous line (blue, machine back to patient) -->
  <path d="M64,58 Q72,58 74,70 Q76,80 84,82 Q90,82 90,90" fill="none" stroke="#4488cc" stroke-width="3" stroke-linecap="round"/>
  <!-- Dialyzer filter (on lines) -->
<!-- Filter membrane lines -->
  <line x1="62" y1="42" x2="66" y2="42" stroke="#aaa" stroke-width="1"/>
  <line x1="62" y1="46" x2="66" y2="46" stroke="#aaa" stroke-width="1"/>
  <line x1="62" y1="50" x2="66" y2="50" stroke="#aaa" stroke-width="1"/>
  <line x1="62" y1="54" x2="66" y2="54" stroke="#aaa" stroke-width="1"/>
</svg>
