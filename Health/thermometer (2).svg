<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Thermometer glass tube (vertical) -->
  <rect x="44" y="15" width="12" height="60" rx="6" fill="#f5f5dc" stroke="#888" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Mercury bulb at bottom -->
  <circle cx="50" cy="78" r="10" fill="#e74c3c" stroke="#8B1a1a" stroke-width="2.5"/>
  <!-- Mercury column (red fill) -->
  <rect x="47" y="42" width="6" height="35" rx="3" fill="#e74c3c"/>
  <!-- Scale markings on tube -->
  <line x1="56" y1="25" x2="60" y2="25" stroke="#888" stroke-width="1.5"/>
  <line x1="56" y1="33" x2="62" y2="33" stroke="#888" stroke-width="1.5"/>
  <line x1="56" y1="41" x2="60" y2="41" stroke="#888" stroke-width="1.5"/>
  <line x1="56" y1="49" x2="62" y2="49" stroke="#888" stroke-width="1.5"/>
  <line x1="56" y1="57" x2="60" y2="57" stroke="#888" stroke-width="1.5"/>
  <line x1="56" y1="65" x2="62" y2="65" stroke="#888" stroke-width="1.5"/>
  <!-- Highlight on glass -->
  <line x1="46" y1="20" x2="46" y2="70" stroke="white" stroke-width="1.5" opacity="0.5"/>
</svg>
