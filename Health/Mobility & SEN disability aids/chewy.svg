  <path d="M29 44 Q50 35 71 44" fill="none" stroke="#c8906a" stroke-width="7" stroke-linecap="round"/>
  <path d="M29 56 Q50 65 71 56" fill="none" stroke="#c8906a" stroke-width="7" stroke-linecap="round"/>
