  <path d="M36 48 Q50 44 64 48" fill="none" stroke="#a0704a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M36 52 Q50 56 64 52" fill="none" stroke="#a0704a" stroke-width="1.5" stroke-linecap="round"/>
