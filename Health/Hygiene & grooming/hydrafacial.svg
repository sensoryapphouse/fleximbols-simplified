  <!-- Hydrafacial: face + water droplets + suction wand -->
  <!-- Head -->
  <ellipse cx="50" cy="45" rx="27" ry="32" fill="#f5c98a" stroke="#333" stroke-width="2.5"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="40" rx="5" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="40" cy="40" r="2" fill="#555"/>
  <ellipse cx="60" cy="40" rx="5" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="60" cy="40" r="2" fill="#555"/>
  <!-- Smile -->
  <path d="M42,56 Q50,63 58,56" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M48,48 L46,53 Q50,55 54,53 L52,48" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="43" y="76" width="14" height="14" rx="3" fill="#f5c98a" stroke="#333" stroke-width="2"/>
  <!-- Wand device on side -->
  <rect x="72" y="30" width="8" height="28" rx="4" fill="#d0d0d0" stroke="#333" stroke-width="2.5"/>
