  <!-- Waxing: leg with wax strip being pulled off -->
  <!-- Leg -->
  <path d="M28,10 Q20,10 18,40 Q16,70 20,95 Q25,97 30,95 Q33,70 35,40 Q38,13 32,10 Z" fill="#f5c98a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Wax strip on leg -->
  <rect x="14" y="40" width="24" height="30" rx="3" fill="#f5e060" stroke="#d4b800" stroke-width="2"/>
  <!-- Strip texture / fabric mesh -->
  <line x1="20" y1="40" x2="20" y2="70" stroke="#d4b800" stroke-width="1" opacity="0.5"/>
  <line x1="26" y1="40" x2="26" y2="70" stroke="#d4b800" stroke-width="1" opacity="0.5"/>
  <line x1="14" y1="48" x2="38" y2="48" stroke="#d4b800" stroke-width="1" opacity="0.5"/>
  <line x1="14" y1="56" x2="38" y2="56" stroke="#d4b800" stroke-width="1" opacity="0.5"/>
  <line x1="14" y1="64" x2="38" y2="64" stroke="#d4b800" stroke-width="1" opacity="0.5"/>
  <!-- Strip being pulled - peeling corner -->
  <path d="M14,40 L8,25 L22,32 L14,40 Z" fill="#f5e060" stroke="#d4b800" stroke-width="2" stroke-linejoin="round"/>
  <!-- Hairs sticking to strip -->
  <line x1="16" y1="35" x2="14" y2="44" stroke="#8B6914" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="33" x2="18" y2="42" stroke="#8B6914" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hand pulling strip (simplified arrow) -->
  <path d="M8,18 Q4,12 8,8 Q12,4 14,10" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <polygon points="5,20 12,18 8,24" fill="#333"/>
  <!-- Wax pot on right -->
  <rect x="60" y="55" width="30" height="28" rx="5" fill="#f5c050" stroke="#333" stroke-width="2.5"/>
  <rect x="58" y="50" width="34" height="10" rx="4" fill="#d4a800" stroke="#333" stroke-width="2"/>
  <!-- Wax drip -->
  <path d="M70,83 Q68,90 70,95" fill="none" stroke="#f5c050" stroke-width="3" stroke-linecap="round"/>
  <!-- Stick in pot -->
  <rect x="73" y="38" width="5" height="22" rx="2" fill="#c8a060" stroke="#333" stroke-width="2"/>
</svg>