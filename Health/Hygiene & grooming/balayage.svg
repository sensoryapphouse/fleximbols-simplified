  <!-- Balayage: head with freehand painted lighter ends -->
  <!-- Head -->
  <ellipse cx="50" cy="46" rx="28" ry="33" fill="#f5c98a" stroke="#333" stroke-width="2.5"/>
  <!-- Dark roots at top -->
  <path d="M22,34 Q22,12 50,10 Q78,12 78,34 Q78,20 50,18 Q22,20 22,34 Z" fill="#3a2010" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Long hair left: dark to light balayage -->
  <path d="M22,35 Q12,58 14,85 Q16,92 18,95" fill="none" stroke="#3a2010" stroke-width="9" stroke-linecap="round"/>
  <path d="M22,42 Q13,65 15,90" fill="none" stroke="#8B6040" stroke-width="5" stroke-linecap="round"/>
  <path d="M22,55 Q14,75 16,92" fill="none" stroke="#d4b070" stroke-width="3" stroke-linecap="round"/>
  <path d="M22,68 Q15,82 17,95" fill="none" stroke="#e8d0a0" stroke-width="2" stroke-linecap="round"/>
  <!-- Long hair right: dark to light -->
  <path d="M78,35 Q88,58 86,85 Q84,92 82,95" fill="none" stroke="#3a2010" stroke-width="9" stroke-linecap="round"/>
  <path d="M78,42 Q87,65 85,90" fill="none" stroke="#8B6040" stroke-width="5" stroke-linecap="round"/>
  <path d="M78,55 Q86,75 84,92" fill="none" stroke="#d4b070" stroke-width="3" stroke-linecap="round"/>
  <path d="M78,68 Q85,82 83,95" fill="none" stroke="#e8d0a0" stroke-width="2" stroke-linecap="round"/>
  <!-- Paint brush (balayage technique - freehand painting) -->
  <rect x="78" y="20" width="5" height="30" rx="2" fill="#c8a060" stroke="#333" stroke-width="2"/>
  <path d="M76,48 Q80,52 84,48 L82,42 L78,42 Z" fill="#d4b070" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Neck -->
  <rect x="43" y="78" width="14" height="13" rx="3" fill="#f5c98a" stroke="#333" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="48" rx="5" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="40" cy="48" r="2" fill="#444"/>
  <ellipse cx="60" cy="48" rx="5" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="60" cy="48" r="2" fill="#444"/>
</svg>