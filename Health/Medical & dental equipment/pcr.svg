  <!-- PCR test: thermocycler machine with tubes, DNA amplification implied -->
  <!-- Machine body -->
  <rect x="10" y="30" width="80" height="52" rx="6" fill="#ddeeff" stroke="#222" stroke-width="2.5"/>
