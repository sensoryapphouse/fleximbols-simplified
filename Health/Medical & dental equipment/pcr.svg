  <!-- Screen content: graph lines -->
  <polyline points="22,70 28,60 34,72 40,55 46,70" fill="none" stroke="#4af" stroke-width="2"/>
  <!-- Tube block (sample wells) -->
  <rect x="62" y="38" width="22" height="30" rx="3" fill="#eee" stroke="#222" stroke-width="1.5"/>
  <!-- PCR tubes in block -->
  <rect x="65" y="41" width="5" height="20" rx="2" fill="#4488cc" stroke="#222" stroke-width="1"/>
  <rect x="72" y="41" width="5" height="20" rx="2" fill="#4488cc" stroke="#222" stroke-width="1"/>
  <rect x="79" y="41" width="3" height="20" rx="1.5" fill="#4488cc" stroke="#222" stroke-width="1"/>
