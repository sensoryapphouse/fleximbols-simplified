  <!-- ECG: 12-lead electrocardiogram with chest lead electrodes visible -->
  <!-- ECG paper / trace display -->
  <rect x="6" y="18" width="88" height="62" rx="4" fill="#fff8ee" stroke="#e0c080" stroke-width="1.5"/>
  <!-- Grid lines -->
  <line x1="6" y1="30" x2="94" y2="30" stroke="#f0d090" stroke-width="0.8"/>
  <line x1="6" y1="42" x2="94" y2="42" stroke="#f0d090" stroke-width="0.8"/>
  <line x1="6" y1="54" x2="94" y2="54" stroke="#f0d090" stroke-width="0.8"/>
  <line x1="6" y1="66" x2="94" y2="66" stroke="#f0d090" stroke-width="0.8"/>
  <line x1="24" y1="18" x2="24" y2="80" stroke="#f0d090" stroke-width="0.8"/>
  <line x1="42" y1="18" x2="42" y2="80" stroke="#f0d090" stroke-width="0.8"/>
  <line x1="60" y1="18" x2="60" y2="80" stroke="#f0d090" stroke-width="0.8"/>
  <line x1="78" y1="18" x2="78" y2="80" stroke="#f0d090" stroke-width="0.8"/>
  <!-- Lead I trace (top row) -->
  <polyline points="8,30 14,30 16,25 18,38 20,22 24,36 28,30 36,30 38,26 42,30 50,30" fill="none" stroke="#cc2222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lead II trace (mid row) -->
  <polyline points="8,50 14,50 16,44 18,56 20,40 24,54 28,50 36,50 38,46 42,50 50,50" fill="none" stroke="#cc2222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lead III trace (bottom row) -->
  <polyline points="8,68 14,68 16,64 18,72 20,60 24,70 28,68 36,68 38,64 42,68 50,68" fill="none" stroke="#cc2222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- V4-V6 traces (right side) -->
  <polyline points="52,30 56,30 58,22 62,36 66,30 70,30 78,30 80,26 82,30 90,30" fill="none" stroke="#cc2222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="52,50 56,50 58,42 62,56 66,50 70,50 78,50 80,46 82,50 90,50" fill="none" stroke="#cc2222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="52,68 56,68 58,62 62,74 66,68 70,68 78,68 80,64 82,68 90,68" fill="none" stroke="#cc2222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lead labels -->
  <text x="8" y="28" font-size="5" fill="#888" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">I</text>
  <text x="8" y="48" font-size="5" fill="#888" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">II</text>
  <text x="8" y="66" font-size="5" fill="#888" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">III</text>
  <!-- ECG label -->
</svg>
