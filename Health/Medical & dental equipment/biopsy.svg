  <!-- Biopsy: punch biopsy tool on skin cross-section -->
  <!-- Skin cross section -->
  <rect x="8" y="52" width="84" height="40" rx="4" fill="#ffd0a0" stroke="#222" stroke-width="2"/>
  <!-- Deeper tissue layer -->
  <rect x="8" y="68" width="84" height="24" rx="4" fill="#f0b080" stroke="#222" stroke-width="1.5"/>
  <!-- Biopsy punch tool (cylindrical cutter) -->
  <rect x="40" y="14" width="20" height="50" rx="3" fill="#888" stroke="#222" stroke-width="2"/>
  <!-- Punch handle -->
  <rect x="36" y="8" width="28" height="10" rx="3" fill="#555" stroke="#222" stroke-width="2"/>
  <!-- Punch core/cutter at bottom (hollow ring) -->
  <ellipse cx="50" cy="64" rx="8" ry="4" fill="#666" stroke="#222" stroke-width="2"/>
  <!-- Tissue core being removed -->
  <ellipse cx="50" cy="62" rx="6" ry="3" fill="#ffd0a0" stroke="#cc3333" stroke-width="1.5"/>
  <!-- Cut lines in skin -->
  <ellipse cx="50" cy="64" rx="6" ry="3" fill="none" stroke="#cc3333" stroke-width="2"/>
  <!-- Blood drop at cut site -->
  <path d="M44,68 Q50,78 56,68 Q56,62 50,60 Q44,62 44,68Z" fill="#cc2222" stroke="#222" stroke-width="1"/>
</svg>
