<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Amniocentesis: needle through abdomen into amniotic sac, fetus visible, ultrasound guide -->
  <!-- Ultrasound screen (small, top corner) -->
  <rect x="4" y="4" width="30" height="22" rx="3" fill="#222" stroke="#444" stroke-width="1.5"/>
  <rect x="6" y="6" width="26" height="18" rx="2" fill="#111"/>
  <!-- Fetus outline on screen -->
  <ellipse cx="16" cy="12" rx="6" ry="5" fill="#333" stroke="#888" stroke-width="1"/>
  <ellipse cx="22" cy="20" rx="6" ry="4" fill="#333" stroke="#888" stroke-width="1"/>
  <!-- Needle guide line on ultrasound screen -->
  <line x1="28" y1="6" x2="14" y2="22" stroke="#f0c040" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Pregnant abdomen (large, center) -->
  <path d="M14,40 Q10,56 14,74 Q20,90 50,92 Q80,90 86,74 Q90,56 86,40 Q80,26 50,24 Q20,26 14,40 Z" fill="#ffd0a0" stroke="#222" stroke-width="2.5"/>
  <!-- Uterus outline (inside abdomen) -->
  <ellipse cx="50" cy="62" rx="28" ry="24" fill="#f0c0a0" stroke="#cc8855" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Amniotic fluid (blue) -->
  <ellipse cx="50" cy="64" rx="22" ry="18" fill="#aaddff" stroke="#6699cc" stroke-width="1.5"/>
  <!-- Fetus silhouette in sac -->
  <ellipse cx="44" cy="58" rx="8" ry="7" fill="#ffd0a0" stroke="#cc8855" stroke-width="1.5"/>
  <ellipse cx="56" cy="68" rx="10" ry="8" fill="#ffd0a0" stroke="#cc8855" stroke-width="1.5"/>
  <!-- Amniocentesis needle (long, entering from top) -->
  <line x1="80" y1="8" x2="50" y2="60" stroke="#aaa" stroke-width="3" stroke-linecap="round"/>
  <!-- Needle tip in amniotic fluid -->
  <polygon points="48,62 52,62 50,68" fill="#888" stroke="#222" stroke-width="1.5"/>
  <!-- Syringe at top of needle -->
  <rect x="76" y="4" width="10" height="12" rx="2" fill="#ddeeff" stroke="#222" stroke-width="1.5" transform="rotate(-60 81 10)"/>
  <!-- Amniotic fluid in syringe (drawn back) -->
  <rect x="77" y="5" width="6" height="6" rx="1" fill="#aaddff" transform="rotate(-60 80 8)"/>
  <!-- Ultrasound probe guiding (to right of needle entry) -->
  <rect x="66" y="16" width="10" height="18" rx="4" fill="#555" stroke="#222" stroke-width="1.5" transform="rotate(-30 71 25)"/>
  <!-- Gel on skin near probe -->
  <ellipse cx="70" cy="36" rx="8" ry="3" fill="#aaddff" opacity="0.5"/>
</svg>
