  <!-- Mache (lamb's lettuce) - small rosette of spoon-shaped leaves -->
  <!-- Rosette pattern -->
  <!-- Bottom leaves -->
  <ellipse cx="50" cy="75" rx="12" ry="18" fill="#4a8a2a" stroke="#2a5a0a" stroke-width="2"/>
  <ellipse cx="28" cy="65" rx="12" ry="18" fill="#4a8a2a" stroke="#2a5a0a" stroke-width="2" transform="rotate(-40 28 65)"/>
  <ellipse cx="72" cy="65" rx="12" ry="18" fill="#4a8a2a" stroke="#2a5a0a" stroke-width="2" transform="rotate(40 72 65)"/>
  <!-- Middle leaves -->
  <ellipse cx="20" cy="48" rx="10" ry="16" fill="#5a9a3a" stroke="#2a5a0a" stroke-width="2" transform="rotate(-60 20 48)"/>
  <ellipse cx="80" cy="48" rx="10" ry="16" fill="#5a9a3a" stroke="#2a5a0a" stroke-width="2" transform="rotate(60 80 48)"/>
  <ellipse cx="50" cy="38" rx="10" ry="16" fill="#5a9a3a" stroke="#2a5a0a" stroke-width="2"/>
  <!-- Top/inner leaves -->
  <ellipse cx="32" cy="30" rx="9" ry="14" fill="#6aaa4a" stroke="#2a5a0a" stroke-width="2" transform="rotate(-30 32 30)"/>
  <ellipse cx="68" cy="30" rx="9" ry="14" fill="#6aaa4a" stroke="#2a5a0a" stroke-width="2" transform="rotate(30 68 30)"/>
  <!-- Centre tiny leaves -->
  <ellipse cx="50" cy="20" rx="7" ry="11" fill="#7aba5a" stroke="#3a6a1a" stroke-width="1.5"/>
  <ellipse cx="42" cy="22" rx="6" ry="10" fill="#7aba5a" stroke="#3a6a1a" stroke-width="1.5" transform="rotate(-20 42 22)"/>
  <ellipse cx="58" cy="22" rx="6" ry="10" fill="#7aba5a" stroke="#3a6a1a" stroke-width="1.5" transform="rotate(20 58 22)"/>
  <!-- Root base -->
  <ellipse cx="50" cy="88" rx="6" ry="4" fill="#8a6030" stroke="#4a3010" stroke-width="2"/>
</svg>
