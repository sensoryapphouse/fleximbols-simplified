<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(-24.927 -19.141) scale(1.5000)">
<!-- plastic bottle -->
  <!-- cap -->
  <rect x="38" y="16" width="24" height="10" rx="4" fill="#e05c8a" stroke="#b03060" stroke-width="2"/>
  <!-- neck -->
  <rect x="42" y="25" width="16" height="8" rx="2" fill="#7aaad4" stroke="#2060a0" stroke-width="2"/>
  <!-- body -->
  <path d="M32,33 Q28,38 28,55 Q28,72 32,76 L68,76 Q72,72 72,55 Q72,38 68,33Z" fill="#7aaad4" stroke="#2060a0" stroke-width="2.5"/>
  <!-- label on bottle -->
<!-- bottle highlight -->
