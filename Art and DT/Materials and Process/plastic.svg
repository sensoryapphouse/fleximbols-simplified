  <!-- liquid inside -->
  <path d="M30,62 Q50,58 70,62 L70,74 Q50,70 30,74Z" fill="#4a90d9" stroke="none" opacity="0.6"/>
  <!-- recycling symbol on label -->
  <path d="M46,52 A6,6 0 0,1 54,52" fill="none" stroke="#5bba5b" stroke-width="1.5"/>
  <polygon points="54,52 50,48 50,56" fill="#5bba5b"/>
  <path d="M54,56 A6,6 0 0,1 46,56" fill="none" stroke="#5bba5b" stroke-width="1.5"/>
