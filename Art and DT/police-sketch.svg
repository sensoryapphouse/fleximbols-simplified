  <!-- Sketch paper -->
  <rect x="5" y="5" width="90" height="90" rx="3" fill="#f8f5e0" stroke="#333" stroke-width="2.5"/>
  <!-- Paper texture lines -->
  <line x1="5" y1="20" x2="95" y2="20" stroke="#e8e0c8" stroke-width="0.8"/>
  <line x1="5" y1="35" x2="95" y2="35" stroke="#e8e0c8" stroke-width="0.8"/>
  <line x1="5" y1="50" x2="95" y2="50" stroke="#e8e0c8" stroke-width="0.8"/>
  <line x1="5" y1="65" x2="95" y2="65" stroke="#e8e0c8" stroke-width="0.8"/>
  <line x1="5" y1="80" x2="95" y2="80" stroke="#e8e0c8" stroke-width="0.8"/>
  <!-- Sketched face - pencil style (slightly rough lines) -->
  <!-- Oval head -->
  <ellipse cx="50" cy="45" rx="28" ry="34" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="1,0"/>
  <!-- Hair (sketchy) -->
  <path d="M22 38 Q24 20 50 18 Q76 20 78 38" fill="#555" stroke="#555" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="38" rx="7" ry="5" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="38" cy="38" r="3" fill="#555"/>
  <ellipse cx="62" cy="38" rx="7" ry="5" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="62" cy="38" r="3" fill="#555"/>
  <!-- Eyebrows - thick -->
  <path d="M30 32 Q38 29 46 32" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <path d="M54 32 Q62 29 70 32" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M50 43 L46 55 Q50 58 54 55 L50 43" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mouth -->
  <path d="M38 64 Q50 70 62 64" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ear -->
  <path d="M22 42 Q16 46 18 52 Q20 58 22 55" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <path d="M78 42 Q84 46 82 52 Q80 58 78 55" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <!-- Pencil -->
