<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- chalk stick -->
  <rect x="20" y="35" width="60" height="18" rx="4" ry="4" fill="#f0f0f0" stroke="#555" stroke-width="2.5"/>
  <!-- chalk tip -->
  <polygon points="80,35 80,53 90,44" fill="#ddd" stroke="#555" stroke-width="2"/>
  <!-- chalk end flat -->
  <rect x="18" y="35" width="4" height="18" rx="1" fill="#ccc" stroke="#555" stroke-width="1.5"/>
  <!-- chalk dust marks -->
  <line x1="35" y1="60" x2="55" y2="60" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="65" x2="52" y2="65" stroke="#ccc" stroke-width="2" stroke-linecap="round"/>
  <!-- label -->
</svg>
