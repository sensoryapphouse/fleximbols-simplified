<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(-6.366 -5.861) scale(1.1498)">
<!-- Crayon body -->
  <rect x="40" y="18" width="18" height="50" rx="3" fill="#e87040" stroke="#333" stroke-width="2.5" transform="rotate(-5 49 43)"/>
  <!-- Paper wrapper (lower portion) -->
  <rect x="40" y="40" width="18" height="28" rx="0" fill="#fffbe0" stroke="#333" stroke-width="1.5" transform="rotate(-5 49 43)"/>
  <!-- Brand label on paper -->
  <line x1="41" y1="48" x2="57" y2="46" stroke="#f5c842" stroke-width="2"/>
  <line x1="41" y1="54" x2="57" y2="52" stroke="#333" stroke-width="1"/>
  <!-- Tip (wax point) -->
  <polygon points="40,68 58,68 49,80" fill="#c05020" stroke="#333" stroke-width="2" stroke-linejoin="round" transform="rotate(-5 49 43)"/>
  <!-- Label -->
</g>
  </svg>
