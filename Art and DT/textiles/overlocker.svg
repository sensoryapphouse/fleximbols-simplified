<!-- Machine body -->
  <rect x="12" y="20" width="76" height="55" rx="5" fill="#e8f0e8" stroke="#2a6a2a" stroke-width="2.5"/>
  <!-- Upper arm -->
  <rect x="12" y="20" width="76" height="20" rx="5" fill="#c8e0c8" stroke="#2a6a2a" stroke-width="2"/>
  <!-- Needle/looper area -->
  <rect x="36" y="38" width="28" height="24" rx="2" fill="#a8d0a8" stroke="#2a6a2a" stroke-width="1.5"/>
  <!-- Multiple needles (overlocker has 2-4) -->
  <rect x="44" y="42" width="2" height="15" rx="1" fill="#888" stroke="#444" stroke-width="1"/>
  <rect x="50" y="42" width="2" height="15" rx="1" fill="#888" stroke="#444" stroke-width="1"/>
  <polygon points="43,57 47,57 45,63" fill="#888" stroke="#444" stroke-width="1"/>
  <polygon points="49,57 53,57 51,63" fill="#888" stroke="#444" stroke-width="1"/>
  <!-- Knife blade indicator -->
  <rect x="56" y="42" width="4" height="14" rx="0.5" fill="#c0c0c0" stroke="#606060" stroke-width="1"/>
  <!-- Fabric feed -->
  <path d="M12,62 L88,62" stroke="#d0d0d0" stroke-width="6" stroke-linecap="round"/>
  <!-- Multiple thread spools on top -->
  <ellipse cx="28" cy="23" rx="5" ry="3" fill="#e05050" stroke="#8a1010" stroke-width="1"/>
  <ellipse cx="42" cy="23" rx="5" ry="3" fill="#5050e0" stroke="#10108a" stroke-width="1"/>
  <ellipse cx="58" cy="23" rx="5" ry="3" fill="#f0c030" stroke="#8a7010" stroke-width="1"/>
  <ellipse cx="72" cy="23" rx="5" ry="3" fill="#50c050" stroke="#1a6a1a" stroke-width="1"/>
  <!-- Thread paths -->
  <path d="M28,26 Q34,40 44,42" fill="none" stroke="#e05050" stroke-width="1" stroke-dasharray="2,1"/>
  <path d="M42,26 Q46,36 50,42" fill="none" stroke="#5050e0" stroke-width="1" stroke-dasharray="2,1"/>
</svg>
