<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Fabric piece with buttonhole -->
  <rect x="10" y="35" width="35" height="40" rx="3" fill="#c8d8f0" stroke="#336699" stroke-width="2"/>
  <!-- Buttonhole -->
<!-- Fabric piece on right side -->
  <rect x="55" y="35" width="35" height="40" rx="3" fill="#d8e8f8" stroke="#336699" stroke-width="2"/>
  <!-- Button on right fabric -->
  <circle cx="65" cy="55" r="10" fill="#ff9966" stroke="#cc4400" stroke-width="2.5"/>
  <!-- Button holes -->
  <circle cx="62" cy="52" r="2" fill="white" stroke="#cc4400" stroke-width="1.5"/>
  <circle cx="68" cy="52" r="2" fill="white" stroke="#cc4400" stroke-width="1.5"/>
  <circle cx="62" cy="58" r="2" fill="white" stroke="#cc4400" stroke-width="1.5"/>
  <circle cx="68" cy="58" r="2" fill="white" stroke="#cc4400" stroke-width="1.5"/>
  <!-- Thread across button -->
  <line x1="62" y1="52" x2="68" y2="52" stroke="#cc4400" stroke-width="1.5"/>
  <line x1="62" y1="58" x2="68" y2="58" stroke="#cc4400" stroke-width="1.5"/>
  <!-- Arrow showing buttoning -->
  <path d="M44 55 L56 55" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <polygon points="54,52 60,55 54,58" fill="#555"/>
</svg>
