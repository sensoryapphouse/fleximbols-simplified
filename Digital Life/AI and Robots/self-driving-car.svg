<!-- Car body -->
  <rect x="8" y="52" width="84" height="22" fill="#c8c8e8" stroke="#6666aa" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Car cabin -->
  <path d="M20,52 Q30,34 50,34 Q70,34 80,52" fill="#c8c8e8" stroke="#6666aa" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Windows -->
  <path d="M25,52 Q32,40 50,40 Q68,40 75,52" fill="#c8e8f8" stroke="#4a8aaa" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="50" y1="40" x2="50" y2="52" stroke="#4a8aaa" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="25" cy="74" r="10" fill="#333" stroke="#111" stroke-width="2"/>
  <circle cx="25" cy="74" r="5" fill="#888" stroke="#555" stroke-width="1.5"/>
  <circle cx="75" cy="74" r="10" fill="#333" stroke="#111" stroke-width="2"/>
  <circle cx="75" cy="74" r="5" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Sensor/camera bubble on roof -->
  <ellipse cx="50" cy="32" rx="9" ry="5" fill="#f0c040" stroke="#9a8010" stroke-width="1.5"/>
  <!-- LiDAR beams -->
  <line x1="50" y1="27" x2="45" y2="20" stroke="#e04040" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="27" x2="50" y2="19" stroke="#e04040" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="27" x2="55" y2="20" stroke="#e04040" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Camera on front -->
  <circle cx="10" cy="60" r="3" fill="#333" stroke="#111" stroke-width="1.5"/>
