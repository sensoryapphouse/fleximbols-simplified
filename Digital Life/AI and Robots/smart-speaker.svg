  <!-- Speaker grill lines (vertical) -->
  <line x1="34" y1="30" x2="34" y2="68" stroke="#888" stroke-width="1.5"/>
  <line x1="40" y1="30" x2="40" y2="68" stroke="#888" stroke-width="1.5"/>
