<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Console body -->
  <rect x="14" y="35" width="72" height="36" rx="8" fill="#b0b8cc" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Disc slot -->
  <rect x="25" y="48" width="32" height="4" rx="2" fill="#555" stroke="#444" stroke-width="1"/>
  <!-- Power button -->
  <circle cx="72" cy="50" r="5" fill="#ddd" stroke="#333" stroke-width="1.5"/>
  <!-- PS buttons (cross, circle, square, triangle) -->
  <text x="28" y="44" font-size="7" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" fill="#6060cc">X</text>
  <circle cx="36" cy="40" r="3" fill="none" stroke="#cc6060" stroke-width="1.5"/>
  <rect x="40" y="37" width="6" height="6" fill="none" stroke="#c060c0" stroke-width="1.5"/>
  <polygon points="50,37 53,43 47,43" fill="none" stroke="#60c060" stroke-width="1.5"/>
</svg>
