<!-- Ground -->
  <line x1="5" y1="72" x2="95" y2="72" stroke="#888" stroke-width="1.5"/>
  <!-- Towing vehicle (front/left) - truck shape -->
  <rect x="48" y="48" width="34" height="20" rx="3" fill="#4a90d9" stroke="#333" stroke-width="2"/>
  <rect x="68" y="42" width="14" height="10" rx="2" fill="#4a90d9" stroke="#333" stroke-width="2"/>
  <!-- Truck wheels -->
  <circle cx="55" cy="72" r="5" fill="#333" stroke="#555" stroke-width="1.5"/>
  <circle cx="75" cy="72" r="5" fill="#333" stroke="#555" stroke-width="1.5"/>
  <!-- Tow rope/chain -->
  <path d="M48,62 Q38,62 28,62" stroke="#8B6914" stroke-width="2.5" fill="none" stroke-dasharray="4,2"/>
  <!-- Towed vehicle (back/right) - car shape -->
  <rect x="10" y="50" width="28" height="18" rx="3" fill="#e07070" stroke="#333" stroke-width="2"/>
  <rect x="14" y="44" width="20" height="8" rx="2" fill="#e07070" stroke="#333" stroke-width="2"/>
  <!-- Car wheels -->
  <circle cx="17" cy="72" r="5" fill="#333" stroke="#555" stroke-width="1.5"/>
  <circle cx="33" cy="72" r="5" fill="#333" stroke="#555" stroke-width="1.5"/>
  <!-- Motion arrow -->
  <path d="M82,42 L90,42 M86,38 L90,42 L86,46" stroke="#e05c2a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
