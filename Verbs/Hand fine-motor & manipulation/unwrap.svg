<!-- Box being revealed -->
  <rect x="30" y="42" width="40" height="30" rx="3" fill="#4a90d9" stroke="#333" stroke-width="2"/>
  <!-- Torn wrapping paper pieces flying off -->
  <path d="M12,28 Q18,22 22,30 Q18,38 14,36 Z" fill="#e07070" stroke="#c05050" stroke-width="1.5"/>
  <path d="M78,25 Q84,22 86,32 Q82,38 76,34 Z" fill="#e07070" stroke="#c05050" stroke-width="1.5"/>
  <path d="M8,50 Q14,44 16,54 Q12,62 8,58 Z" fill="#e07070" stroke="#c05050" stroke-width="1.5"/>
  <path d="M84,48 Q90,44 92,54 Q88,62 82,58 Z" fill="#e07070" stroke="#c05050" stroke-width="1.5"/>
  <!-- Paper being pulled away top -->
  <path d="M30,42 Q22,32 14,30" stroke="#e07070" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M70,42 Q78,32 86,30" stroke="#e07070" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Hands pulling paper apart -->
  <ellipse cx="16" cy="30" rx="6" ry="5" fill="#f5c5a3" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="84" cy="30" rx="6" ry="5" fill="#f5c5a3" stroke="#333" stroke-width="1.5"/>
  <!-- Outward motion arrows -->
  <path d="M10,20 L5,16 M8,22 L5,16 L12,18" stroke="#e05c2a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M90,20 L95,16 M92,22 L95,16 L88,18" stroke="#e05c2a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ribbon remnant -->
  <line x1="50" y1="42" x2="50" y2="28" stroke="#f5c842" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
</svg>
