<!-- Left panel of unfolded item -->
  <rect x="10" y="28" width="34" height="48" rx="3" fill="#c8d8f0" stroke="#336699" stroke-width="2.5"/>
  <!-- Right panel swinging open -->
  <rect x="56" y="28" width="34" height="48" rx="3" fill="#d8e8f8" stroke="#336699" stroke-width="2" opacity="0.8"/>
  <!-- Fold crease in middle -->
  <line x1="44" y1="28" x2="44" y2="76" stroke="#336699" stroke-width="2.5"/>
  <line x1="56" y1="28" x2="56" y2="76" stroke="#336699" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Arrow showing unfolding direction -->
  <path d="M50 42 Q62 38 70 42" fill="none" stroke="#cc6600" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="68,38 74,43 68,48" fill="#cc6600"/>
  <!-- Lines on paper to indicate folded object -->
  <line x1="16" y1="40" x2="38" y2="40" stroke="#6699cc" stroke-width="1.5" stroke-dasharray="4,2"/>
