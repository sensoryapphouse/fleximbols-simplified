  <!-- Amplitude: sine wave with amplitude bracket (height) -->
  <!-- Axes -->
  <line x1="5" y1="50" x2="95" y2="50" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="10" x2="8" y2="90" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Sine wave -->
  <path d="M8,50 Q20,10 32,50 Q44,90 56,50 Q68,10 80,50 Q86,70 92,50"
        fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
  <!-- Amplitude arrow: centre line to crest -->
  <line x1="3" y1="50" x2="3" y2="10" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tick at centre -->
  <line x1="1" y1="50" x2="6" y2="50" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <!-- Tick at crest -->
  <line x1="1" y1="10" x2="6" y2="10" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <!-- A label -->
  <text x="7" y="33" font-size="11" fill="#e74c3c" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold" font-style="italic">A</text>
  <!-- Dashed lines to show amplitude from trough too -->
  <line x1="44" y1="50" x2="44" y2="90" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="20" y2="10" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2" stroke-linecap="round"/>
  <!-- Axis label -->
  <text x="89" y="48" font-size="9" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-style="italic">t</text>
  <text x="9" y="10" font-size="9" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-style="italic">y</text>
</svg>
