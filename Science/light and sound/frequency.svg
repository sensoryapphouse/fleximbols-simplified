  <!-- Frequency: fast vs slow waves compared -->
  <!-- Axes -->
  <line x1="8" y1="50" x2="95" y2="50" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="10" x2="8" y2="90" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- High frequency wave (top half) - many cycles, blue -->
  <path d="M8,30 Q14,15 20,30 Q26,45 32,30 Q38,15 44,30 Q50,45 56,30 Q62,15 68,30 Q74,45 80,30 Q86,15 92,30"
        fill="none" stroke="#2980b9" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Low frequency wave (bottom half) - few cycles, red -->
  <path d="M8,70 Q26,50 44,70 Q62,90 80,70 Q88,58 92,70"
        fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Labels -->
  <text x="10" y="22" font-size="9" fill="#2980b9" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">high f</text>
  <text x="10" y="85" font-size="9" fill="#e74c3c" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">low f</text>
  <!-- f label on axis -->
  <text x="88" y="48" font-size="10" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-style="italic">t</text>
  <text x="5" y="12" font-size="10" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-style="italic">f</text>
</svg>
