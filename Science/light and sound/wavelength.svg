<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Wavelength: sine wave with lambda bracket -->
  <!-- Axes -->
  <line x1="5" y1="55" x2="97" y2="55" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <defs>
    <marker id="xarr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <polygon points="0,0 5,2.5 0,5" fill="#333"/>
    </marker>
  </defs>
  <line x1="5" y1="55" x2="96" y2="55" stroke="#333" stroke-width="2" marker-end="url(#xarr)" stroke-linecap="round"/>
  <!-- Sine wave - exactly two full cycles -->
  <path d="M10,55 Q18,20 26,55 Q34,90 42,55 Q50,20 58,55 Q66,90 74,55 Q82,20 90,55"
        fill="none" stroke="#8e44ad" stroke-width="3" stroke-linecap="round"/>
  <!-- Wavelength bracket from peak to peak -->
  <line x1="18" y1="20" x2="18" y2="12" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="50" y2="12" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="13" x2="50" y2="13" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <!-- Lambda symbol in bracket -->
  <text x="29" y="11" font-size="11" fill="#e74c3c" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-style="italic">λ</text>
  <!-- Crest and trough labels -->
  <text x="14" y="19" font-size="7" fill="#8e44ad" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">crest</text>
  <text x="28" y="94" font-size="7" fill="#8e44ad" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">trough</text>
  <!-- t axis label -->
  <text x="89" y="52" font-size="10" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-style="italic">x</text>
</svg>
