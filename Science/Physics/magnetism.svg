<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Magnetism: horseshoe magnet with field lines -->
  <!-- Horseshoe magnet body -->
  <path d="M20,85 L20,35 Q20,10 50,10 Q80,10 80,35 L80,85"
        fill="none" stroke="#999" stroke-width="14" stroke-linecap="round"/>
  <!-- North pole (red) -->
  <rect x="13" y="62" width="14" height="25" rx="3" fill="#e74c3c" stroke="#333" stroke-width="2"/>
  <!-- South pole (blue) -->
  <rect x="73" y="62" width="14" height="25" rx="3" fill="#2980b9" stroke="#333" stroke-width="2"/>
  <!-- N label -->
  <text x="16" y="80" font-size="10" fill="#fff" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">N</text>
  <!-- S label -->
  <text x="77" y="80" font-size="10" fill="#fff" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">S</text>
  <!-- Magnetic field lines between poles -->
  <defs>
    <marker id="marr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <polygon points="0,0 5,2.5 0,5" fill="#f39c12"/>
    </marker>
  </defs>
  <path d="M27,75 Q50,55 73,75" fill="none" stroke="#f39c12" stroke-width="2" marker-end="url(#marr)" stroke-linecap="round"/>
  <path d="M27,80 Q50,65 73,80" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round"/>
  <path d="M27,70 Q50,45 73,70" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round"/>
</svg>
