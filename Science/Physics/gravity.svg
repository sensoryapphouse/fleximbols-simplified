<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Gravity: Earth with falling object and force arrows -->
  <defs>
    <marker id="garr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#333"/>
    </marker>
  </defs>
  <!-- Earth (bottom) -->
  <circle cx="50" cy="80" r="18" fill="#27ae60" stroke="#333" stroke-width="2.5"/>
  <!-- Earth surface details -->
  <path d="M35,72 Q40,68 45,73 Q50,78 55,73 Q60,68 65,72" fill="none" stroke="#1a7a3f" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Falling object (sphere/ball) -->
  <circle cx="50" cy="22" r="10" fill="#e74c3c" stroke="#333" stroke-width="2.5"/>
  <!-- Gravity force arrows pointing down -->
  <line x1="50" y1="32" x2="50" y2="58" stroke="#333" stroke-width="2.5" marker-end="url(#garr)" stroke-linecap="round"/>
  <!-- Side gravity arrows -->
  <line x1="28" y1="25" x2="38" y2="50" stroke="#555" stroke-width="2" marker-end="url(#garr)" stroke-linecap="round" stroke-dasharray="4,2"/>
  <line x1="72" y1="25" x2="62" y2="50" stroke="#555" stroke-width="2" marker-end="url(#garr)" stroke-linecap="round" stroke-dasharray="4,2"/>
  <!-- g label -->
  <text x="55" y="48" font-size="12" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-style="italic" font-weight="bold">g</text>
</svg>
