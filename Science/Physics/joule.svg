<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Joule: energy / work = force x distance diagram -->
  <rect x="8" y="8" width="84" height="84" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="3"/>
  <!-- Block being pushed -->
  <rect x="52" y="52" width="28" height="22" rx="3" fill="#a9cce3" stroke="#333" stroke-width="2.5"/>
  <!-- Force arrow pushing the block -->
  <defs>
    <marker id="jarr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#e74c3c"/>
    </marker>
  </defs>
  <line x1="18" y1="63" x2="50" y2="63" stroke="#e74c3c" stroke-width="3" marker-end="url(#jarr)" stroke-linecap="round"/>
  <text x="25" y="58" font-size="9" fill="#e74c3c" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">F</text>
  <!-- Distance bracket -->
  <line x1="18" y1="80" x2="80" y2="80" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="77" x2="18" y2="83" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="77" x2="80" y2="83" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <text x="43" y="78" font-size="9" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-style="italic">d</text>
  <!-- J = large label -->
  <text x="50" y="42" font-size="28" fill="#e67e22" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold" text-anchor="middle">J</text>
  <!-- Formula W = Fd -->
  <text x="50" y="22" font-size="10" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle">W = F × d</text>
  <!-- Ground line under block -->
  <line x1="10" y1="74" x2="90" y2="74" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
</svg>
