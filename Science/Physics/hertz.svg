  <text x="28" y="68" font-size="9" fill="#e74c3c" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle">T=1/f</text>
</svg>
