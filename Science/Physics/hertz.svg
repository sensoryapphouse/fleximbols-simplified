  <!-- Hertz: frequency unit, sine wave with Hz -->
  <rect x="8" y="8" width="84" height="84" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/>
  <!-- Sine wave -->
  <path d="M12,50 Q20,20 28,50 Q36,80 44,50 Q52,20 60,50 Q68,80 76,50 Q84,20 92,50"
        fill="none" stroke="#3949ab" stroke-width="3" stroke-linecap="round"/>
  <!-- Hz label -->
  <text x="50" y="88" font-size="18" fill="#3949ab" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold" text-anchor="middle">Hz</text>
  <!-- Period markers -->
  <line x1="12" y1="50" x2="12" y2="58" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="50" x2="44" y2="58" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="76" y2="58" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <!-- Period bracket -->
