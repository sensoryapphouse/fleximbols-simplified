<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Water -->
  <path d="M5 55 Q20 50 35 55 Q50 60 65 55 Q80 50 95 55 L95 85 L5 85 Z" fill="#c8e6fa"/>
  <path d="M5 55 Q20 50 35 55 Q50 60 65 55 Q80 50 95 55" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <!-- Person floating on back - horizontal -->
  <!-- Head above water -->
  <circle cx="22" cy="52" r="8" fill="#f5c89a" stroke="#333" stroke-width="2"/>
  <!-- Body horizontal at water surface -->
  <line x1="28" y1="54" x2="75" y2="54" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms spread out -->
  <line x1="40" y1="54" x2="36" y2="62" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="54" x2="56" y2="62" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs spread slightly -->
  <line x1="75" y1="54" x2="82" y2="58" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="54" x2="82" y2="50" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Calm ripples -->
  <path d="M10 68 Q25 65 40 68" fill="none" stroke="#4a90d9" stroke-width="1" opacity="0.6"/>
  <path d="M55 68 Q70 65 85 68" fill="none" stroke="#4a90d9" stroke-width="1" opacity="0.6"/>
</svg>