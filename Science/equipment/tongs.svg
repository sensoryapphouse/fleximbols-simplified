<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Tongs: two arms joined at pivot, scalloped grips -->
  <!-- pivot ring -->
  <circle cx="50" cy="28" r="6" fill="none" stroke="#333" stroke-width="3"/>
  <!-- left arm -->
  <path d="M46 28 L25 75 Q20 85 28 88 Q35 90 38 80 L50 34" fill="#b0b0b0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- right arm -->
  <path d="M54 28 L75 75 Q80 85 72 88 Q65 90 62 80 L50 34" fill="#b0b0b0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- grip texture left -->
  <path d="M26 72 Q22 78 26 84" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- grip texture right -->
  <path d="M74 72 Q78 78 74 84" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- spring band at top -->
  <path d="M40 22 Q50 15 60 22" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round"/>
</svg>