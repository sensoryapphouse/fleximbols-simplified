<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="10" ry="10" fill="white" stroke="#222" stroke-width="3"/>
  <!-- Ring at apex (open circle) -->
  <circle cx="50" cy="28" r="12" fill="none" stroke="#222" stroke-width="3"/>
  <!-- Three legs splaying outward from central ring to base -->
  <!-- Left leg -->
  <line x1="40" y1="36" x2="16" y2="88" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="60" y1="36" x2="84" y2="88" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Centre-back leg -->
  <line x1="50" y1="40" x2="50" y2="88" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Small feet at base -->
  <circle cx="16" cy="88" r="3" fill="#222"/>
  <circle cx="84" cy="88" r="3" fill="#222"/>
  <circle cx="50" cy="88" r="3" fill="#222"/>
</svg>
