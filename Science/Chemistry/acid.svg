<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Acid: beaker with bubbling liquid, pH < 7 shown -->
  <!-- Beaker shape -->
  <path d="M20,15 L20,72 Q20,82 30,82 L70,82 Q80,82 80,72 L80,15 Z"
        fill="#fde8d8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Beaker top rim -->
  <rect x="15" y="10" width="70" height="8" rx="3" fill="#ccc" stroke="#333" stroke-width="2.5"/>
  <!-- Acid liquid (red/orange tint) -->
  <path d="M20,45 L80,45 L80,72 Q80,82 70,82 L30,82 Q20,82 20,72 Z"
        fill="#e74c3c" opacity="0.5"/>
  <!-- Bubbles in acid -->
  <circle cx="35" cy="62" r="4" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="50" cy="55" r="5" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="65" cy="65" r="3" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="40" cy="72" r="3" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- pH scale indicator -->
  <!-- Low pH marker on left -->
  <rect x="22" y="10" width="12" height="5" rx="1" fill="#e74c3c"/>
  <!-- Spout/pour lines -->
  <path d="M25,10 Q22,5 28,3" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <path d="M30,10 Q27,4 33,2" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <!-- H+ ions coming off top -->
  <circle cx="45" cy="5" r="4" fill="#f39c12" stroke="#333" stroke-width="1.5"/>
  <circle cx="60" cy="8" r="3" fill="#f39c12" stroke="#333" stroke-width="1.5"/>
</svg>
