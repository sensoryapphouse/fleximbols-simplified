  <!-- Alkaline: beaker with blue liquid, OH- ions -->
  <!-- Beaker shape -->
  <path d="M20,15 L20,72 Q20,82 30,82 L70,82 Q80,82 80,72 L80,15 Z"
        fill="#dce8fd" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Beaker top rim -->
  <rect x="15" y="10" width="70" height="8" rx="3" fill="#ccc" stroke="#333" stroke-width="2.5"/>
  <!-- Alkaline liquid (blue tint) -->
  <path d="M20,45 L80,45 L80,72 Q80,82 70,82 L30,82 Q20,82 20,72 Z"
        fill="#2980b9" opacity="0.45"/>
  <!-- OH- ion bubbles -->
  <circle cx="35" cy="62" r="4" fill="none" stroke="#1a5276" stroke-width="2"/>
  <circle cx="50" cy="55" r="5" fill="none" stroke="#1a5276" stroke-width="2"/>
  <circle cx="65" cy="65" r="3" fill="none" stroke="#1a5276" stroke-width="2"/>
  <!-- High pH indicator -->
  <rect x="66" y="10" width="12" height="5" rx="1" fill="#2980b9"/>
  <!-- OH- ions floating above -->
  <circle cx="42" cy="5" r="4" fill="#27ae60" stroke="#333" stroke-width="1.5"/>
  <circle cx="58" cy="7" r="3.5" fill="#27ae60" stroke="#333" stroke-width="1.5"/>
  <!-- Rising streams -->
  <path d="M38" y1="10" x2="42" y2="5" fill="none"/>
  <path d="M42,10 Q40,7 42,5" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M58,10 Q56,8 58,7" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-linecap="round"/>
</svg>
