<!-- Sky -->
  <rect x="0" y="0" width="100" height="65" fill="#ffeecc"/>
  <!-- Ground -->
  <rect x="0" y="65" width="100" height="35" fill="#c8b06a"/>
  <!-- Horizon -->
  <line x1="0" y1="65" x2="100" y2="65" stroke="#8B7355" stroke-width="2.5"/>
  <!-- Sun high in sky (summer solstice) -->
  <circle cx="50" cy="25" r="16" fill="#ffdd22" stroke="#cc8800" stroke-width="2.5"/>
  <!-- Many rays (long summer day) -->
  <line x1="50" y1="4" x2="50" y2="0" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="69" y1="10" x2="73" y2="6" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="81" y1="25" x2="87" y2="25" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="69" y1="40" x2="73" y2="44" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="31" y1="10" x2="27" y2="6" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="19" y1="25" x2="13" y2="25" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="31" y1="40" x2="27" y2="44" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Long day / short night label -->
  <rect x="5" y="70" width="55" height="12" rx="3" fill="#ffeeaa" stroke="#cc8800" stroke-width="1.5"/>
  <text x="32" y="80" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#cc8800">LONGEST DAY</text>
  <rect x="64" y="70" width="32" height="12" rx="3" fill="#334488" stroke="#112266" stroke-width="1.5"/>
  <text x="80" y="80" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="7" text-anchor="middle" fill="white">21 Jun</text>
</svg>
