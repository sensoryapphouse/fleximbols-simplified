<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Voltage: battery symbol + V letter on circuit background -->
  <!-- Battery long line (positive) -->
  <line x1="50" y1="20" x2="50" y2="42" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Battery short line (negative) -->
  <line x1="42" y1="50" x2="58" y2="50" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Multiple cells -->
  <line x1="38" y1="58" x2="62" y2="58" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="66" x2="58" y2="66" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Circuit wire from top -->
  <line x1="50" y1="20" x2="50" y2="10" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="10" x2="80" y2="10" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="10" x2="80" y2="90" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Circuit wire from bottom -->
  <line x1="50" y1="66" x2="50" y2="90" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="90" x2="80" y2="90" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Voltmeter circle on right -->
  <circle cx="80" cy="50" r="16" fill="#fffde7" stroke="#333" stroke-width="2.5"/>
  <!-- V symbol inside voltmeter -->
  <text x="73" y="55" font-size="14" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">V</text>
  <!-- Plus/minus labels -->
  <text x="53" y="38" font-size="10" fill="#e74c3c" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">+</text>
  <text x="53" y="72" font-size="10" fill="#2980b9" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">-</text>
  <!-- Left side wire connection -->
  <line x1="10" y1="10" x2="50" y2="10" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="10" y2="90" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="90" x2="50" y2="90" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
</svg>
