<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Resistance: resistor symbol with R label -->
  <!-- Wire in from left -->
  <line x1="5" y1="50" x2="22" y2="50" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Wire out to right -->
  <line x1="78" y1="50" x2="95" y2="50" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Resistor rectangle (IEC style) -->
  <rect x="22" y="37" width="56" height="26" rx="3" fill="#ffe0a0" stroke="#333" stroke-width="2.5"/>
  <!-- R label inside -->
  <text x="40" y="56" font-size="20" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">R</text>
  <!-- Ohm symbol below -->
  <text x="38" y="80" font-size="18" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">Ω</text>
  <!-- Current arrows (I) -->
  <defs>
    <marker id="rarr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#e74c3c"/>
    </marker>
  </defs>
  <line x1="5" y1="42" x2="20" y2="42" stroke="#e74c3c" stroke-width="2" marker-end="url(#rarr)" stroke-linecap="round"/>
  <!-- Heat dissipation wiggles above -->
  <path d="M35,37 Q37,28 40,37 Q43,28 46,37" fill="none" stroke="#e67e22" stroke-width="2" stroke-linecap="round"/>
  <path d="M52,37 Q54,28 57,37 Q60,28 63,37" fill="none" stroke="#e67e22" stroke-width="2" stroke-linecap="round"/>
  <!-- V label above resistor (voltage drop) -->
  <text x="44" y="25" font-size="11" fill="#2980b9" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-style="italic">V</text>
  <!-- Plus minus bracket -->
  <line x1="22" y1="25" x2="78" y2="25" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="20" y="22" font-size="9" fill="#2980b9" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">+</text>
  <text x="76" y="22" font-size="9" fill="#2980b9" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">-</text>
</svg>
