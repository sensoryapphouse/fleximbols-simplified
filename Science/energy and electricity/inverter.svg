<!-- Inverter box -->
  <rect x="8" y="22" width="84" height="52" rx="5" fill="#d8d0c8" stroke="#4a4030" stroke-width="2.5"/>
  <!-- Label -->
  
  <!-- DC input left -->
  <rect x="8" y="38" width="14" height="20" rx="2" fill="#e05050" stroke="#8a1010" stroke-width="2"/>
  
  
  <!-- AC output right -->
  <rect x="78" y="38" width="14" height="20" rx="2" fill="#5080d0" stroke="#1a3a8a" stroke-width="2"/>
  
  
  <!-- DC wave (flat) -->
