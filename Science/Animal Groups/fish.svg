<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- simple fish shape -->
  <!-- tail fin -->
  <path d="M76 40 L90 28 L90 62 Z" fill="#78909C" stroke="#37474F" stroke-width="2"/>
  <!-- body -->
  <ellipse cx="48" cy="50" rx="32" ry="20" fill="#90A4AE" stroke="#37474F" stroke-width="2.5"/>
  <!-- scales -->
  <path d="M36 44 C40 40 46 42 44 48" fill="none" stroke="#546E7A" stroke-width="1.5"/>
  <path d="M48 40 C52 36 58 38 56 44" fill="none" stroke="#546E7A" stroke-width="1.5"/>
  <path d="M36 52 C40 48 46 50 44 56" fill="none" stroke="#546E7A" stroke-width="1.5"/>
  <path d="M48 50 C52 46 58 48 56 54" fill="none" stroke="#546E7A" stroke-width="1.5"/>
  <!-- eye -->
  <circle cx="22" cy="47" r="4" fill="white" stroke="#37474F" stroke-width="2"/>
  <circle cx="22" cy="47" r="2" fill="#212121"/>
  <!-- mouth -->
  <path d="M12 50 C14 53 18 54 20 52" stroke="#37474F" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- dorsal fin -->
  <path d="M38 30 C44 22 56 22 62 30" fill="#78909C" stroke="#37474F" stroke-width="2"/>
  <!-- belly fin -->
  <path d="M44 70 C48 76 54 76 58 70" fill="#78909C" stroke="#37474F" stroke-width="2"/>
</svg>
