<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Background objects hidden behind opaque block -->
  <!-- Hidden objects (draw them first, then cover with opaque) -->
  <!-- Opaque solid block covering everything -->
  <rect x="20" y="28" width="60" height="44" rx="4" fill="#555" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- "Nothing visible through" indicator - solid with no see-through -->
  <!-- Question marks on the side to suggest hidden objects behind -->
  <text x="12" y="52" font-size="12" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="#aaa">?</text>
  <text x="88" y="52" font-size="12" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" text-anchor="middle" fill="#aaa">?</text>
  <!-- Eye with slash over it (cannot see through) -->
  <ellipse cx="50" cy="50" rx="12" ry="7" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="50" cy="50" r="3" fill="#e0e0e0"/>
  <line x1="40" y1="42" x2="60" y2="58" stroke="#e06060" stroke-width="2" stroke-linecap="round"/>
</svg>