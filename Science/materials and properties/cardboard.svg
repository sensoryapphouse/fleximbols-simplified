<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- cardboard box (open flaps) -->
  <!-- left flap open -->
  <path d="M18,45 L18,28 L38,35 L38,52Z" fill="#c8a060" stroke="#8b5e3c" stroke-width="2" transform="rotate(-15,28,40)"/>
  <!-- right flap open -->
  <path d="M62,35 L82,28 L82,45 L62,52Z" fill="#c8a060" stroke="#8b5e3c" stroke-width="2" transform="rotate(15,72,40)"/>
  <!-- box body -->
  <rect x="18" y="45" width="64" height="32" rx="2" fill="#d4b080" stroke="#8b5e3c" stroke-width="2.5"/>
  <!-- front crease -->
  <line x1="50" y1="45" x2="50" y2="77" stroke="#8b5e3c" stroke-width="1.5"/>
  <!-- bottom fold line -->
  <line x1="18" y1="58" x2="82" y2="58" stroke="#8b5e3c" stroke-width="1.5"/>
  <!-- corrugated pattern on side face -->
  <path d="M82,45 L90,40 L90,72 L82,77Z" fill="#b8904a" stroke="#8b5e3c" stroke-width="2"/>
  <!-- wavy corrugation -->
  <path d="M84,48 Q86,51 84,54 Q86,57 84,60 Q86,63 84,66 Q86,69 84,72" stroke="#8b5e3c" stroke-width="1" fill="none"/>
  <!-- handle holes -->
  <ellipse cx="38" cy="60" rx="8" ry="4" fill="none" stroke="#8b5e3c" stroke-width="2"/>
  <ellipse cx="62" cy="60" rx="8" ry="4" fill="none" stroke="#8b5e3c" stroke-width="2"/>
</svg>
