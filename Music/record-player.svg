<!-- Record player / turntable -->
  <!-- Cabinet base -->
  <rect x="8" y="30" width="84" height="52" rx="4" fill="#8B6040" stroke="#333" stroke-width="2.5"/>
  <!-- Turntable platter -->
  <circle cx="42" cy="56" r="26" fill="#222" stroke="#444" stroke-width="2"/>
  <!-- Record grooves -->
  <circle cx="42" cy="56" r="22" fill="none" stroke="#444" stroke-width="0.8"/>
  <circle cx="42" cy="56" r="18" fill="none" stroke="#444" stroke-width="0.8"/>
  <circle cx="42" cy="56" r="14" fill="none" stroke="#444" stroke-width="0.8"/>
  <!-- Label in centre -->
  <circle cx="42" cy="56" r="9" fill="#c44" stroke="#333" stroke-width="1.5"/>
  <!-- Centre spindle -->
  <circle cx="42" cy="56" r="2" fill="#888" stroke="#333" stroke-width="1"/>
  <!-- Tonearm pivot post -->
  <circle cx="76" cy="38" r="4" fill="#888" stroke="#333" stroke-width="1.5"/>
  <!-- Tonearm -->
  <line x1="76" y1="38" x2="58" y2="50" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Headshell and cartridge -->
  <rect x="52" y="49" width="8" height="4" rx="1" fill="#bbb" stroke="#333" stroke-width="1.5"/>
  <!-- Stylus needle -->
  <line x1="56" y1="53" x2="57" y2="60" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Speed selector button -->
  <circle cx="78" cy="55" r="4" fill="#555" stroke="#333" stroke-width="1.5"/>
</svg>
