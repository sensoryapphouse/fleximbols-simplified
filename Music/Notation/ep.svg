  <!-- EP: small vinyl record (7-inch) with EP label -->
  <!-- Record disc -->
  <circle cx="50" cy="52" r="38" fill="#333" stroke="#222" stroke-width="2.5"/>
  <!-- Grooves -->
  <circle cx="50" cy="52" r="33" fill="none" stroke="#555" stroke-width="0.8"/>
  <circle cx="50" cy="52" r="27" fill="none" stroke="#555" stroke-width="0.8"/>
  <circle cx="50" cy="52" r="21" fill="none" stroke="#555" stroke-width="0.8"/>
  <!-- Large centre label (EP has bigger label) -->
  <circle cx="50" cy="52" r="16" fill="#f0c040" stroke="#333" stroke-width="2"/>
  <!-- Centre hole -->
  <circle cx="50" cy="52" r="7" fill="#333" stroke="#222" stroke-width="1.5"/>
  <!-- EP text blocks -->
  <rect x="38" y="47" width="8" height="2" rx="0.5" fill="#333"/>
  <rect x="38" y="51" width="6" height="2" rx="0.5" fill="#333"/>
  <rect x="38" y="55" width="8" height="2" rx="0.5" fill="#333"/>
  <rect x="49" y="46" width="2" height="11" rx="0.5" fill="#333"/>
  <rect x="49" y="46" width="7" height="2" rx="0.5" fill="#333"/>
  <rect x="49" y="51" width="6" height="2" rx="0.5" fill="#333"/>
  <!-- Sleeve corner -->
  <rect x="5" y="5" width="40" height="40" rx="3" fill="#5ba85a" stroke="#333" stroke-width="2"/>
  <rect x="9" y="9" width="32" height="32" rx="2" fill="#4a9848" stroke="#333" stroke-width="1"/>
</svg>
