<!-- rhythmic waveform / beat bars -->
  <!-- baseline -->
  <line x1="8" y1="55" x2="92" y2="55" stroke="#bdbdbd" stroke-width="1.5"/>
  <!-- beat bars of varying height -->
  <!-- beat 1 - strong -->
  <rect x="12" y="25" width="8" height="30" rx="2" fill="#f57f17" stroke="#e65100" stroke-width="1.5"/>
  <!-- beat 2 - weak -->
  <rect x="26" y="40" width="8" height="15" rx="2" fill="#ff9800" stroke="#e65100" stroke-width="1.5"/>
  <!-- beat 3 - medium -->
  <rect x="40" y="32" width="8" height="23" rx="2" fill="#f57f17" stroke="#e65100" stroke-width="1.5"/>
  <!-- beat 4 - weak -->
  <rect x="54" y="44" width="8" height="11" rx="2" fill="#ff9800" stroke="#e65100" stroke-width="1.5"/>
  <!-- beat 5 - strong -->
  <rect x="68" y="22" width="8" height="33" rx="2" fill="#f57f17" stroke="#e65100" stroke-width="1.5"/>
  <!-- beat 6 - medium -->
  <rect x="82" y="38" width="8" height="17" rx="2" fill="#ff9800" stroke="#e65100" stroke-width="1.5"/>
  <!-- below baseline mirror (shadow) -->
  <rect x="12" y="55" width="8" height="8" rx="2" fill="#ffcc80" stroke="#e65100" stroke-width="1" opacity="0.5"/>
  <rect x="40" y="55" width="8" height="6" rx="2" fill="#ffcc80" stroke="#e65100" stroke-width="1" opacity="0.5"/>
  <rect x="68" y="55" width="8" height="9" rx="2" fill="#ffcc80" stroke="#e65100" stroke-width="1" opacity="0.5"/>
  <!-- dotted beat line indicators -->
  <line x1="16" y1="70" x2="16" y2="80" stroke="#f57f17" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="30" y1="70" x2="30" y2="76" stroke="#ff9800" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="44" y1="70" x2="44" y2="78" stroke="#f57f17" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="58" y1="70" x2="58" y2="75" stroke="#ff9800" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="72" y1="70" x2="72" y2="80" stroke="#f57f17" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="86" y1="70" x2="86" y2="76" stroke="#ff9800" stroke-width="2" stroke-dasharray="3,2"/>
</svg>
