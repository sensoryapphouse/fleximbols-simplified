<!-- cello - large bowed string, shown vertically with endpin -->
  <!-- upper bout -->
  <ellipse cx="50" cy="28" rx="16" ry="14" fill="#a0785a" stroke="#5d4037" stroke-width="2.5"/>
  <!-- lower bout (large) -->
  <ellipse cx="50" cy="64" rx="22" ry="18" fill="#a0785a" stroke="#5d4037" stroke-width="2.5"/>
  <!-- waist -->
  <rect x="36" y="35" width="28" height="22" fill="#a0785a" stroke="none"/>
  <path d="M36,35 Q28,46 36,57" fill="none" stroke="#5d4037" stroke-width="2.5"/>
  <path d="M64,35 Q72,46 64,57" fill="none" stroke="#5d4037" stroke-width="2.5"/>
  <!-- f-holes -->
  <path d="M41,46 Q39,51 41,56" fill="none" stroke="#3e2723" stroke-width="2" stroke-linecap="round"/>
  <path d="M59,46 Q61,51 59,56" fill="none" stroke="#3e2723" stroke-width="2" stroke-linecap="round"/>
  <circle cx="41" cy="45" r="1.5" fill="#3e2723"/>
  <circle cx="41" cy="57" r="1.5" fill="#3e2723"/>
  <circle cx="59" cy="45" r="1.5" fill="#3e2723"/>
  <circle cx="59" cy="57" r="1.5" fill="#3e2723"/>
  <!-- bridge -->
  <rect x="45" y="55" width="10" height="5" rx="0" fill="#a0785a" stroke="#5d4037" stroke-width="1.5"/>
  <!-- tailpiece -->
  <path d="M43,76 L57,76 L55,82 L45,82 Z" fill="#5d4037" stroke="#3e2723" stroke-width="1.5"/>
  <!-- endpin -->
  <line x1="50" y1="82" x2="50" y2="92" stroke="#9e9e9e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="92" r="2" fill="#9e9e9e"/>
  <!-- neck (short for cello) -->
  <rect x="47" y="6" width="6" height="24" rx="2" fill="#8d6e63" stroke="#5d4037" stroke-width="1.5"/>
  <!-- scroll -->
  <path d="M46,6 Q44,2 48,1 Q52,2 54,6" fill="#795548" stroke="#5d4037" stroke-width="1.5"/>
  <!-- pegs -->
  <line x1="44" y1="8" x2="56" y2="8" stroke="#c0a080" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="13" x2="56" y2="13" stroke="#c0a080" stroke-width="2" stroke-linecap="round"/>
  <!-- strings -->
  <line x1="48" y1="3" x2="46" y2="82" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="49" y1="3" x2="48" y2="82" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="51" y1="3" x2="52" y2="82" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="52" y1="3" x2="54" y2="82" stroke="#9e9e9e" stroke-width="1"/>
  <!-- bow beside cello -->
  <line x1="78" y1="10" x2="78" y2="84" stroke="#8d6e63" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M81,10 Q87,47 81,84" fill="none" stroke="#c0a080" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="76" y="9" width="5" height="5" rx="1" fill="#5d4037"/>
  <rect x="76" y="82" width="5" height="5" rx="1" fill="#5d4037"/>
</svg>
