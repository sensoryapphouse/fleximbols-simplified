<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Envelope body -->
  <rect x="12" y="26" width="76" height="50" rx="3" fill="#F5F5E8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Flap (closed V) -->
  <path d="M12,26 L50,52 L88,26" fill="none" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bottom fold lines -->
  <line x1="12" y1="76" x2="38" y2="52" stroke="#DDD8C8" stroke-width="2"/>
  <line x1="88" y1="76" x2="62" y2="52" stroke="#DDD8C8" stroke-width="2"/>
  <!-- Seal dot -->
  <circle cx="50" cy="52" r="5" fill="#C8503C" stroke="#333" stroke-width="1.5"/>
</svg>
