<!-- Envelope body -->
  <rect x="10" y="28" width="80" height="52" rx="3" fill="#faf0f0" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Envelope flap (open/closed showing heart) -->
  <path d="M10,28 L50,52 L90,28 Z" fill="#ffcccb" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <!-- Envelope diagonal fold lines -->
  <line x1="10" y1="80" x2="42" y2="52" stroke="#ddd" stroke-width="1.5"/>
  <line x1="90" y1="80" x2="58" y2="52" stroke="#ddd" stroke-width="1.5"/>
  <!-- Heart seal on flap -->
  <path d="M50,38 C50,38 42,32 42,26 C42,21 46,18 50,22 C54,18 58,21 58,26 C58,32 50,38 50,38 Z" fill="#e05c2c" stroke="#aa2200" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lines simulating letter content visible through envelope -->
  <line x1="24" y1="64" x2="60" y2="64" stroke="#ccc" stroke-width="1"/>
  <line x1="24" y1="70" x2="54" y2="70" stroke="#ccc" stroke-width="1"/>
</svg>
