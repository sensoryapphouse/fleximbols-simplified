<!-- Figure lifting heavy weight -->
  <!-- Head -->
  <circle cx="50" cy="14" r="9" fill="#FDDCB5" stroke="#333" stroke-width="2.5"/>
  <!-- Body slightly bent (effort) -->
  <line x1="50" y1="23" x2="50" y2="48" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legs spread (lifting stance) -->
  <line x1="50" y1="48" x2="35" y2="72" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="48" x2="65" y2="72" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms raised holding bar -->
  <line x1="50" y1="32" x2="28" y2="44" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="72" y2="44" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Barbell bar -->
  <line x1="18" y1="46" x2="82" y2="46" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <!-- Weight discs -->
  <ellipse cx="18" cy="46" rx="5" ry="13" fill="#BDC3C7" stroke="#333" stroke-width="2.5"/>
  <ellipse cx="82" cy="46" rx="5" ry="13" fill="#BDC3C7" stroke="#333" stroke-width="2.5"/>
  <!-- Effort marks (stars/lines) -->
  <line x1="14" y1="28" x2="18" y2="34" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="24" x2="22" y2="30" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="28" x2="82" y2="34" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="24" x2="78" y2="30" stroke="#E67E22" stroke-width="2" stroke-linecap="round"/>
</svg>
