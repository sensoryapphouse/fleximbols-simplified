<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Large single eye, centered -->
  <!-- Eye whites (almond shape) -->
  <path d="M10 47 Q30 28 50 26 Q70 28 90 47 Q70 66 50 68 Q30 66 10 47 Z" fill="white" stroke="#222" stroke-width="2.5"/>
  <!-- Iris -->
  <circle cx="50" cy="47" rx="16" ry="16" fill="#3e8a5a"/>
  <!-- Pupil -->
  <circle cx="50" cy="47" r="10" fill="#111"/>
  <!-- Eye shine -->
  <circle cx="42" cy="40" r="5" fill="white" opacity="0.75"/>
  <circle cx="56" cy="42" r="2.5" fill="white" opacity="0.5"/>
  <!-- Upper eyelid line -->
  <path d="M10 47 Q30 30 50 28 Q70 30 90 47" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- Lashes -->
  <line x1="26" y1="38" x2="22" y2="30" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="33" x2="34" y2="24" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="30" x2="50" y2="20" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="33" x2="66" y2="24" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="74" y1="38" x2="78" y2="30" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arrow pointing to eye -->
  <line x1="10" y1="80" x2="30" y2="64" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <polyline points="20,64 30,64 30,74" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
