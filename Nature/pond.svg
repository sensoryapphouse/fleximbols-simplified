<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- land surround -->
  <rect x="5" y="5" width="90" height="90" rx="4" fill="#5a9e3a" stroke="#2d5a1b" stroke-width="2"/>
  <!-- small pond -->
  <ellipse cx="50" cy="55" rx="26" ry="18" fill="#4090d0" stroke="#2060a0" stroke-width="2.5"/>
  <!-- lily pads -->
  <circle cx="38" cy="52" r="6" fill="#4a8a2a" stroke="#2d5a1b" stroke-width="1.5"/>
  <circle cx="62" cy="58" r="5" fill="#5a9e3a" stroke="#2d5a1b" stroke-width="1.5"/>
  <circle cx="48" cy="62" r="4" fill="#4a8a2a" stroke="#2d5a1b" stroke-width="1.5"/>
  <!-- small flower on lily pad -->
  <circle cx="38" cy="52" r="2" fill="#e07880" stroke="#c05060" stroke-width="1"/>
  <!-- ripple -->
  <ellipse cx="60" cy="46" rx="6" ry="3" fill="none" stroke="#2060a0" stroke-width="1.5"/>
</svg>