<!-- launch structure -->
  <line x1="18" y1="30" x2="18" y2="75" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="30" x2="82" y2="75" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="75" x2="82" y2="75" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="45" x2="35" y2="45" stroke="#888" stroke-width="2"/>
  <line x1="82" y1="45" x2="65" y2="45" stroke="#888" stroke-width="2"/>
  <!-- rocket body -->
  <rect x="40" y="22" width="20" height="45" rx="2" fill="#e8e8f0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- nose cone -->
  <polygon points="50,8 40,22 60,22" fill="#c83030" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- fins -->
  <polygon points="40,55 32,68 40,67" fill="#c8a050" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="60,55 68,68 60,67" fill="#c8a050" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- exhaust flames -->
