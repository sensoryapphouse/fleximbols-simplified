  <circle cx="50" cy="50" r="5" fill="#F9E04B" stroke="none"/>
  <!-- Pin -->
  <line x1="30" y1="70" x2="70" y2="72" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="68" cy="72" r="3" fill="#A0A0A0" stroke="#606060" stroke-width="1.5"/>
