<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Brooch flower petals -->
  <ellipse cx="50" cy="32" rx="8" ry="14" fill="#E8A0C0" stroke="#B06080" stroke-width="2"/>
  <ellipse cx="50" cy="68" rx="8" ry="14" fill="#E8A0C0" stroke="#B06080" stroke-width="2"/>
  <ellipse cx="32" cy="50" rx="14" ry="8" fill="#E8A0C0" stroke="#B06080" stroke-width="2"/>
  <ellipse cx="68" cy="50" rx="14" ry="8" fill="#E8A0C0" stroke="#B06080" stroke-width="2"/>
  <!-- Diagonal petals -->
  <ellipse cx="38" cy="38" rx="8" ry="14" fill="#F0B8D0" stroke="#B06080" stroke-width="2" transform="rotate(-45 38 38)"/>
  <ellipse cx="62" cy="38" rx="8" ry="14" fill="#F0B8D0" stroke="#B06080" stroke-width="2" transform="rotate(45 62 38)"/>
  <ellipse cx="38" cy="62" rx="8" ry="14" fill="#F0B8D0" stroke="#B06080" stroke-width="2" transform="rotate(45 38 62)"/>
  <ellipse cx="62" cy="62" rx="8" ry="14" fill="#F0B8D0" stroke="#B06080" stroke-width="2" transform="rotate(-45 62 62)"/>
