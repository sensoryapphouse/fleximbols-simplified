  <path d="M22,18 L22,58 Q22,62 26,62 L74,62 Q78,62 80,58 L88,30 Q90,22 82,22 Z" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round"/>
