  <line x1="58" y1="22" x2="55" y2="62" stroke="#90caf9" stroke-width="1.5"/>
  <!-- Items in cart -->
  <rect x="30" y="30" width="12" height="14" rx="2" fill="#f9a825" stroke="#f57f17" stroke-width="1.5"/>
  <rect x="46" y="28" width="12" height="16" rx="2" fill="#ef9a9a" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="62" y="32" width="10" height="12" rx="2" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="34" cy="72" r="7" fill="#555" stroke="#333" stroke-width="2"/>
  <circle cx="34" cy="72" r="3" fill="#ccc"/>
  <circle cx="70" cy="72" r="7" fill="#555" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="72" r="3" fill="#ccc"/>
</svg>
