<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Board frame -->
  <rect x="8" y="12" width="84" height="60" rx="3" fill="#2d4a2d" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Board surface -->
  <rect x="12" y="16" width="76" height="52" rx="1" fill="#3a5a3a" stroke="#2a4a2a" stroke-width="1"/>
  <!-- Chalk writing -->
  <path d="M20 35 Q30 28 40 35 Q50 42 60 35" stroke="#e8e8d0" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="20" y1="48" x2="55" y2="48" stroke="#d0e8d0" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="54" x2="45" y2="54" stroke="#d0e8d0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Chalk tray -->
  <rect x="8" y="72" width="84" height="6" rx="2" fill="#8a7a60" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Chalk stick -->
  <rect x="18" y="73" width="12" height="4" rx="2" fill="#e8e0c8" stroke="#aaa" stroke-width="1"/>
  <!-- Stand legs -->
  <line x1="20" y1="78" x2="15" y2="88" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="78" x2="85" y2="88" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
</svg>
