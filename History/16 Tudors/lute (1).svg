  <circle cx="47" cy="16" r="2" fill="#5a3a10"/>
  <circle cx="53" cy="16" r="2" fill="#5a3a10"/>
  <!-- Sound hole -->
  <circle cx="50" cy="63" r="6" fill="none" stroke="#5a3a10" stroke-width="1.5"/>
  <!-- Strings -->
  <line x1="48" y1="30" x2="48" y2="80" stroke="#888" stroke-width="0.8"/>
  <line x1="50" y1="30" x2="50" y2="82" stroke="#888" stroke-width="0.8"/>
