<!-- Lute body: pear shape -->
  <ellipse cx="50" cy="65" rx="22" ry="26" fill="#c8a464" stroke="#5a3a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lute neck -->
  <rect x="46" y="30" width="8" height="28" rx="3" fill="#a07840" stroke="#5a3a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- Peg box angled -->
  <path d="M46,30 Q44,18 48,12 Q52,18 54,30 Z" fill="#a07840" stroke="#5a3a10" stroke-width="2" stroke-linejoin="round"/>
