<!-- Obelisk / statue plinth -->
  <rect x="30" y="70" width="40" height="10" rx="2" fill="#aaa" stroke="#555" stroke-width="2.5"/>
  <!-- Obelisk column -->
  <polygon points="34,70 40,22 60,22 66,70" fill="#dde8f5" stroke="#555" stroke-width="2.5"/>
  <!-- Obelisk tip -->
  <polygon points="40,22 50,10 60,22" fill="#ccc" stroke="#555" stroke-width="2"/>
  <!-- Hieroglyph-style lines on obelisk -->
  <line x1="41" y1="35" x2="59" y2="35" stroke="#aaa" stroke-width="1.5"/>
  <line x1="42" y1="45" x2="58" y2="45" stroke="#aaa" stroke-width="1.5"/>
  <line x1="43" y1="55" x2="57" y2="55" stroke="#aaa" stroke-width="1.5"/>
  <line x1="44" y1="65" x2="56" y2="65" stroke="#aaa" stroke-width="1.5"/>
  <!-- Steps at base -->
  <rect x="26" y="78" width="48" height="4" rx="1" fill="#888" stroke="#555" stroke-width="2"/>
  <rect x="20" y="82" width="60" height="4" rx="1" fill="#888" stroke="#555" stroke-width="2"/>
  <!-- Gold pyramid tip gleam -->
  <polygon points="48,10 50,6 52,10" fill="#e8c44a" stroke="#c8a020" stroke-width="1"/>
  <!-- Ground -->
  <line x1="10" y1="86" x2="90" y2="86" stroke="#8a5a2a" stroke-width="2"/>
</svg>
