<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Sky - dramatic with clouds -->
  <rect x="0" y="0" width="100" height="55" fill="#87ceeb"/>
  <ellipse cx="20" cy="12" rx="16" ry="8" fill="#fff" opacity="0.9"/>
  <ellipse cx="75" cy="18" rx="18" ry="7" fill="#fff" opacity="0.9"/>
  <!-- Salisbury Plain grass -->
  <path d="M0,55 Q25,50 50,53 Q75,56 100,51 L100,100 L0,100 Z" fill="#6aaa6a"/>
  <!-- Outer ring stones (trilithons) - standing stones with lintels -->
  <!-- Stone group 1 (left outer) -->
  <rect x="5" y="40" width="7" height="20" rx="1" fill="#9a9a9a" stroke="#555" stroke-width="1.5"/>
  <rect x="15" y="38" width="7" height="22" rx="1" fill="#888" stroke="#555" stroke-width="1.5"/>
  <rect x="4" y="37" width="20" height="5" rx="1" fill="#aaa" stroke="#555" stroke-width="1.5"/>
  <!-- Stone group 2 (center-left) -->
  <rect x="26" y="35" width="7" height="26" rx="1" fill="#9a9a9a" stroke="#555" stroke-width="2"/>
  <rect x="36" y="33" width="7" height="28" rx="1" fill="#888" stroke="#555" stroke-width="2"/>
  <rect x="24" y="30" width="22" height="6" rx="1" fill="#b0b0b0" stroke="#555" stroke-width="2"/>
  <!-- Center trilithon - largest, most iconic -->
  <rect x="42" y="30" width="8" height="32" rx="1" fill="#9a9a9a" stroke="#555" stroke-width="2"/>
  <rect x="52" y="28" width="8" height="34" rx="1" fill="#888" stroke="#555" stroke-width="2"/>
  <rect x="40" y="25" width="22" height="6" rx="1" fill="#b0b0b0" stroke="#555" stroke-width="2"/>
  <!-- Stone group 4 (center-right) -->
  <rect x="64" y="33" width="7" height="28" rx="1" fill="#9a9a9a" stroke="#555" stroke-width="2"/>
  <rect x="74" y="35" width="7" height="26" rx="1" fill="#888" stroke="#555" stroke-width="2"/>
  <rect x="62" y="30" width="22" height="6" rx="1" fill="#b0b0b0" stroke="#555" stroke-width="2"/>
  <!-- Stone group 5 (right outer) -->
  <rect x="85" y="38" width="7" height="22" rx="1" fill="#9a9a9a" stroke="#555" stroke-width="1.5"/>
  <!-- Fallen stone - on ground -->
  <rect x="17" y="56" width="20" height="6" rx="2" fill="#888" stroke="#555" stroke-width="1.5" transform="rotate(-5 27 59)"/>
  <!-- Distant stones (smaller) -->
  <rect x="10" y="48" width="4" height="10" rx="1" fill="#7a7a7a" stroke="#555" stroke-width="1"/>
  <rect x="84" y="46" width="4" height="12" rx="1" fill="#7a7a7a" stroke="#555" stroke-width="1"/>
  <!-- Sun rising behind (Midsummer sunrise alignment) -->
  <circle cx="50" cy="6" r="10" fill="#f0c040" stroke="#e8a020" stroke-width="1.5" opacity="0.8"/>
</svg>
