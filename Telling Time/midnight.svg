<!-- Stars -->
  <circle cx="12" cy="14" r="2" fill="#f0e060"/>
  <circle cx="85" cy="10" r="1.5" fill="#f0e060"/>
  <circle cx="72" cy="22" r="1.5" fill="#f0e060"/>
  <!-- Clock face -->
  <circle cx="50" cy="50" r="28" fill="#e8e8e8" stroke="#333" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="2.5" fill="#333"/>
  <!-- 12 at top -->
  <text x="50" y="30" font-size="7" text-anchor="middle" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">12</text>
  <!-- Hour hand pointing straight up (midnight) -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand pointing straight up -->
  <line x1="50" y1="50" x2="50" y2="26" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  <!-- 3, 6, 9 markers -->
  <text x="72" y="54" font-size="7" text-anchor="middle" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">3</text>
  <text x="50" y="74" font-size="7" text-anchor="middle" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">6</text>
  <text x="28" y="54" font-size="7" text-anchor="middle" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">9</text>
</svg>
