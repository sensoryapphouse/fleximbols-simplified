<!-- Clock face -->
  <circle cx="50" cy="46" r="32" fill="#f5f5f5" stroke="#555" stroke-width="2.5"/>
  <circle cx="50" cy="46" r="2.5" fill="#333"/>
  <!-- Hour hand (pointing to 1 o'clock) -->
  <line x1="50" y1="46" x2="64" y2="22" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand (pointing to 12) -->
  <line x1="50" y1="46" x2="50" y2="18" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <!-- Hour markers -->
  <text x="50" y="22" font-size="6.5" text-anchor="middle" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">12</text>
  <text x="75" y="50" font-size="6.5" text-anchor="middle" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">3</text>
  <text x="50" y="74" font-size="6.5" text-anchor="middle" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">6</text>
  <text x="25" y="50" font-size="6.5" text-anchor="middle" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">9</text>
  <!-- "1h" label -->
  <text x="50" y="88" font-size="9" text-anchor="middle" fill="#2e7d32" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">1h</text>
</svg>
