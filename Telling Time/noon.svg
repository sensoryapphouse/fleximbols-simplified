<!-- Sun directly overhead (top-center) -->
  <circle cx="50" cy="30" r="16" fill="#f5c518" stroke="#c8900a" stroke-width="2.5"/>
  <!-- Sun rays -->
  <line x1="50" y1="8" x2="50" y2="3" stroke="#c8900a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="52" x2="50" y2="57" stroke="#c8900a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="30" x2="23" y2="30" stroke="#c8900a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="30" x2="77" y2="30" stroke="#c8900a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="15" x2="31" y2="11" stroke="#c8900a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="15" x2="69" y2="11" stroke="#c8900a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="45" x2="31" y2="49" stroke="#c8900a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="45" x2="69" y2="49" stroke="#c8900a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ground / horizon -->
  <rect x="5" y="65" width="90" height="4" fill="#8bc34a" rx="2"/>
  <!-- Shadow directly below (noon shadow = very short) -->
  <ellipse cx="50" cy="68" rx="4" ry="2" fill="#ccc"/>
  <!-- "12:00" label -->
  <text x="50" y="60" font-size="10" text-anchor="middle" fill="#c8900a" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">12:00</text>
</svg>
