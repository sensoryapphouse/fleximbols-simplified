  <!-- Podium -->
  <polygon points="28,52 72,52 78,95 22,95" fill="#8e6b3e" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="20" y="48" width="60" height="7" rx="2" fill="#a07840" stroke="#222" stroke-width="2"/>
  <!-- Figure -->
  <circle cx="50" cy="24" r="10" fill="#e8c49a" stroke="#222" stroke-width="2.5"/>
  <!-- Body -->
  <rect x="38" y="34" width="24" height="16" rx="2" fill="#2c3e50" stroke="#222" stroke-width="2"/>
  <!-- Arm raised (pointing/speaking) -->
  <line x1="38" y1="38" x2="26" y2="30" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="23" cy="28" rx="5" ry="4" fill="#e8c49a" stroke="#222" stroke-width="2"/>
  <!-- Speech bubbles cascading right -->
  <rect x="58" y="8" width="28" height="14" rx="5" fill="#ecf0f1" stroke="#222" stroke-width="2"/>
  <polygon points="58,14 52,18 62,18" fill="#ecf0f1" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="63" y1="13" x2="80" y2="13" stroke="#555" stroke-width="1.5"/>
  <line x1="63" y1="18" x2="80" y2="18" stroke="#555" stroke-width="1.5"/>
  <rect x="62" y="25" width="24" height="12" rx="5" fill="#ecf0f1" stroke="#222" stroke-width="2"/>
  <polygon points="62,30 56,34 66,34" fill="#ecf0f1" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="67" y1="29" x2="80" y2="29" stroke="#555" stroke-width="1.5"/>
  <line x1="67" y1="33" x2="80" y2="33" stroke="#555" stroke-width="1.5"/>
  <!-- Clock showing long time passing -->
  <circle cx="15" cy="65" r="14" fill="#ecf0f1" stroke="#222" stroke-width="2"/>
  <!-- Clock hands at "late" position -->
  <line x1="15" y1="65" x2="15" y2="55" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="65" x2="22" y2="72" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
  <!-- "HOURS" text -->
  <text x="15" y="84" font-size="6" text-anchor="middle" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">HOURS</text>
  <!-- "..." -->
  <text x="15" y="90" font-size="8" text-anchor="middle" fill="#555" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">...</text>
</svg>
