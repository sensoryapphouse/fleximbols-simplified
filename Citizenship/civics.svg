<!-- Government building -->
  <!-- Steps -->
  <rect x="15" y="72" width="70" height="5" rx="1" fill="#ccc" stroke="#555" stroke-width="1.5"/>
  <rect x="20" y="68" width="60" height="5" rx="1" fill="#ddd" stroke="#555" stroke-width="1.5"/>
  <!-- Main building body -->
  <rect x="22" y="40" width="56" height="30" fill="#e8e4d8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Columns -->
  <rect x="28" y="42" width="5" height="28" fill="#d4d0c8" stroke="#555" stroke-width="1.5"/>
  <rect x="40" y="42" width="5" height="28" fill="#d4d0c8" stroke="#555" stroke-width="1.5"/>
