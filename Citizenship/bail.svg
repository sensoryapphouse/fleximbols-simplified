<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Bail: money/cash + handcuffs opening/releasing -->
  <!-- Cash/money stack -->
  <rect x="8" y="32" width="42" height="28" rx="3" fill="#7ab87a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="5" y="36" width="42" height="28" rx="3" fill="#5a9a5a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="8" y="40" width="42" height="28" rx="3" fill="#4a8a4a" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Dollar sign on money -->
  <circle cx="29" cy="54" r="10" fill="#6ab06a" stroke="#333" stroke-width="1.5"/>
  
  <!-- Oval decorations on bill -->
  <ellipse cx="13" cy="54" r="5" ry="8" fill="none" stroke="#6ab06a" stroke-width="1.5" rx="5"/>
  <ellipse cx="45" cy="54" rx="5" ry="8" fill="none" stroke="#6ab06a" stroke-width="1.5"/>
  <!-- Handcuffs (open/releasing) -->
  <circle cx="72" cy="38" r="12" fill="none" stroke="#555" stroke-width="4"/>
  <circle cx="72" cy="38" r="7" fill="#c8d8e8" stroke="#555" stroke-width="2"/>
  <!-- Open link on cuffs = bail = freedom -->
  <path d="M84,38 Q92,38 92,48 Q92,58 84,58 L72,58" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <circle cx="72" cy="58" r="8" fill="none" stroke="#555" stroke-width="4"/>
  <!-- Open cuff link gap (broken) -->
  <path d="M80,58 L88,58" stroke="#f5f0e8" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrow = free -->
  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 0,6 8,3" fill="#4a9a4a" stroke="none"/>
    </marker>
  </defs>
  <line x1="55" y1="80" x2="75" y2="80" stroke="#4a9a4a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrB)"/>
  
</svg>
