<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Open box -->
  <rect x="140" y="270" width="232" height="44" fill="#7a5028" stroke="#000000" stroke-width="5"/>
  <path d="M 140 314 L 372 314 L 388 326 L 124 326 Z" fill="#a06840" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="120" y="326" width="272" height="94" fill="#caa379" stroke="#000000" stroke-width="5"/>
  <!-- Ball high above box -->
  <circle cx="256" cy="80" r="54" fill="#e74c3c" stroke="#000000" stroke-width="5"/>
  <circle cx="236" cy="60" r="16" fill="#f7b8b0"/>
  <!-- Tall vertical up-arrow: shaft from box top (y=270) to just below ball -->
  <rect x="244" y="170" width="24" height="100" fill="#2eb05a" stroke="#000000" stroke-width="5"/>
  <!-- Arrowhead tip at y=134, base at y=174 -->
  <polygon points="256,134 230,174 282,174" fill="#2eb05a" stroke="#000000" stroke-width="5"/>
</svg>
