<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Open box moved HIGHER (back wall y=200, front face y=256-350) to make room for the ball below -->
  <rect x="140" y="200" width="232" height="44" fill="#7a5028" stroke="#000000" stroke-width="5"/>
  <path d="M 140 244 L 372 244 L 388 256 L 124 256 Z" fill="#a06840" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <rect x="120" y="256" width="272" height="94" fill="#caa379" stroke="#000000" stroke-width="5"/>

  <!-- Tall down-arrow emphasising motion -->
  <rect x="244" y="350" width="24" height="56" fill="#2eb05a" stroke="#000000" stroke-width="5"/>
  <polygon points="256,422 226,394 286,394" fill="#2eb05a" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>

  <!-- Full-size ball below the box -->
  <circle cx="256" cy="468" r="40" fill="#e74c3c" stroke="#000000" stroke-width="5"/>
  <circle cx="240" cy="452" r="13" fill="#f7b8b0"/>

  <!-- Motion lines above the ball showing downward travel -->
  <line x1="210" y1="436" x2="220" y2="426" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="430" x2="256" y2="418" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="302" y1="436" x2="292" y2="426" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
</svg>
