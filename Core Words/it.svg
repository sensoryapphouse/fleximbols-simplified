  <!-- Background -->
  <rect width="512" height="512" fill="white"/>

  <!-- Object being pointed at (a simple box / thing) -->
  <rect x="294" y="160" width="174" height="140" rx="14" fill="#d0d8e8" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Object label "thing" -->
  

  <!-- Arrow pointing FROM left TO the object -->
  <!-- Arrow shaft -->
  <line x1="60" y1="230" x2="282" y2="230" stroke="#e05a2b" stroke-width="10" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polygon points="282,200 318,230 282,260" fill="#e05a2b" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>

  <!-- Label "it" on the left (the word being illustrated) -->
  

  <!-- Small dotted arc connecting "it" label to arrow (showing it = the thing being pointed at) -->
  <path d="M 138 170 Q 138 230 148 228" fill="none" stroke="#e05a2b" stroke-width="4" stroke-dasharray="8,5" stroke-linecap="round"/>
