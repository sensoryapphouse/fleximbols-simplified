  <rect x="30" y="28" width="5" height="50" rx="2" fill="#f57f17" stroke="#e65100" stroke-width="2"/>
  <rect x="65" y="28" width="5" height="50" rx="2" fill="#f57f17" stroke="#e65100" stroke-width="2"/>
  <rect x="85" y="20" width="5" height="58" rx="2" fill="#f57f17" stroke="#e65100" stroke-width="2"/>
