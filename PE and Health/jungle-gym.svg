  <rect x="10" y="20" width="80" height="5" rx="2" fill="#e91e63" stroke="#880e4f" stroke-width="2"/>
  <rect x="10" y="38" width="24" height="5" rx="2" fill="#42a5f5" stroke="#1565c0" stroke-width="2"/>
