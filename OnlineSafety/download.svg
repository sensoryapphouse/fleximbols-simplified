<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Tray at bottom -->
  <rect x="16" y="66" width="68" height="14" rx="3" fill="#d6eaf8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Down arrow -->
  <line x1="50" y1="18" x2="50" y2="58" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <polygon points="34,50 50,68 66,50" fill="#27ae60" stroke="#27ae60" stroke-width="1" stroke-linejoin="round"/>
  <!-- Arrow shaft fill -->
  <rect x="44" y="18" width="12" height="42" fill="#27ae60"/>
  <line x1="50" y1="18" x2="50" y2="58" stroke="#27ae60" stroke-width="12" stroke-linecap="round"/>
  <polygon points="34,50 50,68 66,50" fill="#27ae60" stroke="none"/>
  <!-- Re-draw outline -->
  <line x1="50" y1="16" x2="50" y2="58" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <polygon points="34,50 50,68 66,50" fill="none" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
</svg>