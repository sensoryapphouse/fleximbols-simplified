  <!-- Open notebook with pen and writing lines -->
  <!-- notebook pages -->
  <rect x="10" y="15" width="80" height="70" rx="4" ry="4" fill="#fffde8" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- spine -->
  <rect x="10" y="15" width="8" height="70" rx="2" ry="2" fill="#c8a870" stroke="#333" stroke-width="2"/>
  <!-- page fold right -->
  <path d="M90 15 L90 85 L78 85 L78 15 Z" fill="#fff8d8" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- writing lines left page -->
  <line x1="24" y1="30" x2="76" y2="30" stroke="#c8c8c8" stroke-width="1.5"/>
  <line x1="24" y1="40" x2="76" y2="40" stroke="#c8c8c8" stroke-width="1.5"/>
  <line x1="24" y1="50" x2="76" y2="50" stroke="#c8c8c8" stroke-width="1.5"/>
  <line x1="24" y1="60" x2="76" y2="60" stroke="#c8c8c8" stroke-width="1.5"/>
  <!-- pen diagonally across -->
  <rect x="58" y="28" width="6" height="42" rx="2" ry="2" fill="#e8a040" stroke="#333" stroke-width="2" stroke-linejoin="round" transform="rotate(25 61 49)"/>
  <polygon points="58,65 64,65 61,75" fill="#f0f0e8" stroke="#333" stroke-width="1.5" stroke-linejoin="round" transform="rotate(25 61 70)"/>
  <!-- heart doodle on page -->
  <path d="M32 44 C31 41 28 41 28 44 C28 47 32 50 32 50 C32 50 36 47 36 44 C36 41 33 41 32 44Z" fill="#f08080" stroke="#333" stroke-width="1"/>
</svg>
