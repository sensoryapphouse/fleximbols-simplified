<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Go stone: on a board grid intersection, black and white stones -->
  <!-- Board grid lines -->
  <line x1="10" y1="25" x2="90" y2="25" stroke="#c8a060" stroke-width="2"/>
  <line x1="10" y1="50" x2="90" y2="50" stroke="#c8a060" stroke-width="2"/>
  <line x1="10" y1="75" x2="90" y2="75" stroke="#c8a060" stroke-width="2"/>
  <line x1="25" y1="10" x2="25" y2="90" stroke="#c8a060" stroke-width="2"/>
  <line x1="50" y1="10" x2="50" y2="90" stroke="#c8a060" stroke-width="2"/>
  <line x1="75" y1="10" x2="75" y2="90" stroke="#c8a060" stroke-width="2"/>
  <!-- Board background (slightly showing) -->
  <rect x="5" y="5" width="90" height="90" rx="4" fill="#d4aa60" stroke="#8a6020" stroke-width="2.5" opacity="0.3"/>
  <!-- Star point dots -->
  <circle cx="25" cy="25" r="3" fill="#8a6020"/>
  <circle cx="75" cy="25" r="3" fill="#8a6020"/>
  <circle cx="25" cy="75" r="3" fill="#8a6020"/>
  <circle cx="75" cy="75" r="3" fill="#8a6020"/>
  <circle cx="50" cy="50" r="3" fill="#8a6020"/>
  <!-- Black stone (large, front) -->
  <circle cx="50" cy="50" r="18" fill="#222" stroke="#444" stroke-width="2"/>
  <ellipse cx="44" cy="44" rx="6" ry="4" fill="#666" opacity="0.5"/>
  <!-- White stone (smaller, offset) -->
  <circle cx="25" cy="25" r="14" fill="#f0f0f0" stroke="#888" stroke-width="2"/>
  <ellipse cx="22" cy="22" rx="5" ry="3" fill="#fff" opacity="0.7"/>
</svg>
