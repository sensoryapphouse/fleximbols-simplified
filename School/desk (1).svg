<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Desk top surface -->
  <rect x="5" y="28" width="90" height="8" rx="2" fill="#DDBB88" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="5" y="34" width="90" height="5" rx="2" fill="#C8A87A" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left pedestal (drawer unit) -->
  <rect x="5" y="38" width="28" height="42" rx="2" fill="#C8A87A" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Drawers on left pedestal -->
  <rect x="8" y="41" width="22" height="10" rx="1" fill="#DDBB88" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="19" cy="46" r="2" fill="#888"/>
  <rect x="8" y="53" width="22" height="10" rx="1" fill="#DDBB88" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="19" cy="58" r="2" fill="#888"/>
  <rect x="8" y="65" width="22" height="12" rx="1" fill="#DDBB88" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="19" cy="71" r="2" fill="#888"/>
  <!-- Right leg -->
  <rect x="82" y="38" width="13" height="42" rx="2" fill="#B89868" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Monitor on desk -->
  <rect x="35" y="8" width="38" height="22" rx="2" fill="#333" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="37" y="10" width="34" height="18" rx="1" fill="#A8D4F5" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="50" y="30" width="8" height="4" fill="#333" stroke="#555" stroke-width="1.5"/>
  <rect x="45" y="33" width="18" height="3" rx="1" fill="#555" stroke="#555" stroke-width="1"/>
  <!-- Keyboard on desk -->
  <rect x="32" y="35" width="36" height="5" rx="2" fill="#888" stroke="#555" stroke-width="2"/>
</svg>
