<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Bottle body (elegant shape) -->
  <rect x="28" y="40" width="44" height="44" rx="8" fill="#f5d0c8" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bottle neck narrow -->
  <rect x="38" y="26" width="24" height="16" rx="3" fill="#f5d0c8" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Atomiser cap -->
  <rect x="42" y="18" width="16" height="10" rx="3" fill="#d4a0a0" stroke="#555" stroke-width="2"/>
  <!-- Atomiser pump side tube -->
  <rect x="56" y="22" width="18" height="5" rx="2" fill="#d4a0a0" stroke="#555" stroke-width="2"/>
  <!-- Spray nozzle -->
  <circle cx="74" cy="24" r="4" fill="#b08080" stroke="#555" stroke-width="2"/>
  <!-- Spray mist -->
  <line x1="78" y1="20" x2="84" y2="14" stroke="#f5d0c8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="24" x2="88" y2="20" stroke="#f5d0c8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="79" y1="28" x2="87" y2="28" stroke="#f5d0c8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Label -->
</svg>
